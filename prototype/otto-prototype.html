:root{
  /* ── surfaces et encres ── */
  --bg:#F4F6F3;        /* papier comptable très légèrement verdi */
  --panel:#FFFFFF;
  --panel-2:#FAFBF9;
  --ink:#14171A;
  --ink-2:#4A534E;
  --ink-3:#79837D;
  --line:#DFE4DE;
  /* ── accent unique, identique dans les trois espaces ── */
  --accent:#1F4D3D;
  --accent-soft:#EAEFEB;
  /* ── sémantique, réservée aux problèmes ── */
  --anomalie:#9B2C2C;
  --anomalie-soft:#F7ECEB;
  --attention:#8A5A00;
  --attention-soft:#F8F2E6;
  /* ── typographie ── */
  --sans:OttoSans,"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:OttoMono,"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --t1:11px; --t2:12px; --t3:13px; --t4:15px; --t5:19px;   /* cinq tailles, pas six */
  /* ── géométrie ── */
  --r:3px; --rond:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  --ombre:0 1px 2px rgba(20,23,26,.06);
}
html[data-theme="dark"]{
  --bg:#121614; --panel:#191E1B; --panel-2:#1D2320;
  --ink:#E8EDE9; --ink-2:#A9B3AD; --ink-3:#78827C; --line:#2A322D;
  --accent:#6FBF9C; --accent-soft:#1B2621;
  --anomalie:#E38A85; --anomalie-soft:#2A1A19;
  --attention:#D6A44A; --attention-soft:#2A2214;
  --ombre:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#121614; --panel:#191E1B; --panel-2:#1D2320;
    --ink:#E8EDE9; --ink-2:#A9B3AD; --ink-3:#78827C; --line:#2A322D;
    --accent:#6FBF9C; --accent-soft:#1B2621;
    --anomalie:#E38A85; --anomalie-soft:#2A1A19;
    --attention:#D6A44A; --attention-soft:#2A2214;
    --ombre:0 1px 2px rgba(0,0,0,.3);
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:var(--t3)/1.45 var(--sans);
     -webkit-text-size-adjust:100%;overflow-x:hidden;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.006em}
h1{font-size:var(--t5)}
h2{font-size:var(--t4)}
h3{font-size:var(--t1);color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
   font-weight:700;margin:var(--s4) 0 var(--s2)}
h3:first-child{margin-top:0}
a{color:var(--accent);text-underline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:var(--t2)}

/* ══ chrome supérieur ══════════════════════════════════════════════════════ */
.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;padding:var(--s2) calc(var(--s6) * 3) var(--s1) var(--s4)}
.brand b{font-size:var(--t3)}
.brand .esp{font:700 var(--t1)/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;
            color:var(--accent);border-left:2px solid var(--accent);padding-left:var(--s2)}
.brand span{color:var(--ink-3);font-size:var(--t2)}
.spaces{display:flex;gap:var(--s1);padding:0 var(--s3) var(--s2);overflow-x:auto;
        scrollbar-width:thin;align-items:center;border-top:1px solid var(--line)}
.spaces .qui{flex:0 0 auto;margin-left:auto;padding-left:var(--s2)}
.spaces button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:var(--r);
               padding:var(--s1) var(--s3);font-size:var(--t2);color:var(--ink-3);cursor:pointer;min-height:30px}
.spaces button.on{color:var(--ink);border-color:var(--line);background:var(--panel-2);font-weight:700}
.themebtn{position:absolute;top:var(--s2);right:var(--s3);z-index:2;background:var(--panel-2);
          border:1px solid var(--line);border-radius:var(--r);padding:var(--s1) var(--s2);
          font-size:var(--t2);cursor:pointer;color:var(--ink-2);min-height:28px;min-width:64px}

/* ══ pastilles : neutres par défaut, colorées SEULEMENT sur un problème ════ */
.pill{display:inline-block;padding:1px var(--s2);border-radius:var(--rond);font-size:var(--t1);
      border:1px solid var(--line);background:transparent;color:var(--ink-2);white-space:nowrap}
.pill.bad{border-color:var(--anomalie);color:var(--anomalie);background:var(--anomalie-soft)}
.pill.warn{border-color:var(--attention);color:var(--attention);background:var(--attention-soft)}
/* aucune classe « ok » : l'état normal ne porte pas de couleur */

/* ══ seuils — espace auditeur uniquement ═════════════════════════════════ */
.seuils{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--s2);
        padding:var(--s1) var(--s4) var(--s2)}
.ctrl{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.ctrl label{font-size:var(--t1);color:var(--ink-3)}
.ctrl select,.ctrl input[type=number],.ctrl input[type=text],.ctrl input[type=email]{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s1) var(--s2);font-size:var(--t2);min-width:0;width:100%}
.ctrl input[type=range]{accent-color:var(--accent);width:100%}
.seuilbox{display:flex;gap:var(--s2);flex-wrap:wrap;padding:0 var(--s4) var(--s2)}
.seuilbox .s{flex:1 1 130px;border-left:2px solid var(--line);padding:0 0 0 var(--s2)}
.seuilbox .s .k{font-size:var(--t1);color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.seuilbox .s .v{font:700 var(--t4)/1.2 var(--mono);margin-top:1px}
.seuilbox .s .d{font-size:var(--t1);color:var(--ink-3)}
.impact{display:flex;gap:var(--s3);overflow-x:auto;padding:0 var(--s4) var(--s2);scrollbar-width:thin;
        border-top:1px solid var(--line);padding-top:var(--s2)}
.impact .c{flex:0 0 auto;min-width:0}
.impact .c .k{font-size:var(--t1);color:var(--ink-3);white-space:nowrap}
.impact .c .k .sm{display:none}
.impact .c .v{font:700 var(--t2)/1.3 var(--mono);white-space:nowrap}
.impact .c.flash .v{color:var(--accent)}

/* ══ coquille ═════════════════════════════════════════════════════════════ */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1680px;margin:0 auto}
.rail{border-right:1px solid var(--line);padding:var(--s3) var(--s2) var(--s5);position:sticky;
      top:var(--topH,180px);align-self:start;max-height:calc(100vh - var(--topH,180px));
      overflow-y:auto;scrollbar-width:thin}
.rail .grp{font-size:var(--t1);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
           padding:var(--s3) var(--s2) var(--s1);font-weight:700}
.rail a{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;
        padding:var(--s1) var(--s2);border-radius:var(--r);font-size:var(--t2);color:var(--ink-2);
        text-decoration:none;cursor:pointer;min-height:30px}
.rail a:hover{background:var(--panel-2)}
.rail a.on{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--accent)}
.rail a .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail a .b{flex:0 0 auto;font:700 var(--t1)/1 var(--mono);color:var(--ink-3)}
.rail a .b.bad{color:var(--anomalie)}
.rail a .b.warn{color:var(--attention)}
.railm{display:none;padding:var(--s2) var(--s3) 0}
main{padding:var(--s4);min-width:0}

/* ══ blocs ════════════════════════════════════════════════════════════════ */
.hd{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;margin-bottom:var(--s1)}
.hd .sub{color:var(--ink-3);font-size:var(--t2)}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
     margin-top:var(--s3);overflow:hidden;scroll-margin-top:calc(var(--topH,180px) + var(--s3))}
.blk > header{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);
              display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap}
.blk > header .num{font:700 var(--t1)/1 var(--mono);color:var(--ink-3)}
/* signature : la référence du papier, en chasse fixe, coin supérieur droit,
   sous le filet — la convention que tout associé reconnaît. */
.blk > header .why{margin-left:auto;font:400 var(--t1)/1 var(--mono);color:var(--ink-3);

/** Générateur pseudo-aléatoire à germe (mulberry32) : même germe ⇒ même suite.
 *  C'est ce qui rend le tirage d'échantillon rejouable à l'identique. */function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** Germe entier stable à partir d'une chaîne (FNV-1a 32 bits). */
function seedOf(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

const NBSP = '\u00A0';
/** Format français : espace insécable pour les milliers, virgule décimale, € après. */
function eur(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents));
  const ent = String(Math.floor(v / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (neg ? '-' : '') + ent + ',' + String(v % 100).padStart(2, '0') + NBSP + '€';
}
function eur0(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents / 100));
  return (neg ? '-' : '') + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP) + NBSP + '€';
}
function pct(x, d){ return (x * 100).toFixed(d === undefined ? 1 : d).replace('.', ',') + NBSP + '%'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }

function isWeekend(iso){ const d = new Date(iso + 'T00:00:00Z').getUTCDay(); return d === 0 || d === 6; }
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }

/* ═══ 3. GRAND LIVRE ═══════════════════════════════════════════════════════
   Le grand livre n'est PAS saisi : il est engendré, à germe fixe, de façon à

   de situation volontairement absente (l'écart que le rapprochement doit

   Conséquences vérifiables à l'écran :
     · total des débits = total des crédits (chaque écriture est équilibrée) ;
     · solde du grand livre = solde de la balance sur tous les comptes sauf deux.
   ═══════════════════════════════════════════════════════════════════════ */

const SAISIE = ['S. Marchand (comptabilité)','T. Girard (comptabilité)','M. Ferrand (direction)'];

function buildLedger(){
  const rnd = mulberry32(seedOf('otto-altiverre-fy2025-v1'));

  // cibles = balance client, par compte et par sens

  needC.set(ECART_SITUATION.credit, needC.get(ECART_SITUATION.credit) - ECART_SITUATION.montant);

  const entries = [];

  function push(e){
    e.num = e.journal + '-2025-' + String(++num).padStart(4, '0');

      if (l.credit) needC.set(l.compte, (needC.get(l.compte) || 0) - l.credit);
    }
    entries.push(e);
    return e;
  }

         lines:[ line('411000', 3633000, 0, CLIENTS[1]), line('701000', 0, 3633000) ] });
  // A6 — écriture manuelle ronde, un samedi, saisie par la direction
  push({ journal:'OD', date:'2025-11-15', pieceRef:'OD-2025-089', pieceDate:'2025-11-15',
         libelle:'Régularisation contrat-cadre — décision de direction', saisiePar:SAISIE[2],
         validDate:'2025-11-17', tag:'A6',
         lines:[ line('411000', 5000000, 0, CLIENTS[0]), line('706000', 0, 5000000) ] });
  // honoraires juridiques : deux cabinets, dont un seul sera déclaré par le client
  {
    const tot = needD.get('622600') || 0;
    const part = Math.round(tot * 0.62);
    push({ journal:'AC', date:'2025-03-20', pieceRef:'FF2025-0311', pieceDate:'2025-03-18',
           libelle:'Honoraires — ' + AVOCATS[0], saisiePar:SAISIE[0], validDate:'2025-03-25',
           lines:[ line('622600', part, 0, AVOCATS[0]), line('401000', 0, part, AVOCATS[0]) ] });
    push({ journal:'AC', date:'2025-09-08', pieceRef:'FF2025-0742', pieceDate:'2025-09-04',
           libelle:'Honoraires contentieux — ' + AVOCATS[1], saisiePar:SAISIE[1], validDate:'2025-09-12',
           lines:[ line('622600', tot - part, 0, AVOCATS[1]), line('401000', 0, tot - part, AVOCATS[1]) ] });
  }

  /* ── 3b. table des contreparties plausibles ───────────────────────────── */
  const PREF = [
    { d:/^411/, c:/^(701|706|445710)/, j:'VE', lib:'Facture de vente' },
    { d:/^709/, c:/^411/,              j:'VE', lib:'Avoir accordé' },
    { d:/^512/, c:/^411/,              j:'BQ', lib:'Encaissement client' },
    { d:/^401/, c:/^512/,              j:'BQ', lib:'Règlement fournisseur' },
    { d:/^(60|61|62|624|606|615|616)/, c:/^401/, j:'AC', lib:'Facture fournisseur' },
    { d:/^445660/, c:/^401/,           j:'AC', lib:'TVA déductible sur achats' },
    { d:/^(641|645|621)/, c:/^(421|431|437)/, j:'PA', lib:'Paie du mois' },
    { d:/^(421|431|437)/, c:/^512/,    j:'BQ', lib:'Versement social / salaires' },
    { d:/^(661|164)/, c:/^512/,        j:'BQ', lib:'Échéance emprunt' },
    { d:/^445510/, c:/^512/,           j:'BQ', lib:'Paiement TVA' },
    { d:/^445710/, c:/^(445510|445660)/, j:'OD', lib:'Déclaration de TVA' },
    { d:/^681/, c:/^28/,               j:'OD', lib:'Dotation aux amortissements' },
    { d:/^(2|3)/, c:/^(401|512)/,      j:'AC', lib:'Acquisition' },
  ];
  const CAP = { VE:[300000,6500000], AC:[50000,3500000], BQ:[80000,9000000],
                PA:[1500000,18000000], OD:[100000,4000000], AN:[0,0] };

  function pickDate(){
    // dates réparties sur l'exercice, décalées au lundi suivant dans 9 cas sur 10
    // lorsqu'elles tombent un week-end : une comptabilité ne saisit presque jamais
    // le samedi, ce qui fait du critère « week-end » un vrai signal (~3 % ici).
    let d = addDays('2025-01-01', Math.floor(rnd() * 365));
    if (isWeekend(d) && rnd() < 0.9){
      d = addDays(d, new Date(d + 'T00:00:00Z').getUTCDay() === 6 ? 2 : 1);
      if (d > '2025-12-31') d = addDays(d, -3);
    }
    return d;
  }
  function mkEntry(dc, cc, amount, j, lib){
    const date = j === 'AN' ? '2025-01-01' : pickDate();
    const aux = dc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : cc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)]
              : cc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : dc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)] : '';
    const prefix = { VE:'FA', AC:'FF', BQ:'BQ', PA:'PA', OD:'OD', AN:'AN' }[j];
    const piece = prefix + '2025-' + String(1000 + Math.floor(rnd() * 8999));
    // validation : quelques écritures validées après la clôture (critère de test)
    const late = rnd() < 0.03;
    let pd = j === 'AN' ? date : addDays(date, -Math.floor(rnd() * 4));
    if (pd < '2025-01-01') pd = '2025-01-01';
    return { journal:j, date, pieceRef:piece, pieceDate:pd,
             libelle: lib + (aux ? ' — ' + aux : ''), saisiePar: SAISIE[rnd() < 0.04 ? 2 : (rnd() < .5 ? 0 : 1)],
             validDate: late ? addDays('2026-01-05', Math.floor(rnd()*20)) : addDays(date, 1 + Math.floor(rnd()*6)),
             lines: [ line(dc, amount, 0, aux), line(cc, 0, amount, aux) ] };
  }

  /* ── 3c. appariement glouton jusqu'à consommer toutes les cibles ───────── */
  const alive = m => [...m.entries()].filter(([, v]) => v > 0);
  let guard = 0;
  while (guard++ < 40000){
    const ds = alive(needD), cs = alive(needC);
    if (!ds.length || !cs.length) break;
    // on prend la cible débit la plus lourde : la boucle converge vite
    ds.sort((a, b) => b[1] - a[1]);
    const [dc, dRem] = ds[0];
    let rule = PREF.find(p => p.d.test(dc) && cs.some(([c]) => p.c.test(c) ));
    let cc, j, lib;
    if (rule){
      const cands = cs.filter(([c]) => rule.c.test(c));
      cc = cands[Math.floor(rnd() * cands.length)][0]; j = rule.j; lib = rule.lib;
    } else {
      // pas de contrepartie naturelle disponible : opération diverse
      const bs = c => /^[1-5]/.test(c);
      const cands = cs.filter(([c]) => bs(c) === bs(dc)).concat(cs);
      cc = cands[Math.floor(rnd() * cands.length)][0];
      j = (/^[1-3]/.test(dc) && /^[1-3]/.test(cc)) ? 'AN' : 'OD';
      lib = j === 'AN' ? 'À nouveau' : 'Opération diverse';
    }
    const cRem = needC.get(cc);
    const [lo, hi] = CAP[j];
    let amount;
    if (j === 'AN') amount = Math.min(dRem, cRem);
    else {
      // rnd()^2,6 : la masse des écritures est petite, la queue est longue
      amount = Math.min(dRem, cRem, lo + Math.floor(Math.pow(rnd(), 2.6) * (hi - lo)));
      // reliquat trop petit pour une écriture crédible : on le solde d'un coup
      if (dRem - amount < lo) amount = Math.min(dRem, cRem);
      // ~8 % des montants sont ronds au millier (critère « montant rond »)
      if (amount > 500000 && rnd() < 0.08) amount = Math.floor(amount / 100000) * 100000;
    }
    if (amount <= 0) { needD.set(dc, 0); continue; }
    push(mkEntry(dc, cc, amount, j, lib));
  }

  // numérotation par journal, comme dans un FEC réel
  const perJournal = {};
  for (const e of entries){
    perJournal[e.journal] = (perJournal[e.journal] || 0) + 1;
    e.num = e.journal + String(perJournal[e.journal]).padStart(5, '0');
  }
  entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.num < b.num ? -1 : 1));

  // aplatissement en lignes de FEC
  const rows = [];
  for (const e of entries){
    e.lines.forEach((l, i) => rows.push({
      JournalCode:e.journal, JournalLib:{VE:'Ventes',AC:'Achats',BQ:'Banque',PA:'Paie',OD:'Opérations diverses',AN:'À nouveaux'}[e.journal],
      EcritureNum:e.num, EcritureDate:e.date, CompteNum:l.compte, CompteLib:l.libelleCompte,
      CompAuxNum:l.auxNum, CompAuxLib:l.auxLib, PieceRef:e.pieceRef, PieceDate:e.pieceDate,
      EcritureLib:e.libelle, Debit:l.debit, Credit:l.credit, EcritureLet:'', DateLet:'',
      ValidDate:e.validDate, Montantdevise:'', Idevise:'', saisiePar:e.saisiePar, tag:e.tag || '', ligne:i + 1
    }));
  }
  return { entries, rows };
}

/** Le grand livre d'origine — la version 1. Les versions suivantes s'y
 *  AJOUTENT (voir ledgerVersion) : il n'est jamais régénéré. */
let _ledgerBase = null;
function ledgerBase(){ return _ledgerBase || (_ledgerBase = buildLedger()); }

/** Balance recalculée à partir des écritures — jamais saisie à côté. */
function balanceFromLedger(rows){
  const m = new Map();
  for (const r of rows){
    const a = m.get(r.CompteNum) || { compte:r.CompteNum, lib:r.CompteLib, debit:0, credit:0 };
    a.debit += r.Debit; a.credit += r.Credit; m.set(r.CompteNum, a);
  }
  return [...m.values()].sort((a, b) => a.compte < b.compte ? -1 : 1);
}

/* ═══ 6. ASSERTIONS, FACTEURS DE RISQUE, PROCÉDURES ════════════════════════
   La chaîne que ce prototype doit rendre visible :
     facteurs (observés OU déclarés) → niveau de risque par assertion
       → liste des procédures requises → taille d'échantillon → couverture.
   Un questionnaire de risque qui ne commande rien est décoratif ; ici il
   commande, et l'écran le montre.
   ═══════════════════════════════════════════════════════════════════════ */
const ASSERTIONS = [
  { code:'realite',      lib:'Réalité',                    d:'les opérations enregistrées ont eu lieu' },
  { code:'exhaustivite', lib:'Exhaustivité',               d:'toutes les opérations sont enregistrées' },
  { code:'separation',   lib:'Séparation des exercices',   d:'les opérations sont rattachées au bon exercice' },
  { code:'evaluation',   lib:'Évaluation',                 d:'les montants sont correctement évalués' },
  { code:'presentation', lib:'Présentation',               d:'la ventilation et l’information sont correctes' },
];

/** Statistiques observées d'un poste — base des facteurs qui n'ont pas à être demandés. */
const _statCache = new Map();
function statsPoste(p){
  if (_statCache.has(p.code)) return _statCache.get(p.code);
  const re = p.re;
  const ecr = lg().entries.filter(e => e.lines.some(l => re.test(l.compte)));
  const mvt = e => e.lines.reduce((a, l) => a + (re.test(l.compte) ? Math.abs(l.debit - l.credit) : 0), 0);
  const st = {
    n:ecr.length,
    od:ecr.filter(e => e.journal === 'OD').length,
    direction:ecr.filter(e => /direction/.test(e.saisiePar)).length,
    tardives:ecr.filter(e => e.validDate > '2025-12-31').length,
    decembre:ecr.filter(e => e.date >= '2025-12-01').length,
    tiers:new Set(ecr.flatMap(e => e.lines.map(l => l.auxLib).filter(Boolean))).size,
    masse:ecr.reduce((a, e) => a + mvt(e), 0),
  };
  _statCache.set(p.code, st);
  return st;
}

/** Facteurs OBSERVÉS : calculés sur les données, jamais demandés à l'auditeur.
 *  Facteurs DÉCLARÉS : relèvent du jugement, l'auditeur répond lui-même. */
const FACTEURS = [
  { code:'variation', a:'realite', lib:'Variation N/N-1 supérieure au seuil de planification',
    obs:p => Math.abs(p.solde - p.soldeN1) >= seuils().PM,
    dit:p => `variation ${eur0(p.solde - p.soldeN1)} · seuil ${eur0(seuils().PM)}` },
  { code:'volume', a:'exhaustivite', lib:'Plus de 200 écritures sur l’exercice',
    obs:p => statsPoste(p).n > 200, dit:p => statsPoste(p).n + ' écritures' },
  { code:'manuel', a:'realite', lib:'Plus de 5 % d’écritures en journal d’opérations diverses',
    obs:p => statsPoste(p).n > 0 && statsPoste(p).od / statsPoste(p).n > 0.05,
    dit:p => statsPoste(p).od + ' OD sur ' + statsPoste(p).n },
  { code:'tardive', a:'separation', lib:'Écritures validées après la date de clôture',
    obs:p => statsPoste(p).tardives > 0, dit:p => statsPoste(p).tardives + ' écriture(s)' },
  { code:'concentration', a:'separation', lib:'Plus de 15 % des écritures concentrées en décembre',
    obs:p => statsPoste(p).n > 0 && statsPoste(p).decembre / statsPoste(p).n > 0.15,
    dit:p => statsPoste(p).decembre + ' écritures en décembre sur ' + statsPoste(p).n },
  { code:'estimation', a:'evaluation', lib:'Le poste comporte une estimation comptable', declare:true },
  { code:'fraude', a:'realite', lib:'Poste porteur d’un risque de fraude identifié', declare:true },
  { code:'ci_faible', a:'exhaustivite', lib:'Contrôle interne non testé ou jugé non fiable sur ce cycle', declare:true },
  { code:'complexe', a:'presentation', lib:'Règle de présentation ou d’annexe complexe sur ce poste', declare:true },
  { code:'litige', a:'evaluation', lib:'Poste exposé à un litige ou à une incertitude', declare:true },
];

/** Facteurs actifs d'un poste : les observés sont calculés, les déclarés sont lus dans le casier. */
function facteursActifs(p){
  const st = sec(p.code);
  const locaux = FACTEURS.map(f => ({ ...f,
    actif: f.declare ? !!st.declares[f.code] : !!f.obs(p),
    preuve: f.declare ? null : f.dit(p) }));
  // Les constatations venues d'ailleurs, CONFIRMÉES et retenues comme
  // majorantes, comptent comme des facteurs de la section : c'est là que la
  // circulation produit son effet, et pas seulement un affichage.
  const vus = new Set();
  for (const f of facteursRetenus(p.code)){
    for (const c of f.cibles.filter(x => x.fsli === p.code)){
      for (const a of c.assertions){
        const k = f.id + '|' + a;
        if (vus.has(k)) continue;
        vus.add(k);
        locaux.push({ code:'REG:' + k, a, lib:f.description, actif:true,
                      registre:true, facteur:f, preuve:f.source ? f.source.lib : 'saisi à la main' });
      }
    }
  }
  return locaux;
}
const NIVEAUX = ['faible', 'moyen', 'eleve'];
const NIV_LIB = { faible:'faible', moyen:'moyen', eleve:'élevé' };
/** Règle : 0 facteur → faible, 1 → moyen, 2 et plus → élevé. Surchargeable avec motif. */
function niveauCalcule(p, a){
  const n = facteursActifs(p).filter(f => f.a === a && f.actif).length;
  return n === 0 ? 'faible' : n === 1 ? 'moyen' : 'eleve';
}
function niveau(p, a){ return sec(p.code).override[a] || niveauCalcule(p, a); }
function niveauMax(p){
  return ASSERTIONS.reduce((m, a) => Math.max(m, NIVEAUX.indexOf(niveau(p, a.code))), 0);
}

/* ── étendue des travaux : elle suit l'assertion, pas le poste ─────────────
   Une procédure répond à UNE assertion. Lui appliquer le risque le plus élevé
   du poste revient à traiter la séparation des exercices comme l'exhaustivité
   sous prétexte qu'elles partagent un compte : sur le chiffre d'affaires, un
   test de cut-off recevait trente éléments alors que la séparation des
   exercices est évaluée « faible ». Les deux tables ci-dessous s'appliquent
   donc au niveau de risque de l'assertion TESTÉE, et une section porte des
   échantillons de tailles différentes — c'est la conséquence normale.       */
const TAILLE = { faible:6, moyen:15, eleve:30 };
/** Seuil de la strate exhaustive, en fraction du seuil de planification :
 *  plus le risque de l'assertion est élevé, plus le seuil descend, donc plus
 *  d'éléments sont couverts un par un. */
const STRATE = { faible:1, moyen:1 / 2, eleve:1 / 3 };
const STRATE_LIB = { faible:'seuil de planification', moyen:'moitié du seuil de planification',
                     eleve:'tiers du seuil de planification' };
function tailleEchantillon(p, pr){ return TAILLE[niveau(p, pr.a)]; }
function seuilStrate(p, pr){ return Math.round(seuils().PM * STRATE[niveau(p, pr.a)]); }

/* ═══ 9. CONTACTS ET PARAMÉTRAGE DU PORTAIL ════════════════════════════════ */
function initPortail(){

/** Empreinte d'un fichier : déterministe, calculée sur ce qu'il contient. */
function empreinteVersion(n){
  const src = JSON.stringify([n, tbVersion(n), ledgerVersion(n).entries.length]);
  let h = 0x811c9dc5;
  for (let i = 0; i < src.length; i++){ h ^= src.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  const g = (x) => x.toString(16).padStart(8, '0');
  return (g(h) + g(Math.imul(h, 0x85ebca6b) >>> 0) + g(Math.imul(h ^ n, 0xc2b2ae35) >>> 0)).slice(0, 20);
}

/* ── balance d'une version ────────────────────────────────────────────────
   La balance de la version n, c'est celle de la version 1 augmentée des
   écritures des versions suivantes qui la touchent. Rien n'est écrasé.     */
const _tbCache = new Map();
function tbVersion(n){
  if (_tbCache.has(n)) return _tbCache.get(n);
  const m = new Map(TB_2025.map(r => [r[0], [r[0], r[1], r[2], r[3]]]));
  for (const e of ecrituresJusqua(n)){
    if (e.cible === 'gl') continue;
    for (const [c, d, cr] of e.lignes){
      const r = m.get(c) || [c, COMPTES_NOUVEAUX[c] || c, 0, 0];
      r[2] += d; r[3] += cr; m.set(c, r);
    }
  }
  const out = [...m.values()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  _tbCache.set(n, out);
  return out;
}
/* ── grand livre d'une version ───────────────────────────────────────────── */
const _lgCache = new Map();
function ledgerVersion(n){
  if (_lgCache.has(n)) return _lgCache.get(n);

    journal:'OD', date:e.date, pieceRef:e.ref, pieceDate:e.date, libelle:e.lib,
    validDate:VERSIONS.find(v => v.n === e.v).date, saisiePar:VERSIONS.find(v => v.n === e.v).par,
    num:e.ref, tag:'', version:e.v,
    lines:e.lignes.map(([c, d, cr]) => ({
      compte:c, libelleCompte:libelleCompte(c), debit:d, credit:cr, auxNum:'', auxLib:'' })),
  }));
  const entries = [...base.entries, ...sup];
  const rows = [...base.rows];
  for (const e of sup) e.lines.forEach((l, i) => rows.push({
    JournalCode:'OD', JournalLib:'Opérations diverses', EcritureNum:e.num, EcritureDate:e.date,

    EcritureLet:'', DateLet:'', ValidDate:e.validDate, Montantdevise:'', Idevise:'',
    saisiePar:e.saisiePar, tag:'', ligne:i + 1 }));
  const r = { entries, rows };
  _lgCache.set(n, r);
  return r;
}

/** Signature de la sélection d'une procédure : si elle change, l'échantillon
 *  n'est plus le même et le papier ne porte plus sur la même population. */
function empreinteSelection(p, pr){
  const e = echantillonProc(p, pr);
  if (!e) return '';
  return e.retenus.length + ':' + e.retenus.map(x => x.cle).join('|');
}
/** Stampe la version d'exécution au premier travail réellement saisi. */
function marquerExecution(p, pr){
  const st = proc(p.code, pr.code);
  if (st.execVersion === undefined || st.execVersion === null){
    st.execVersion = S.version;
    st.execEmpreinte = empreinteSelection(p, pr);
  }
}
/** Un papier est périmé si la version a changé ET que sa population a bougé,
 *  ou s'il a été exécuté sur une version antérieure à celle du dossier. */
function peremption(p, pr){
  const st = proc(p.code, pr.code);
  if (st.execVersion === undefined || st.execVersion === null) return null;
  if (st.execVersion === S.version) return null;
  const emp = empreinteSelection(p, pr);
  return { de:st.execVersion, a:S.version, populationChangee:emp !== st.execEmpreinte };
}
function soldes(tb){ const m = new Map(); for (const [c, l, d, cr] of tb) m.set(c, { lib:l, solde:d - cr, debit:d, credit:cr }); return m; }
const B24 = soldes(TB_2024);
function sumWhere(bal, re){ let s = 0; for (const [c, v] of bal) if (re.test(c)) s += v.solde; return s; }

/** Références possibles pour la matérialité, toutes calculées depuis la balance.
 *  Signe : produits et capitaux propres sont créditeurs, on les rend positifs. */
function benchmarks(bal){
  const produits = -sumWhere(bal, /^7/);
  const charges  =  sumWhere(bal, /^6/);
  const ca       = -sumWhere(bal, /^70/);                    // 701+706 moins 709 (RRR)
  const resultat = produits - charges;                        // résultat courant avant impôt
  // total actif net = soldes débiteurs des classes 2 à 5, nets des amortissements
  let actif = 0;
  for (const [c, v] of bal){
    if (/^(28|29|39|49)/.test(c)) actif += v.solde;           // amortissements : solde créditeur, donc négatif
    else if (/^[2345]/.test(c) && v.solde > 0) actif += v.solde;
  }
  const capitaux = -sumWhere(bal, /^(101|106|110)/) + resultat;
  return {
    ca:{ code:'ca', lib:'Chiffre d’affaires', val:ca, defaut:1 },
    pbt:{ code:'pbt', lib:'Résultat courant avant impôt', val:resultat, defaut:5 },
    equity:{ code:'equity', lib:'Capitaux propres', val:capitaux, defaut:3 },
    actif:{ code:'actif', lib:'Total de l’actif', val:actif, defaut:2 },
    charges:{ code:'charges', lib:'Total des charges', val:charges, defaut:1 },
  };
}
const BM24 = benchmarks(B24);

/** Arrondi prudent vers le bas au pas indiqué (pratique de place). */
function arrondiBas(cents, pas){ return Math.floor(cents / pas) * pas; }

/** Les trois seuils. Recalculés à chaque mouvement de curseur. */
function seuils(){
  const b = bm()[S.benchmark];
  const brut = Math.round(b.val * S.pctM / 100);
  const M  = arrondiBas(brut, 100000);            // au millier d'euros inférieur
  const PM = arrondiBas(Math.round(M * S.pctPM / 100), 100000);
  const CTT= arrondiBas(Math.round(M * S.pctCTT / 100), 10000); // à la centaine d'euros
  return { bench:b, brut, M, PM, CTT };
}

/* ── masses : bilan et compte de résultat ─────────────────────────────────
   Un poste a une masse principale et peut en toucher une seconde : les
   provisions et les stocks vivent au bilan mais leur variation passe par le
   résultat ; les dotations sont une charge dont la contrepartie est au bilan.
   Le classement n'est donc pas binaire — le poste apparaît dans les deux. */
const MASSE_LIB = { bilan:'Bilan', resultat:'Compte de résultat' };
function masseDe(p){ return p.masse || 'bilan'; }
function postesDeMasse(m){
  return postesEnPerimetre().filter(p => masseDe(p) === m || p.aussi === m);
}
function table(cols, rows, opts){
  opts = opts || {};
  const th = cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.t)}</th>`).join('');
  const tb = rows.map(r => '<tr>' + cols.map(c => {
    const v = r[c.k];
    return `<td class="${c.n ? 'n' : ''} ${c.cls || ''} ${r._cls && r._cls[c.k] || ''}">${v === undefined || v === null ? '' : v}</td>`;
  }).join('') + '</tr>').join('');
  const tf = opts.foot ? '<tfoot><tr>' + cols.map(c => `<td class="${c.n ? 'n' : ''}">${opts.foot[c.k] === undefined ? '' : opts.foot[c.k]}</td>`).join('') + '</tr></tfoot>' : '';
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${tf}</table></div>`;
}

/* ═══ 7. MODULE 1 — IMPORT ET RAPPROCHEMENT ═══════════════════════════════ */const CHAMPS_FEC = ['JournalCode','JournalLib','EcritureNum','EcritureDate','CompteNum','CompteLib',
  'CompAuxNum','CompAuxLib','PieceRef','PieceDate','EcritureLib','Debit','Credit','EcritureLet',

/** Contrôles de forme du fichier des écritures comptables.
 *  Chaque contrôle renvoie le nombre de lignes ou d'écritures en anomalie. */
function controlesFec(){
  const tot = { d:0, c:0 };
  let deuxColonnes = 0, horsExercice = 0, compteInvalide = 0, validAvant = 0, auxIncomplet = 0, pieceHors = 0;
  const parEcriture = new Map();
  const rows = fec();
  for (const r of rows){
    tot.d += r.Debit; tot.c += r.Credit;
    if ((r.Debit > 0 && r.Credit > 0) || (r.Debit === 0 && r.Credit === 0)) deuxColonnes++;
    if (r.EcritureDate < '2025-01-01' || r.EcritureDate > '2025-12-31') horsExercice++;
    if (!/^\d{3,}$/.test(r.CompteNum)) compteInvalide++;
    if (r.ValidDate && r.ValidDate < r.EcritureDate) validAvant++;
    if ((r.CompAuxNum === '') !== (r.CompAuxLib === '')) auxIncomplet++;
    if (r.PieceDate && (r.PieceDate < '2025-01-01' || r.PieceDate > '2025-12-31')) pieceHors++;
    const e = parEcriture.get(r.EcritureNum) || { d:0, c:0 };
    e.d += r.Debit; e.c += r.Credit; parEcriture.set(r.EcritureNum, e);
  }
  let ecrituresDesequilibrees = 0;
  for (const [, v] of parEcriture) if (v.d !== v.c) ecrituresDesequilibrees++;
  const champsManquants = CHAMPS_FEC.filter(f => rows.some(r => r[f] === undefined));
  return { tot, deuxColonnes, horsExercice, compteInvalide, validAvant, auxIncomplet, pieceHors,
           ecrituresDesequilibrees, nbEcritures:parEcriture.size, champsManquants };
}

/** Rapprochement balance client ↔ grand livre, compte par compte. */
function rapprochement(n){
  const v = n === undefined ? S.version : n;
  const tbv = tbVersion(v), balv = v === S.version ? bal() : soldes(tbv);
  const glb = v === S.version ? glBal() : balanceFromLedger(ledgerVersion(v).rows);
  const gl = new Map(glb.map(r => [r.compte, r]));
  const comptes = [...new Set([...tbv.map(r => r[0]), ...glb.map(r => r.compte)])].sort();
  return comptes.map(c => {
    const t = balv.get(c), g = gl.get(c);
    const sTB = t ? t.solde : 0, sGL = g ? g.debit - g.credit : 0;
    return { compte:c, lib:(t ? t.lib : g.lib), sTB, sGL, ecart:sTB - sGL,
             presentTB:!!t, presentGL:!!g };
  });
}
function arSeuilMontant(){ return S.arMontant === null ? seuils().PM : S.arMontant; }

function revueAnalytique(){
  const b = bal();
  const comptes = [...new Set([...tb().map(r => r[0]), ...TB_2024.map(r => r[0])])].sort();
  return comptes.map(c => {
    const n = b.get(c) ? b.get(c).solde : 0;
    const n1 = B24.get(c) ? B24.get(c).solde : 0;
    const lib = (b.get(c) || B24.get(c)).lib;
    const d = n - n1;
    const p = n1 === 0 ? (n === 0 ? 0 : null) : d / Math.abs(n1);   // null = pas de base N-1
    const parMontant = Math.abs(d) >= arSeuilMontant();
    const parPct = p !== null && Math.abs(p) >= S.arPct / 100;
    return { compte:c, lib, n, n1, d, p, parMontant, parPct, flag:parMontant || parPct };
  });
}
/** Sens naturel d'un compte : -1 s'il est normalement créditeur (produits,
 *  capitaux, dettes). Sans cela, une hausse du chiffre d'affaires — qui rend le
 *  solde PLUS créditeur, donc plus négatif en convention signée — serait
 *  décrite comme une baisse. C'est le genre d'erreur qu'un associé voit en
 *  trois secondes et qui décrédibilise tout le reste. */
function sensNaturel(l){ return ((l.n1 || l.n) < 0) ? -1 : 1; }

/** Question composée automatiquement — assemblage déterministe, aucun texte de modèle. */
function questionVariation(l){
  const k = sensNaturel(l);
  const mouvement = l.d * k;                       // > 0 = augmentation, dans le sens du compte
  const sens = mouvement > 0 ? 'une augmentation' : 'une diminution';
  const nature = k < 0 ? 'solde créditeur' : 'solde débiteur';
  const pctTxt = l.p === null ? 'sans base comparative en N-1' : 'soit ' + pct(Math.abs(l.p), 1);
  const motif = l.parMontant && l.parPct ? 'seuil en montant et seuil en pourcentage'
              : l.parMontant ? 'seuil en montant' : 'seuil en pourcentage';
  return `Le compte ${l.compte} « ${l.lib} » (${nature}) présente ${sens} de ${eur(Math.abs(l.d))} entre le `
       + `31/12/2024 (${eur(Math.abs(l.n1))}) et le 31/12/2025 (${eur(Math.abs(l.n))}), ${pctTxt}. Cette variation `
       + `dépasse le ${motif} retenu pour la revue analytique (${eur(arSeuilMontant())} / ${S.arPct}${NBSP}%). `
       + `Merci d’en indiquer l’explication et de préciser les éléments justificatifs disponibles.`;
}

function pieceSynth(e, montantCompta){

    qte_facturee:qteFacturee,

function proceduresRequises(p){
  const fa = facteursActifs(p);
  return PROCEDURES.filter(pr => {
    if (pr.postes && !pr.postes.includes(p.code)) return false;
    if (pr.siFacteur && !fa.find(f => f.code === pr.siFacteur && f.actif)) return false;
    return NIVEAUX.indexOf(niveau(p, pr.a)) >= NIVEAUX.indexOf(pr.min);
  });
}
function procRef(p, pr){ return p.code.slice(0, 4) + '-' + pr.code.slice(0, 3) + '-01'; }

/* ── casier d'une procédure dans une section ─────────────────────────────── */
function proc(code, prCode){
  const st = sec(code);
  if (!st.procs) st.procs = {};
  if (!st.procs[prCode]) st.procs[prCode] = {
    seed:'otto-' + code.toLowerCase() + '-' + prCode.toLowerCase() + '-01',
    wp:null, conclusion:'',
  };
  return st.procs[prCode];
}

/* ── population d'une procédure : explicite, affichée, comptée ───────────── */
const _popCache = new Map();
function population(p, pr){
  if (!pr.ech) return null;
  const s = seuils();
  const cle = p.code + '|' + pr.code + '|' + s.CTT;
  if (_popCache.has(cle)) return _popCache.get(cle);
  const d = pr.pop(p);
  let items;
  if (pr.tiers){
    const m = new Map();
    for (const e of lg().entries){
      const aux = e.lines.map(l => l.auxLib).find(Boolean);
      if (!aux || !e.lines.some(l => p.re.test(l.compte))) continue;
      const mv = e.lines.reduce((a, l) => a + (p.re.test(l.compte) ? Math.abs(l.debit - l.credit) : 0), 0);
      const cur = m.get(aux) || { cle:aux, lib:aux, montant:0, n:0, e:null };
      cur.montant += mv; cur.n++; cur.e = cur.e || e;
      m.set(aux, cur);
    }
    items = [...m.values()].sort((a, b) => b.montant - a.montant);
  } else {
    const min = d.min ? d.min() : 0;
    items = lg().entries
      .filter(e => e.lines.some(l => p.re.test(l.compte)))
      .filter(d.f)
      .map(e => ({ cle:e.num, e, montant:e.lines.reduce((a, l) => a + (p.re.test(l.compte) ? Math.abs(l.debit - l.credit) : 0), 0) }))
      .filter(x => x.montant > min);
  }
  const r = { ...d, comptes:p.comptes, unite:pr.unite, items,
              masse:items.reduce((a, x) => a + x.montant, 0) };
  if (_popCache.size > 300) _popCache.clear();
  _popCache.set(cle, r);
  return r;
}

/** Tirage d'une procédure : strate exhaustive au-dessus du seuil de
 *  planification, puis tirage aléatoire à germe dans le reliquat. */
const _echProcCache = new Map();
function echantillonProc(p, pr){
  const pop = population(p, pr);
  if (!pop) return null;
  const s = seuils(), st = proc(p.code, pr.code);
  const n = tailleEchantillon(p, pr), strate = seuilStrate(p, pr);
  const cle = p.code + '|' + pr.code + '|' + st.seed + '|' + strate + '|' + s.CTT + '|' + n;
  if (_echProcCache.has(cle)) return _echProcCache.get(cle);
  const exhaustif = pop.items.filter(x => x.montant >= strate);
  const reste = pop.items.filter(x => x.montant < strate);
  const rnd = mulberry32(seedOf(st.seed));
  const idx = reste.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const alea = idx.slice(0, Math.min(n, idx.length)).sort((a, b) => a - b).map(i => reste[i]);
  const couvert = exhaustif.reduce((a, x) => a + x.montant, 0) + alea.reduce((a, x) => a + x.montant, 0);
  const r = { pop, exhaustif, alea, retenus:[...exhaustif, ...alea], n, couvert,
              taux: pop.masse ? couvert / pop.masse : 0, strate, niv:niveau(p, pr.a) };
  if (_echProcCache.size > 300) _echProcCache.clear();
  _echProcCache.set(cle, r);
  return r;
}

/** Le catalogue applicable : spécifique au poste s'il existe, générique sinon. */
function catalogue(p, pr){
  return CATALOGUE[p.code + '/' + pr.code] || CATALOGUE['*/' + pr.code] || null;
}
function catalogueSpecifique(p, pr){ return !!CATALOGUE[p.code + '/' + pr.code]; }
/** Documents attendus pour une procédure, dans l'ordre du catalogue. */
function docsAttendusProc(p, pr){ const c = catalogue(p, pr); return c ? c.map(d => d.doc) : []; }

/* ── comparaison d'un champ relevé à sa donnée de référence ──────────────── */
function compare(ch, releve, x){
  if (releve === undefined || releve === null || releve === '') return { saisi:false };
  const r = ch.ref(x);
  if (ch.type === 'montant'){
    const v = Math.round((parseFloat(String(releve).replace(/\s/g, '').replace(',', '.')) || 0) * 100);
    return { saisi:true, ecart:v - r, conforme:Math.abs(v - r) <= (ch.tol || 0),
             refLib:eur(r), valLib:eur(v), ecartLib:eur(v - r) };
  }
  if (ch.type === 'nombre'){
    const v = parseFloat(String(releve).replace(',', '.'));
    return { saisi:true, ecart:v - r, conforme:Math.abs(v - r) <= (ch.tol || 0),
             refLib:String(r), valLib:String(v), ecartLib:(v - r > 0 ? '+' : '') + (v - r) };
  }
  if (ch.type === 'date'){
    /* Une facture datée du 5 et comptabilisée le 8 n'est pas une anomalie :
       comparer une date de pièce à la date de comptabilisation « à l'exact »
       produisait un écart sur toute pièce normale. Chaque champ déclare donc
       la RÈGLE qui le contrôle, et non une simple égalité. */
    const j = Math.round((Date.parse(releve) - Date.parse(r)) / 86400000);
    let conforme, refLib;
    switch (ch.regle){
      case 'dans l’exercice':
        conforme = releve >= OUVERTURE && releve <= CLOTURE;
        refLib = frDate(OUVERTURE) + ' – ' + frDate(CLOTURE);
        break;
      case 'antérieure ou égale':
        conforme = releve <= r; refLib = '≤ ' + frDate(r); break;
      case 'même exercice que la référence':
        conforme = (releve <= CLOTURE) === (r <= CLOTURE);
        refLib = frDate(r) + ' (même exercice)'; break;
      default:
        conforme = Math.abs(j) <= (ch.tol || 0); refLib = frDate(r);
    }
    return { saisi:true, ecart:j, conforme, refLib, valLib:frDate(releve),
             ecartLib:ch.regle === 'dans l’exercice' ? 'hors exercice' : (j > 0 ? '+' : '') + j + ' j' };
  }
  if (ch.type === 'bool'){
    const v = releve === 'oui' || releve === true;
    return { saisi:true, ecart:v === !!r ? 0 : 1, conforme:v === !!r,
             refLib:r ? 'exigée' : 'non exigée', valLib:v ? 'oui' : 'non', ecartLib:v === !!r ? '—' : 'absente' };
  }
  const conforme = String(releve).trim().toLowerCase() === String(r).trim().toLowerCase();
  return { saisi:true, ecart:conforme ? 0 : 1, conforme,
           refLib:String(r), valLib:String(releve), ecartLib:conforme ? '—' : 'divergent' };
}

/* ── papier de travail d'une procédure ───────────────────────────────────── */
function wpProc(p, pr){
  const e = echantillonProc(p, pr);
  if (!e) return null;
  const st = proc(p.code, pr.code);
  const anc = new Map((st.wp || []).map(r => [r.cle, r]));
  /* Une ligne ne porte AUCUN drapeau de réception : « reçue » se dérive du
     dépôt du client sur la requête (voir ligneRecue). Elle ne porte que ce
     qu'un auditeur a réellement saisi : les valeurs relevées et les
     résolutions d'écart. */
  st.wp = e.retenus.map(x => {
    const g = anc.get(x.cle);
    return g || { cle:x.cle, x, champs:{}, res:{} };
  });
  for (const r of st.wp){ const x = e.retenus.find(v => v.cle === r.cle); if (x) r.x = x; }
  return st.wp;
}
/** Contrôles d'une procédure : un par (élément × document attendu × champ). */
function controles(p, pr){
  const cat = catalogue(p, pr), wp = wpProc(p, pr);
  if (!cat || !wp) return [];
  const out = [];
  for (const r of wp){
    for (const d of cat){
      for (const ch of d.champs){
        const cle = r.cle + '|' + d.doc + '|' + ch.code;
        const c = compare(ch, r.champs[cle], r.x);
        out.push({ ligne:r, doc:d.doc, ch, cle, recu:docRecu(p, pr, r.cle, d.doc), ...c });
      }
    }
  }
  return out;
}
function ecartsProc(p, pr){ return controles(p, pr).filter(c => c.saisi && !c.conforme); }
/** Écarts chiffrés d'une procédure, pour la synthèse des anomalies.
 *  Seul le RÉSIDUEL entre au cumul — mais un écart intégralement expliqué
 *  reste LISTÉ, avec son constaté, sa part expliquée et son résiduel nul.
 *  Le faire disparaître de la liste est précisément ce qui avait permis à un
 *  montant de quitter le cumul sans que rien ne l'explique. */
function ecartsChiffresProc(p, pr){
  return ecartsProc(p, pr).filter(c => constateDe(c) !== 0)
    .map(c => ({ ...c, ...residuel(c), montant:residuel(c).residuel }));
}

/* ═══ 27b. DOCUMENTATION DU JEU DE DONNÉES ═════════════════════════════════
   Le taux d'anomalie est un paramètre du jeu d'essai : il doit être lisible,
   et le taux CONSTATÉ doit être comparé au taux VISÉ. Si les deux divergent,
   c'est que la table des pièces et les cibles ne sont plus d'accord.
   ═══════════════════════════════════════════════════════════════════════ */
/** Contrôle de bande : la part de la pièce que représente chaque écart posé,
 *  comparée à la bande de sa nature. C'est la vérification que le montant
 *  découle de la cause et non d'un réglage. */
function bandesEcarts(){
  return Object.entries(ANOMALIES_PIECES).filter(([, a]) => a.t === 'montant').map(([ref, a]) => {
    const e = lg().entries.find(x => x.pieceRef === ref);
    const piece = e ? Math.max(...e.lines.map(l => Math.max(l.debit, l.credit))) : 0;
    const part = piece ? -a.delta / piece : null;
    const b = NATURES_ECART[a.n];
    return { ref, ...a, piece, part, bande:b,
             ok:part !== null && part > b.min && part <= b.max };
  });
}
function tauxConstates(){
  const parType = {};
  for (const [ref, a] of Object.entries(ANOMALIES_PIECES)){
    (parType[a.t] = parType[a.t] || []).push({ ref, ...a });
  }

/* ═══ 35. ÉTATS DÉRIVÉS ET RÉSOLUTION D'ÉCART ══════════════════════════════
   Deux règles, une seule idée : un état ne se saisit pas, il se DÉDUIT de ce
   qui existe. « Pièce reçue » se déduit du dépôt du client sur la requête qui
   la demandait ; l'état d'une ligne de papier se déduit de sa pièce, de sa
   saisie et de sa résolution. Une case à cocher aurait permis de déclarer
   reçue une pièce que personne n'a déposée.

   La résolution d'écart REPREND la contrainte probante déjà écrite pour les
   exceptions (migration 0009, NEP 500) : explication du client mot pour mot,
   conclusion de l'auditeur, qualification, LIEN vers ce qui corrobore, auteur
   et horodatage. Aucun second chemin : sans ces six éléments, l'écart reste
   entier au cumul des anomalies.
   ═══════════════════════════════════════════════════════════════════════ */

/* ── 1. réception : dérivée du portail, jamais cochée ─────────────────────── */
const _depIdx = { cle:'', m:null };
function indexDepots(){
  const n = S.requetes.reduce((a, r) => a + r.items.reduce((b, i) => b + i.depots.length, 0), 0);
  const cle = S.requetes.length + '/' + n;
  if (_depIdx.cle === cle && _depIdx.m) return _depIdx.m;
  const m = new Map();
  for (const r of S.requetes){
    if (!r.proc) continue;
    for (const it of r.items){
      if (it.ref === null || it.ref === undefined) continue;
      const k = r.section + '|' + r.proc + '|' + it.ref;
      const l = m.get(k) || [];
      for (const d of it.depots) l.push({ ...d, req:r.id, item:it.id });
      if (l.length) m.set(k, l);
    }
  }
  _depIdx.cle = cle; _depIdx.m = m;
  return m;
}
/** Les dépôts du client rattachés à un élément d'échantillon. */
function depotsElement(p, pr, cle){
  return indexDepots().get(p.code + '|' + pr.code + '|' + cle) || [];
}
function ligneRecue(p, pr, cle){ return depotsElement(p, pr, cle).length > 0; }
function docRecu(p, pr, cle, doc){ return depotsElement(p, pr, cle).some(d => d.doc === doc); }

/* ── 2. les cinq états d'une ligne de papier de travail ───────────────────── */
const ETATS_LIGNE = [
  { id:'attente',  lib:'en attente',         mk:'n',
    d:'la requête est émise, le client n’a rien déposé pour cet élément' },
  { id:'recue',    lib:'reçue',              mk:'a',
    d:'la pièce est déposée, le contrôle n’est pas encore saisi' },
  { id:'traitee',  lib:'traitée sans écart', mk:'p',
    d:'valeur relevée conforme à la référence, dans la tolérance déclarée' },
  { id:'ecart',    lib:'écart à expliquer',  mk:'x',
    d:'valeur relevée hors tolérance, aucune résolution probante acquise' },
  { id:'explique', lib:'écart expliqué',     mk:'e',
    d:'écart résolu : explication, corroboration liée, qualification et auteur' },
];
const ETAT = Object.fromEntries(ETATS_LIGNE.map(e => [e.id, e]));
/* Une ligne porte plusieurs contrôles, qui peuvent être dans des états
   différents. L'état retenu pour la ligne est le premier de cette liste
   qu'un de ses contrôles atteint : on montre d'abord ce qui appelle une
   action de l'auditeur (un écart), puis ce qui appelle une action du client
   (une pièce), puis ce qui reste à faire, et seulement ensuite ce qui est
   terminé. Ce n'est pas le plus fréquent qui gagne : c'est le plus exigeant. */
const PRIORITE_ETAT = ['ecart', 'attente', 'recue', 'explique', 'traitee'];

function etatControle(c){
  if (!c.recu)     return 'attente';
  if (!c.saisi)    return 'recue';
  if (c.conforme)  return 'traitee';
  return resolutionAcquise(c) ? 'explique' : 'ecart';
}
function etatLigne(ctrLigne){
  const s = new Set(ctrLigne.map(etatControle));
  return PRIORITE_ETAT.find(e => s.has(e)) || 'attente';
}
/** Compte des cinq états sur un ensemble de contrôles. */
function comptesEtats(ctr){
  const c = { attente:0, recue:0, traitee:0, ecart:0, explique:0 };
  for (const x of ctr) c[etatControle(x)]++;
  return c;
}
function marqueEtat(id, titre){ return marque(ETAT[id].mk, titre || ETAT[id].d); }

/* ── 3. résolution d'écart : UN SEUL chemin, où que l'écart soit né ───────
   Écart de papier de travail, écart de rapprochement, écriture relevée au
   test des écritures : la même contrainte, le même objet, la même carte.
   Un second chemin, plus commode, serait un chemin sans preuve. */
/* Les quatre qualifications sont celles de la contrainte existante : elles
   disent ce qu'il est advenu de l'argent. Tout le reste doit être escaladé. */
const DISPOSITIONS = {
  corrigee:     { lib:'corrigée', d:'une écriture de correction existe — elle est citée en corroboration' },
  pas_anomalie: { lib:'pas d’anomalie', d:'la pièce corroborante démontre qu’il n’y avait pas d’anomalie' },
  compensee:    { lib:'compensée', d:'un autre élément probant couvre l’assertion sur le même montant' },
  deja_cumulee: { lib:'déjà cumulée', d:'le même fait est déjà porté au cumul par un autre écart' },
};
function resolVide(){
  return { explique:0, expl:'', concl:'', disposition:'',
           corrobPiece:'', corrobEcriture:'', par:null, t:null };
}
/** Casier de résolution d'un contrôle de papier de travail. */
function resol(c){
  const l = c.ligne;
  if (!l.res) l.res = {};
  if (!l.res[c.cle]) l.res[c.cle] = resolVide();
  return l.res[c.cle];
}
function resolLue(c){ return (c.ligne.res || {})[c.cle] || null; }
/** Casier de résolution d'un écart né hors papier de travail.
 *  `explInitiale` : l'explication déjà REÇUE du client, si elle l'a été. Elle
 *  est enregistrée comme explication, jamais comme résolution : à elle seule
 *  elle ne retire pas un centime du cumul. */
function resolHors(ref, explInitiale){
  if (!S.resolutionsHors[ref]){
    S.resolutionsHors[ref] = resolVide();
    if (explInitiale) S.resolutionsHors[ref].expl = explInitiale;
  }
  return S.resolutionsHors[ref];
}
/** Ce qui manque pour que la résolution soit probante — la liste est la règle. */
function manquesResolution(r){
  const m = [];
  if (!r || !(r.expl || '').trim())  m.push('explication reçue du client, mot pour mot');
  if (!r || !(r.concl || '').trim()) m.push('conclusion de l’auditeur sur cette explication');
  if (!r || !r.disposition)          m.push('qualification de l’écart');
  if (!r || !((r.corrobPiece || '').trim() || (r.corrobEcriture || '').trim()))
    m.push('lien vers la pièce ou l’écriture qui corrobore');
  if (!r || !r.par)                  m.push('auteur et date de la conclusion');
  return m;
}
/** Un écart CHIFFRÉ n'est résolu que si une part est réellement retirée du
 *  cumul : c'est la règle « une exception quantifiée doit dire ce qu'il est
 *  advenu de l'argent ». Un écart NON CHIFFRÉ — une date de pièce, un tiers,
 *  une référence — n'a rien à retirer d'un cumul : il exige les mêmes
 *  éléments probants, et rien de plus. Les deux passent par le même casier. */
function resolutionAcquiseR(r, constate){
  if (!r || manquesResolution(r).length) return false;
  if (!constate) return true;
  return partRetenue(constate, r) !== 0;
}
function partRetenue(constate, r){
  const brut = r ? r.explique : 0;
  return constate >= 0 ? Math.max(0, Math.min(brut, constate))
                       : Math.min(0, Math.max(brut, constate));
}
/** L'écart d'un contrôle, en euros quand il en porte un, zéro sinon. */
function constateDe(c){ return c.ch.type === 'montant' ? -c.ecart : 0; }
function resolutionAcquise(c){ return resolutionAcquiseR(resolLue(c), constateDe(c)); }
/** Une corroboration est un LIEN : l'écriture citée doit exister au grand livre. */
function ecritureExiste(ref){
  const v = String(ref || '').trim().toUpperCase();
  if (!v) return null;
  return lg().entries.find(e => e.num.toUpperCase() === v || String(e.pieceRef).toUpperCase() === v) || null;
}

/* ── 4. écart constaté, expliqué, résiduel ────────────────────────────────
   Le résiduel n'est jamais saisi : c'est une soustraction. Et la part
   expliquée ne peut ni dépasser l'écart, ni en inverser le sens — une
   résolution qui rendrait l'écart plus grand n'est pas une résolution. */
function residuelR(constate, r){
  const brut = r ? r.explique : 0;
  const borne = partRetenue(constate, r);
  const acquis = resolutionAcquiseR(r, constate);
  const explique = acquis ? borne : 0;
  return { constate, explique, residuel:constate - explique, acquis, retenu:borne, chiffre:constate !== 0,
           saisi:brut, borne:brut !== borne, res:r, manques:manquesResolution(r) };
}
function residuel(c){ return residuelR(constateDe(c), resolLue(c)); }
/** Enregistre la conclusion : c'est elle, et rien d'autre, qui porte l'auteur. */
function conclureResolution(r, constate, libelle){
  const m = manquesResolution({ ...r, par:'x' });
  if (m.length) return { ok:false, why:'résolution incomplète : ' + m.join(' ; ') };
  if ((r.corrobEcriture || '').trim() && !ecritureExiste(r.corrobEcriture))
    return { ok:false, why:'l’écriture « ' + r.corrobEcriture.trim() + ' » n’existe pas au grand livre' };
  if (constate && partRetenue(constate, r) === 0)
    return { ok:false, why:'une part expliquée nulle ne résout rien : escaladez l’écart ou laissez-le au cumul' };
  r.par = S.moi; r.t = tick();
  logEvent('écart résolu', libelle, DISPOSITIONS[r.disposition].lib
           + (constate ? ' · ' + eur(partRetenue(constate, r)) + ' expliqué(s)' : ' · écart non chiffré'));
  return { ok:true };
}
function annulerResolutionR(r, libelle){
  r.par = null; r.t = null;
  logEvent('résolution retirée', libelle, USERS[S.moi].nom);
}

/* ── 4b. la carte de résolution, une seule pour tous les écarts ──────────── */
function carteResolution(cle, entete, constate, r, depots){
  const d = residuelR(constate, r);
  const ecr = ecritureExiste(r.corrobEcriture);
  const manquesHorsAuteur = d.manques.filter(x => !x.startsWith('auteur'));
  return `<div class="nl ${d.acquis ? '' : 'warn'}" style="margin-top:8px">
    <div class="m">${entete} ${d.acquis ? marqueEtat('explique') : marqueEtat('ecart')}</div>
    ${d.chiffre ? `<div class="kv">
      <span class="k">Écart constaté</span><span class="v">${eur(d.constate)}</span>
      <span class="k">Part expliquée</span><span class="v"><input class="cell" data-rmont="${esc(cle)}"
        value="${d.saisi ? (d.saisi / 100).toFixed(2).replace('.', ',') : ''}" placeholder="0,00"></span>
      <span class="k">Écart résiduel</span><span class="v"${d.residuel ? ' style="color:var(--anomalie)"' : ''}>${eur(d.residuel)}</span>
    </div>
    ${d.borne ? `<div class="callout warn">La part expliquée est bornée à l’écart constaté et à son sens :
      ${eur(d.saisi)} saisi, ${eur(d.retenu)} retenu.</div>` : ''}`
    : `<p class="note">Écart non chiffré : il ne porte aucun montant et n’entre pas au cumul des anomalies.
       Les éléments probants exigés sont les mêmes.</p>`}
    <div class="ctrl"><label>Explication reçue du client — mot pour mot, pas un résumé</label>
      <textarea data-rexpl="${esc(cle)}" rows="2" placeholder="ce que le client a écrit ou dit, tel quel">${esc(r.expl)}</textarea></div>
    <div class="ctrl"><label>Conclusion de l’auditeur sur cette explication</label>
      <textarea data-rconcl="${esc(cle)}" rows="2" placeholder="pourquoi cette explication tient, au vu de la corroboration">${esc(r.concl)}</textarea></div>
    <div class="row">
      <div class="ctrl"><label>Qualification</label>
        <select data-rdisp="${esc(cle)}">
          <option value="">— à qualifier —</option>
          ${Object.entries(DISPOSITIONS).map(([id, x]) => `<option value="${id}" ${r.disposition === id ? 'selected' : ''}>${esc(x.lib)}</option>`).join('')}
        </select></div>
      ${depots && depots.length ? `<div class="ctrl"><label>Pièce corroborante déposée</label>
        <select data-rpiece="${esc(cle)}">
          <option value="">— aucune —</option>
          ${depots.map(x => `<option value="${esc(x.nom)}" ${r.corrobPiece === x.nom ? 'selected' : ''}>${esc(x.doc)} — ${esc(x.nom)}</option>`).join('')}
        </select></div>` : ''}
      <div class="ctrl"><label>${depots && depots.length ? 'ou é' : 'É'}criture du grand livre</label>
        <input class="cell txt" data-recr="${esc(cle)}" value="${esc(r.corrobEcriture)}" placeholder="n° d’écriture ou de pièce"></div>
    </div>
    ${r.disposition ? `<p class="note">${esc(DISPOSITIONS[r.disposition].d)}</p>` : ''}
    ${(r.corrobEcriture || '').trim() ? (ecr
      ? `<p class="note">Écriture <span class="mono">${esc(ecr.num)}</span> du ${frDate(ecr.date)} — ${esc(ecr.libelle)}.</p>`
      : `<div class="callout bad">Aucune écriture « ${esc(r.corrobEcriture)} » au grand livre :
          une corroboration est un lien, pas une mention.</div>`) : ''}
    ${r.par
      ? `<div class="callout"><b>Conclu</b> par ${esc(USERS[r.par].nom)} (${esc(ROLE_LIB[USERS[r.par].role])})
          le ${horo(r.t)} — ${esc(DISPOSITIONS[r.disposition].lib)}, ${eur(d.explique)} retiré(s) du cumul.
          <button class="btn mini sec" data-rannul="${esc(cle)}">retirer la conclusion</button></div>`
      : `<div class="callout ${manquesHorsAuteur.length ? 'warn' : ''}">
          ${manquesHorsAuteur.length
            ? `<b>Il manque :</b> ${esc(manquesHorsAuteur.join(' ; '))}.
               ${d.chiffre ? 'Tant que ces éléments manquent, l’écart reste au cumul pour ' + eur(d.constate) + '.'
                           : 'Tant que ces éléments manquent, l’écart reste ouvert.'}`
            : 'Les éléments probants sont réunis.'}</div>
        <button class="btn" data-rconclure="${esc(cle)}" ${manquesHorsAuteur.length ? 'disabled' : ''}>conclure — engage ${esc(USERS[S.moi].nom)}</button>`}

}

/* ── 5. obstacles d'une procédure : ce qui empêche de la dire terminée ───── */
function obstaclesProcedure(p, pr){
  const o = [], st = proc(p.code, pr.code);
  if (!pr.ech){
    if (!st.conclusion.trim()) o.push('conclusion de la procédure non rédigée');
    return o;
  }
  const n = comptesEtats(controles(p, pr));
  if (n.attente) o.push(`${n.attente} justificatif(s) attendu(s) du client`);
  if (n.recue)   o.push(`${n.recue} contrôle(s) non saisi(s) alors que la pièce est reçue`);
  if (n.ecart)   o.push(`${n.ecart} écart(s) sans résolution probante`);
  if (!st.conclusion.trim()) o.push('conclusion de la procédure non rédigée');
  return o;
}

/* ── 6. avancement des justificatifs, par section ─────────────────────────
   Les cinq états s'agrègent : c'est le tableau de bord de suivi, dérivé des
   mêmes contrôles que le papier de travail — rien n'est compté deux fois. */
function avancementSection(p){
  const t = { attente:0, recue:0, traitee:0, ecart:0, explique:0, total:0, elements:0, recus:0 };
  for (const pr of proceduresRequises(p)){
    if (!pr.ech) continue;
    const ctr = controles(p, pr), n = comptesEtats(ctr);
    for (const k of Object.keys(n)) t[k] += n[k];
    t.total += ctr.length;
    const wp = wpProc(p, pr) || [];
    t.elements += wp.length;
    t.recus += wp.filter(r => ligneRecue(p, pr, r.cle)).length;
  }
  return t;
}
function bandeauAvancement(t){
  const c = (k, n) => `<span class="pill ${k === 'ecart' && n ? 'bad' : k === 'attente' && n ? 'warn' : ''}">`
    + `${n} ${esc(ETAT[k].lib)}</span>`;
  return `<div class="row">${ETATS_LIGNE.map(e => c(e.id, t[e.id])).join('')}
    <span class="smallcaps">${t.total} contrôle(s) sur ${t.elements} élément(s)</span></div>`;
}
/* ── marques de pointage : la convention du papier de travail ─────────────
   Une marque en chasse fixe, soulignée de pointillés, avec sa légende sous le
   tableau. Elle n'est pas une pastille d'état saisie à côté : c'est
   l'AFFICHAGE des cinq états dérivés (voir ETATS_LIGNE), dans l'ordre du
   cycle de vie d'un justificatif. Seuls « écart » et « en attente » portent
   une couleur : elles appellent une action. */
const CLS_MARQUE = { x:'x', n:'n' };
const MARQUES = Object.fromEntries(ETATS_LIGNE.map(e =>
  [e.mk, { lib:e.lib, d:e.d, cls:CLS_MARQUE[e.mk] || '' }]));
function marque(k, titre){
  const m = MARQUES[k];
  return `<span class="mk ${m.cls || ''}" title="${esc(titre || m.d)}">${k}</span>`;
}
const LEGENDE_MARQUES = '<div class="legende">' + Object.entries(MARQUES)
  .map(([k, m]) => `<span><b>${k}</b> ${esc(m.lib)} — ${esc(m.d)}</span>`).join('')
  + '<span>Aucun de ces états ne se saisit : chacun se déduit du dépôt du client, '
  + 'de la valeur relevée et de la résolution documentée.</span></div>';

   ═══════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────────────────────────────────────────────────
   1. COMPTES DE LA SECTION
   Deux indicateurs distincts : position du compte / seuil de remontée
   (triage interne) et poids / seuil de planification (périmètre).
   ───────────────────────────────────────────────────────────────────────── */
function blocComptes(p){
  const s = seuils(), st = sec(p.code);
  const rows = p.comptes.map(c => {
    const n = bal().get(c).solde, n1 = B24.get(c) ? B24.get(c).solde : 0, d = n - n1;
    const pr = n1 === 0 ? null : d / Math.abs(n1);
    const propose = Math.abs(n) < s.CTT ? 'ns' : 'sig';
    return { c, lib:bal().get(c).lib, n, n1, d, pr, propose, retenu:st.ns[c] || propose,
             rCTT:Math.abs(n) / s.CTT, rPM:Math.abs(n) / s.PM };
  });
  const tot = rows.reduce((a, r) => a + r.n, 0), totN1 = rows.reduce((a, r) => a + r.n1, 0);
  const body = rows.map(r => ({
    c:`<span class="mono">${r.c}</span>`, lib:esc(r.lib),
    n1:eur(r.n1), n:eur(r.n), d:eur(r.d),
    pr:r.pr === null ? '<span class="smallcaps">—</span>' : pct(r.pr, 1),
    ctt:`${r.rCTT >= 1 ? '<b>' : ''}${pct(r.rCTT, 0)}${r.rCTT >= 1 ? '</b>' : ''}`,
    pm:pct(r.rPM, 0),
    st:`<select class="cell txt" data-ns="${r.c}" style="width:140px">
          <option value="auto" ${!st.ns[r.c] ? 'selected' : ''}>proposé : ${r.propose === 'ns' ? 'non significatif' : 'significatif'}</option>
          <option value="sig" ${st.ns[r.c] === 'sig' ? 'selected' : ''}>significatif (surchargé)</option>
          <option value="ns"  ${st.ns[r.c] === 'ns'  ? 'selected' : ''}>non significatif (surchargé)</option>
        </select>` +
        (st.ns[r.c] ? `<input class="cell txt" data-nsm="${r.c}" placeholder="motif obligatoire" value="${esc(st.nsMotif[r.c] || '')}" style="margin-top:3px">` : ''),
    nt:boutonNote(p.code, 'compte', r.c, 'Compte ' + r.c + ' — ' + r.lib),
  }));
  const sansMotif = rows.filter(r => st.ns[r.c] && !(st.nsMotif[r.c] || '').trim());
  return `
    <p class="note">Soldes signés · « / remontée » ${eur0(s.CTT)} · « / planification » ${eur0(s.PM)}</p>
    ${table([{k:'c',t:'Compte'},{k:'lib',t:'Intitulé',cls:'wrapcell'},{k:'n1',t:'31/12/2024',n:1},
             {k:'n',t:'31/12/2025',n:1},{k:'d',t:'Variation',n:1},{k:'pr',t:'%',n:1},
             {k:'ctt',t:'/ remontée',n:1},{k:'pm',t:'/ planification',n:1},
             {k:'st',t:'Statut'},{k:'nt',t:''}], body,
            { foot:{ c:'Total', n1:eur(totN1), n:eur(tot), d:eur(tot - totN1) } })}
    ${sansMotif.length ? `<div class="callout bad"><b>Surcharge sans motif</b> : ${sansMotif.map(r => r.c).join(', ')}.</div>` : ''}
    ${blocRevueAnalytique(p)}`;
}

/** Revue analytique SUBSTANTIVE du poste — l'un des trois moments (voir
 *  vueRAPrelim en planification et vueRAFinale à l'achèvement). */
function blocRevueAnalytique(p){
  const lignes = revueAnalytique().filter(l => p.re.test(l.compte));
  const flags = lignes.filter(l => l.flag);
  const deja = c => requetesDe(p.code).some(r => r.origine === 'revue analytique substantive'
                                              && r.items.some(i => i.ref === c));
  return `
    <h3>Revue analytique substantive du poste</h3>
    <div class="row">
      <div class="ctrl"><label>Seuil en montant</label>
        <input type="number" id="ar-montant" value="${(arSeuilMontant() / 100).toFixed(0)}" step="1000"></div>
      <div class="ctrl"><label>Seuil en pourcentage</label>
        <input type="number" id="ar-pct" value="${S.arPct}" step="1"></div>
      <div class="ctrl"><label>&nbsp;</label>
        <span class="pill ${flags.length ? 'warn' : ''}">${flags.length} compte(s) au-dessus d’un seuil</span></div>
    </div>
    ${flags.length ? `<div class="tw"><table>
      <thead><tr><th>Compte</th><th class="n">Variation (sens du compte)</th><th class="n">%</th><th>Ressort</th>
        <th>Question composée</th><th></th></tr></thead>
      <tbody>${flags.map(l => `<tr>
        <td class="mono">${l.compte}<div class="smallcaps">${sensNaturel(l) < 0 ? 'créditeur' : 'débiteur'}</div></td>
        <td class="n">${eur(l.d * sensNaturel(l))}</td>
        <td class="n">${l.p === null ? '—' : pct(Math.abs(l.p) * (l.d * sensNaturel(l) > 0 ? 1 : -1), 1)}</td>
        <td>${l.parMontant ? '<span class="tag">montant</span> ' : ''}${l.parPct ? '<span class="tag">%</span>' : ''}</td>
        <td class="wrapcell">${esc(questionVariation(l))}</td>
        <td>${deja(l.compte) ? '<span class="pill">requête émise</span>'
              : `<button class="btn mini" data-ravar="${l.compte}">créer la requête d’explication</button>`}
            ${boutonNote(p.code, 'ra', l.compte, 'Revue analytique — compte ' + l.compte)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<p class="note">Aucune variation au-dessus des seuils sur ce poste.</p>'}`;
}

/* ─────────────────────────────────────────────────────────────────────────
   2. ÉVALUATION DU RISQUE → PROCÉDURES → TAILLE D'ÉCHANTILLON
   ───────────────────────────────────────────────────────────────────────── */
function blocRisque(p){
  const st = sec(p.code), fa = facteursActifs(p), procs = proceduresRequises(p);
  const parA = a => fa.filter(f => f.a === a);
  const lignes = ASSERTIONS.map(a => {
    const fs = parA(a.code), actifs = fs.filter(f => f.actif);
    const calc = niveauCalcule(p, a.code), ret = niveau(p, a.code), forced = !!st.override[a.code];
    return `
      <tr>
        <td><b>${esc(a.lib)}</b><div class="smallcaps" style="white-space:normal">${esc(a.d)}</div></td>
        <td class="wrapcell">${fs.map(f => f.registre ? `
          <span class="chk" style="margin:2px 3px 2px 0;border-color:var(--anomalie);background:var(--bad-soft)">
            <span>⇄ ${esc(f.lib.length > 90 ? f.lib.slice(0, 90) + '…' : f.lib)}</span>
            <span class="cnt">${esc(f.preuve)}</span></span>` : `
          <label class="chk" style="${f.declare ? '' : 'cursor:default;opacity:' + (f.actif ? 1 : .55)}">
            <input type="checkbox" ${f.actif ? 'checked' : ''} ${f.declare ? `data-fac="${f.code}"` : 'disabled'}>
            <span>${esc(f.lib)}</span>
            <span class="cnt">${f.declare ? 'déclaré' : (f.preuve ? esc(f.preuve) : 'observé')}</span>
          </label>`).join('')}</td>
        <td><span class="pill ${calc === 'eleve' ? 'bad' : calc === 'moyen' ? 'warn' : ''}">${actifs.length} → ${NIV_LIB[calc]}</span></td>
        <td>
          <select class="cell txt" data-niv="${a.code}" style="width:150px">
            <option value="">retenu = calculé (${NIV_LIB[calc]})</option>
            ${NIVEAUX.map(n => `<option value="${n}" ${st.override[a.code] === n ? 'selected' : ''}>forcé : ${NIV_LIB[n]}</option>`).join('')}
          </select>
          ${forced ? `<input class="cell txt" data-nivm="${a.code}" placeholder="motif obligatoire" value="${esc(st.overrideMotif[a.code] || '')}" style="margin-top:3px">` : ''}
        </td>
        <td><span class="pill ${ret === 'eleve' ? 'bad' : ret === 'moyen' ? 'warn' : ''}">${NIV_LIB[ret]}</span></td>
        <td>${boutonNote(p.code, 'risque', a.code, 'Évaluation du risque — ' + a.lib)}</td>
      </tr>`;
  }).join('');
  const forcedSansMotif = ASSERTIONS.filter(a => st.override[a.code] && !(st.overrideMotif[a.code] || '').trim());
  return `
    <h3>Constatations venues d’autres procédures</h3>
    ${blocFacteursSection(p)}
    <h3>Évaluation par assertion</h3>
    <div class="tw"><table>
      <thead><tr><th>Assertion</th><th>Facteurs de risque</th><th>Calculé</th><th>Jugement de l’auditeur</th><th>Retenu</th><th></th></tr></thead>
      <tbody>${lignes}</tbody>
    </table></div>
    ${forcedSansMotif.length ? `<div class="callout bad"><b>Niveau forcé sans motif</b> : ${forcedSansMotif.map(a => esc(a.lib)).join(', ')}.</div>` : ''}
    <h3>Étendue des travaux, par assertion</h3>
    ${table([{k:'a',t:'Assertion'},{k:'r',t:'Risque retenu'},{k:'n',t:'Tirage aléatoire',n:1},
             {k:'s',t:'Seuil de la strate exhaustive',n:1},{k:'p',t:'Procédures servies',cls:'wrapcell'}],
      ASSERTIONS.map(a => {
        const niv = niveau(p, a.code), pr = procs.filter(x => x.a === a.code);
        return { a:esc(a.lib),
                 r:`<span class="pill ${niv === 'eleve' ? 'bad' : niv === 'moyen' ? 'warn' : ''}">${NIV_LIB[niv]}</span>`,
                 n:String(TAILLE[niv]),
                 s:eur0(Math.round(seuils().PM * STRATE[niv])) + ' <span class="smallcaps">' + esc(STRATE_LIB[niv]) + '</span>',
                 p:pr.length ? pr.map(x => `<span class="tag">${esc(procRef(p, x))}</span>`).join(' ') : '<span class="smallcaps">aucune</span>' };
      }))}
    <p class="note">Tirage : faible ${TAILLE.faible} · moyen ${TAILLE.moyen} · élevé ${TAILLE.eleve} éléments.
    Strate exhaustive : ${STRATE_LIB.faible} · ${STRATE_LIB.moyen} · ${STRATE_LIB.eleve}, soit
    ${eur0(seuils().PM)} · ${eur0(Math.round(seuils().PM / 2))} · ${eur0(Math.round(seuils().PM / 3))}.
    Une section porte donc des échantillons de tailles différentes.</p>`;

/* ─────────────────────────────────────────────────────────────────────────
   3. PLAN DE TRAVAIL — la vue qu'un réviseur ouvre en premier
   Sélection → procédure → papier de travail → statut.
   ───────────────────────────────────────────────────────────────────────── */
function etatProc(p, pr){
  if (!pr.ech) return { lib:'sans sélection', cls:'', ok:true, n:null };
  const wp = wpProc(p, pr) || [], recus = wp.filter(r => ligneRecue(p, pr, r.cle)).length;
  const ctr = controles(p, pr), n = comptesEtats(ctr);
  const saisis = n.traitee + n.ecart + n.explique;
  const b = { wp, ctr, n, recus, saisis, ec:n.ecart };
  if (!recus)                return { ...b, lib:'pièces non reçues', cls:'bad', ok:false };
  if (n.attente || n.recue)  return { ...b, lib:saisis + '/' + ctr.length + ' contrôles', cls:'warn', ok:false };
  if (n.ecart)               return { ...b, lib:n.ecart + ' écart(s) à expliquer', cls:'bad', ok:false };
  return { ...b, lib:n.explique ? n.explique + ' écart(s) expliqué(s)' : 'exécutée', cls:'', ok:true };
}
function blocPlan(p){
  const procs = proceduresRequises(p);
  const rows = procs.map(pr => {
    const e = echantillonProc(p, pr), st = etatProc(p, pr);
    const ouvert = S.procOuverte === p.code + '/' + pr.code;
    return {
      pr:`<b>${esc(pr.lib)}</b><div class="smallcaps">${esc(procRef(p, pr))} · requise à partir de « ${NIV_LIB[pr.min]} »</div>`,
      a:esc(libAssertion(pr.a)) + `<div class="smallcaps">risque ${NIV_LIB[niveau(p, pr.a)]}${e ? ' · tirage ' + e.n + ' · strate ' + eur0(e.strate) : ''}</div>`,
      sel:e ? `<span class="mono">${e.retenus.length}</span> ${esc(pr.unite)}(s)
               <div class="smallcaps">${e.exhaustif.length} exhaustifs + ${e.alea.length} tirés · ${pct(e.taux, 1)} de la masse</div>`
            : '<span class="smallcaps">sans sélection</span>',
      pop:e ? `<span class="mono">${e.pop.items.length}</span><div class="smallcaps">${eur0(e.pop.masse)}</div>` : '—',
      wp:pr.ech ? `<span class="mono">${esc(procRef(p, pr))}</span>` : '<span class="smallcaps">—</span>',
      st:`<span class="pill ${st.cls}">${st.lib}</span>`
         + (pr.unidirectionnel ? ' <span class="pill warn">unidirectionnel</span>' : ''),
      act:`<button class="btn mini ${ouvert ? '' : 'sec'}" data-proc="${p.code}/${pr.code}">${ouvert ? 'ouverte' : 'ouvrir'}</button>
           ${boutonNote(p.code, 'procedure', pr.code, 'Procédure ' + procRef(p, pr))}`,
    };
  });
  return procs.length ? table([{k:'pr',t:'Procédure',cls:'wrapcell'},{k:'a',t:'Assertion'},
    {k:'pop',t:'Population',n:1},{k:'sel',t:'Sélection',cls:'wrapcell'},{k:'wp',t:'Papier'},
    {k:'st',t:'Statut'},{k:'act',t:''}], rows)
    : '<p class="note">Aucune procédure requise au niveau de risque retenu.</p>';
}

/* ─────────────────────────────────────────────────────────────────────────
   4. UNE PROCÉDURE : sa population, sa sélection, son papier
   ───────────────────────────────────────────────────────────────────────── */
const CTR_PAR_PAGE = 40;
function blocProcedure(p, pr){
  const stp = proc(p.code, pr.code), e = echantillonProc(p, pr), s = seuils();
  const cat = catalogue(p, pr), spec = catalogueSpecifique(p, pr);
  const deja = requetesDe(p.code).some(r => r.proc === pr.code);
  if (!pr.ech) return `
    <div class="row"><span class="pill">${esc(libAssertion(pr.a))}</span>
      <span class="pill">sans sélection</span><span class="smallcaps">${esc(procRef(p, pr))}</span></div>
    <p class="note">${esc(pr.lib)} — procédure exécutée sur la population entière, sans échantillonnage.</p>
    <div class="ctrl"><label>Conclusion de la procédure</label>
      <textarea data-pconcl="${pr.code}" rows="2" placeholder="résultat de la procédure">${esc(stp.conclusion)}</textarea></div>`;

  /* ── définition de la population, affichée telle quelle ── */
  const defPop = `
    <h3>Population</h3>

      <span class="k">Définition</span><span class="v" style="font-family:var(--sans)">${esc(e.pop.lib)}</span>

      <span class="k">Masse</span><span class="v">${eur(e.pop.masse)}</span>
      <span class="k">Procédure servie</span><span class="v" style="font-family:var(--sans)">${esc(pr.lib)}</span>
      <span class="k">Assertion visée</span><span class="v" style="font-family:var(--sans)">${esc(libAssertion(pr.a))}</span>
      <span class="k">Papier alimenté</span><span class="v">${esc(procRef(p, pr))}</span>
    </div>
    ${pr.unidirectionnel ? `<div class="callout warn"><b>Test unidirectionnel.</b> ${esc(pr.unidirectionnel)}</div>` : ''}`;

  /* ── paramètres de tirage ── */
  const params = `
    <h3>Sélection</h3>

        <input type="text" data-pseed="${pr.code}" value="${esc(stp.seed)}"></div>
      <div class="ctrl"><label>&nbsp;</label><button class="btn sec" data-pnouveau="${pr.code}">nouveau germe</button></div>
      <div class="ctrl"><label>&nbsp;</label>
        <button class="btn" data-preq="${pr.code}" ${deja ? 'disabled' : ''}>${deja ? 'requête émise' : 'générer la requête depuis le catalogue'}</button></div>
    </div>
    <div class="grid3">
      <div class="kv"><span class="k">Strate exhaustive (≥ ${eur0(e.strate)})</span><span class="v">${e.exhaustif.length}</span>
        <span class="k">Tirage aléatoire</span><span class="v">${e.alea.length} / ${e.n} — risque ${NIV_LIB[e.niv]}</span></div>
      <div class="kv"><span class="k">Retenus</span><span class="v">${e.retenus.length}</span>
        <span class="k">Montant couvert</span><span class="v">${eur(e.couvert)}</span></div>
      <div class="kv"><span class="k">Couverture</span><span class="v">${pct(e.taux, 1)}</span>
        <span class="k">Papier</span><span class="v">${esc(procRef(p, pr))}</span></div>
    </div>`;

  /* ── catalogue de preuve appliqué ── */
  const catBloc = cat ? `
    <h3>Justificatifs attendus <span class="tag ${spec ? 'det' : ''}">${spec ? 'catalogue du cycle' : 'catalogue générique'}</span></h3>
    ${table([{k:'d',t:'Document'},{k:'c',t:'Champ à relever'},{k:'r',t:'Contrôlé contre',cls:'wrapcell'},{k:'t',t:'Tolérance'}],
      cat.flatMap(d => d.champs.map((ch, i) => ({
