/* ═══ 14. PÉRIMÈTRE ET SYNTHÈSE ════════════════════════════════════════════ */
function postesEnPerimetre(){
  const s = seuils();
  return postesCalcules().filter(p =>
    (S.scopingOverride[p.code] || (Math.abs(p.solde) >= s.PM ? 'in' : 'out')) === 'in');
}

/** Anomalies : elles ne sont pas saisies, elles AGRÈGENT ce que les sections
 *  ont produit — écarts de papiers de travail, écart de rapprochement,
 *  écritures relevées au test des écritures. */
function anomalies(){
  const s = seuils(), out = [];
  for (const p of postesEnPerimetre()){
    for (const pr of proceduresRequises(p)){
      for (const c of ecartsChiffresProc(p, pr)){
        out.push({ src:p.lib + ' · ' + procRef(p, pr),
                   lib:c.ch.lib + ' — ' + (c.ligne.x.e ? 'pièce ' + c.ligne.x.e.pieceRef : c.ligne.cle)
                      + ' (' + c.doc.toLowerCase() + ')',
                   montant:c.montant, expl:c.ligne.expl,
                   section:p.code, objet:'papier', ref:c.ligne.cle });
      }
    }
  }
  for (const r of rapprochement()) if (r.ecart !== 0 && r.sTB - r.sGL > 0)
    out.push({ src:'Rapprochement', lib:'Écriture de situation non reprise au FEC — compte ' + r.compte,
               montant:r.ecart, expl:'Écart documenté ; rapprochement à re-exécuter sur le FEC définitif.',
               section:null, objet:'rappro', ref:r.compte });
  const parTag = t => LEDGER.entries.filter(e => e.tag === t);
  const dupe = parTag('A1');
  if (dupe.length === 2) out.push({ src:'Test des écritures', lib:'Même facture comptabilisée deux fois (' + dupe[0].pieceRef + ')',
    montant:dupe[1].lines[0].debit, expl:'Doublon d’intégration reconnu par le client ; extourne non comptabilisée à date.',
    section:null, objet:'je', ref:dupe[1].num });
  for (const e of parTag('A5')) out.push({ src:'Test des écritures', lib:'Produit de 2026 rattaché à 2025 (' + e.pieceRef + ')',
    montant:e.lines[0].debit, expl:'Facture datée du ' + frDate(e.pieceDate) + ', comptabilisée le ' + frDate(e.date) + '.',
    section:null, objet:'je', ref:e.num });
  for (const e of parTag('A6')) out.push({ src:'Test des écritures', lib:'Écriture manuelle de direction (' + e.pieceRef + ')',
    montant:e.lines[0].debit, expl:'Prestation démarrant en janvier 2026 selon l’explication reçue.',
    section:null, objet:'je', ref:e.num });
  return out.map(a => ({ ...a, souSeuil:Math.abs(a.montant) < s.CTT }));
}

    blk('Anomalies relevées', a.length + ' au total',
      table([{k:'src',t:'Origine'},{k:'lib',t:'Anomalie',cls:'wrapcell'},{k:'m',t:'Montant',n:1},

      `<div class="grid2" style="margin-top:10px">
        <div class="kv">
          <span class="k">Anomalies relevées</span><span class="v">${a.length}</span>
          <span class="k">Sous le seuil de remontée (${eur0(s.CTT)})</span><span class="v">${triviales.length}</span>
          <span class="k">Non corrigées</span><span class="v">${retenues.length} — ${eur(cumul)}</span>
          <span class="k">Seuil de signification</span><span class="v">${eur(s.M)}</span>
          <span class="k">Rapport au seuil</span><span class="v">${pct(Math.abs(cumul) / s.M, 0)}</span>
        </div>
        <div class="callout ${depasse ? 'bad' : 'ok'}"><b>Conséquence.</b> ${depasse
          ? `Le cumul des anomalies non corrigées (${eur(cumul)}) <b>dépasse le seuil de signification</b> (${eur(s.M)}).

    return {
      s:`<b>${esc(p.lib)}</b><div class="smallcaps">${esc(MASSE_LIB[masseDe(p)])}</div>`,
      r:`<span class="pill ${NIVEAUX[niveauMax(p)] === 'eleve' ? 'bad' : NIVEAUX[niveauMax(p)] === 'moyen' ? 'warn' : 'ok'}">${NIV_LIB[NIVEAUX[niveauMax(p)]]}</span>`,
      p:String(proceduresRequises(p).length),
      e:`${recus} / ${tot}`,
      ct:ctrTot ? `${ctrOk} / ${ctrTot}` : '<span class="smallcaps">—</span>',
      q:rs.length ? `<div class="bar" style="width:80px"><i style="width:${(av * 100).toFixed(0)}%"></i></div><span class="smallcaps">${pct(av, 0)}</span>` : '<span class="smallcaps">aucune</span>',
      n:bl ? `<span class="pill bad">${bl} bloquante(s)</span>` : '<span class="smallcaps">—</span>',
      v:st.visa ? '<span class="pill ok">visée</span>' : `<span class="pill ${o.length ? 'bad' : 'warn'}">${o.length || 'prête'}</span>`,
      a:`<button class="btn mini sec" data-open="${p.code}">ouvrir</button>`,
    };
  });
  const enRetard = S.requetes.filter(retard);
  const parPersonne = {};
  for (const r of enRetard){ const c = S.contacts.find(x => x.id === r.contact);
    const k = c ? c.id : '?';
    parPersonne[k] = parPersonne[k] || { c, n:0, items:0, age:0 };
    parPersonne[k].n++; parPersonne[k].items += r.items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length;
    parPersonne[k].age = Math.max(parPersonne[k].age, ancienneteRetard(r)); }
  return entete('Avancement de la mission', 'état réel des sections et des demandes — rien de saisi à côté') +
    blk('Sections', postes.length + ' dans le périmètre',
      table([{k:'s',t:'Section',cls:'wrapcell'},{k:'r',t:'Risque'},{k:'p',t:'Procédures',n:1},
             {k:'e',t:'Pièces reçues',n:1},{k:'ct',t:'Contrôles saisis',n:1},{k:'q',t:'Requêtes'},
             {k:'n',t:'Notes bloquantes'},{k:'v',t:'Visa'},{k:'a',t:''}], rows)) +
    blk('Qui doit quoi, côté client', enRetard.length + ' demande(s) en retard',
      Object.keys(parPersonne).length
        ? table([{k:'p',t:'Personne',cls:'wrapcell'},{k:'n',t:'Demandes',n:1},{k:'i',t:'Éléments',n:1},{k:'a',t:'Ancienneté',n:1}],
            Object.values(parPersonne).sort((a, b) => b.age - a.age).map(x => ({
              p:x.c ? `<b>${esc(x.c.nom)}</b><div class="smallcaps">${esc(x.c.fonction)} · ${esc(x.c.societe)}</div>` : '—',
              n:String(x.n), i:String(x.items), a:x.age + ' j ouvrés' }))) +
          ''
        : '<p class="note">Aucune demande en retard.</p>') +
    blk('Export du statut de mission', 'trois périmètres de destinataire',
      `<p class="note">Le classeur, les périmètres de colonnes et la composition de l’envoi périodique se trouvent
      dans <a data-vue="pil.export" style="cursor:pointer">Exports et envoi</a>.</p>`);
}
/* ═══ 25. REGISTRE DES FACTEURS DE RISQUE ══════════════════════════════════
   Ce que doivent faire circuler les sections, ce ne sont pas des lignes de
   tableau : ce sont des CONSTATATIONS. Une constatation levée par une
   procédure — un écart de rapprochement, une écriture de direction, une
   pièce datée hors exercice — doit se poser SEULE sur les sections
   concernées, avec un lien vers sa source, sans ressaisie.

   Le facteur est un objet de première classe : source, nature, description,
   FSLI et assertions touchés, statut, effet retenu. Il n'est PAS un
   enregistrement figé : les candidats sont re-dérivés à chaque rendu par les
   règles ci-dessous (donc ils suivent la matérialité), tandis que la DÉCISION
   humaine — confirmé, écarté, effet retenu — est conservée par identifiant
   stable. Bouger un seuil ne perd jamais un arbitrage.

   GARDE-FOU. Trois cents alertes que personne ne lit, c'est le défaut
   classique de l'analyse de données en audit. Chaque règle porte donc un
   SEUIL DE PERTINENCE explicite et modifiable, le compteur de facteurs
   proposés est affiché en permanence, et la vue de triage alerte dès que le
   volume sort de l'ordre de la dizaine.
   ═══════════════════════════════════════════════════════════════════════ */

const CIBLE_VOLUME = 15;   // au-delà, le registre prévient qu'il devient du bruit

/** Postes touchés par un compte donné. */
function postesDuCompte(compte){
  return postesCalcules().filter(p => p.re.test(compte));
}

/* ── règles de levée ──────────────────────────────────────────────────────
   Chaque règle : un code, une source (procédure qui la lève et vue où la
   relire), un seuil de pertinence nommé, et une fonction qui rend des
   candidats. L'identifiant d'un candidat est stable : règle + clé métier.  */
const REGLES_FACTEUR = [
  {
    code:'RAPPRO', lib:'Écart de rapprochement balance ↔ grand livre non résolu',
    srcLib:'Rapprochement balance ↔ grand livre', srcVue:'plan.rappro',
    seuilLib:'écart minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const r of rapprochement()){
        if (Math.abs(r.ecart) < seuil * 100) continue;
        const postes = postesDuCompte(r.compte);
        if (!postes.length) continue;
        out.push({
          id:'RAPPRO:' + r.compte,
          description:`Le compte ${r.compte} « ${r.lib} » présente un écart de ${eur(r.ecart)} entre la balance `
                    + `transmise et le fichier des écritures. Tant qu’il n’est pas expliqué, le détail du poste `
                    + `n’est pas rapproché de son solde.`,
          cibles:postes.map(p => ({ fsli:p.code, assertions:['exhaustivite'] })),
          pertinence:`écart ${eur(Math.abs(r.ecart))} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'compte ' + r.compte,
        });
      }
      return out;
    },
  },
  {
    /* Chemin parcouru sur cette règle, parce qu'il dit ce que vaut le garde-fou.
       « La direction a saisi des écritures » : 62 écritures sur 1 605, réparties
       sur tous les postes → treize facteurs, c'est-à-dire du bruit pur.
       « … et porteuses d'un second marqueur » : encore onze.
       En regardant la distribution : douze postes entre 11 k€ et 244 k€, aucune
       coupure naturelle. Il n'y a pas de seuil ABSOLU défendable — le générateur
       attribue la saisie par la direction au hasard, donc il n'y a AUCUNE
       concentration à trouver. Choisir un montant qui « donne trois facteurs »
       aurait été régler le nombre, pas le critère.
       Le critère qui a un sens est donc RELATIF : la direction pèse-t-elle sur ce
       poste une part anormale de sa masse ? Sur ce jeu de données la réponse est
       non, et la règle ne lève rien — c'est le bon résultat. Une règle qui
       trouverait quelque chose ici serait une règle qui trouve toujours quelque
       chose. Baissez le seuil dans la vue de triage pour la voir se déclencher :
       c'est le compromis, et il est sous votre main. */
    code:'DIRECTION', lib:'Poids anormal des écritures de direction sur le poste',
    srcLib:'Test des écritures', srcVue:'plan.je',
    seuilLib:'part minimale de la masse du poste', seuilUnite:'%', seuilDefaut:() => 5, pas:0.5,
    nature:'qualitatif',
    calc(seuil){
      const marqueurs = [
        { lib:'journal d’opérations diverses', f:e => e.journal === 'OD' },
        { lib:'comptabilisée un week-end',     f:e => isWeekend(e.date) },
        { lib:'montant rond au millier',       f:e => { const m = e.lines[0].debit || e.lines[0].credit; return m >= 100000 && m % 100000 === 0; } },
        { lib:'validée après la clôture',      f:e => e.validDate > '2025-12-31' },
      ];
      const out = [];
      for (const p of postesCalcules()){
        const masse = statsPoste(p).masse;
        if (!masse) continue;
        const ecr = LEDGER.entries.filter(e => e.lines.some(l => p.re.test(l.compte))
          && /direction/.test(e.saisiePar) && marqueurs.some(m => m.f(e)));
        if (!ecr.length) continue;
        const m = ecr.reduce((a, e) => a + (e.lines[0].debit || e.lines[0].credit), 0);
        const part = m / masse;
        // plancher absolu : un poste minuscule ne devient pas un risque parce
        // qu'une écriture y pèse proportionnellement beaucoup
        if (part < seuil / 100 || m < seuils().CTT) continue;
        const quels = [...new Set(ecr.flatMap(e => marqueurs.filter(x => x.f(e)).map(x => x.lib)))];
        out.push({
          id:'DIRECTION:' + p.code,
          description:`${ecr.length} écriture(s) saisies par la direction ET porteuses d’un second marqueur `
                    + `(${quels.join(', ')}) pèsent ${eur(m)}, soit ${pct(part, 1)} de la masse du poste `
                    + `(${eur(masse)}). La possibilité pour la direction de passer outre les contrôles est un `
                    + `facteur qualitatif : il ne se déduit d’aucun montant, mais il ne se lève que là où la `
                    + `concentration le justifie.`,
          cibles:[{ fsli:p.code, assertions:['realite'] }],
          pertinence:`${pct(part, 1)} de la masse ≥ seuil ${seuil}${NBSP}% (plancher ${eur(seuils().CTT)})`,
          srcRef:p.lib,
        });
      }
      return out;
    },
  },
  {
    code:'PIECE_HORS', lib:'Pièce datée hors exercice',
    srcLib:'Contrôle de forme du fichier des écritures', srcVue:'plan.rappro',
    /* Clé : la PIÈCE, pas le poste. Une facture de vente touche le chiffre
       d'affaires ET les créances : la keyer par poste dédoublait une seule
       constatation en deux facteurs portant le même texte. Une constatation,
       un facteur, plusieurs cibles. */
    seuilLib:'écart minimal à la clôture', seuilUnite:'jours', seuilDefaut:() => 1, pas:1,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const e of LEDGER.entries){
        if (!e.pieceDate) continue;
        const jours = e.pieceDate > '2025-12-31'
          ? Math.round((Date.parse(e.pieceDate) - Date.parse('2025-12-31')) / 86400000)
          : e.pieceDate < '2025-01-01'
            ? Math.round((Date.parse('2025-01-01') - Date.parse(e.pieceDate)) / 86400000) : 0;
        if (jours < seuil) continue;
        const postes = [...new Set(e.lines.flatMap(l => postesDuCompte(l.compte).map(p => p.code)))];
        if (!postes.length) continue;
        out.push({
          id:'PIECE_HORS:' + e.pieceRef,
          description:`La pièce ${e.pieceRef} porte la date du ${frDate(e.pieceDate)}, soit ${jours} jour(s) hors `
                    + `de l’exercice, alors que l’écriture ${e.num} est comptabilisée le ${frDate(e.date)} `
                    + `(${eur(e.lines[0].debit || e.lines[0].credit)}). Indice de rattachement au mauvais exercice.`,
          cibles:postes.map(c => ({ fsli:c, assertions:['separation'] })),
          pertinence:`${jours} jour(s) hors exercice ≥ seuil ${seuil}`,
          srcRef:'pièce ' + e.pieceRef,
        });
      }
      return out;
    },
  },
  {
    code:'JE_ANOMALIE', lib:'Écriture particulière relevée au test des écritures',
    srcLib:'Test des écritures', srcVue:'plan.je',
    seuilLib:'montant minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const LIB = { A1:['réalité', 'realite', 'Même facture comptabilisée deux fois'],
                    A5:['séparation des exercices', 'separation', 'Produit de 2026 rattaché à 2025'],
                    A6:['réalité', 'realite', 'Écriture manuelle de direction en fin d’exercice'] };
      const out = [], vus = new Set();
      for (const e of LEDGER.entries){
        if (!e.tag || !LIB[e.tag]) continue;
        const cle = e.tag + '/' + e.pieceRef;
        if (vus.has(cle)) continue;          // une constatation, un facteur
        vus.add(cle);
        const m = e.lines[0].debit || e.lines[0].credit;
        if (m < seuil * 100) continue;
        const comptes = e.lines.map(l => l.compte);
        const postes = [...new Set(comptes.flatMap(c => postesDuCompte(c).map(p => p.code)))];
        if (!postes.length) continue;
        out.push({
          id:'JE_ANOMALIE:' + e.num,
          description:`${LIB[e.tag][2]} — écriture ${e.num}, pièce ${e.pieceRef}, ${eur(m)}. Relevée par les `
                    + `critères de sélection des écritures, elle porte sur ce poste.`,
          cibles:postes.map(c => ({ fsli:c, assertions:[LIB[e.tag][1]] })),
          pertinence:`${eur(m)} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'écriture ' + e.num,
        });
      }
      return out;
    },
  },
  {
    /* Deuxième fois que le même piège se referme, et de la même façon.
       Premier essai : « variation ≥ 3 × le seuil de planification ». Résultat,
       cinq facteurs — dont une HAUSSE DE 1,7 % DU CHIFFRE D'AFFAIRES. Sur un
       compte de 5 M€, trois fois le seuil est un mouvement ordinaire ; le
       multiple absolu ne mesure que la taille du compte.
       Ce qui rend une variation inhabituelle, c'est son ampleur RELATIVE à ce
       que le compte pèse. La règle exige donc les deux : un montant qui compte
       (au moins le seuil de planification, sinon on parle de bruit) ET une
       déformation du compte au-delà du taux réglé ci-contre. Une croissance de
       1,7 % ne lève plus rien ; un compte qui double, oui. */
    code:'RA_PRELIM', lib:'Variation d’ampleur inhabituelle à la revue analytique préliminaire',
    srcLib:'Revue analytique préliminaire', srcVue:'plan.ra',
    seuilLib:'déformation minimale du compte', seuilUnite:'%', seuilDefaut:() => 25, pas:5,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const l of revueAnalytique()){
        if (Math.abs(l.d) < seuils().PM) continue;              // plancher : le montant doit compter
        if (l.p === null || Math.abs(l.p) < seuil / 100) continue;  // et la déformation doit être réelle
        const postes = postesDuCompte(l.compte);
        if (!postes.length) continue;
        const k = sensNaturel(l), sens = l.d * k > 0 ? 'augmentation' : 'diminution';
        out.push({
          id:'RA_PRELIM:' + l.compte,
          description:`Le compte ${l.compte} « ${l.lib} » présente une ${sens} de ${eur(Math.abs(l.d))}, soit `
                    + `${pct(Math.abs(l.p), 1)} de son solde de l’exercice précédent (${eur(Math.abs(l.n1))}). `
                    + `Une déformation de cette ampleur oriente les travaux avant même leur programmation.`,
          cibles:postes.map(x => ({ fsli:x.code, assertions:['realite', 'presentation'] })),
          pertinence:`${pct(Math.abs(l.p), 1)} de déformation ≥ seuil ${seuil}${NBSP}% · montant ${eur(Math.abs(l.d))} ≥ plancher ${eur0(seuils().PM)}`,
          srcRef:'compte ' + l.compte,
        });
      }
      return out;
    },
  },
  {
    code:'CIRC', lib:'Compte en comptabilité absent du listing à circulariser',
    srcLib:'Exhaustivité des circularisations', srcVue:'plan.circ',
    seuilLib:'solde minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const b of exhaustiviteBanques()){
        if (b.declare || Math.abs(b.solde) < seuil * 100) continue;
        const postes = postesDuCompte(b.compte);
        if (!postes.length) continue;
        out.push({
          id:'CIRC:' + b.compte,
          description:`Le compte ${b.compte} « ${b.lib} » (${eur(b.solde)}) figure en comptabilité mais pas au `
                    + `listing des banques transmis par le client. Le périmètre des confirmations à demander `
                    + `n’est pas arrêté.`,
          cibles:postes.map(p => ({ fsli:p.code, assertions:['exhaustivite'] })),
          pertinence:`solde ${eur(Math.abs(b.solde))} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'compte ' + b.compte,
        });
      }
      return out;
    },
  },
];

const _regleCache = new Map();
/** Candidats d'une règle, mémoïsés sur (règle, seuil, seuils de la mission).
 *  Sans cela, le rail — qui interroge les obstacles au visa de chaque section —
 *  relançait le registre entier seize fois par rendu. */
function candidatsRegle(r){
  const s = seuils(), seuil = seuilRegle(r.code);
  const cle = r.code + '|' + seuil + '|' + s.PM + '|' + s.CTT;
  if (_regleCache.has(cle)) return _regleCache.get(cle);
  const v = r.calc(seuil);
  if (_regleCache.size > 200) _regleCache.clear();
  _regleCache.set(cle, v);
  return v;
}
function seuilRegle(code){
  const r = REGLES_FACTEUR.find(x => x.code === code);
  return S.seuilsFacteurs[code] !== undefined ? S.seuilsFacteurs[code] : r.seuilDefaut();
}

/** Registre complet : candidats re-dérivés + facteurs saisis à la main,
 *  chacun portant la décision humaine conservée par identifiant. */
let _regCache = null, _regCle = '';
function registre(){
  const sq = seuils();
  const cle = JSON.stringify([S.seuilsFacteurs, S.decisionsFacteurs, S.facteursManuels.length, sq.PM, sq.CTT]);
  if (_regCache && _regCle === cle) return _regCache;
  const out = [];
  for (const r of REGLES_FACTEUR){
    for (const c of candidatsRegle(r)){
      const d = S.decisionsFacteurs[c.id] || {};
      out.push({ ...c, regle:r.code, regleLib:r.lib, nature:r.nature,
                 source:{ lib:r.srcLib, vue:r.srcVue, ref:c.srcRef },
                 auto:true,
                 statut:d.statut || 'propose', motif:d.motif || '',
                 effet:d.effet || 'majore', par:d.par, t:d.t, cree:d.cree || S.premierRendu });
    }
  }
  for (const f of S.facteursManuels){
    const d = S.decisionsFacteurs[f.id] || {};
    out.push({ ...f, auto:false,
               statut:d.statut || 'propose', motif:d.motif || '',
               effet:d.effet || 'majore', par:d.par, t:d.t });
  }
  _regCache = out; _regCle = cle;
  return out;
}
function facteursDe(code){ return registre().filter(f => f.cibles.some(c => c.fsli === code)); }
function facteursProposes(code){ return facteursDe(code).filter(f => f.statut === 'propose'); }
/** Facteurs confirmés ET retenus comme majorants, sur une assertion donnée. */
function facteursRetenus(code, assertion){
  return registre().filter(f => f.statut === 'confirme' && f.effet === 'majore'
    && f.cibles.some(c => c.fsli === code && (assertion === undefined || c.assertions.includes(assertion))));
}
function statuerFacteur(id, statut, motif, effet){
  const f = registre().find(x => x.id === id); if (!f) return;
  S.decisionsFacteurs[id] = { statut, motif:motif || '', effet:effet || 'majore',
                              par:S.moi, t:tick(), cree:f.cree };
  logEvent('facteur de risque ' + (statut === 'confirme' ? 'confirmé' : statut === 'ecarte' ? 'écarté' : 'remis en attente'),
           id, (motif ? motif.slice(0, 80) : '') + (statut === 'confirme' ? ' · effet : ' + effet : ''));
}

/* ── rendu d'un facteur ───────────────────────────────────────────────────── */
const STATUT_FACTEUR = { propose:{ lib:'proposé', cls:'warn' }, confirme:{ lib:'confirmé', cls:'bad' },
                         ecarte:{ lib:'écarté', cls:'' } };
function libFsli(code){ return (POSTES.find(p => p.code === code) || {}).lib || code; }
function libAssertion(code){ return (ASSERTIONS.find(a => a.code === code) || {}).lib || code; }

function carteFacteur(f, compact){
  const s = STATUT_FACTEUR[f.statut];
  const sansMotif = f.statut === 'ecarte' && !f.motif.trim();
  return `<div class="nl ${f.statut === 'propose' ? 'doc' : f.statut === 'confirme' ? 'bloq' : 'n1'}" data-fact="${esc(f.id)}">
    <div class="m">
      <span class="pill ${s.cls}">${s.lib}</span>
      <span class="mono">${esc(f.id)}</span>
      <span class="tag">${f.nature}</span>
      ${f.auto ? `<button class="btn mini sec" data-gosrc="${esc(f.source.vue)}">${esc(f.source.lib)} ↗</button>`
               : '<span class="tag">saisi à la main</span>'}
      ${f.source && f.source.ref ? `<span class="smallcaps">${esc(f.source.ref)}</span>` : ''}
      ${f.statut === 'confirme' ? `<span class="pill ${f.effet === 'majore' ? 'bad' : ''}">${f.effet === 'majore' ? 'majore le risque' : 'sans effet sur le niveau'}</span>` : ''}
      ${f.par ? `<span class="smallcaps">${esc(USERS[f.par].nom)} · ${horo(f.t)}</span>` : ''}
    </div>
    <div class="txt">${esc(f.description)}</div>
    <div class="m" style="margin-top:3px">
      ${compact ? '' : f.cibles.map(c => `<span class="tag">${esc(libFsli(c.fsli))} · ${c.assertions.map(libAssertion).join(', ')}</span>`).join(' ')}
      <span class="smallcaps">pertinence : ${esc(f.pertinence || '—')}</span>
    </div>
    ${f.motif ? `<div class="rep"><b>Motif</b> — ${esc(f.motif)}</div>` : ''}
    ${sansMotif ? '<div class="callout bad" style="margin-top:5px">Un facteur écarté sans motif écrit ne compte pas comme statué : il continue de bloquer le visa.</div>' : ''}
    <div class="row" style="margin:6px 0 0">
      ${f.statut === 'propose' ? `
        <div class="ctrl"><label>Effet si confirmé</label>
          <select data-feff="${esc(f.id)}"><option value="majore">majore le niveau de risque</option>
            <option value="neutre">confirmé, sans effet sur le niveau</option></select></div>
        <div class="ctrl" style="flex:1 1 240px"><label>Motif (obligatoire pour écarter, et pour « sans effet »)</label>
          <input type="text" data-fmotif="${esc(f.id)}" placeholder="pourquoi ce facteur est retenu, neutralisé ou écarté"></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn" data-fconf="${esc(f.id)}">confirmer</button></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn sec" data-fecart="${esc(f.id)}">écarter</button></div>`
      : `<button class="btn mini sec" data-frouvre="${esc(f.id)}">remettre en attente</button>`}
    </div>
  </div>`;
}

/* ── bloc inséré dans l'évaluation du risque d'une section ────────────────── */
function blocFacteursSection(p){
  const l = facteursDe(p.code), props = l.filter(f => f.statut === 'propose');
  if (!l.length) return `<p class="note">Aucune constatation venue d’une autre procédure ne touche ce poste

/* ═══ 28. REVUE ANALYTIQUE — TROIS MOMENTS ═════════════════════════════════
   Ce ne sont pas trois affichages d'un même module : ce sont trois diligences
   différentes, à trois moments différents, avec trois finalités.
     · préliminaire — en planification, transverse, elle ALIMENTE le registre
       des facteurs de risque ;
     · substantive  — dans une section, comme procédure à valeur probante ;
     · finale       — à l'achèvement, cohérence d'ensemble avant signature.
   ═══════════════════════════════════════════════════════════════════════ */

/** Ratios calculés des deux exercices. Aucun n'est saisi. */
function ratios(){
  const q = (b, re) => { let s = 0; for (const [c, v] of b) if (re.test(c)) s += v.solde; return s; };
  const f = b => {
    const ca = -q(b, /^70/), achats = q(b, /^60/), perso = q(b, /^64/),
          stocks = q(b, /^3/), clients = q(b, /^41/), fourn = -q(b, /^40/),
          produits = -q(b, /^7/), charges = q(b, /^6/), fin = q(b, /^66/);
    return { ca, achats, perso, stocks, clients, fourn, resultat:produits - charges, fin };
  };
  const a = f(B25), b = f(B24);
  const L = [
    { lib:'Marge sur achats consommés', u:'%', formule:'(chiffre d’affaires − achats consommés) ÷ chiffre d’affaires',
      n:a.ca ? (a.ca - a.achats) / a.ca : 0, n1:b.ca ? (b.ca - b.achats) / b.ca : 0, type:'pct' },
    { lib:'Poids des charges de personnel', u:'%', formule:'charges de personnel ÷ chiffre d’affaires',
      n:a.ca ? a.perso / a.ca : 0, n1:b.ca ? b.perso / b.ca : 0, type:'pct' },
    { lib:'Résultat courant rapporté au chiffre d’affaires', u:'%', formule:'résultat courant ÷ chiffre d’affaires',
      n:a.ca ? a.resultat / a.ca : 0, n1:b.ca ? b.resultat / b.ca : 0, type:'pct' },
    { lib:'Délai de règlement clients', u:'jours', formule:'créances clients ÷ chiffre d’affaires × 365',
      n:a.ca ? a.clients / a.ca * 365 : 0, n1:b.ca ? b.clients / b.ca * 365 : 0, type:'jours' },
    { lib:'Délai de règlement fournisseurs', u:'jours', formule:'dettes fournisseurs ÷ achats consommés × 365',
      n:a.achats ? a.fourn / a.achats * 365 : 0, n1:b.achats ? b.fourn / b.achats * 365 : 0, type:'jours' },
    { lib:'Rotation des stocks', u:'jours', formule:'stocks ÷ achats consommés × 365',
      n:a.achats ? a.stocks / a.achats * 365 : 0, n1:b.achats ? b.stocks / b.achats * 365 : 0, type:'jours' },
    { lib:'Couverture des charges financières', u:'×', formule:'résultat courant ÷ charges financières',
      n:a.fin ? a.resultat / a.fin : 0, n1:b.fin ? b.resultat / b.fin : 0, type:'fois' },
  ];
  return L.map(r => ({ ...r, d:r.n - r.n1,
    fmt:v => r.type === 'pct' ? pct(v, 1) : r.type === 'jours' ? v.toFixed(0).replace('.', ',') + NBSP + 'j'
           : v.toFixed(1).replace('.', ',') + NBSP + '×' }));
}

  { ref:'A-02', lib:'Annexe — échéancier des dettes financières à plus d’un an', nature:'calcul',
    formule:'capital restant dû au 31/12/2025 diminué des échéances contractuelles des douze mois suivants',
    aide:'Le solde 164000 ne se ventile pas seul : la ventilation vient du tableau d’amortissement de l’emprunt.' },
  { ref:'A-03', lib:'Annexe — ventilation du chiffre d’affaires par nature', nature:'calcul',

];
function montantAudite(e){
  if (e.nature === 'calcul') return null;
  return Math.abs(soldeDe(e.comptes));
}
function montantPlaquette(e){
  const a = montantAudite(e);
  return a === null ? null : a + (e.ecart || 0);
}
const NATURE_LIB = { solde:'solde de balance', agregat:'agrégat de comptes', calcul:'calcul à documenter' };

function vueAchPointage(){
  const st = S.achevement;
  const rows = PLAQUETTE.map(e => {
    const aud = e.nature === 'calcul'
      ? (st.calculs[e.ref] && st.calculs[e.ref].montant !== undefined ? st.calculs[e.ref].montant : null)
      : montantAudite(e);
    const pl = e.nature === 'calcul'
      ? (st.plaquette[e.ref] !== undefined ? st.plaquette[e.ref] : null)
      : montantPlaquette(e);
    const ec = (aud === null || pl === null) ? null : pl - aud;
    return {
      ref:`<span class="mono">${e.ref}</span>`,
      lib:`<b>${esc(e.lib)}</b>${e.formule ? '<div class="smallcaps">' + esc(e.formule) + '</div>' : ''}`,

         ? `<input class="cell" data-plaq="${e.ref}" value="${pl === null ? '' : (pl / 100).toFixed(2).replace('.', ',')}" placeholder="montant plaquette">`
         : eur(pl),
      or:e.nature === 'calcul' ? '<span class="smallcaps">à documenter</span>'
         : `<span class="smallcaps">${e.comptes.join(' · ')}</span>`,
      aud:e.nature === 'calcul'
          ? `<input class="cell" data-calcm="${e.ref}" value="${aud === null ? '' : (aud / 100).toFixed(2).replace('.', ',')}" placeholder="montant audité">`
          : eur(aud),
      ec:ec === null ? '<span class="pill warn">non rapproché</span>'
         : ec === 0 ? '<span class="pill ok">nul</span>' : '<span class="pill bad">' + eur(ec) + '</span>',
      doc:e.nature === 'calcul'
          ? `<input class="cell txt" data-calcd="${e.ref}" value="${esc((st.calculs[e.ref] || {}).doc || '')}" placeholder="d’où vient le montant">`
          : '<span class="smallcaps">rapproché de la balance</span>',

  const nonRappro = PLAQUETTE.filter(e => {

  const ecarts = PLAQUETTE.filter(e => {

  const sansDoc = PLAQUETTE.filter(e => e.nature === 'calcul' && !((st.calculs[e.ref] || {}).doc || '').trim());
  return entete('Pointage des états financiers', 'plaquette à gauche, montant audité à droite, écart et origine') +

      relève de l’échelle d’extraction <span class="tag mod">modèle</span>.</p>`);
}

function vueAchAnomalies(){
  const s = seuils(), a = anomalies(), st = S.achevement;
  const retenues = a.filter(x => !x.souSeuil);
  const corrigees = retenues.filter(x => st.corrigees[x.ref + '|' + x.lib]);
  const nonCorr = retenues.filter(x => !st.corrigees[x.ref + '|' + x.lib]);
  const cumul = nonCorr.reduce((t, x) => t + x.montant, 0);
  const depasse = Math.abs(cumul) > s.M;
  const opinions = [
    { v:'certification', lib:'Certification sans réserve' },
    { v:'reserve', lib:'Certification avec réserve' },
    { v:'refus', lib:'Refus de certifier' },
    { v:'impossibilite', lib:'Impossibilité de certifier' },
  ];
  const propose = depasse ? 'reserve' : 'certification';
  return entete('Anomalies non corrigées et incidence sur l’opinion', 'évaluation finale') +
    blk('Anomalies au-dessus du seuil de remontée', retenues.length + ' — dont ' + nonCorr.length + ' non corrigées',
      table([{k:'src',t:'Origine',cls:'wrapcell'},{k:'lib',t:'Anomalie',cls:'wrapcell'},{k:'m',t:'Montant',n:1},
             {k:'c',t:'Corrigée par le client'},{k:'v',t:''}],
        retenues.map(x => ({
          src:esc(x.src), lib:esc(x.lib), m:eur(x.montant),
          c:`<label class="chk"><input type="checkbox" data-corr="${esc(x.ref + '|' + x.lib)}" ${st.corrigees[x.ref + '|' + x.lib] ? 'checked' : ''}><span>corrigée</span></label>`,
          v:x.section ? `<button class="btn mini sec" data-open="${x.section}">section</button>` : '',
        })), { foot:{ src:'Cumul non corrigé', m:eur(cumul) } })) +
    blk('Incidence sur l’opinion', depasse ? 'le cumul dépasse le seuil de signification' : 'le cumul reste sous le seuil',
      `<div class="kv">
        <span class="k">Cumul non corrigé</span><span class="v">${eur(cumul)}</span>
        <span class="k">Seuil de signification</span><span class="v">${eur(s.M)}</span>
        <span class="k">Rapport au seuil</span><span class="v">${pct(Math.abs(cumul) / s.M, 0)}</span>
        <span class="k">Corrigées par le client</span><span class="v">${corrigees.length} — ${eur(corrigees.reduce((t, x) => t + x.montant, 0))}</span>
      </div>
      <div class="row" style="margin-top:10px">
        <div class="ctrl"><label>Opinion retenue — proposition : ${esc(opinions.find(o => o.v === propose).lib)}</label>
          <select id="ach-op">${opinions.map(o => `<option value="${o.v}" ${st.opinion === o.v ? 'selected' : ''}>${esc(o.lib)}</option>`).join('')}</select></div>
      </div>
      <div class="ctrl"><label>Motivation${st.opinion && st.opinion !== propose ? ' — obligatoire : l’opinion retenue s’écarte de la proposition' : ''}</label>
        <textarea id="ach-opm" rows="3" placeholder="motivation de l’opinion retenue">${esc(st.opinionMotif)}</textarea></div>
      ${st.opinion && st.opinion !== propose && !st.opinionMotif.trim()
        ? '<div class="callout bad">L’opinion retenue s’écarte de la proposition et n’est pas motivée.</div>' : ''}`);
}

function vueAchCloture(){
  const st = S.achevement, postes = postesEnPerimetre();
  const nonVisees = postes.filter(p => !sec(p.code).visa);
  const bloq = notesBloquantesOuvertes();
  const facteursOuverts = registre().filter(f => f.statut === 'propose');
  const echeance = addDays(DATE_RAPPORT, DELAI_ASSEMBLAGE);
  const jours = Math.round((Date.parse(echeance) - Date.parse(S.aujourdhui)) / 86400000);
  const obstacles = [];
  if (nonVisees.length) obstacles.push(`${nonVisees.length} section(s) non visée(s) : ${nonVisees.map(p => p.lib).join(', ')}`);
  if (bloq.length) obstacles.push(`${bloq.length} note(s) de revue bloquante(s) ouverte(s)`);
  if (facteursOuverts.length) obstacles.push(`${facteursOuverts.length} facteur(s) de risque non statué(s)`);
  if (!st.opinion) obstacles.push('opinion non arrêtée');
  if (!st.raFinale.trim()) obstacles.push('revue analytique finale non conclue');
  for (const k of Object.keys(ACH)){
    const f = ACH[k].pts.filter((_, i) => (st.points[k] || {})[i]).length;
    if (f < ACH[k].pts.length) obstacles.push(`${ACH[k].t} : ${ACH[k].pts.length - f} point(s) non exécuté(s)`);
    if (!(st.concl[k] || '').trim()) obstacles.push(`${ACH[k].t} : conclusion manquante`);
  }
  return entete('Assemblage et clôture du dossier', 'le dossier devient définitif et se verrouille') +
    blk('Délai d’assemblage', jours >= 0 ? jours + ' jour(s) restant(s)' : 'délai dépassé',
      `<div class="kv">
        <span class="k">Date du rapport</span><span class="v">${frDate(DATE_RAPPORT)}</span>
        <span class="k">Délai d’assemblage</span><span class="v">${DELAI_ASSEMBLAGE} jours</span>
        <span class="k">Échéance</span><span class="v">${frDate(echeance)}</span>
        <span class="k">Aujourd’hui</span><span class="v">${frDate(S.aujourdhui)}</span>
        <span class="k">Conservation</span><span class="v">${RETENTION_ANS} ans</span>
      </div>
      <p class="note">Délai d’assemblage : <b>C. com., art. D. 821-186, III et IV</b> — 60 jours.
      Durée de conservation : <b>C. com., art. R. 820-42</b> — 6 ans. Ces deux références ont été vérifiées sur le
      texte primaire lors des travaux de rétention du dépôt ; elles sont portées ici telles que le noyau les
      enregistre, avec leur source.</p>`) +
    blk('Conditions de clôture', obstacles.length ? obstacles.length + ' obstacle(s)' : 'réunies',
      obstacles.length
        ? `<div class="callout bad"><ul style="margin:0 0 0 16px;padding:0">${obstacles.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
           <button class="btn" disabled>clôturer et verrouiller le dossier</button>`
        : st.clos
          ? `<div class="callout ok"><b>Dossier clôturé</b> par ${esc(USERS[st.clos.par].nom)} le ${horo(st.clos.t)}.
             Le dossier est en lecture seule ; toute pièce ajoutée après cette date porte sa propre date et ne se
             substitue à rien.</div>`
          : `<button class="btn" id="ach-clore">clôturer et verrouiller le dossier</button>`) +
    blk('Ce que contient le dossier clôturé', '',
      table([{k:'q',t:'Élément'},{k:'n',t:'Nombre',n:1}], [
        { q:'Sections de travail visées', n:String(postes.filter(p => sec(p.code).visa).length) },
        { q:'Procédures exécutées', n:String(postes.reduce((a, p) => a + proceduresRequises(p).length, 0)) },
        { q:'Éléments sélectionnés', n:String(postes.reduce((a, p) => a + proceduresRequises(p).reduce((b, pr) => { const e = echantillonProc(p, pr); return b + (e ? e.retenus.length : 0); }, 0), 0)) },
        { q:'Requêtes émises', n:String(S.requetes.length) },
        { q:'Pièces déposées', n:String(S.requetes.reduce((a, r) => a + r.items.reduce((b, i) => b + i.depots.length, 0), 0)) },
        { q:'Notes de revue', n:String(S.notes.length) },
        { q:'Facteurs de risque statués', n:String(registre().filter(f => f.statut !== 'propose').length) },
        { q:'Événements au journal', n:String(S.events.length) },
      ]));

/* ═══ 31. FILTRES DE REQUÊTES ══════════════════════════════════════════════
   Cumulables, et les mêmes des deux côtés : ce qui change entre l'auditeur et
   le client, c'est le jeu de requêtes visibles et les statuts lisibles, pas
   la façon de filtrer.
   ═══════════════════════════════════════════════════════════════════════ */
function filtrer(liste, cote){
  const f = S.filtres;
  return liste.filter(r => {
    if (f.section && r.section !== f.section) return false;
    if (f.contact && r.contact !== f.contact) return false;
    if (f.statut){
      const st = r.items.map(i => cote === 'client' ? statutVisibleClient(i) : i.statut);
      if (!st.includes(f.statut)) return false;
    }
    if (f.echeance === 'retard' && !retard(r)) return false;
    if (f.echeance === 'avenir' && (retard(r) || r.echeance < S.aujourdhui)) return false;
    if (f.q){
      const q = f.q.toLowerCase();
      const hay = (r.id + ' ' + r.titre + ' ' + r.items.map(i => i.desc).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function barreFiltres(cote, total, retenus){
  const f = S.filtres;
  const sections = [...new Set(S.requetes.map(r => r.section))];
  const statuts = Object.entries(STATUTS).filter(([, v]) => cote !== 'client' || v.client);
  return `<div class="row" style="align-items:flex-end">
    <div class="ctrl" style="flex:1 1 190px"><label>Recherche</label>
      <input type="text" id="f-q" value="${esc(f.q)}" placeholder="numéro, objet, élément"></div>
    <div class="ctrl"><label>Statut</label>
      <select id="f-statut"><option value="">tous</option>
        ${statuts.map(([k, v]) => `<option value="${k}" ${f.statut === k ? 'selected' : ''}>${esc(v.lib)}</option>`).join('')}</select></div>
    ${cote === 'client' ? '' : `<div class="ctrl"><label>Section</label>
      <select id="f-section"><option value="">toutes</option>
        ${sections.map(c => `<option value="${c}" ${f.section === c ? 'selected' : ''}>${esc(libFsli(c))}</option>`).join('')}</select></div>`}
    ${cote === 'client' ? '' : `<div class="ctrl"><label>Destinataire</label>
      <select id="f-contact"><option value="">tous</option>
        ${S.contacts.map(c => `<option value="${c.id}" ${f.contact === c.id ? 'selected' : ''}>${esc(c.nom)}</option>`).join('')}</select></div>`}
    <div class="ctrl"><label>Échéance</label>
      <select id="f-echeance"><option value="">toutes</option>
        <option value="retard" ${f.echeance === 'retard' ? 'selected' : ''}>en retard</option>
        <option value="avenir" ${f.echeance === 'avenir' ? 'selected' : ''}>à venir</option></select></div>
    <div class="ctrl"><label>&nbsp;</label>
      <span class="pill ${retenus < total ? 'acc' : ''}">${retenus} / ${total}</span></div>
    ${Object.values(f).some(Boolean) ? '<div class="ctrl"><label>&nbsp;</label><button class="btn sec" id="f-raz">effacer</button></div>' : ''}
  </div>`;
}

/* ═══ 32. EXPORT DU STATUT DE MISSION ══════════════════════════════════════
   Trois périmètres de destinataire. Le classeur porte une feuille par section
   et une feuille de synthèse.
   ═══════════════════════════════════════════════════════════════════════ */
const PERIMETRES = {
  equipe:{ lib:'équipe interne',
    cols:['N°','Objet','Procédure','Élément','Statut interne','En attente de revue par','Échéance','Retard (j ouvrés)','Responsable côté client'] },
  groupe:{ lib:'auditeur du groupe',
    cols:['N°','Objet','Éléments','Avancement','Échéance','Retard (j ouvrés)'] },
  client:{ lib:'client',
    cols:['N°','Objet','Élément','Statut','Échéance','Responsable côté client'] },
};
function lignesExport(kind, requetes){
  const out = [];
  for (const r of requetes){
    const c = S.contacts.find(x => x.id === r.contact);
    if (kind === 'groupe'){
      out.push([r.id, r.titre, String(r.items.length), pct(avancement(r.items), 0),
                frDate(r.echeance), String(ancienneteRetard(r))]);
      continue;
    }
    for (const i of r.items){
      if (kind === 'equipe') out.push([r.id, r.titre, r.proc || '', i.desc, STATUTS[i.statut].lib,
        i.revoyeur || '', frDate(r.echeance), String(ancienneteRetard(r)), c ? c.nom : '']);
      else out.push([r.id, r.titre, i.desc, STATUTS[statutVisibleClient(i)].lib,
        frDate(r.echeance), c ? c.nom : '']);
    }
  }
  return out;
}
/** Feuille de synthèse : avancement par section, et qui doit quoi. */
function feuilleSynthese(kind){
  const l = [['Section', 'Requêtes', 'Éléments', 'En attente', 'Avancement', 'Retard max (j ouvrés)']];
  const sections = [...new Set(S.requetes.map(r => r.section))];
  for (const c of sections){
    const rs = requetesDe(c);
    const items = rs.flatMap(r => r.items);
    l.push([libFsli(c), String(rs.length), String(items.length),
            String(items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length),
            pct(rs.length ? rs.reduce((a, r) => a + avancement(r.items), 0) / rs.length : 0, 0),
            String(Math.max(0, ...rs.map(ancienneteRetard)))]);
  }
  l.push([]);
  l.push(['Responsable côté client', 'Société', 'Demandes en retard', 'Éléments dus', 'Ancienneté max (j ouvrés)']);
  for (const ct of S.contacts){
    const rs = S.requetes.filter(r => r.contact === ct.id && retard(r));
    if (!rs.length) continue;
    l.push([ct.nom, ct.societe, String(rs.length),
            String(rs.flatMap(r => r.items).filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length),
            String(Math.max(...rs.map(ancienneteRetard)))]);
  }
  return l;
}
const xmlEsc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const nomFeuille = s => s.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31);
/** Classeur au format SpreadsheetML — plusieurs feuilles, aucune dépendance. */
function classeur(kind){
  const d = PERIMETRES[kind];
  const feuilles = [{ nom:'Synthèse', lignes:feuilleSynthese(kind) }];
  for (const c of [...new Set(S.requetes.map(r => r.section))]){
    feuilles.push({ nom:nomFeuille(libFsli(c)), lignes:[d.cols, ...lignesExport(kind, requetesDe(c))] });
  }
  const xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" '
    + 'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'
    + feuilles.map(f => `<Worksheet ss:Name="${xmlEsc(f.nom)}"><Table>\n`
        + f.lignes.map(r => '<Row>' + r.map(v =>
            `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`).join('') + '</Row>').join('\n')
        + '\n</Table></Worksheet>').join('\n')
    + '\n</Workbook>';
  return { xml, feuilles };
}
function telecharger(nom, contenu, type){
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenu], { type }));
    a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    return true;
  } catch (e){ return false; }
}

/** Mémorise le champ actif pour le rendre après reconstruction du DOM. */
function focusKey(){
  const el = document.activeElement;
  if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
  const pos = el.selectionStart;
  if (el.id) return { sel:'#' + el.id, pos };
  const ds = [...el.attributes].filter(a => a.name.startsWith('data-')).map(a => `[${a.name}="${a.value}"]`).join('');
  return ds ? { sel:el.tagName.toLowerCase() + ds, pos } : null;
}
function focusRestore(k){
  if (!k) return;
  const el = document.querySelector(k.sel);
  if (!el) return;
  el.focus();
  try { if (k.pos !== null && el.setSelectionRange) el.setSelectionRange(k.pos, k.pos); } catch (e) {}
}
function renderMain(){
  const k = focusKey();
  const main = document.getElementById('main');
  main.innerHTML = renderRail() + contenu();
  focusRestore(k);
}

function aller(vue, espace){
  if (espace && espace !== S.espace) S.espace = espace;
  S.vue = vue; S.noteCible = null;
  render();
  const m = document.getElementById('main');
  if (m) m.scrollIntoView({ block:'start' });
}
/** Ouvre la section d'un poste, depuis n'importe où. */
function ouvrirSection(code){ aller('fsli:' + code, 'auditeur'); }

/* ═══ 21. ENCHAÎNEMENT ═════════════════════════════════════════════════════
   Règle → requête DANS la section → portail client → dépôt → papier de
   travail de la même section → écart → synthèse. Chaque maillon est ici.
   ═══════════════════════════════════════════════════════════════════════ */
function requeteJustificatifsProc(p, pr){
  const e = echantillonProc(p, pr); if (!e) return null;
  const cat = catalogue(p, pr), docs = docsAttendusProc(p, pr);
  const items = e.retenus.map(x => ({
    desc:`${pr.tiers ? 'Tiers' : 'Écriture'} ${x.cle}${x.e ? ' — pièce ' + x.e.pieceRef : ''}`
       + `${x.e ? ' du ' + frDate(x.e.date) : ''} (${eur(x.montant)}) — à fournir : ${docs.join(' + ')}`,
    ref:x.cle }));
  const r = creerRequete(p.code, 'Justificatifs — ' + pr.lib, items, 12);
  r.proc = pr.code;
  r.origine = 'catalogue de preuve';
  // ce que le client doit trouver sur chaque document : rédigé par le catalogue
  r.detail = cat ? cat.map(d => d.doc + ' — ' + d.champs.map(c => c.lib.toLowerCase()).join(', ')).join(' ; ') : '';
  return r;
}
function requeteVariation(p, compte, l){
  const r = creerRequete(p.code, 'Explication de variation — compte ' + compte, [{
    desc:`Le compte ${compte} « ${l.lib} » passe de ${eur(l.n1)} au 31/12/2024 à ${eur(l.n)} au 31/12/2025, `
       + `soit ${eur(l.d)}${l.pr === null ? '' : ' (' + pct(l.pr, 1) + ')'}. Merci d’en indiquer l’explication et `
       + `de préciser les éléments justificatifs disponibles.`, ref:compte }], 10);
  r.origine = 'revue analytique substantive';
  return r;
}
/** Dépôt d'une pièce par le client : il rend testable la ligne du papier de
 *  travail de LA PROCÉDURE qui a demandé la pièce. */
function deposer(reqId, itemId){
  const r = S.requetes.find(x => x.id === reqId); if (!r) return;
  const it = r.items.find(i => i.id === itemId); if (!it) return;
  const p = postesCalcules().find(x => x.code === r.section);
  const pr = r.proc ? PROCEDURES.find(x => x.code === r.proc) : null;
  const docs = (p && pr && docsAttendusProc(p, pr).length) ? docsAttendusProc(p, pr) : ['pièce justificative'];
  const doc = docs[Math.min(it.depots.length, docs.length - 1)];
  const base = it.ref ? String(it.ref).replace(/[^\w-]+/g, '') : r.id;
  const nom = base + '_' + doc.toLowerCase().replace(/[^a-zà-ÿ0-9]+/gi, '-').replace(/^-|-$/g, '') + '.pdf';
  it.depots.push({ nom, doc, t:tick(), par:contactCourant().nom });
  it.statut = it.depots.length >= docs.length ? 'depose' : 'partiel';
  logEvent('pièce déposée', r.id + ' · ' + nom, contactCourant().nom);
  if (p && pr){
    const w = (wpProc(p, pr) || []).find(x => String(x.cle) === String(it.ref));
    if (w){ w.recu = true; w.docs[doc] = true; }
  }
}

/* ═══ 23. INTERACTIONS ═════════════════════════════════════════════════════ */
function posteCourant(){ return S.vue.startsWith('fsli:') ? postesCalcules().find(p => p.code === S.vue.slice(5)) : null; }

  if (t.id === 'ppm'){ S.pctPM = parseInt(t.value, 10); renderSeuils(); renderImpact(); return renderMainRaf(); }
  if (t.id === 'pctt'){ S.pctCTT = parseInt(t.value, 10); renderSeuils(); renderImpact(); return renderMainRaf(); }
  if (d.pseed !== undefined && p){ proc(p.code, d.pseed).seed = t.value; proc(p.code, d.pseed).wp = null; return; }
  if (d.pconcl !== undefined && p){ proc(p.code, d.pconcl).conclusion = t.value; return renderMainDiff(); }
  if (d.ctr !== undefined && p){
    const pr = PROCEDURES.find(x => x.code === d.pcode);
    const wp = wpProc(p, pr) || [];
    const cle = String(d.ctr).split('|')[0];

  }

  if (t.id === 'ar-pct'){ S.arPct = parseFloat(t.value) || 0; return renderMainDiff(); }
  if (t.id === 'sec-concl' && p){ sec(p.code).conclusion = t.value; return renderMainDiff(); }
  if (t.id === 'pp-adr'){ S.portail.adresse = t.value; return; }
  if (t.id === 'f-q'){ S.filtres.q = t.value; return renderMainDiff(); }
  const cts = v => Math.round((parseFloat(String(v).replace(/\s/g, '').replace(',', '.')) || 0) * 100);
  if (d.plaq !== undefined){ S.achevement.plaquette[d.plaq] = t.value.trim() === '' ? undefined : cts(t.value); return renderMainDiff(); }
  if (d.calcm !== undefined){ const c = S.achevement.calculs[d.calcm] = S.achevement.calculs[d.calcm] || {};
    c.montant = t.value.trim() === '' ? undefined : cts(t.value); return renderMainDiff(); }
  if (d.calcd !== undefined){ const c = S.achevement.calculs[d.calcd] = S.achevement.calculs[d.calcd] || {};
    c.doc = t.value; return renderMainDiff(); }
  if (t.id === 'ach-ra'){ S.achevement.raFinale = t.value; return renderMainDiff(); }
  if (t.id === 'ach-opm'){ S.achevement.opinionMotif = t.value; return renderMainDiff(); }
  if (d.achc !== undefined){ S.achevement.concl[d.achc] = t.value; return renderMainDiff(); }
  if (d.fseuil !== undefined){ S.seuilsFacteurs[d.fseuil] = parseFloat(t.value) || 0; return renderMainDiff(); }
  if (d.scopem !== undefined){ S.scopingMotif[d.scopem] = t.value; return renderMainDiff(); }
  if (d.nsm !== undefined && p){ sec(p.code).nsMotif[d.nsm] = t.value; return renderMainDiff(); }
  if (d.nivm !== undefined && p){ sec(p.code).overrideMotif[d.nivm] = t.value; return renderMainDiff(); }
});

document.addEventListener('change', e => {

    return renderMain(); }
  if (d.corr !== undefined){ S.achevement.corrigees[d.corr] = t.checked; return renderMain(); }
  if (t.id === 'ach-op'){ S.achevement.opinion = t.value;
    logEvent('opinion arrêtée', 'Altiverre SAS FY2025', t.value); return renderMain(); }
  if (d.je !== undefined){ S.jeCrit[d.je] = t.checked; return renderMain(); }
  if (t.id === 'je-an'){ S.jeSansAN = t.checked; return renderMain(); }
  if (t.id === 'f-statut'){ S.filtres.statut = t.value; return renderMain(); }
  if (t.id === 'f-section'){ S.filtres.section = t.value; return renderMain(); }
  if (t.id === 'f-contact'){ S.filtres.contact = t.value; return renderMain(); }
  if (t.id === 'f-echeance'){ S.filtres.echeance = t.value; return renderMain(); }
  if (t.id === 'env-cad'){ S.envoi.cadence = t.value; return renderMain(); }
  if (t.id === 'env-dest'){ S.envoi.destinataires = [...t.selectedOptions].map(o => o.value); return renderMain(); }
  if (d.crole !== undefined){ const c = S.contacts.find(x => x.id === d.crole); if (c) c.role = t.value; return renderMain(); }
  if (t.id === 'pp-cad'){ S.portail.cadence = +t.value; return renderMain(); }
  if (t.id === 'pp-esc'){ S.portail.escalade = +t.value; return renderMain(); }
  if (t.id === 'pp-sam'){ S.portail.samediOuvre = t.value === '1'; return renderMain(); }
  if (t.id === 'pp-lang'){ S.portail.langue = t.value; return renderMain(); }
});

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-vue]');
  if (a) return aller(a.dataset.vue);
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, p = posteCourant();

  if (t.id === 'themebtn'){
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    return;
  }
  if (d.espace){ const x = ESPACES.find(y => y.id === d.espace); return aller(x.defaut, x.id); }
  if (d.open) return ouvrirSection(d.open);
  if (d.goreq){ const r = S.requetes.find(x => x.id === d.goreq);
    if (r){ const c = S.contacts.find(x => x.id === r.contact); if (c) S.moiClient = c.id; }
    return aller('cli.vue', 'client'); }

  /* ── sélection et enchaînement ── */
  if (d.proc){ S.procOuverte = S.procOuverte === d.proc ? null : d.proc; renderMain();
    const b = document.getElementById('b4'); if (b) b.scrollIntoView({ block:'start' }); return; }
  if (d.ctrtout){ S.ctrTout[d.ctrtout] = !S.ctrTout[d.ctrtout]; return renderMain(); }
  if (d.pnouveau && p){
    const st = proc(p.code, d.pnouveau);
    st.seed = 'otto-' + p.code.toLowerCase() + '-' + d.pnouveau.toLowerCase() + '-' + String(seedOf(st.seed) % 9000 + 1000);
    st.wp = null;
    logEvent('nouveau germe', p.lib + ' · ' + d.pnouveau, st.seed);
    renderImpact(); return renderMain();
  }
  if (d.preq && p){
    const pr = PROCEDURES.find(x => x.code === d.preq);
    if (pr) requeteJustificatifsProc(p, pr);
    renderImpact(); return renderMain();
  }
  if (d.plire && p){
    const pr = PROCEDURES.find(x => x.code === d.plire);
    let n = 0;
    for (const c of controles(p, pr)){
      if (!c.recu || c.saisi) continue;
      const v = c.ch.val(c.ligne.x);
      c.ligne.champs[c.cle] = c.ch.type === 'montant' ? (v / 100).toFixed(2).replace('.', ',')
                            : c.ch.type === 'bool' ? (v ? 'oui' : 'non') : String(v);
      n++;
    }
    logEvent('valeurs relevées saisies', p.lib + ' · ' + procRef(p, pr), n + ' champ(s)');
    renderImpact(); return renderMain();
  }
  if (d.ravar && p){
    const l = revueAnalytique().find(x => x.compte === d.ravar);
    if (l) requeteVariation(p, d.ravar, l);
    renderImpact(); return renderMain();
  }
  if (t.id === 'req-add' && p){
    const ti = document.getElementById('req-titre'), dl = document.getElementById('req-delai');
    if (!ti.value.trim()) return;
    creerRequete(p.code, ti.value.trim(), ['Éléments demandés'], +dl.value);
    renderImpact(); return renderMain();
  }

  /* ── notes de revue ── */
  if (d.noteCible){
    const [section, objet, ref, lib] = d.noteCible.split('|');
    S.noteCible = { section, objet, ref, lib };
    renderMain();
    const b = document.querySelector('#b6') || document.querySelector('#main');
    if (b) b.scrollIntoView({ block:'start' });
    const i = document.getElementById('nt-txt'); if (i) i.focus();
    return;
  }
  if (t.id === 'nt-annul'){ S.noteCible = null; return renderMain(); }
  if (t.id === 'nt-add'){
    const txt = document.getElementById('nt-txt');
    if (!txt || !txt.value.trim() || !S.noteCible) return;
    const n = ajouterNote(document.getElementById('nt-type').value, S.noteCible, txt.value.trim());
    n.pour = document.getElementById('nt-pour').value;
    S.noteCible = null; renderImpact(); return renderMain();
  }
  if (d.repok){
    const i = document.querySelector(`input[data-rep="${d.repok}"]`);
    const n = S.notes.find(x => x.id === +d.repok);
    if (i && n && i.value.trim()){ n.reponses.push({ par:S.moi, t:tick(), texte:i.value.trim() });
      logEvent('réponse à une note', '#' + n.id + ' — ' + n.ancre.lib, USERS[S.moi].nom); }
    return renderMain();
  }
  if (d.clos){
    const n = S.notes.find(x => x.id === +d.clos);
    if (n && peutClore(S.moi, n)){ n.clos = { par:S.moi, t:tick() };
      logEvent('note close', '#' + n.id + ' — ' + n.ancre.lib, USERS[S.moi].nom + ' (' + ROLE_LIB[USERS[S.moi].role] + ')'); }
    renderImpact(); return renderMain();
  }
  if (d.goanc){
    const n = S.notes.find(x => x.id === +d.goanc);
    if (!n) return;
    if (n.ancre.section === 'JE') aller('plan.je', 'auditeur'); else ouvrirSection(n.ancre.section);
    setTimeout(() => {
      const el = [...document.querySelectorAll('[data-note-cible]')]
        .find(x => x.dataset.noteCible.startsWith(n.ancre.section + '|' + n.ancre.objet + '|' + n.ancre.ref + '|'));
      if (el){ const tr = el.closest('tr') || el.closest('div');
        if (tr){ tr.scrollIntoView({ block:'center' }); tr.style.outline = '2px solid var(--accent)';
                 setTimeout(() => { tr.style.outline = ''; }, 1800); } }
    }, 60);
    return;
  }

  /* ── conclusion, visa, reprise N-1, clôture ── */
  if (d.n1 && p){ sec(p.code).reprisN1Vues[d.n1] = 'Reconfirmé par ' + USERS[S.moi].nom + ' le ' + horo(tick());
    logEvent('travail N-1 reconfirmé', p.lib + ' · ' + d.n1, USERS[S.moi].nom); return renderMain(); }
  if (t.id === 'sec-visa' && p){
    if (obstaclesVisa(p).length) return;
    sec(p.code).visa = { par:S.moi, t:tick() };
    logEvent('section visée', p.lib, USERS[S.moi].nom + ' (' + ROLE_LIB[USERS[S.moi].role] + ')');
    return renderMain();
  }
  if (t.id === 'sec-devisa' && p){ sec(p.code).visa = null;
    logEvent('visa retiré', p.lib, USERS[S.moi].nom); return renderMain(); }
  if (t.id === 'clore-dossier'){
    if (notesBloquantesOuvertes().length) return;
    S.dossierClos = true; logEvent('dossier clôturé', 'Altiverre SAS FY2025', USERS[S.moi].nom);
    return renderMain();
  }

  /* ── portail client ── */
  if (d.clitout){ S.cliTout = S.cliTout || {}; S.cliTout[d.clitout] = !S.cliTout[d.clitout]; return renderMain(); }
  if (d.depot){ const [rid, iid] = d.depot.split('|'); deposer(rid, +iid); renderImpact(); return renderMain(); }
  if (d.clot){
    const r = S.requetes.find(x => x.id === d.clot);
    if (r && r.items.every(i => i.statut !== 'non_recu' && i.statut !== 'partiel')){
      r.clotureClient = true;
      for (const i of r.items) i.statut = 'traitement';
      logEvent('client : tout est déposé', r.id + ' — ' + r.titre, contactCourant().nom);
      // côté auditeur, la demande complète passe en attente de revue
      for (const i of r.items){ i.statut = 'attente_revue'; i.revoyeur = USERS.lea.nom; }
    }
    renderImpact(); return renderMain();
  }
  if (d.msgok){
    const i = document.querySelector(`input[data-msg="${d.msgok}"]`), r = S.requetes.find(x => x.id === d.msgok);
    if (i && r && i.value.trim()){
      r.messages.push({ cote:S.espace === 'client' ? 'cli' : 'aud',
                        par:S.espace === 'client' ? contactCourant().nom : USERS[S.moi].nom,
                        t:tick(), texte:i.value.trim() });
      logEvent('message sur requête', r.id, i.value.trim().slice(0, 60));
    }
    return renderMain();
  }
  if (t.id === 'ct-add'){
    const g = id => document.getElementById(id);
    const nom = g('ct-nom').value.trim(); if (!nom) return;
    const id = 'c' + (S.contacts.length + 1) + seedOf(nom) % 100;
    S.contacts.push({ id, nom, fonction:g('ct-fct').value.trim() || 'contact', mail:g('ct-mail').value.trim() || '—',
                      societe:g('ct-soc').value, role:'contributeur',
                      sections:g('ct-sec').value ? [g('ct-sec').value] : [] });
    logEvent('contact ajouté', nom, g('ct-soc').value);
    return renderMain();
  }
  /* ── registre des facteurs de risque ── */
  if (d.gosrc) return aller(d.gosrc, 'auditeur');
  if (d.fconf || d.fecart){
    const id = d.fconf || d.fecart;
    const mi = document.querySelector(`input[data-fmotif="${CSS.escape(id)}"]`);
    const se = document.querySelector(`select[data-feff="${CSS.escape(id)}"]`);
    const motif = mi ? mi.value.trim() : '', effet = se ? se.value : 'majore';
    // écarter, ou confirmer en neutralisant, sont des décisions qui doivent s'écrire
    if (!motif && (d.fecart || effet === 'neutre')){
      if (mi){ mi.focus(); mi.style.borderColor = 'var(--bad)'; mi.placeholder = 'motif obligatoire pour cette décision'; }
      return;
    }
    statuerFacteur(id, d.fconf ? 'confirme' : 'ecarte', motif, effet);
    renderImpact(); return renderMain();
  }
  if (d.frouvre){ delete S.decisionsFacteurs[d.frouvre];
    logEvent('facteur de risque remis en attente', d.frouvre, USERS[S.moi].nom);
    renderImpact(); return renderMain(); }
  if (t.id === 'mf-add'){
    const g = x => document.getElementById(x);
    const desc = g('mf-desc').value.trim();
    const fsli = [...g('mf-fsli').selectedOptions].map(o => o.value);
    const ass  = [...g('mf-ass').selectedOptions].map(o => o.value);
    if (!desc || !fsli.length || !ass.length){
      const manque = !desc ? 'mf-desc' : !fsli.length ? 'mf-fsli' : 'mf-ass';
      const el = g(manque); if (el){ el.focus(); el.style.borderColor = 'var(--bad)'; }
      return;
    }
    const id = 'MANUEL:' + String(++S.seqFacteurManuel).padStart(3, '0');
    S.facteursManuels.push({ id, regle:'MANUEL', regleLib:'Facteur levé à la main',
      nature:g('mf-nat').value, description:desc,
      cibles:fsli.map(c => ({ fsli:c, assertions:ass })),
      pertinence:'jugement de l’auditeur',
      source:{ lib:g('mf-src').value.trim() || 'saisi à la main', vue:null, ref:'' },
      cree:tick() });
    logEvent('facteur de risque levé à la main', id, desc.slice(0, 80) + ' → ' + fsli.join(', '));
    renderImpact(); return renderMain();
  }
  if (t.id === 'ach-clore'){ S.achevement.clos = { par:S.moi, t:tick() };
    logEvent('dossier clôturé et verrouillé', 'Altiverre SAS FY2025',
             USERS[S.moi].nom + ' — assemblage dans les ' + DELAI_ASSEMBLAGE + ' jours du rapport');
    return renderMain(); }
  if (d.raprelim){
    const l = revueAnalytique().find(x => x.compte === d.raprelim);
    if (l){
      const ps = postesDuCompte(d.raprelim);
      const r = creerRequete(ps.length ? ps[0].code : 'CA', 'Explication de variation — compte ' + d.raprelim,
        [{ desc:questionVariation(l), ref:d.raprelim }], 10);
      r.origine = 'revue analytique préliminaire';
    }
    renderImpact(); return renderMain();
  }
  if (t.id === 'f-raz'){ S.filtres = { statut:'', section:'', contact:'', echeance:'', q:'' }; return renderMain(); }
  if (d.perim){ S.envoi.perimetre = d.perim; return renderMain(); }
  if (d.xls){
    const c = classeur(d.xls);
    const ok = telecharger('suivi-altiverre-2025-' + d.xls + '.xls', c.xml, 'application/vnd.ms-excel');
    logEvent('classeur généré', 'statut de mission — ' + PERIMETRES[d.xls].lib,
             c.feuilles.length + ' feuille(s)');
    document.getElementById('exp-out').innerHTML = ok
      ? `<div class="callout ok">Classeur généré : ${c.feuilles.length} feuille(s), format SpreadsheetML lisible par
         Excel et LibreOffice. Si rien ne s’est téléchargé, c’est que la page est ouverte dans un cadre qui bloque les
         téléchargements : ouvrez le fichier directement dans le navigateur.</div>`
      : '<div class="callout bad">Le téléchargement a été refusé par le navigateur.</div>';
    return;
  }
  if (d.csv){
    const l = [PERIMETRES[d.csv].cols, ...lignesExport(d.csv, S.requetes)];
    const csv = l.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
    telecharger('suivi-altiverre-2025-' + d.csv + '.csv', '\uFEFF' + csv, 'text/csv');
    logEvent('export CSV généré', PERIMETRES[d.csv].lib, l.length - 1 + ' ligne(s)');
    document.getElementById('exp-out').innerHTML =
      `<div class="callout"><b>${l.length - 1} ligne(s)</b></div><textarea rows="8" readonly>${esc(csv)}</textarea>`;
    return;
  }
  if (d.imprime){ window.print(); return; }
});
