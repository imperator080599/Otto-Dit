      <b>${esc(va.lib)}</b> du ${frDate(va.date)}. Tout ce qui suit est calculé en évaluant réellement le
      dossier sur les deux versions.</p>`
    + seuilsRow + q1 + q2 + q3 + q4 + q5 + q6);
}

/** Balance multi-colonnes : une colonne par version, l'écart entre deux versions successives. */
function blocBalanceVersions(){
  const ns = VERSIONS.map(v => v.n);
  const tbs = Object.fromEntries(ns.map(n => [n, new Map(tbVersion(n).map(r => [r[0], r]))]));
  const comptes = [...new Set(ns.flatMap(n => tbVersion(n).map(r => r[0])))].sort();
  const bouge = c => ns.some(n => n > 1 && solde(tbs[n].get(c)) !== solde(tbs[n - 1].get(c)));
  const seulsMouv = S.balTout !== true;
  const vus = seulsMouv ? comptes.filter(bouge) : comptes;
  const cols = [{k:'c',t:'Compte'},{k:'l',t:'Intitulé',cls:'wrapcell'}];
  for (const n of ns) cols.push({ k:'v' + n, t:'v' + n, n:1 });
  for (const n of ns) if (n > 1) cols.push({ k:'d' + n, t:'v' + (n - 1) + ' → v' + n, n:1 });
  const rows = vus.map(c => {
    const r = { c:`<span class="mono">${c}</span>`,
                l:esc((tbs[ns[ns.length - 1]].get(c) || tbs[1].get(c))[1]) };
    for (const n of ns){ const x = tbs[n].get(c); r['v' + n] = x ? eur(solde(x)) : '<span class="smallcaps">absent</span>'; }
    for (const n of ns) if (n > 1){
      const d = solde(tbs[n].get(c)) - solde(tbs[n - 1].get(c));
      r['d' + n] = d ? '<b>' + eur(d) + '</b>' : '<span class="smallcaps">—</span>';
    }
    return r;
  });
  const foot = { c:'Total', l:'' };
  for (const n of ns) foot['v' + n] = eur(vus.reduce((a, c) => a + solde(tbs[n].get(c)), 0));
  for (const n of ns) if (n > 1) foot['d' + n] = eur(vus.reduce((a, c) => a + solde(tbs[n].get(c)) - solde(tbs[n - 1].get(c)), 0));
  return blk('Balance, une colonne par version', vus.length + ' compte(s) affiché(s) sur ' + comptes.length,
    `<div class="row">
      <button class="btn mini sec" id="bal-tout">${seulsMouv ? 'afficher les ' + comptes.length + ' comptes' : 'n’afficher que les comptes qui bougent'}</button>
      <span class="smallcaps">rien n’est écrasé : chaque version reste lisible dans sa colonne</span>
    </div>` + table(cols, rows, { foot }));
}
function solde(r){ return r ? r[2] - r[3] : 0; }

/** Le rapprochement est rejoué à chaque version ; les écarts antérieurs restent lisibles. */
function blocRapproVersions(){
  const rows = VERSIONS.map(v => {
    const ec = rapprochement(v.n).filter(r => r.ecart !== 0);
    return { n:`<span class="mono">v${v.n}</span>`, l:esc(v.lib),
      e:ec.length ? `<span class="pill bad">${ec.length}</span>` : '<span class="pill">aucun</span>',
      d:ec.length ? ec.map(r => `<span class="mono">${r.compte}</span> ${eur(r.ecart)}`).join(' · ')
                  : '<span class="smallcaps">balance et grand livre concordent</span>',
      m:esc(v.n === 1 ? 'écriture de situation à la balance, absente du fichier des écritures'
          : (v.ecritures.some(x => x.cible === 'gl') && !ec.length) ? 'l’écriture manquante a été reprise : l’écart de la version précédente est résorbé'
          : ec.length ? 'écriture passée à la balance seule : le fichier des écritures transmis lui est antérieur'
          : 'aucune écriture à sens unique') };
  });
  return blk('Rapprochement rejoué à chaque version', VERSIONS.length + ' rapprochements',
    table([{k:'n',t:'Version'},{k:'l',t:'Objet',cls:'wrapcell'},{k:'e',t:'Écarts',n:1},
           {k:'d',t:'Détail',cls:'wrapcell'},{k:'m',t:'Cause',cls:'wrapcell'}], rows) +
    `<p class="note">Le rapprochement n’est pas refait « à la place » de l’ancien : chaque version garde le sien.
    Un écart résorbé se lit encore sur la version où il avait été relevé.</p>`);
}

/* ═══ 45. AJUSTEMENTS ET RETRAITEMENTS ═════════════════════════════════════
   Le rapport d'impact d'une version dit CE QUI a changé : quels comptes ont
   bougé, quels seuils sont franchis, quels papiers sont périmés. Il ne dit
   pas POURQUOI. Cette section le dit, écriture par écriture.

   Trois natures, et c'est la distinction qui compte :

     — écriture d'INVENTAIRE : le client termine son exercice. Normale.
     — RETRAITEMENT : un reclassement, un changement d'estimation, une
       correction que le client ou son expert-comptable a trouvée seul.
     — CORRECTION SUR CONSTAT D'AUDIT : le client corrige parce que NOUS
       avons relevé quelque chose. Celle-là n'est pas une écriture comme les
       autres : elle doit se réconcilier avec l'état de nos anomalies.

   La réconciliation est AUTOMATIQUE. Une correction d'audit nomme la pièce
   qu'elle corrige ; l'anomalie portée sur cette pièce quitte le cumul non
   corrigé à hauteur de ce qui a réellement été passé. Personne ne coche
   « corrigée » : une case à cocher aurait fait disparaître un montant du
   cumul sans qu'aucune écriture ne le porte — c'est la règle déjà écrite
   pour la résolution d'écart, appliquée ici.

   Deux signaux, et ils ne disent pas la même chose :

     1. ANOMALIE QUALIFIÉE « CORRIGÉE » SANS ÉCRITURE IDENTIFIÉE. Le dossier
        affirme qu'une correction existe ; aucune écriture de version ne la
        porte. Soit la correction n'a pas été passée, soit elle l'a été sans
        nous être transmise. Dans les deux cas le cumul est faux.
     2. ÉCRITURE DE CORRECTION SANS ANOMALIE CORRESPONDANTE. Le client dit
        répondre à un constat que notre dossier ne porte pas. Soit nous avons
        omis de le consigner, soit il corrige autre chose. Dans les deux cas
        il y a une question à poser.

   Et une troisième situation, qui n'est pas un défaut mais l'application de
   la règle du versionnement : une correction ANNONCÉE dans une version reçue
   et NON PRISE EN COMPTE n'a rien corrigé. Le cumul ne bouge pas tant que la
   version n'est pas prise en compte, et l'écran dit de combien il bougerait.
   ═══════════════════════════════════════════════════════════════════════ */

const NATURES_AJUSTEMENT = {
  inventaire: { lib:'écriture d’inventaire', cls:'',
    d:'le client termine son exercice : dépouillement d’inventaire, dotations, provisions, cut-off. '
     + 'Elle n’appelle rien de particulier de notre part au-delà du contrôle de la procédure concernée.' },
  retraitement:{ lib:'retraitement', cls:'warn',
    d:'reclassement, changement d’estimation, ou correction trouvée par le client ou son '
     + 'expert-comptable. Elle change les comptes sans venir de nous : elle est à contrôler comme '
     + 'une écriture d’inventaire, et son motif est à obtenir.' },
  correction_audit:{ lib:'correction sur constat d’audit', cls:'bad',
    d:'le client corrige parce que nous avons relevé quelque chose. Elle se réconcilie avec l’état '
     + 'de nos anomalies : elle fait sortir du cumul non corrigé ce qu’elle porte réellement, et '
     + 'rien de plus.' },
};
function natureAj(a){ return NATURES_AJUSTEMENT[a.nature] || NATURES_AJUSTEMENT.inventaire; }

/* ── la liste des ajustements, dérivée des versions ───────────────────────
   Rien n'est saisi ici : un ajustement EST une écriture de version. La
   section ne tient pas un second registre — elle lit celui qui existe. */
function ajustements(){
  return VERSIONS.filter(v => v.n > 1).flatMap(v => v.ecritures.map(e => ({
    ...e, v:v.n, vLib:v.lib, vDate:v.date,
    par:e.par || v.par, nature:e.nature || 'inventaire',
    prise:v.n <= S.version, recue:v.date <= S.aujourdhui,
  })));
}
/** Montant d'une écriture : la somme de ses débits — elle est équilibrée. */
function montantAjustement(a){ return a.lignes.reduce((t, l) => t + l[1], 0); }

/* ── impact d'un ajustement : par poste, et par masse ─────────────────────
   Δ résultat = Σ (crédit − débit) sur les comptes 6 et 7.
   Δ situation nette = Σ (débit − crédit) sur les comptes 1 à 5.
   Les deux sont ÉGAUX par construction — c'est la partie double, et l'écran
   le vérifie plutôt que de l'affirmer.
   Δ capitaux propres = Δ résultat + les mouvements portés directement aux
   comptes de capitaux (10, 11), qui ne passent pas par le résultat. */
function impactAjustement(a){
  const parPoste = new Map();
  const hors = [];
  let resultat = 0, nette = 0, capitauxDirects = 0;
  for (const [c, d, cr] of a.lignes){
    const delta = d - cr;
    const p = POSTES.find(x => x.re.test(c));
    if (p){
      const cur = parPoste.get(p.code) || { code:p.code, lib:p.lib, masse:p.masse, delta:0 };
      cur.delta += delta; parPoste.set(p.code, cur);
    } else hors.push({ compte:c, lib:libelleCompte(c), delta });
    if (/^[67]/.test(c)) resultat += cr - d; else nette += delta;
    if (/^(10|11)/.test(c)) capitauxDirects += cr - d;
  }
  return { postes:[...parPoste.values()].sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta)),
           hors, resultat, nette, capitaux:resultat + capitauxDirects,
           equilibre:resultat === nette, montant:montantAjustement(a) };
}

/* ── corrections d'audit : en vigueur, ou seulement annoncées ─────────────
   « Reçue » n'est pas « prise en compte » : c'est la règle du versionnement,
   et elle vaut ici aussi. Une correction annoncée n'a rien corrigé. */
function correctionsEnVigueur(){ return ajustements().filter(a => a.nature === 'correction_audit' && a.prise); }
function correctionsAnnoncees(){
  return ajustements().filter(a => a.nature === 'correction_audit' && a.recue && !a.prise);
}

/** Allocation d'une correction aux anomalies de la pièce qu'elle nomme.
 *  Bornée au résiduel de chaque anomalie et à son sens : une correction ne
 *  peut ni retirer plus que l'anomalie, ni en inverser le signe. C'est la
 *  même borne que la part expliquée d'une résolution. Les anomalies sont
 *  servies du plus gros résiduel au plus petit — sans quoi l'ordre de la
 *  liste déciderait de ce qui reste au cumul. */
function appliquerCorrections(out){
  for (const a of correctionsEnVigueur()){
    let reste = montantAjustement(a);
    const cibles = out.filter(x => x.piece === a.repond && x.montant !== 0)
                      .sort((x, y) => Math.abs(y.montant) - Math.abs(x.montant));
    for (const x of cibles){
      if (reste <= 0) break;
      const dispo = Math.min(reste, Math.abs(x.montant));
      const part = x.montant >= 0 ? dispo : -dispo;
      x.corrige = (x.corrige || 0) + part;
      x.montant -= part;
      (x.corrigePar = x.corrigePar || []).push({ ref:a.ref, v:a.v, montant:part });
      reste -= dispo;
    }
  }
  return out;
}

/* ── réconciliation ───────────────────────────────────────────────────────
   Elle ne tranche rien : elle apparie ce qui s'apparie et NOMME ce qui ne
   s'apparie pas. Les deux listes non appariées sont les deux signaux. */
const _recAjCache = { cle:'', v:null };
function reconciliation(){
  const anos = anomalies();
  const cle = S.version + '|' + anos.length + '|' + anos.map(x => x.cleRes + ':' + x.montant).join(',');
  if (_recAjCache.cle === cle) return _recAjCache.v;
  const appariees = [], sansAnomalie = [];
  for (const a of correctionsEnVigueur()){
    const l = anos.filter(x => x.piece === a.repond);
    const affecte = l.reduce((t, x) => t + (x.corrigePar || [])
      .filter(c => c.ref === a.ref).reduce((u, c) => u + Math.abs(c.montant), 0), 0);
    const montant = montantAjustement(a);
    if (l.length) appariees.push({ a, l, affecte, montant, nonAffecte:montant - affecte });
    else sansAnomalie.push({ a, montant });
  }
  /* Signal 1 : le dossier dit « corrigée », aucune écriture ne le porte. */
  const sansEcriture = anos.filter(x => !x.souSeuil && x.acquis && x.res
    && x.res.disposition === 'corrigee' && !(x.corrigePar || []).length);
  const r = { appariees, sansAnomalie, sansEcriture, annoncees:correctionsAnnoncees(), anos };
  _recAjCache.cle = cle; _recAjCache.v = r;
  return r;
}

/* ── cumul corrigé / non corrigé, et sa bascule ───────────────────────────
   Aucune de ces trois lignes n'est saisie : le constaté vient des écarts,
   l'expliqué d'une résolution probante, le corrigé d'une écriture de
   version. Le résiduel est la soustraction. */
function cumulAnomalies(){
  const anos = anomalies().filter(x => !x.souSeuil);
  return {
    n:anos.length,
    constate:anos.reduce((t, x) => t + x.constate, 0),
    explique:anos.reduce((t, x) => t + x.explique, 0),
    corrige:anos.reduce((t, x) => t + (x.corrige || 0), 0),
    residuel:anos.reduce((t, x) => t + x.montant, 0),
    nCorrigees:anos.filter(x => (x.corrigePar || []).length).length,
  };
}
/** Le même cumul, évalué comme si la version n était prise en compte.
 *  C'est un calcul, pas une promesse : la bascule est réellement jouée. */
function cumulAuVersion(n){ return auVersion(n, cumulAnomalies); }

/* ── impact cumulé de tous les ajustements pris en compte ─────────────── */
function cumulAjustements(){
  const l = ajustements().filter(a => a.prise);
  const parPoste = new Map();
  let resultat = 0, capitaux = 0, nette = 0;
  const parNature = {};
  for (const a of l){
    const i = impactAjustement(a);
    resultat += i.resultat; capitaux += i.capitaux; nette += i.nette;
    const k = parNature[a.nature] = parNature[a.nature] || { n:0, montant:0, resultat:0 };
    k.n++; k.montant += i.montant; k.resultat += i.resultat;
    for (const p of i.postes){
      const cur = parPoste.get(p.code) || { ...p, delta:0 };
      cur.delta += p.delta; parPoste.set(p.code, cur);
    }
  }
  return { l, parPoste:[...parPoste.values()].sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)),
           resultat, capitaux, nette, parNature, equilibre:resultat === nette };
}

/* ═══════════════════════════════════════════════════════════════════════
   LA VUE
   ═══════════════════════════════════════════════════════════════════════ */
function vueAjustements(){
  return entete('Ajustements et retraitements',
                'le rapport d’impact dit ce qui a changé — ici on dit pourquoi, écriture par écriture') +
    blocNatures() +
    blocAjustements() +
    blocImpactCumule() +
    blocReconciliation() +
    blocCumulBascule();
}

function blocNatures(){
  const c = cumulAjustements();
  return blk('Les trois natures', Object.keys(NATURES_AJUSTEMENT).length,
    table([{k:'n',t:'Nature'},{k:'d',t:'Ce que c’est, et ce que ça exige de nous',cls:'wrapcell'},
           {k:'c',t:'Écritures',n:1},{k:'m',t:'Montant',n:1},{k:'r',t:'Effet résultat',n:1}],
      Object.entries(NATURES_AJUSTEMENT).map(([id, x]) => {
        const k = c.parNature[id] || { n:0, montant:0, resultat:0 };
        return { n:`<span class="pill ${x.cls}">${esc(x.lib)}</span>`, d:esc(x.d),
                 c:String(k.n), m:k.n ? eur(k.montant) : '<span class="smallcaps">—</span>',
                 r:k.n ? eur(k.resultat) : '<span class="smallcaps">—</span>' };
      })) +
    `<p class="note">Les compteurs portent sur les versions <b>prises en compte</b> — le dossier est
    à la version ${S.version}. Une écriture d’une version reçue et non prise en compte n’a rien changé
    aux comptes : elle figure plus bas, sous « corrections annoncées ».</p>`);
}

function blocAjustements(){
  const l = ajustements();
  const rows = l.map(a => {
    const i = impactAjustement(a), x = natureAj(a);
    const etat = a.prise ? '<span class="pill">prise en compte</span>'
      : a.recue ? '<span class="pill warn">annoncée, v' + a.v + ' non prise en compte</span>'
      : '<span class="smallcaps">non reçue</span>';
    return {
      v:`<span class="mono">v${a.v}</span><div class="smallcaps">${frDate(a.vDate)}</div>`,
      r:`<span class="mono">${esc(a.ref)}</span>`,
      l:`<b>${esc(a.lib)}</b><div class="smallcaps">${esc(a.motif || '—')}</div>`,
      n:`<span class="pill ${x.cls}">${esc(x.lib)}</span>`
        + (a.repond ? `<div class="smallcaps">répond sur la pièce <span class="mono">${esc(a.repond)}</span></div>` : ''),
      m:eur(i.montant),
      p:i.postes.map(p => `${esc(p.lib)} <span class="mono">${eur(p.delta)}</span>`).join('<br>')
        + (i.hors.length ? `<br><span class="smallcaps">hors poste cartographié : `
            + i.hors.map(h => esc(h.compte) + ' ' + eur(h.delta)).join(', ') + '</span>' : ''),
      b:`<span class="smallcaps">résultat</span> ${eur(i.resultat)}<br><span class="smallcaps">situation nette</span> ${eur(i.nette)}`,
      j:`${esc(a.justif || '—')}<div class="smallcaps">${esc(a.par)}</div>`,
      s:etat,
    };
  });
  const desequilibres = l.filter(a => !impactAjustement(a).equilibre);
  return blk('Ajustements passés, version par version', l.length + ' écriture(s)',
    table([{k:'v',t:'Version'},{k:'r',t:'Réf.'},{k:'l',t:'Libellé et motif',cls:'wrapcell'},
           {k:'n',t:'Nature',cls:'wrapcell'},{k:'m',t:'Montant',n:1},
           {k:'p',t:'Impact par poste',cls:'wrapcell'},{k:'b',t:'Par masse',cls:'wrapcell'},
           {k:'j',t:'Justificatif et auteur côté client',cls:'wrapcell'},{k:'s',t:'État'}], rows) +
    (desequilibres.length
      ? `<div class="callout bad"><b>${desequilibres.length} écriture(s) dont l’effet résultat ne répond pas
         à l’effet sur la situation nette.</b> ${esc(desequilibres.map(a => a.ref).join(', '))} —
         une écriture équilibrée ne peut pas produire deux nombres différents : c’est la donnée qui est fausse.</div>`
      : `<p class="note">Pour chaque écriture, l’effet sur le résultat et l’effet sur la situation nette
         sont <b>égaux</b> : c’est la partie double, et c’est vérifié ici plutôt qu’affirmé.</p>`));
}

function blocImpactCumule(){
  const c = cumulAjustements();
  return blk('Impact cumulé sur le résultat et les capitaux propres',
    c.l.length + ' écriture(s) prise(s) en compte',
    `<div class="grid3">
      <div class="kv"><span class="k">Variation du résultat</span>
        <span class="v"${c.resultat ? ' style="color:var(--anomalie)"' : ''}>${eur(c.resultat)}</span>
        <span class="k">Variation des capitaux propres</span><span class="v">${eur(c.capitaux)}</span></div>
      <div class="kv"><span class="k">Variation de la situation nette</span><span class="v">${eur(c.nette)}</span>
        <span class="k">Contrôle de partie double</span>
        <span class="v">${c.equilibre ? 'résultat = situation nette' : '<span style="color:var(--anomalie)">divergents</span>'}</span></div>
      <div class="kv"><span class="k">Postes touchés</span><span class="v">${c.parPoste.length}</span>
        <span class="k">Rapport au seuil de signification</span>
        <span class="v">${pct(Math.abs(c.resultat) / Math.max(1, seuils().M), 0)}</span></div>
    </div>
    ${table([{k:'p',t:'Poste'},{k:'m',t:'Masse'},{k:'d',t:'Mouvement cumulé',n:1}],
      c.parPoste.map(p => ({ p:esc(p.lib), m:p.masse === 'bilan' ? 'bilan' : 'compte de résultat',
                             d:eur(p.delta) })))}
    <p class="note">La variation des capitaux propres est celle du résultat, augmentée des mouvements
    portés directement aux comptes de capitaux — il n’y en a aucun ici. Ces nombres ne sont pas saisis :
    ils se recalculent à chaque bascule de version, comme tout ce qui dépend du fichier.</p>`);
}

function blocReconciliation(){
  const r = reconciliation();
  const app = r.appariees.map(x => ({
    r:`<span class="mono">${esc(x.a.ref)}</span><div class="smallcaps">v${x.a.v}</div>`,
    l:`<b>${esc(x.a.lib)}</b><div class="smallcaps">pièce <span class="mono">${esc(x.a.repond)}</span></div>`,
    a:x.l.map(y => `${esc(y.lib)}<div class="smallcaps">${esc(y.src)} — constaté ${eur(y.constate)}</div>`).join('<br>'),
    m:eur(x.montant),
    c:eur(x.affecte),
    e:x.nonAffecte
      ? `<span style="color:var(--anomalie)">${eur(x.nonAffecte)}</span>
         <div class="smallcaps">écriture au-delà de l’anomalie</div>`
      : (x.l.reduce((t, y) => t + y.montant, 0)
        ? `<span style="color:var(--anomalie)">${eur(x.l.reduce((t, y) => t + y.montant, 0))}</span>
           <div class="smallcaps">reste au cumul</div>`
        : '<span class="smallcaps">soldée</span>'),
  }));
  const signaux = r.sansEcriture.length + r.sansAnomalie.length;
  /* Le panneau porte son alerte : le nombre de SIGNAUX, ou à défaut les
     corrections annoncées qui attendent une prise en compte de version. */
  const alerte = signaux
    ? signaux + ' signal' + (signaux > 1 ? 'aux' : '') + ' à traiter'
    : r.annoncees.length ? r.annoncees.length + ' correction(s) annoncée(s)' : '';
  return blk('Réconciliation des corrections avec l’état des anomalies',
    r.appariees.length + ' correction(s) appariée(s)'
    + (signaux ? '' : ' · aucun signal'),
    (r.appariees.length
      ? table([{k:'r',t:'Écriture'},{k:'l',t:'Correction',cls:'wrapcell'},
               {k:'a',t:'Anomalie répondue',cls:'wrapcell'},{k:'m',t:'Passé',n:1},
               {k:'c',t:'Imputé au cumul',n:1},{k:'e',t:'Reste',cls:'wrapcell'}], app)
      : `<p class="note">Aucune correction d’audit dans les versions prises en compte.
         ${r.annoncees.length ? 'Il y en a ' + r.annoncees.length + ' d’annoncée(s) — voir ci-dessous.' : ''}</p>`) +

    /* signal 1 */
    `<div class="callout ${r.sansEcriture.length ? 'bad' : ''}" style="margin-top:10px">
      <b>Signal 1 — anomalie qualifiée « corrigée » sans écriture identifiée : ${r.sansEcriture.length}.</b>
      ${r.sansEcriture.length
        ? '<br>' + r.sansEcriture.map(x => `${esc(x.lib)} — ${eur(x.constate)}
            <span class="smallcaps">(${esc(x.src)}, qualifiée par ${esc(USERS[x.res.par].nom)})</span>`).join('<br>')
          + `<br>Le dossier affirme qu’une correction existe ; aucune écriture de version ne la porte.
             Soit elle n’a pas été passée, soit elle ne nous a pas été transmise — dans les deux cas le cumul est faux.`
        : `<br>Ce signal s’allume dès qu’un écart est qualifié « corrigée » dans une carte de résolution
           alors qu’aucune écriture de correction, dans une version prise en compte, ne porte la pièce
           concernée. Il vaut zéro aujourd’hui parce qu’aucun écart n’a encore été qualifié ainsi.`}
    </div>

    <div class="callout ${r.sansAnomalie.length ? 'bad' : ''}">
      <b>Signal 2 — écriture de correction sans anomalie correspondante : ${r.sansAnomalie.length}.</b>
      ${r.sansAnomalie.length
        ? '<br>' + r.sansAnomalie.map(x => `<span class="mono">${esc(x.a.ref)}</span> ${esc(x.a.lib)} —
            ${eur(x.montant)}, présentée comme répondant à la pièce
            <span class="mono">${esc(x.a.repond)}</span>, sur laquelle notre dossier ne porte aucune anomalie.
            <span class="smallcaps">${esc(x.a.par)}</span>`).join('<br>')
          + `<br>Soit nous avons omis de consigner le constat, soit le client corrige autre chose.
             La plateforme ne tranche pas : elle pose la question.`
        : '<br>Aucune correction ne se présente comme répondant à un constat absent de notre dossier.'}
    </div>` +

    /* corrections annoncées */
    (r.annoncees.length ? `<div class="callout warn">
      <b>${r.annoncees.length} correction(s) annoncée(s) dans une version reçue et non prise en compte.</b>
      ${r.annoncees.map(a => `<br><span class="mono">${esc(a.ref)}</span> ${esc(a.lib)} — ${eur(montantAjustement(a))}
        <span class="smallcaps">(version ${a.v}, reçue le ${frDate(a.vDate)})</span>`).join('')}
      <br>Elles n’ont rien corrigé : le cumul ne bouge pas tant que la version n’est pas prise en compte.
      La bascule ci-dessous dit de combien il bougerait.</div>` : '') +

    `<p class="note">L’appariement se fait sur la <b>pièce</b> que la correction nomme, et le montant imputé
    est borné à l’anomalie et à son sens : une correction ne peut ni retirer plus que ce qui a été relevé,
    ni en inverser le signe. Une correction partielle laisse le reste au cumul — c’est le cas de
    <span class="mono">OD-V4-003</span> lorsque la version 4 est prise en compte.</p>`,
    alerte);
}

function blocCumulBascule(){
  const c = cumulAnomalies(), s = seuils();
  const autres = VERSIONS.filter(v => v.n !== S.version && v.date <= S.aujourdhui)
    .map(v => ({ v, c:cumulAuVersion(v.n) }));
  return blk('Cumul corrigé et non corrigé — la bascule',
    c.n + ' anomalie(s) au-dessus du seuil de remontée',
    `<div class="grid3">
      <div class="kv"><span class="k">Constaté</span><span class="v">${eur(c.constate)}</span>
        <span class="k">Expliqué — résolution probante</span><span class="v">${eur(c.explique)}</span></div>
      <div class="kv"><span class="k">Corrigé — écriture de version</span><span class="v">${eur(c.corrige)}</span>
        <span class="k">Anomalies corrigées</span><span class="v">${c.nCorrigees} sur ${c.n}</span></div>
      <div class="kv"><span class="k">Résiduel au cumul</span>
        <span class="v"${c.residuel ? ' style="color:var(--anomalie)"' : ''}>${eur(c.residuel)}</span>
        <span class="k">Rapport au seuil de signification</span>
        <span class="v">${pct(Math.abs(c.residuel) / Math.max(1, s.M), 0)}</span></div>
    </div>
    ${table([{k:'v',t:'Si le dossier était à…'},{k:'n',t:'Anomalies',n:1},{k:'c',t:'Constaté',n:1},
             {k:'x',t:'Corrigé par écriture',n:1},{k:'m',t:'Résiduel au cumul',n:1},{k:'d',t:'Écart',n:1}],
      [{ v:`<b>version ${S.version} — état actuel</b>`, n:String(c.n), c:eur(c.constate),
         x:eur(c.corrige), m:`<b>${eur(c.residuel)}</b>`, d:'<span class="smallcaps">—</span>' }]
      .concat(autres.map(x => ({
        v:`version ${x.v.n} — ${esc(x.v.lib)}`, n:String(x.c.n), c:eur(x.c.constate),
        x:eur(x.c.corrige), m:eur(x.c.residuel),
        d:x.c.residuel !== c.residuel
          ? `<span style="color:var(--anomalie)">${eur(x.c.residuel - c.residuel)}</span>` : '—' }))))}
    <p class="note">Chaque ligne est un calcul réel : la version y est réellement prise en compte, le dossier
    réévalué, puis l’état rétabli. Ce n’est pas une estimation. Une anomalie ne quitte le cumul que de deux
    façons — une <b>résolution probante</b> enregistrée là où l’écart est né, ou une <b>écriture de correction</b>
    présente dans une version prise en compte. Il n’y a pas de troisième chemin, et pas de case à cocher.</p>`);
}

/* ═══ 48. REPRÉSENTATIONS GRAPHIQUES — À L'ENCRE ═══════════════════════════
   Cinq représentations pour l'associé qui ouvre le dossier : avancement par
   section, budget contre réalisé, achèvements dans le temps rapportés à
   l'échéance, charge par personne, et âge des demandes en retard.

   CONTRAINTE, et c'est elle qui décide de tout : le système visuel existant
   s'applique intégralement. Les graphiques se tracent à l'ENCRE — les trois
   gris du texte et le filet — et la COULEUR reste réservée aux PROBLÈMES :
   retard, blocage, dépassement de budget. Aucune palette de graphique, aucun
   dégradé, aucune teinte hors jetons. Un camembert à sept couleurs dirait
   « regardez-moi » là où le dossier dit « regardez ce qui ne va pas ».

   Conséquence de conception : ce sont des BARRES et des LIGNES, jamais des
   secteurs, parce qu'une série sans couleur ne se distingue que par sa
   position et sa longueur. La densité fait le reste — hachures pour ce qui
   est fait, plein pour ce qui reste.
   ═══════════════════════════════════════════════════════════════════════ */

/* Les seules « couleurs » admises dans un graphe. Trois encres, un filet, et
   deux teintes de problème — exactement les jetons du système. */
const ENCRE = { fort:'var(--ink)', moyen:'var(--ink-2)', faible:'var(--ink-3)',
                filet:'var(--line)', probleme:'var(--anomalie)', attention:'var(--attention)' };

/* `preserveAspectRatio` par défaut CENTRE le dessin quand le conteneur est
   plus large que le viewBox : les graphiques flottaient au milieu d'une page
   large, décrochés de la colonne de texte. On les cale à gauche et on borne
   leur largeur — au-delà, un graphique étiré ne se lit pas mieux. */
function svg(w, h, contenu, titre){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
    preserveAspectRatio="xMinYMid meet" aria-label="${esc(titre)}"
    style="display:block;overflow:visible;max-width:${w}px">${contenu}</svg>`;
}
function txt(x, y, s, o){
  o = o || {};
  return `<text x="${x}" y="${y}" fill="${o.fill || ENCRE.faible}"
    font-family="${o.mono ? 'var(--mono)' : 'var(--sans)'}" font-size="${o.taille || 11}"
    text-anchor="${o.ancre || 'start'}"${o.gras ? ' font-weight="700"' : ''}>${esc(s)}</text>`;
}
function rect(x, y, w, h, fill, o){
  o = o || {};
  return `<rect x="${x}" y="${y}" width="${Math.max(0, w)}" height="${h}" fill="${fill}"
    ${o.opacite ? `opacity="${o.opacite}"` : ''} ${o.rx ? `rx="${o.rx}"` : ''}></rect>`;
}
/** Hachures : ce qui est FAIT, sans recourir à une seconde couleur. */
/* `fill="none"` partout où rien ne doit être peint : sans lui, ces éléments
   portent le noir par défaut de SVG. Ils ne peignent rien — un trait n'a pas
   de surface, un <defs> ne se rend pas — mais le contrôle de couleur les
   relève, et il a raison de les relever : une teinte non voulue dans le
   document reste une teinte non voulue. On la retire plutôt que de l'excuser. */
const HACHURE = `<defs fill="none">
  <pattern id="hach" width="4" height="4" patternTransform="rotate(45)" patternUnits="userSpaceOnUse" fill="none">
    <rect width="4" height="4" fill="var(--panel)"></rect>
    <line x1="0" y1="0" x2="0" y2="4" stroke="var(--ink-2)" stroke-width="2" fill="none"></line>
  </pattern>
</defs>`;

/* ── 1. avancement par section ──────────────────────────────────────────── */
function grapheAvancement(){
  const postes = postesEnPerimetre().map(p => {
    const l = travauxDe(p.code).filter(t => !t.sansObjet);
    return { p, n:l.length,
             revus:l.filter(t => t.statut === 'revu').length,
             acheves:l.filter(t => t.statut === 'acheve').length,
             obst:obstaclesVisa(p).length, visa:!!sec(p.code).visa };
  }).filter(x => x.n).sort((a, b) => (b.revus + b.acheves) / b.n - (a.revus + a.acheves) / a.n);
  /* Colonnes FIXES : nom, barre, décompte, obstacles. En texte proportionnel
     on ne sait pas où finit une chaîne, et deux étiquettes finissaient l'une
     sur l'autre. Chaque colonne a donc sa position, et le décompte est en
     chasse fixe pour que les nombres s'alignent. */
  const H = 19, LG = 152, BAR = 260, CPT = LG + BAR + 12, OBS = CPT + 92, W = OBS + 106;
  const h = postes.length * H + 26;
  const lignes = postes.map((x, i) => {
    const y = i * H + 16;
    const u = BAR / Math.max(1, x.n);
    const wr = x.revus * u, wa = x.acheves * u, wo = (x.n - x.revus - x.acheves) * u;
    return txt(0, y + 9, x.p.lib.length > 25 ? x.p.lib.slice(0, 24) + '…' : x.p.lib, { fill:ENCRE.moyen })
      + rect(LG, y, BAR, 11, ENCRE.filet)
      + rect(LG, y, wr, 11, ENCRE.fort)
      + rect(LG + wr, y, wa, 11, 'url(#hach)')
      + (x.obst ? rect(LG + wr + wa + wo - 2, y, 2, 11, ENCRE.probleme) : '')
      + txt(CPT, y + 9, `${String(x.revus).padStart(2)} · ${String(x.acheves).padStart(2)} · ${String(x.n).padStart(2)}`,
            { mono:true, fill:ENCRE.faible })
      + (x.obst ? txt(OBS, y + 9, String(x.obst).padStart(2) + ' obstacle(s)',
            { mono:true, fill:ENCRE.probleme }) : '');
  }).join('');
  return svg(W, h, HACHURE
    + txt(CPT, 8, 'revu · achevé · total', { mono:true, fill:ENCRE.faible })
    + lignes
    + txt(0, h - 2, 'plein : revu · hachuré : achevé · filet : reste — le trait rouge marque une section qui porte un obstacle au visa',
          { fill:ENCRE.faible }),
    'Avancement par section');
}

/* ── 2. budget contre réalisé, par phase ────────────────────────────────── */
function grapheBudget(){
  const l = travaux().filter(t => !t.sansObjet);
  const par = PHASES.map(ph => {
    const t = l.filter(x => x.phase === ph.id);
    return { ph, b:t.reduce((a, x) => a + budget(x), 0), r:t.reduce((a, x) => a + x.heuresReel, 0) };
  }).filter(x => x.b || x.r);
  const max = Math.max(1, ...par.map(x => Math.max(x.b, x.r)));
  const H = 30, LG = 150, BAR = 300, W = LG + BAR + 150;
  const h = par.length * H + 26;
  const lignes = par.map((x, i) => {
    const y = i * H + 12;
    const depasse = x.r > x.b;
    return txt(0, y + 8, x.ph.lib, { fill:ENCRE.moyen })
      + rect(LG, y, BAR * x.b / max, 9, ENCRE.filet)
      + txt(LG + BAR * x.b / max + 6, y + 8, hFmt(x.b), { mono:true, fill:ENCRE.faible })
      + rect(LG, y + 11, BAR * x.r / max, 9, depasse ? ENCRE.probleme : ENCRE.moyen)
      + txt(LG + BAR * x.r / max + 6, y + 19, hFmt(x.r) + (depasse ? ' — dépassement' : ''),
            { mono:true, fill:depasse ? ENCRE.probleme : ENCRE.faible });
  }).join('');
  return svg(W, h, lignes
    + txt(LG, h - 2, 'barre claire : budget · barre pleine : réalisé — rouge dès que le réalisé dépasse',
          { fill:ENCRE.faible }),
    'Budget contre réalisé, par phase');
}

/* ── 3. achèvements dans le temps, rapportés à l'échéance ───────────────── */
function grapheCourbe(){
  const l = travaux().filter(t => !t.sansObjet);
  const faits = l.filter(t => t.acheve).map(t => t.acheve.t.slice(0, 10)).sort();
  const deb = jalon('interim'), fin = jalon('rapport');
  const jours = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 86400000);
  const total = Math.max(1, jours(deb, fin));
  const W = 520, h = 150, G = 40, B = 26;
  const x = d => G + (W - G - 10) * Math.min(1, Math.max(0, jours(deb, d) / total));
  const y = n => h - B - (h - B - 14) * (n / Math.max(1, l.length));
  /* La courbe RÉELLE : un palier par achèvement. */
  let pts = `${x(deb)},${y(0)}`, n = 0;
  for (const d of faits){ pts += ` ${x(d)},${y(n)} ${x(d)},${y(++n)}`; }
  pts += ` ${x(S.aujourdhui)},${y(n)}`;
  /* La droite ATTENDUE : de zéro au premier jalon à tout à la date du rapport.
     Ce n'est pas une prévision, c'est une référence — et elle est en pointillé
     pour qu'on ne la confonde pas avec une mesure. */
  const retard = n < l.length * Math.min(1, jours(deb, S.aujourdhui) / total);
  return svg(W, h, `
    <line x1="${G}" y1="${h - B}" x2="${W - 10}" y2="${h - B}" stroke="${ENCRE.filet}" stroke-width="1" fill="none"></line>
    <line x1="${G}" y1="14" x2="${G}" y2="${h - B}" stroke="${ENCRE.filet}" stroke-width="1" fill="none"></line>
    <line x1="${x(deb)}" y1="${y(0)}" x2="${x(fin)}" y2="${y(l.length)}"
      stroke="${ENCRE.faible}" stroke-width="1" stroke-dasharray="3 3" fill="none"></line>
    <line x1="${x(S.aujourdhui)}" y1="10" x2="${x(S.aujourdhui)}" y2="${h - B}"
      stroke="${ENCRE.moyen}" stroke-width="1" fill="none"></line>
    <polyline points="${pts}" fill="none" stroke="${retard ? ENCRE.probleme : ENCRE.fort}" stroke-width="2"></polyline>
    ${txt(G - 6, y(l.length) + 4, String(l.length), { mono:true, ancre:'end' })}
    ${txt(G - 6, y(0) + 4, '0', { mono:true, ancre:'end' })}
    ${txt(x(deb), h - B + 14, frDate(deb), { mono:true })}
    ${txt(x(fin), h - B + 14, frDate(fin), { mono:true, ancre:'end' })}
    ${txt(x(S.aujourdhui) + 4, 18, 'aujourd’hui', { fill:ENCRE.moyen })}
    ${txt(G, h - 4, `trait plein : travaux achevés · pointillé : rythme qu’exige la date du rapport`
      + (retard ? ' — la courbe est sous la référence' : ''),
      { fill:retard ? ENCRE.probleme : ENCRE.faible })}`,
    'Travaux achevés dans le temps');
}

/* ── 4. charge par personne ─────────────────────────────────────────────── */
function grapheCharge(){
  const c = chargeParPersonne('reelle').filter(x => !USERS[x.k].sortie);
  const prop = chargeParPersonne('proposee');
  const max = Math.max(1, ...c.map(x => x.h), ...prop.map(x => x.h));
  const H = 26, LG = 150, BAR = 280, W = LG + BAR + 170;
  const h = c.length * H + 26;
  const lignes = c.map((x, i) => {
    const y = i * H + 12, pr = prop.find(z => z.k === x.k) || { h:0 };
    return txt(0, y + 8, x.u.nom, { fill:ENCRE.moyen })
      + txt(0, y + 19, x.u.grade, { fill:ENCRE.faible })
      + rect(LG, y, BAR * pr.h / max, 8, ENCRE.filet)
      + rect(LG, y + 10, BAR * x.h / max, 8, x.indispo ? ENCRE.probleme : ENCRE.fort)
      + txt(LG + BAR + 8, y + 8, hFmt(pr.h) + ' proposé', { mono:true, fill:ENCRE.faible })
      + txt(LG + BAR + 8, y + 19, x.indispo ? esc(x.indispo) : hFmt(x.h) + ' attribué',
            { mono:!x.indispo, fill:x.indispo ? ENCRE.probleme : ENCRE.moyen });
  }).join('');
  return svg(W, h, lignes
    + txt(LG, h - 2, 'barre claire : charge proposée · barre pleine : charge réellement attribuée',
          { fill:ENCRE.faible }),
    'Charge par personne');
}

/* ── 5. âge des demandes clients en retard ──────────────────────────────── */
function grapheRetards(){
  const l = S.requetes.filter(retard).map(r => ({ r, age:ancienneteRetard(r) }))
    .sort((a, b) => b.age - a.age);
  if (!l.length) return `<p class="note">Aucune demande en retard : rien à tracer.</p>`;
  const max = Math.max(...l.map(x => x.age), 1);
  const H = 20, LG = 230, BAR = 240, W = LG + BAR + 110;
  const h = l.length * H + 26;
  const seuil = S.portail.escalade;
  const lignes = l.map((x, i) => {
    const y = i * H + 14;
    const grave = x.age >= seuil;
    return txt(0, y + 9, (x.r.titre.length > 38 ? x.r.titre.slice(0, 37) + '…' : x.r.titre), { fill:ENCRE.moyen })
      + rect(LG, y, BAR * x.age / max, 11, grave ? ENCRE.probleme : ENCRE.attention)
      + txt(LG + BAR * x.age / max + 6, y + 9, x.age + ' j ouvrés', { mono:true,
            fill:grave ? ENCRE.probleme : ENCRE.moyen });
  }).join('');
  return svg(W, h, lignes
    + `<line x1="${LG + BAR * seuil / max}" y1="6" x2="${LG + BAR * seuil / max}" y2="${h - 20}"
        stroke="${ENCRE.probleme}" stroke-width="1" stroke-dasharray="2 2" fill="none"></line>`
    + txt(LG, h - 2, `pointillé : seuil d’escalade du portail (${seuil} jours ouvrés)`, { fill:ENCRE.faible }),
    'Âge des demandes en retard');
}

/** Le bloc entier, pour la vue de pilotage. */
function blocGraphes(){
  return blk('Où en est le dossier', 'cinq lectures, à l’encre — la couleur ne dit qu’un problème',
    `<h3>Avancement par section</h3>${grapheAvancement()}
     <h3>Budget contre réalisé</h3>${grapheBudget()}
     <h3>Travaux achevés dans le temps</h3>${grapheCourbe()}
     <h3>Charge par personne</h3>${grapheCharge()}
     <h3>Demandes clients en retard</h3>${grapheRetards()}
     <p class="note">Tout est tracé avec les jetons du système : trois encres, le filet, et les deux teintes
     de problème. Aucune palette de graphique, aucun dégradé. Une série ne se distingue donc jamais par sa
     couleur mais par sa <b>position</b>, sa <b>longueur</b> et sa <b>densité</b> — et quand quelque chose
     devient rouge, c’est que quelque chose ne va pas, pas que c’est la deuxième série.</p>`);
}

/* ═══ 47. UN TESTING ENTIÈREMENT DÉROULÉ — CHIFFRE D'AFFAIRES ══════════════
   Un outil d'audit se juge sur le papier qu'il produit, pas sur ses écrans
   vides. Le test de détail du chiffre d'affaires est donc DÉROULÉ dans l'état
   initial du fichier, de bout en bout :

     échantillon tiré → requête émise → pièces déposées côté client → états
     dérivés à « reçue » → champs relevés selon le catalogue de preuve → un
     écart constaté, expliqué, corroboré et RÉSOLU → un second écart laissé
     NON RÉSOLU qui remonte au cumul → une note de revue posée par la
     réviseuse, répondue par le préparateur, close par la réviseuse → travail
     achevé par son préparateur, revu par sa réviseuse.

   RIEN ICI N'EST FABRIQUÉ. Chaque étape passe par la MÊME fonction que le
   clic correspondant : creerRequete, deposer, les champs du papier, la carte
   de résolution, ajouterNote, changerStatut. Si une règle refusait une de ces
   étapes, l'amorce échouerait au lieu de produire un faux papier — et c'est
   la seule façon de garantir que ce qu'on montre est ce que l'outil fait.

   L'horloge est remise à sa valeur de départ à la fin : ces travaux ont eu
   lieu AVANT qu'on ouvre l'outil, comme les affectations de l'amorce.
   ═══════════════════════════════════════════════════════════════════════ */

const DEROULE = {
  poste:'CA', proc:'DETAIL',
  prep:'karim', rev:'sonia',
  heures:12.5,          // heures réellement passées — donnée déclarée du jeu d'essai
  /* Les deux écarts sont NOMMÉS : on ne compte pas sur le tirage pour en
     rencontrer un. Le premier est résolu, le second reste au cumul. */
  note:{
    type:'doc',
    texte:'Point à valider avant revue : pour les ventes à installation différée, je me suis appuyé sur le bon '
        + 'de livraison signé, faute de procès-verbal de réception au dossier. Est-ce que cela te suffit comme '
        + 'preuve de la réalité de la livraison, ou faut-il demander le procès-verbal au client ?',
    reponse:'Le bon de livraison signé du client suffit pour l’assertion de réalité : il porte la date et '
          + 'l’identité du signataire. Le procès-verbal de réception n’ajouterait rien ici, il relèverait de '
          + 'l’acceptation contractuelle. Point clos, la conclusion peut être rédigée en l’état.',
  },
};

/** Les travaux que le déroulé affecte. Ils s'ajoutent à ceux de l'amorce
 *  d'équipe : c'est l'ensemble des affectations présentes au démarrage, et
 *  rien d'autre ne doit être écrit tant que personne n'accepte la
 *  proposition de répartition. */
function codesDeroules(){ return ['SEC-' + DEROULE.poste + '-' + DEROULE.proc]; }

/** Le déroulé complet. Rendu : ce qu'il a réellement produit, pour le harnais. */
function derouler(){
  const p = postesCalcules().find(x => x.code === DEROULE.poste);
  const pr = proceduresRequises(p).find(x => x.code === DEROULE.proc);
  if (!p || !pr) return { ok:false, why:'section ou procédure absente' };
  const moiAvant = S.moi;

  /* 1 — affectation. Elle passe par affecter(), donc par la règle
         d'indépendance : si le préparateur n'avait pas signé, tout s'arrête. */
  const a1 = affecter('SEC-CA-DETAIL', 'preparateur', DEROULE.prep);
  const a2 = affecter('SEC-CA-DETAIL', 'reviseur', DEROULE.rev);
  if (!a1.ok || !a2.ok) return { ok:false, why:(a1.why || a2.why) };

  /* 1 bis — LA MÉTHODE DE SÉLECTION, et pourquoi elle change ici.
     Le garde-fou d'exhaustivité se déclenche sur cette procédure : 115
     éléments retenus sur 269, soit 73 % de la masse — à ce niveau on ne sonde
     plus, on teste presque tout. Et la mesure est sans appel : cette
     sélection-là ne rencontre AUCUNE des deux anomalies de montant présentes
     dans la population. Le déroulé applique donc ce que l'écran recommande :
     sondage en unités monétaires, à la taille qui ramène l'intervalle au seuil
     de planification. 167 éléments au lieu de 115 — plus de travail, pas moins
     — et les deux anomalies de montant sont rencontrées. C'est le résultat de
     l'ADR-047, reproduit ici sur le dossier vivant. */
  const st0 = proc(p.code, pr.code);
  st0.methode = 'sum';
  _echProcCache.clear();
  const e0 = echantillonProc(p, pr);
  st0.taille = e0.nAdequate;
  _echProcCache.clear();
  logEvent('méthode de sélection modifiée', p.lib + ' · ' + pr.code,
           'sondage en unités monétaires, taille ' + e0.nAdequate + ' — intervalle ramené au seuil');

  /* 2 — la requête, engendrée depuis le catalogue de preuve. */
  const req = requeteJustificatifsProc(p, pr);
  if (!req) return { ok:false, why:'aucune sélection à demander' };

  /* 3 — le client dépose. Chaque dépôt passe par deposer(), donc l'état
         « reçue » se DÉRIVE : aucune case n'est cochée nulle part. */
  const espaceAvant = S.espace, clientAvant = S.moiClient;
  S.espace = 'client';
  const ref = referentSection(p.code);
  if (ref) S.moiClient = ref.id;
  const docs = docsAttendusProc(p, pr);
  for (const it of req.items){
    for (let k = 0; k < docs.length; k++) deposer(req.id, it.id);
  }
  S.espace = espaceAvant; S.moiClient = clientAvant;

  /* 4 — les champs sont relevés selon le catalogue. C'est la lecture des
         pièces : la valeur portée par la pièce synthétique est saisie telle
         quelle, exactement comme le ferait un auditeur qui la lit. */
  S.moi = DEROULE.prep;
  let releves = 0;
  for (const c of controles(p, pr)){
    if (etatControle(c) !== 'recue') continue;
    const v = c.ch.val(c.ligne.x);
    c.ligne.champs[c.cle] = c.ch.type === 'montant' ? (v / 100).toFixed(2).replace('.', ',')
                          : c.ch.type === 'bool' ? (v ? 'oui' : 'non') : String(v);
    releves++;
  }
  marquerExecution(p, pr);

  /* 5 — les écarts. Le jeu de données en produit ; on en RÉSOUT UN et on
         laisse l'autre. Le premier est le plus gros écart chiffré, parce que
         c'est celui qu'un auditeur traite d'abord. */
  /* Les écarts CHIFFRÉS sont pris du plus PETIT au plus grand : on résout le
     premier, on laisse le second. C'est l'ordre réel d'un dossier — la remise
     de 620 € s'explique et se corrobore en une pièce, le retour de 4 850 €
     attend son avoir. Et c'est le plus gros qui reste au cumul, pas l'inverse. */
  const chiffres = ecartsProc(p, pr).filter(c => constateDe(c) !== 0)
    .sort((x, y) => Math.abs(constateDe(x)) - Math.abs(constateDe(y)));
  let resolu = null, laisse = null;
  if (chiffres.length){
    const c = chiffres[0];
    const r = resol(c);
    const cst = constateDe(c);
    r.expl = 'Remise commerciale de fin d’année accordée à ce client et non déduite de la facture : l’avoir '
           + 'correspondant a été émis le 12 janvier, il vous est joint.';
    r.concl = 'La remise est corroborée par l’avoir déposé et par l’écriture qui le porte au grand livre. Le '
            + 'montant facturé excède le montant dû de la remise ; l’avoir ayant été émis, l’écart est qualifié '
            + 'corrigé et sort du cumul pour sa totalité. Rapporté au seuil de remontée, il n’y entrait pas — '
            + 'ce qui ne dispense pas de le documenter, seulement de le cumuler.';
    r.disposition = 'corrigee';
    r.explique = cst;
    const dep = depotsElement(p, pr, c.ligne.cle);
    if (dep.length) r.corrobPiece = dep[0].nom;
    const ecr = lg().entries.find(e => String(e.pieceRef) === String(c.ligne.x.e && c.ligne.x.e.pieceRef));
    if (ecr) r.corrobEcriture = ecr.num;
    const res = conclureResolution(r, cst, p.lib + ' · ' + c.ch.lib + ' — ' + c.ligne.cle);
    resolu = { cle:c.ligne.cle, champ:c.ch.lib, constate:cst, ok:res.ok, why:res.why };
  }
  if (chiffres.length > 1){
    const c = chiffres[1];
    laisse = { cle:c.ligne.cle, champ:c.ch.lib, constate:constateDe(c) };
  }

  /* 6 — la note de revue. Le PRÉPARATEUR pose le point sur son papier et
         l'adresse à sa réviseuse ; elle répond et elle clôt. C'est la règle
         déjà écrite : on ne clôt pas sa propre note, et seul un réviseur ou un
         associé clôt. Si la réviseuse avait posé la note, elle n'aurait pas pu
         la clore — et l'amorce le dirait au lieu de le cacher. */
  S.moi = DEROULE.prep;
  const n = ajouterNote(DEROULE.note.type,
    ancre(p.code, 'procedure', pr.code, 'Procédure ' + procRef(p, pr)), DEROULE.note.texte);
  n.pour = DEROULE.rev;
  S.moi = DEROULE.rev;
  n.reponses.push({ par:S.moi, t:tick(), texte:DEROULE.note.reponse });
  logEvent('réponse à une note', '#' + n.id + ' — ' + n.ancre.lib, USERS[S.moi].nom);
  const closable = peutClore(S.moi, n);
  if (closable){
    n.clos = { par:S.moi, t:tick() };
    logEvent('note close', '#' + n.id + ' — ' + n.ancre.lib,
             USERS[S.moi].nom + ' (' + ROLE_LIB[USERS[S.moi].role] + ')');
  }

  /* 7 — la conclusion de la procédure, puis les statuts : achevé par le
         préparateur seul, revu par la réviseuse seule. changerStatut refuse
         tout le reste. */
  S.moi = DEROULE.prep;
  proc(p.code, pr.code).conclusion =
    'Test de détail exécuté sur ' + (echantillonProc(p, pr) || { retenus:[] }).retenus.length + ' éléments '
    + 'sélectionnés par sondage en unités monétaires, à la taille qui ramène l’intervalle de sondage au seuil '
    + 'de planification — la strate exhaustive retenait 73 % de la masse sans rencontrer aucune des deux '
    + 'anomalies de montant de la population. Les pièces ont été obtenues pour la '
    + 'totalité des éléments. Deux écarts de montant ont été relevés : le premier est corroboré par l’avoir '
    + 'et par l’écriture de correction, et sort du cumul ; le second reste non résolu et y demeure. Sous '
    + 'réserve de ce second écart, l’assertion de réalité du chiffre d’affaires est couverte pour la '
    + 'population testée.';
  /* La conclusion cite la méthode retenue, parce que c'est elle qui explique
     l'étendue — et parce qu'un réviseur qui lit « 167 éléments » sans savoir
     d'où sort le nombre ne peut rien en faire. */
  /* Les heures passées sont une DONNÉE DÉCLARÉE du jeu d'essai, comme les
     taux d'anomalie : sans elles, la lecture « budget contre réalisé » du
     pilotage n'aurait rien à montrer. Le dépassement est voulu — 167 éléments
     au lieu des 115 de la strate, c'est le coût de la méthode adéquate. */
  trav('SEC-CA-DETAIL').heuresReel = DEROULE.heures;
  const s1 = changerStatut('SEC-CA-DETAIL', 'acheve');
  S.moi = DEROULE.rev;
  const s2 = changerStatut('SEC-CA-DETAIL', 'revu');
  S.moi = moiAvant;

  const n5 = comptesEtats(controles(p, pr));
  return { ok:true, requete:req.id, elements:req.items.length, releves,
           etats:n5, resolu, laisse, note:{ id:n.id, close:closable },
           acheve:s1.ok, revu:s2.ok,
           cumul:anomalies().filter(x => !x.souSeuil && x.section === p.code)
                   .reduce((t, x) => t + x.montant, 0) };
}

/* ═══ 39. CRITÈRES DU TEST DES ÉCRITURES ═══════════════════════════════════
   « 457 écritures en journal d'OD » ne veut rien dire isolément. Ce qui a un
   sens, c'est l'ENTONNOIR : d'où l'on part, ce que chaque critère retient,
   ce qu'il ajoute que les autres n'avaient pas vu, et combien d'écritures
   réunissent au moins N critères.

   Un critère est un objet : identité, ce qu'il cherche, ses PARAMÈTRES
   déclarés, son prédicat, et — quand il ne peut pas s'exécuter sur les
   données disponibles — la raison écrite de son indisponibilité. On peut en
   activer, en désactiver, en créer, et enregistrer l'ensemble en modèle.
   ═══════════════════════════════════════════════════════════════════════ */

const mtEcr = e => Math.max(...e.lines.map(l => Math.max(l.debit, l.credit)));

/* ── jours fériés ─────────────────────────────────────────────────────────
   [UNVERIFIED] La liste des fêtes légales relève du code du travail,
   art. L. 3133-1. Le texte primaire n'a pas pu être atteint depuis cet
   environnement — l'accès à legifrance.gouv.fr y est bloqué. La liste
   ci-dessous n'est donc PAS vérifiée sur le texte en vigueur et le critère
   qui s'en sert le déclare à l'écran. Les dates mobiles de 2025 sont
   calculées, pas recopiées. */
const FERIES_2025 = [
  '2025-01-01', '2025-04-21', '2025-05-01', '2025-05-08', '2025-05-29',
  '2025-06-09', '2025-07-14', '2025-08-15', '2025-11-01', '2025-11-11', '2025-12-25',
];
const FERIES_SOURCE = 'code du travail, art. L. 3133-1';
const FERIES_VERIFIE = false;

/* ── statistiques de population, mémoïsées par version ────────────────────
   Plusieurs critères ont besoin de connaître la population entière : un
   compte « rarement mouvementé » n'a de sens qu'au regard des autres. */
const _jeStat = new Map();
function statsJE(){
  const cle = S.version + '|' + (S.jeSansAN ? 'sansAN' : 'avecAN');
  if (_jeStat.has(cle)) return _jeStat.get(cle);
  const pop = populationJE();
  const parCompte = new Map(), parCouple = new Map(), parAuteurCompte = new Map();
  const parMontantTiers = new Map();
  for (const e of pop){
    const comptes = e.lines.map(l => l.compte);
    for (const c of comptes){
      parCompte.set(c, (parCompte.get(c) || 0) + 1);
      const k = e.saisiePar + '§' + c;
      parAuteurCompte.set(k, (parAuteurCompte.get(k) || 0) + 1);
    }
    const d = e.lines.filter(l => l.debit).map(l => l.compte).sort().join(',');
    const c2 = e.lines.filter(l => l.credit).map(l => l.compte).sort().join(',');
    const couple = d + ' → ' + c2;
    parCouple.set(couple, (parCouple.get(couple) || 0) + 1);
    const tiers = e.lines.map(l => l.auxLib).find(Boolean);
    if (tiers){
      const k = tiers + '§' + mtEcr(e);
      parMontantTiers.set(k, (parMontantTiers.get(k) || 0) + 1);
    }
  }
  const r = { pop, parCompte, parCouple, parAuteurCompte, parMontantTiers };
  if (_jeStat.size > 8) _jeStat.clear();
  _jeStat.set(cle, r);
  return r;
}
function coupleDe(e){
  const d = e.lines.filter(l => l.debit).map(l => l.compte).sort().join(',');
  const c = e.lines.filter(l => l.credit).map(l => l.compte).sort().join(',');
  return d + ' → ' + c;
}
function populationJE(){
  return lg().entries.filter(e => !(S.jeSansAN && e.journal === 'AN'));
}

/* ── le catalogue ─────────────────────────────────────────────────────────
   `params` : ce que l'auditeur règle. `indispo` : la raison, écrite, pour
   laquelle un critère ne peut pas tourner sur les données disponibles. */
const CATALOGUE_JE = [
  { code:'rond', lib:'Montant rond',
    quoi:'un montant exactement multiple d’un pas, au-dessus d’un plancher — signature d’une écriture estimée plutôt que constatée',
    params:[{ code:'pas', lib:'Multiple de', type:'euros', def:100000 },
            { code:'plancher', lib:'À partir de', type:'euros', def:500000 }],
    f:(e, p) => { const m = mtEcr(e); return m >= p.plancher && p.pas > 0 && m % p.pas === 0; } },

  { code:'weekend', lib:'Comptabilisée un week-end',
    quoi:'une écriture datée d’un samedi ou d’un dimanche',
    params:[], f:e => isWeekend(e.date) },

  { code:'ferie', lib:'Comptabilisée un jour férié',
    quoi:'une écriture datée d’une fête légale',
    marque:FERIES_VERIFIE ? null : 'UNVERIFIED',
    note:'La liste des fêtes légales (' + FERIES_SOURCE + ') n’a pas pu être vérifiée sur le texte '
       + 'primaire depuis cet environnement. Le critère fonctionne, sa liste est à confirmer.',
    params:[], f:e => FERIES_2025.includes(e.date) },

  { code:'hors_heures', lib:'Saisie hors heures ouvrées',
    quoi:'une écriture enregistrée la nuit ou pendant le week-end, d’après l’horodatage de saisie',
    indispo:'Le fichier des écritures comptables ne porte que la DATE de validation (champ ValidDate), '
          + 'jamais l’heure. Ce critère exige le journal applicatif de l’ERP, pas le FEC. Il est '
          + 'catalogué et désactivé plutôt que fabriqué : une heure inventée ferait un critère qui '
          + 'trouve toujours quelque chose.',
    params:[{ code:'debut', lib:'Début des heures ouvrées', type:'heure', def:8 },
            { code:'fin', lib:'Fin des heures ouvrées', type:'heure', def:20 }],
    f:() => false },

  { code:'apres_cloture', lib:'Validée après la clôture, datée avant',
    quoi:'une écriture datée de l’exercice mais enregistrée après le 31/12 — la fenêtre où se logent les ajustements de dernière minute',
    params:[{ code:'jours', lib:'Au-delà de la clôture, en jours', type:'entier', def:0 }],
    f:(e, p) => e.date <= CLOTURE && e.validDate > addDays(CLOTURE, p.jours) },

  { code:'libelle', lib:'Libellé vide, trop court ou suspect',
    quoi:'un libellé qui n’explique rien, ou qui emploie un mot de la liste surveillée',
    params:[{ code:'mini', lib:'Longueur minimale', type:'entier', def:12 },
            { code:'mots', lib:'Mots surveillés', type:'liste', def:'divers,régularisation,ajustement,od,correction,à ventiler,pour solde' }],
    f:(e, p) => { const l = (e.libelle || '').trim();
      if (l.length < p.mini) return true;
      const b = l.toLowerCase();
      return p.mots.some(m => m && b.includes(m)); } },

  { code:'compte_rare', lib:'Compte rarement mouvementé',
    quoi:'un compte qui ne bouge presque jamais — l’écriture unique de l’année s’y cache bien',
    params:[{ code:'max', lib:'Au plus, mouvements dans l’exercice', type:'entier', def:3 }],
    f:(e, p) => { const st = statsJE();
      return e.lines.some(l => (st.parCompte.get(l.compte) || 0) <= p.max); } },

  { code:'combinaison', lib:'Combinaison de comptes inhabituelle',
    quoi:'un couple débit → crédit qui n’apparaît presque jamais dans l’exercice',
    params:[{ code:'max', lib:'Au plus, occurrences du couple', type:'entier', def:2 }],
    f:(e, p) => (statsJE().parCouple.get(coupleDe(e)) || 0) <= p.max },

  { code:'contrepassee', lib:'Contrepassée peu après',
    quoi:'une écriture annulée par son symétrique dans les jours qui suivent — ce qui a été passé puis repris mérite d’être lu',
    params:[{ code:'jours', lib:'Dans un délai de, en jours', type:'entier', def:15 }],
    f:(e, p) => { const m = mtEcr(e), c = coupleDe(e).split(' → ');
      const inverse = c[1] + ' → ' + c[0];
      return statsJE().pop.some(x => x !== e && mtEcr(x) === m && coupleDe(x) === inverse
        && Math.abs(Date.parse(x.date) - Date.parse(e.date)) <= p.jours * 86400000); } },

  { code:'sans_piece', lib:'Référence de pièce absente',
    quoi:'une écriture sans pièce citée : rien à demander, rien à rapprocher',
    params:[], f:e => !e.pieceRef || !String(e.pieceRef).trim() },

  { code:'derniers_jours', lib:'Dans les derniers jours de l’exercice',
    quoi:'la fenêtre de clôture, où se concentrent les écritures d’ajustement',
    params:[{ code:'n', lib:'Derniers jours', type:'entier', def:10 }],
    f:(e, p) => e.date > addDays(CLOTURE, -p.n) && e.date <= CLOTURE },

  { code:'meme_montant_tiers', lib:'Montant identique au même tiers',
    quoi:'le même montant, au même tiers, plusieurs fois — doublon ou fractionnement',
    params:[{ code:'min', lib:'À partir de, occurrences', type:'entier', def:2 }],
    f:(e, p) => { const t = e.lines.map(l => l.auxLib).find(Boolean);
      if (!t) return false;
      return (statsJE().parMontantTiers.get(t + '§' + mtEcr(e)) || 0) >= p.min; } },

  { code:'auteur_inhabituel', lib:'Auteur inhabituel sur ce compte',
    quoi:'une écriture passée sur un compte par quelqu’un qui n’y touche presque jamais',
    params:[{ code:'max', lib:'Au plus, écritures de cet auteur sur ce compte', type:'entier', def:2 }],
    f:(e, p) => { const st = statsJE();
      return e.lines.some(l => (st.parCompte.get(l.compte) || 0) > p.max * 3
        && (st.parAuteurCompte.get(e.saisiePar + '§' + l.compte) || 0) <= p.max); } },

  { code:'gros', lib:'Montant supérieur au seuil de planification',
    quoi:'une écriture qui, à elle seule, pourrait porter une anomalie significative',
    params:[], f:e => mtEcr(e) > seuils().PM },

  { code:'od', lib:'Journal d’opérations diverses',
    quoi:'le journal qui ne correspond à aucun flux automatisé',
    params:[], f:e => e.journal === 'OD' },

  { code:'direction', lib:'Saisie par la direction',
    quoi:'une écriture passée par quelqu’un qui n’a pas de rôle comptable quotidien',
    params:[], f:e => /direction/.test(e.saisiePar) },
];

/* ── formes de critères que l'auditeur peut instancier ────────────────────
   Créer un critère, ce n'est pas écrire du code : c'est instancier une forme
   avec ses paramètres. Les cinq formes couvrent ce qu'un auditeur ajoute
   réellement en cours de mission. */
const FORMES_JE = {
  montant_entre:{ lib:'Montant compris entre deux bornes',
    params:[{ code:'min', lib:'Au moins', type:'euros', def:1000000 },
            { code:'max', lib:'Au plus', type:'euros', def:5000000 }],
    f:(e, p) => { const m = mtEcr(e); return m >= p.min && m <= p.max; },
    nom:p => 'Montant entre ' + eur0(p.min) + ' et ' + eur0(p.max) },
  compte_prefixe:{ lib:'Compte commençant par',
    params:[{ code:'prefixe', lib:'Préfixe de compte', type:'texte', def:'627' }],
    f:(e, p) => e.lines.some(l => String(l.compte).startsWith(p.prefixe)),
    nom:p => 'Compte commençant par ' + p.prefixe },
  journal:{ lib:'Journal',
    params:[{ code:'code', lib:'Code journal', type:'texte', def:'OD' }],
    f:(e, p) => e.journal === p.code, nom:p => 'Journal ' + p.code },
  libelle_contient:{ lib:'Libellé contenant',
    params:[{ code:'mots', lib:'Mots', type:'liste', def:'exceptionnel,provision' }],
    f:(e, p) => { const b = (e.libelle || '').toLowerCase(); return p.mots.some(m => m && b.includes(m)); },
    nom:p => 'Libellé contenant : ' + p.mots.join(', ') },
  auteur:{ lib:'Auteur de la saisie',
    params:[{ code:'qui', lib:'Contient', type:'texte', def:'intérim' }],
    f:(e, p) => new RegExp(p.qui, 'i').test(e.saisiePar), nom:p => 'Saisie par « ' + p.qui + ' »' },
};

/* ── résolution des paramètres et des critères actifs ─────────────────── */
function critereJEDef(code){
  const base = CATALOGUE_JE.find(c => c.code === code);
  if (base) return base;
  const cree = (S.jeCrees || []).find(c => c.code === code);
  if (!cree) return null;
  const forme = FORMES_JE[cree.forme];
  return { code:cree.code, lib:cree.nom, quoi:'critère créé pour cette mission — forme « ' + forme.lib + ' »',
           params:forme.params, f:forme.f, cree:true, forme:cree.forme };
}
function tousCriteresJE(){
  return [...CATALOGUE_JE, ...(S.jeCrees || []).map(c => critereJEDef(c.code))];
}
function paramsJE(code){
  const def = critereJEDef(code); if (!def) return {};
  const saisis = (S.jeParams || {})[code] || {};
  const out = {};
  for (const pr of def.params){
    const v = saisis[pr.code];
    out[pr.code] = v === undefined ? (pr.type === 'liste' ? String(pr.def).split(',').map(x => x.trim()) : pr.def)
      : (pr.type === 'liste' ? String(v).split(',').map(x => x.trim().toLowerCase()).filter(Boolean) : v);
  }
  return out;
}
function critereActif(code){
  const def = critereJEDef(code);
  if (!def || def.indispo) return false;
  return !!S.jeCrit[code];
}
function criteresActifs(){ return tousCriteresJE().filter(c => critereActif(c.code)); }
/** Les critères remplis par une écriture. */
function critRemplis(e){
  return criteresActifs().filter(c => { try { return c.f(e, paramsJE(c.code)); } catch { return false; } })
    .map(c => c.code);
}

/* ── logique de combinaison ───────────────────────────────────────────────
   Trois modes. « au moins N » est le réglage courant d'un test d'écritures ;
   l'expression sert quand le raisonnement est précis — « un montant rond ET
   passé un week-end », et non « l'un ou l'autre ». */
const MODES_COMBI = {
  un:{ lib:'au moins un critère', d:'la sélection est l’union des critères' },
  auN:{ lib:'au moins N critères', d:'ne retient que ce que plusieurs signaux désignent ensemble' },
  expression:{ lib:'expression explicite', d:'ET, OU, NON et parenthèses sur les codes de critères' },
};
function combiJE(){ return S.jeCombi || { mode:'un', n:2, expr:'' }; }
function retenue(e){
  const c = combiJE(), rem = critRemplis(e);
  if (c.mode === 'expression'){
    const r = evalExpr(c.expr, rem);
    return r.ok ? r.v : false;
  }
  if (c.mode === 'auN') return rem.length >= Math.max(1, c.n);
  return rem.length >= 1;
}
/** Petit évaluateur booléen : codes de critères, ET / OU / NON, parenthèses.
 *  Toute expression qu'il ne comprend pas est REFUSÉE. Une expression mal
 *  formée qui s'évaluerait à « faux » donnerait une sélection vide et
 *  d'apparence normale : c'est le pire des deux résultats possibles. */
const OPS = ['ET', 'OU', 'NON'];
function evalExpr(expr, remplis){
  const src = String(expr || '').trim();
  if (!src) return { ok:false, why:'expression vide' };
  const toks = src.match(/\(|\)|[A-Za-zÀ-ÿ_][\w_]*/g) || [];
  if (!toks.length) return { ok:false, why:'aucun critère reconnu dans l’expression' };
  let i = 0, inconnu = [], manque = null;
  const mot = () => toks[i];
  const est = m => (toks[i] || '').toUpperCase() === m;
  function ou(){ let v = et(); while (est('OU')){ i++; const w = et(); v = v || w; } return v; }
  function et(){ let v = non(); while (est('ET')){ i++; const w = non(); v = v && w; } return v; }
  function non(){ if (est('NON')){ i++; return !non(); } return atome(); }
  function atome(){
    if (mot() === '('){
      i++; const v = ou();
      if (mot() === ')') i++; else manque = manque || 'une parenthèse fermante manque';
      return v;
    }
    const m = toks[i++];
    if (m === undefined){ manque = manque || 'l’expression s’arrête sur un opérateur : il manque un critère'; return false; }
    if (m === ')'){ manque = manque || 'une parenthèse fermante en trop'; return false; }
    if (OPS.includes(m.toUpperCase())){ manque = manque || 'deux opérateurs se suivent'; return false; }
    if (!tousCriteresJE().some(c => c.code === m)) inconnu.push(m);
    return remplis.includes(m);
  }
  const v = ou();
  if (manque) return { ok:false, why:manque };
  if (i < toks.length) return { ok:false, why:'expression incomplète : « ' + toks.slice(i).join(' ') +' » n’est pas rattaché' };
  if (inconnu.length) return { ok:false, why:'inconnu dans l’expression : ' + [...new Set(inconnu)].join(', ') };
  return { ok:true, v };
}

/* ── l'entonnoir ──────────────────────────────────────────────────────────
   Pour chaque critère : ce qu'il retient seul, et ce qu'il AJOUTE que les
   précédents n'avaient pas vu. Un critère qui n'ajoute rien coûte du temps
   de lecture sans rien apporter — et cela ne se voit que dans cet ordre. */
const _entCache = new Map();
function entonnoir(){
  const c = combiJE();
  const cle = [S.version, S.jeSansAN, JSON.stringify(S.jeCrit), JSON.stringify(S.jeParams),
               JSON.stringify(S.jeCrees), JSON.stringify(c), seuils().PM].join('§');
  if (_entCache.has(cle)) return _entCache.get(cle);
  const pop = populationJE(), actifs = criteresActifs();
  const parEcriture = pop.map(e => ({ e, rem:critRemplis(e) }));
  const vus = new Set();
  const etapes = actifs.map(cr => {
    const seuls = parEcriture.filter(x => x.rem.includes(cr.code));
    const nouveaux = seuls.filter(x => !vus.has(x.e.num));
    for (const x of nouveaux) vus.add(x.e.num);
    return { code:cr.code, lib:cr.lib, seul:seuls.length, ajoute:nouveaux.length,
             cumul:vus.size, masse:seuls.reduce((a, x) => a + mtEcr(x.e), 0) };
  });
  const distribution = {};
  for (const x of parEcriture) distribution[x.rem.length] = (distribution[x.rem.length] || 0) + 1;
  const retenues = parEcriture.filter(x => retenue(x.e));
  const auMoins = [];
  for (let n = 1; n <= Math.max(1, actifs.length); n++){
    const l = parEcriture.filter(x => x.rem.length >= n);
    auMoins.push({ n, n_:l.length, masse:l.reduce((a, x) => a + mtEcr(x.e), 0) });
  }
  const r = { pop, actifs, etapes, distribution, auMoins,
              retenues:retenues.map(x => x.e), parEcriture,
              masseRetenue:retenues.reduce((a, x) => a + mtEcr(x.e), 0),
              masseTotale:pop.reduce((a, e) => a + mtEcr(e), 0) };
  if (_entCache.size > 6) _entCache.clear();
  _entCache.set(cle, r);
  return r;
}

/* ── modèles réutilisables ────────────────────────────────────────────── */
/* Le paramétrage par défaut exige DEUX critères, et ce n'est pas un réglage
   de confort. « Montant supérieur au seuil de planification » retient à lui
   seul 441 écritures sur 1 609 : sur une entreprise dont la facture médiane
   approche le seuil, ce critère décrit un tiers du grand livre, il ne désigne
   rien. Un signal isolé n'est pas un signal ; ce qui mérite d'être lu, c'est
   ce que plusieurs signaux désignent ensemble. Le nombre qui en résulte est
   une conséquence, pas une cible — l'entonnoir affiche ce que donnerait
   « au moins un ». */
const MODELES_LIVRES = [
  { nom:'Test des écritures — paramétrage courant',
    crit:{ rond:true, weekend:true, apres_cloture:true, direction:true, gros:true, sans_piece:true },
    params:{}, combi:{ mode:'auN', n:2, expr:'' } },
  { nom:'Écritures de clôture',
    crit:{ apres_cloture:true, derniers_jours:true, od:true, libelle:true },
    params:{ derniers_jours:{ n:15 } }, combi:{ mode:'auN', n:2, expr:'' } },
  { nom:'Ciblé — manipulation du résultat',
    crit:{ rond:true, direction:true, combinaison:true, apres_cloture:true, libelle:true },
    params:{ rond:{ pas:100000, plancher:1000000 } },
    combi:{ mode:'expression', expr:'direction ET (rond OU combinaison OU apres_cloture)' } },
];
function modelesJE(){ return [...MODELES_LIVRES, ...(S.jeModeles || [])]; }
function appliquerModele(nom){
  const m = modelesJE().find(x => x.nom === nom); if (!m) return;
  S.jeCrit = { ...m.crit };
  S.jeParams = JSON.parse(JSON.stringify(m.params || {}));
  S.jeCombi = { ...m.combi };
  _entCache.clear();
  logEvent('modèle de critères appliqué', nom,
           Object.keys(S.jeCrit).filter(k => S.jeCrit[k]).length + ' critère(s) actif(s)');
}
function enregistrerModele(nom){
  if (!nom.trim()) return { ok:false, why:'un modèle sans nom ne se retrouve pas' };
  if (modelesJE().some(m => m.nom === nom.trim())) return { ok:false, why:'un modèle porte déjà ce nom' };
  S.jeModeles.push({ nom:nom.trim(), crit:{ ...S.jeCrit },
    params:JSON.parse(JSON.stringify(S.jeParams || {})), combi:{ ...combiJE() },
    crees:JSON.parse(JSON.stringify(S.jeCrees || [])) });
  logEvent('modèle de critères enregistré', nom.trim(),
           criteresActifs().length + ' critère(s) · ' + MODES_COMBI[combiJE().mode].lib);
  return { ok:true };
}
function creerCritereJE(forme, nom){
  const f = FORMES_JE[forme]; if (!f) return { ok:false, why:'forme inconnue' };
  const code = 'x_' + forme + '_' + ((S.jeCrees || []).length + 1);
  const params = {};
  for (const p of f.params) params[p.code] = p.def;
  S.jeCrees.push({ code, forme, nom:nom.trim() || f.nom(params) });
  S.jeParams[code] = params;
  S.jeCrit[code] = true;
  _entCache.clear();
  logEvent('critère créé', S.jeCrees[S.jeCrees.length - 1].nom, 'forme « ' + f.lib + ' »');
  return { ok:true, code };
}
function supprimerCritereJE(code){
  S.jeCrees = (S.jeCrees || []).filter(c => c.code !== code);
  delete S.jeCrit[code]; delete S.jeParams[code];
  _entCache.clear();
}

let lastImpact = {};
function renderImpact(){
  if (!document.getElementById('impact')) return;   // idem : absent du portail client
  /* Dans une section, le bandeau collant porte l'état de CETTE section — le
     reste de la mission n'y apprend rien. La hauteur collante est la même :
     ce sont les mêmes cellules, pas une bande de plus. */
  if (S.vue.startsWith('fsli:')){
    const p = postesCalcules().find(x => x.code === S.vue.slice(5));
    if (p) return peindreImpact(cellulesSection(p));
  }
  const s = seuils(), postes = postesEnPerimetre();
  let procs = 0, sel = 0, couvert = 0, total = 0;
  for (const p of postes){
    const prs = proceduresRequises(p);
    procs += prs.length;
    for (const pr of prs){
      const e = echantillonProc(p, pr);
      if (!e) continue;
      sel += e.retenus.length; couvert += e.couvert; total += e.pop.masse;
    }
  }
  const a = anomalies(), nc = a.filter(x => !x.souSeuil).reduce((t, x) => t + x.montant, 0);
  const cells = {
    'sections de travail':                       [postes.length + '/' + postesCalcules().length, 'sections', true],
    'procédures requises':                       [String(procs),                                 'procédures'],
    'éléments sélectionnés':                     [String(sel),                                   'éléments'],
    'couverture des sélections':                 [pct(total ? couvert / total : 0, 1),           'couverture'],
    'facteurs de risque à statuer':              [String(registre().filter(f => f.statut === 'propose').length), 'facteurs'],
    'requêtes en retard':                        [String(S.requetes.filter(retard).length),      'retards'],
    'notes bloquantes ouvertes':                 [String(notesBloquantesOuvertes().length),      'bloquantes', true],
    'cumul non corrigé':                         [eur0(nc),                                      'cumul'],
    'conclusion':                                [Math.abs(nc) > s.M ? 'au-dessus du seuil' : 'sous le seuil', 'conclusion', true],
  };
  peindreImpact(cells);
}
/** Peint les compteurs. Le troisième élément d'une cellule la marque
 *  ESSENTIELLE : c'est elle, et elle seule, qui survit au bandeau réduit. */
function peindreImpact(cells){
  document.getElementById('impact').innerHTML = Object.entries(cells).map(([k, [v, court, essentiel]]) =>
    `<div class="c ${lastImpact[k] !== undefined && lastImpact[k] !== v ? 'flash' : ''}"${essentiel ? ` data-cle="1"` : ''}>`
    + `<div class="k"><span class="lg">${k}</span><span class="sm">${court}</span></div>`
    + `<div class="v" data-k="${esc(court)}">${v}</div></div>`).join('');
  lastImpact = Object.fromEntries(Object.entries(cells).map(([k, [v]]) => [k, v]));
}

/* ── réduction du bandeau au défilement ────────────────────────────────────
   Le bandeau est dans le flux : le réduire raccourcit le document et le
   contenu remonterait d'autant sous les yeux. On compense le défilement de la
   différence de hauteur, sinon la page saute à chaque bascule. */
let _bandeauReduit = false, _dernierY = 0, _bandeauTick = false;
const BANDEAU_DECLENCHE = 48;   // px de défilement avant réduction
const BANDEAU_REMONTE = 24;     // px de remontée avant rétablissement
function majBandeau(){
  _bandeauTick = false;
  const top = document.querySelector('.top');
  if (!top) return;
  const y = window.scrollY;
  let cible = _bandeauReduit;
  if (y <= BANDEAU_DECLENCHE) cible = false;
  else if (y > _dernierY) cible = true;
  else if (y < _dernierY - BANDEAU_REMONTE) cible = false;
  if (cible !== _bandeauReduit){
    const av = top.getBoundingClientRect().height;
    document.documentElement.dataset.bandeau = cible ? 'reduit' : '';
    _bandeauReduit = cible;
    const ap = top.getBoundingClientRect().height;
    syncTopHeight();
    const d = Math.round(av - ap);
    if (d && y > 0){ window.scrollTo(0, Math.max(0, y - d)); _dernierY = Math.max(0, y - d); return; }
  }
  _dernierY = y;
}
window.addEventListener('scroll', () => {
  if (_bandeauTick) return;
  _bandeauTick = true;
  requestAnimationFrame(majBandeau);
}, { passive:true });

/** Mémorise le champ actif pour le rendre après reconstruction du DOM. */
function focusKey(){
  const el = document.activeElement;
  if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
  const pos = el.selectionStart;
  if (el.id) return { sel:'#' + el.id, pos };
  const ds = [...el.attributes].filter(a => a.name.startsWith('data-')).map(a => `[${a.name}="${a.value}"]`).join('');
  return ds ? { sel:el.tagName.toLowerCase() + ds, pos } : null;
}
function focusRestore(k){
  if (!k) return;
  const el = document.querySelector(k.sel);
  if (!el) return;
  el.focus();
  try { if (k.pos !== null && el.setSelectionRange) el.setSelectionRange(k.pos, k.pos); } catch (e) {}
}
function renderMain(){
  const k = focusKey();
  const main = document.getElementById('main');
  main.innerHTML = renderRail() + contenu();
  focusRestore(k);
}

/** Rendu différé pour la saisie au clavier : l'état est mis à jour tout de
 *  suite, l'écran se recompose une fois la frappe retombée. Sans cela, chaque
 *  touche redessine une section de plus de cent lignes et la saisie accroche. */
/** Pendant le glissement d'un curseur, les seuils et le bandeau se recalculent
 *  immédiatement (3 ms) ; le rendu de la section, plus lourd, est ramené à un
 *  par image d'écran au lieu de s'empiler derrière chaque événement. */
let _raf = null;
function renderMainRaf(){
  if (_raf) return;
  _raf = requestAnimationFrame(() => { _raf = null; renderMain(); });
}
let _deb = null;
function renderMainDiff(){

  _deb = setTimeout(() => { renderImpact(); renderMain(); }, 220);
}
/** Hauteur réelle de la barre collante → décalage des ancres de navigation. */
function syncTopHeight(){

}

/** L'espace d'une vue se DÉDUIT de son identifiant : une vue de section ou de
 *  planification appartient à l'espace auditeur, « cli. » au portail, « pil. »
 *  au pilotage. Sans cela, naviguer vers une vue d'un autre espace la rendait

 *  ne se produisait pas tant que l'espace auditeur était celui d'ouverture ;
 *  il apparaît dès que le pilotage passe devant. */
function espaceDeVue(vue){
  if (vue.startsWith('cli.')) return 'client';
  if (vue.startsWith('pil.')) return 'pilotage';
  return 'auditeur';
