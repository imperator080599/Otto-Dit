       ? boutonNote(p.code, 'papier', c.ligne.cle, 'Papier ' + procRef(p, pr) + ' — ' + c.ligne.cle) : '',
  }));
  const st = proc(p.code, pr.code), per = peremption(p, pr);
  const papier = `
    <h3>Papier de travail <span class="mono">${esc(procRef(p, pr))}</span></h3>
    <div class="kv">
      <span class="k">Version du fichier</span><span class="v">v${S.version} — ${esc(versionCourante().lib)}</span>
      <span class="k">Empreinte</span><span class="v">${esc(empreinteVersion(S.version))}</span>
      <span class="k">Papier exécuté sur</span><span class="v">${st.execVersion === undefined || st.execVersion === null
        ? '<span class="smallcaps" style="font-family:var(--sans)">rien de saisi pour l’instant</span>'
        : 'v' + st.execVersion}</span>
    </div>
    ${per ? `<div class="callout bad"><b>Ce papier a été exécuté sur la version ${per.de}, le dossier est à la version ${per.a}.</b>
      ${per.populationChangee
        ? 'La population de la sélection a changé : les éléments testés ne sont plus ceux que la procédure retiendrait aujourd’hui.'
        : 'La sélection est identique ; seule la version du fichier diffère.'}
      Voir le <a data-vue="plan.versions" style="cursor:pointer">rapport d’impact</a>.</div>` : ''}
    <div class="row">
      <span class="pill ${recus === wp.length ? '' : 'bad'}">${recus}/${wp.length} éléments avec pièce</span>
      ${ETATS_LIGNE.map(e => `<span class="pill ${e.id === 'ecart' && nEtat[e.id] ? 'bad'
          : e.id === 'attente' && nEtat[e.id] ? 'warn' : ''}">${nEtat[e.id]} ${esc(e.lib)}</span>`).join('')}
      ${recus ? `<button class="btn sec mini" data-plire="${pr.code}">remplir comme si vous lisiez les pièces</button>` : ''}
    </div>
    ${table([{k:'el',t:'Élément'},{k:'doc',t:'Document'},{k:'ch',t:'Champ relevé'},{k:'v',t:'Valeur relevée',n:1},
             {k:'contre',t:'Contrôlé contre',cls:'wrapcell'},{k:'ref',t:'Référence',n:1},
             {k:'ec',t:'État'},{k:'tol',t:'Tolérance'},{k:'nt',t:''}], rows)}
    ${LEGENDE_MARQUES}
    ${ctr.length > vus.length ? `<button class="btn mini sec" data-ctrtout="${p.code}/${pr.code}" style="margin-top:6px">afficher les ${ctr.length} contrôles</button>`
      : tout && ctr.length > CTR_PAR_PAGE ? `<button class="btn mini sec" data-ctrtout="${p.code}/${pr.code}" style="margin-top:6px">replier</button>` : ''}
    ${blocResolutions(p, pr, ecarts)}
    <div class="ctrl" style="margin-top:8px"><label>Conclusion de la procédure</label>
      <textarea data-pconcl="${pr.code}" rows="2" placeholder="résultat de la procédure au regard des contrôles exécutés">${esc(stp.conclusion)}</textarea></div>
    ${blocFinTesting(p, pr)}`;

  return `<div class="row"><span class="pill">${esc(libAssertion(pr.a))}</span>
      <span class="smallcaps">${esc(pr.lib)}</span></div>
    ${defPop}${params}${catBloc}${papier}`;
}

/* ── résolution documentée des écarts ─────────────────────────────────────
   Un écart n'est pas résolu parce qu'on l'a commenté. Il l'est quand six
   éléments existent : l'explication du client mot pour mot, la conclusion de
   l'auditeur, la qualification, le LIEN vers ce qui corrobore, l'auteur et la
   date. C'est la contrainte déjà écrite pour les exceptions ; ce bloc la
   réutilise et n'ouvre aucun second chemin. */
function blocResolutions(p, pr, ecarts){
  if (!ecarts.length) return '';
  const chiffres = ecarts.filter(c => constateDe(c) !== 0);
  const ouverts = ecarts.filter(c => !resolutionAcquise(c));
  const cumul = chiffres.reduce((a, c) => a + residuel(c).residuel, 0);
  const expl = chiffres.reduce((a, c) => a + residuel(c).explique, 0);
  return `<h3>Écarts relevés et leur résolution</h3>
    <div class="row">
      <span class="pill ${ouverts.length ? 'bad' : ''}">${ouverts.length} écart(s) sans résolution</span>
      <span class="pill">${chiffres.length} chiffré(s) · ${ecarts.length - chiffres.length} non chiffré(s)</span>
      <span class="pill">expliqué ${eur(expl)}</span>
      <span class="pill ${cumul ? 'bad' : ''}">résiduel porté au cumul ${eur(cumul)}</span>
    </div>
    <p class="note">Un écart non chiffré — une date de pièce, un tiers, une référence — n’entre pas au cumul
    des anomalies, mais il exige les mêmes éléments probants : c’est le même casier, pas un second chemin.</p>
    ${ecarts.map(c => carteResolution(
      p.code + '#' + pr.code + '#' + c.cle,
      `<span class="mono">${esc(String(c.ligne.cle))}</span> · ${esc(c.doc)} · ${esc(c.ch.lib)}
       <span class="smallcaps">relevé ${esc(c.valLib)} · référence ${esc(c.refLib)} · ${esc(c.ecartLib)}</span>`,
      constateDe(c), resol(c), depotsElement(p, pr, c.ligne.cle))).join('')}`;
}
/* ── l'action de la section : déclarer le testing terminé ─────────────────
   L'affectation appartient au programme de travail, une seule fois. Ce que la
   section porte, c'est l'action : elle fait passer le travail à « achevé » et
   le soumet à la revue de son réviseur. Elle est refusée tant que le papier
   n'est pas en état de l'être — le bouton ne ment pas sur ce qu'il fait. */
function blocFinTesting(p, pr){
  const code = 'SEC-' + p.code + '-' + pr.code, st = trav(code), o = obstaclesProcedure(p, pr);
  const prep = st.preparateur ? USERS[st.preparateur] : null;
  const rev = st.reviseur ? USERS[st.reviseur] : null;
  const lien = `<button class="btn mini sec" data-gotrav="trav.programme">ouvrir le programme de travail</button>`;
  const t0 = travailDe(code), rc = t0 ? aReconfirmer({ ...t0, ...st }) : null;
  if (rc) return `<div class="callout bad"><b>À reconfirmer.</b> Ce travail est ${esc(STATUT_TRAVAIL[st.statut])},
      mais il a été exécuté sur la version ${rc.de} du fichier et le dossier est à la version ${rc.a} —
      ${esc(rc.motif)}. Il n’est pas conservé en silence.
      <button class="btn" data-recon="${code}">reconfirmer sur la version ${rc.a} — engage ${esc(USERS[S.moi].nom)}</button></div>`;
  if (st.statut === 'revu') return `<div class="callout"><b>Travail revu</b> par ${esc(USERS[st.revu.par].nom)} le ${horo(st.revu.t)}
      <span class="smallcaps">sur la version ${proc(p.code, pr.code).execVersion || S.version}</span>.</div>`;
  if (st.statut === 'acheve') return `<div class="callout">
      <b>Testing déclaré terminé</b> par ${esc(USERS[st.acheve.par].nom)} le ${horo(st.acheve.t)} —
      ${rev ? 'en attente de la revue de ' + esc(rev.nom) : 'aucun réviseur affecté'}.
      ${st.reviseur === S.moi ? `<button class="btn mini" data-tstat="${code}|revu">porter « revu »</button>` : ''}
      <button class="btn mini sec" data-tstat="${code}|en_cours">rouvrir le testing</button></div>`;
  if (!prep) return `<div class="callout warn"><b>Aucun préparateur affecté</b> à ce travail —
      l’affectation se fait au programme de travail, pas ici. ${lien}</div>`;
  if (st.preparateur !== S.moi) return `<div class="callout warn">
      Le testing de ce travail est confié à <b>${esc(prep.nom)}</b> ; seul son préparateur peut le déclarer terminé. ${lien}</div>`;
  if (o.length) return `<div class="callout warn"><b>Le testing ne peut pas être déclaré terminé :</b>
      <ul style="margin:5px 0 0 16px;padding:0">${o.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
      <button class="btn" disabled>le testing est terminé</button>`;
  return `<button class="btn" data-tstat="${code}|acheve">le testing est terminé —
    ${rev ? 'soumettre à la revue de ' + esc(rev.nom) : 'aucun réviseur affecté, à corriger au programme'}</button>`;
}
function refLisible(c){
  const r = c.ch.ref(c.ligne.x);
  return c.ch.type === 'montant' ? eur(r) : c.ch.type === 'date' ? frDate(r) : c.ch.type === 'bool' ? (r ? 'exigée' : '—') : r;
}
function champInput(p, pr, c){
  const v = c.ligne.champs[c.cle];
  if (c.ch.type === 'bool') return `<select class="cell txt" data-ctr="${esc(c.cle)}" data-pcode="${pr.code}" style="width:80px">
      <option value="">—</option><option value="oui" ${v === 'oui' ? 'selected' : ''}>oui</option>
      <option value="non" ${v === 'non' ? 'selected' : ''}>non</option></select>`;
  return `<input class="cell ${c.ch.type === 'texte' ? 'txt' : ''}" data-ctr="${esc(c.cle)}" data-pcode="${pr.code}"
    value="${esc(v === undefined ? '' : v)}" placeholder="${c.ch.type === 'date' ? 'aaaa-mm-jj' : ''}">`;
}

function blocRequetes(p){

      ech:`<span class="mono">${frDate(r.echeance)}</span>` + (ret ? `<div class="smallcaps" style="color:var(--anomalie)">retard ${ancienneteRetard(r)} j</div>` : ''),
      av:`<div class="bar" style="width:90px"><i style="width:${(a * 100).toFixed(0)}%"></i></div><span class="smallcaps">${pct(a, 0)}</span>`,

                {k:'dest',t:'Destinataire',cls:'wrapcell'},{k:'ech',t:'Échéance'},
                {k:'av',t:'Avancement'},{k:'st',t:'États',cls:'wrapcell'},{k:'nt',t:''}], rows) + form;
}

/* ─────────────────────────────────────────────────────────────────────────
   6. CONCLUSION, VISA, REPRISE N-1
   ───────────────────────────────────────────────────────────────────────── */
function obstaclesVisa(p){
  const st = sec(p.code), o = [];
  const bl = notesBloquantesOuvertes(p.code);
  if (bl.length) o.push(`${bl.length} note(s) de revue bloquante(s) ouverte(s)`);
  const fp = facteursProposes(p.code);
  if (fp.length) o.push(`${fp.length} facteur(s) de risque non statué(s)`);
  const fsm = facteursDe(p.code).filter(f => f.statut === 'ecarte' && !f.motif.trim());
  if (fsm.length) o.push(`${fsm.length} facteur(s) écarté(s) sans motif écrit`);
  for (const x of obstaclesTravaux(p.code)) o.push(x);
  let manq = 0, nonSaisis = 0, sansConcl = 0, ecarts = 0, nonAcheves = 0, perimes = 0;
  for (const pr of proceduresRequises(p)){
    if (!pr.ech){ if (!proc(p.code, pr.code).conclusion.trim()) sansConcl++; continue; }
    const wp = wpProc(p, pr) || [];
    manq += wp.filter(r => !ligneRecue(p, pr, r.cle)).length;
    const n = comptesEtats(controles(p, pr));
    nonSaisis += n.recue; ecarts += n.ecart;
    if (!proc(p.code, pr.code).conclusion.trim()) sansConcl++;
    const t = trav('SEC-' + p.code + '-' + pr.code);
    if (t.statut !== 'acheve' && t.statut !== 'revu') nonAcheves++;
    if (peremption(p, pr)) perimes++;
  }
  if (manq) o.push(`${manq} élément(s) sans pièce justificative`);
  if (nonSaisis) o.push(`${nonSaisis} contrôle(s) non exécuté(s) alors que la pièce est reçue`);
  if (ecarts) o.push(`${ecarts} écart(s) sans résolution probante`);
  if (sansConcl) o.push(`${sansConcl} procédure(s) sans conclusion`);
  if (nonAcheves) o.push(`${nonAcheves} procédure(s) dont le testing n’est pas déclaré terminé`);
  if (perimes) o.push(`${perimes} papier(s) exécuté(s) sur une version antérieure du fichier — à reconfirmer`);
  const sansMotif = p.comptes.filter(c => st.ns[c] && !(st.nsMotif[c] || '').trim());
  if (sansMotif.length) o.push(`statut forcé sans motif sur ${sansMotif.join(', ')}`);
  const nivSansMotif = ASSERTIONS.filter(a => st.override[a.code] && !(st.overrideMotif[a.code] || '').trim());
  if (nivSansMotif.length) o.push(`niveau de risque forcé sans motif (${nivSansMotif.map(a => a.lib).join(', ')})`);
  if (!st.conclusion.trim()) o.push('conclusion de section non rédigée');
  const n1 = (PAPIERS_N1[p.code] || []).filter(x => !st.reprisN1Vues[x.id]);
  if (n1.length) o.push(`${n1.length} papier(s) N-1 non reconfirmé(s)`);
  return o;
}
function blocConclusion(p){
  const st = sec(p.code), o = obstaclesVisa(p), n1 = PAPIERS_N1[p.code] || [];
  const notesN1 = NOTES_N1.filter(n => n.section === p.code);
  return `
    <h3>Reprise de l’exercice précédent</h3>
    ${n1.length || notesN1.length ? `
      ${n1.map(x => `<div class="nl n1">
        <div class="m"><span class="mono">${x.id}</span> · exercice 2024
          ${st.reprisN1Vues[x.id] ? '<span class="pill">reconfirmé</span>' : '<span class="pill warn">à reconfirmer</span>'}</div>
        <div class="txt"><b>${esc(x.lib)}</b> — ${esc(x.concl)}</div>
        ${st.reprisN1Vues[x.id] ? `<div class="smallcaps">${esc(st.reprisN1Vues[x.id])}</div>`
          : `<button class="btn mini sec" data-n1="${x.id}">reconfirmer pour 2025</button>`}
      </div>`).join('')}
      ${notesN1.map(n => `<div class="nl ${TYPES_NOTE[n.type].cls}" style="opacity:.8">
        <div class="m"><span class="tag">note N-1</span> ${TYPES_NOTE[n.type].lib}</div>
        <div class="txt">${esc(n.texte)}</div></div>`).join('')}
    ` : '<p class="note">Aucun travail N-1 enregistré sur cette section.</p>'}

    <h3>Conclusion de section</h3>
    <textarea id="sec-concl" rows="3" placeholder="conclusion de l’auditeur sur le poste, au regard des procédures exécutées et des écarts relevés">${esc(st.conclusion)}</textarea>
    ${boutonNote(p.code, 'conclusion', 'concl', 'Conclusion de la section ' + p.lib)}

    <h3>Visa</h3>
    ${st.visa ? `<div class="callout"><b>Section visée</b> par ${esc(USERS[st.visa.par].nom)}
        (${ROLE_LIB[USERS[st.visa.par].role]}) le ${horo(st.visa.t)}.
        <button class="btn mini sec" id="sec-devisa">retirer le visa</button></div>`
      : o.length ? `<div class="callout bad"><b>${o.length} obstacle(s) :</b>
          <ul style="margin:5px 0 0 16px;padding:0">${o.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
          <button class="btn" disabled>viser la section</button>`
      : `<button class="btn" id="sec-visa">viser la section — engage ${esc(USERS[S.moi].nom)}</button>`}`;
}

/* ─────────────────────────────────────────────────────────────────────────
   ASSEMBLAGE
   ───────────────────────────────────────────────────────────────────────── */
function vueFsli(code){
  const p = postesCalcules().find(x => x.code === code);
  if (!p) return '<p class="note">Poste inconnu.</p>';
  const s = seuils(), procs = proceduresRequises(p), st = sec(p.code), o = obstaclesVisa(p);
  const ouvertKey = S.procOuverte && S.procOuverte.startsWith(p.code + '/') ? S.procOuverte.slice(p.code.length + 1) : null;
  const prOuverte = procs.find(x => x.code === ouvertKey) || null;
  // signature : la référence du papier, en chasse fixe, coin supérieur droit
  const bloc = (n, titre, ref, html) => `<section class="blk" id="b${n}">
      <header><span class="num">${n}</span><h2>${esc(titre)}</h2><span class="why">${esc(ref)}</span></header>
      <div class="body">${html}</div></section>`;
  const nSel = procs.filter(x => x.ech).length;
  return `
    <div class="hd">
      <h1>${esc(p.lib)}</h1>
      <span class="pill">${esc(MASSE_LIB[masseDe(p)])}</span>
      <span class="pill ${NIVEAUX[niveauMax(p)] === 'eleve' ? 'bad' : NIVEAUX[niveauMax(p)] === 'moyen' ? 'warn' : ''}">risque ${NIV_LIB[NIVEAUX[niveauMax(p)]]}</span>
      ${st.visa ? '<span class="pill">visée</span>' : `<span class="pill ${o.length ? 'bad' : 'warn'}">${o.length ? o.length + ' obstacle(s)' : 'prête à viser'}</span>`}
      <span class="sub">solde ${eur(p.solde)} · ${p.comptes.length} compte(s) · ${procs.length} procédure(s) · ${nSel} sélection(s)</span>
    </div>
    ${S.affErreur ? `<div class="callout bad">${esc(S.affErreur)}</div>` : ''}
    ${(() => { const vp = visaPerime(p.code); return vp ? `<div class="callout bad">
      <b>Visa posé sur la version ${vp.de} du fichier ; le dossier est à la version ${vp.a}.</b>
      Le visa n’est pas effacé — il est remis en cause : il engage ${esc(USERS[sec(p.code).visa.par].nom)}
      sur des travaux qui ne portent plus sur le même fichier. Reconfirmez les travaux touchés, puis le visa.
      <button class="btn mini sec" id="sec-devisa">retirer le visa</button></div>` : ''; })()}
    ${bloc(1, 'Comptes de la section', p.code + '-CPT-01', blocComptes(p))}
    ${bloc(2, 'Évaluation du risque par assertion', p.code + '-RSQ-01', blocRisque(p))}
    ${bloc(3, 'Plan de travail', p.code + '-PGM-01', blocPlan(p) + blocSuiviSection(p))}
    ${prOuverte ? bloc(4, 'Procédure : ' + prOuverte.lib, procRef(p, prOuverte), blocProcedure(p, prOuverte))
      : (procs.filter(x => x.ech).length
        ? `<section class="blk" id="b4"><header><span class="num">4</span><h2>Procédure</h2></header>
           <div class="body"><p class="note">Ouvrez une procédure dans le plan de travail ci-dessus pour voir sa population,
           sa sélection et son papier.</p></div></section>` : '')}
    ${bloc(5, 'Requêtes de la section', p.code + '-REQ-01', blocRequetes(p))}
    ${bloc(6, 'Notes de revue de la section', p.code + '-NDR-01', blocNotesSection(p.code))}
    ${bloc(7, 'Conclusion, visa et reprise N-1', p.code + '-CCL-01', blocConclusion(p))}`;
}

/* ── avancement des justificatifs de la section ───────────────────────────
   Les cinq états dérivés du papier de travail, agrégés. L'affectation et les
   heures ne sont PAS ici : elles vivent au programme de travail, une seule
   fois. Ce que la section montre, c'est où en sont les pièces. */
function blocSuiviSection(p){
  const t = avancementSection(p);
  if (!t.total) return '';
  const procs = proceduresRequises(p).filter(x => x.ech);
  return `<h3>Avancement des justificatifs</h3>
    ${bandeauAvancement(t)}
    ${table([{k:'pr',t:'Procédure',cls:'wrapcell'},{k:'e',t:'Éléments',n:1},{k:'r',t:'Avec pièce',n:1},
             ...ETATS_LIGNE.map(x => ({ k:x.id, t:x.lib, n:1 })), {k:'st',t:'Travail'}],
      procs.map(pr => {
        const ctr = controles(p, pr), n = comptesEtats(ctr), wp = wpProc(p, pr) || [];
        const st = trav('SEC-' + p.code + '-' + pr.code);
        const row = { pr:esc(pr.lib) + '<div class="smallcaps">' + esc(procRef(p, pr)) + '</div>',
                      e:String(wp.length), r:String(wp.filter(x => ligneRecue(p, pr, x.cle)).length),
                      st:`<span class="pill ${st.statut === 'a_faire' ? 'warn' : ''}">${esc(STATUT_TRAVAIL[st.statut])}</span>` };
        for (const x of ETATS_LIGNE) row[x.id] = x.id === 'ecart' && n[x.id]
          ? `<span style="color:var(--anomalie)">${n[x.id]}</span>` : String(n[x.id]);
        return row;
      }),
      { foot:{ pr:'Total', e:String(t.elements), r:String(t.recus),
               ...Object.fromEntries(ETATS_LIGNE.map(x => [x.id, String(t[x.id])])) } })}
    <p class="note">Aucun de ces nombres n’est saisi : « avec pièce » se lit sur les dépôts du portail,
    les cinq états se déduisent de la pièce, de la valeur relevée et de la résolution documentée.
    L’affectation et les heures de ces travaux se tiennent au
    <a data-vue="trav.programme" style="cursor:pointer">programme de travail</a>, une seule fois.</p>`;
}
/* ═══ 12. NOTES DE REVUE — INTERFACE ═══════════════════════════════════════
   Il n'existe aucun chemin pour créer une note flottante : le bouton porte
   toujours l'objet sur lequel la note se pose, et c'est cet objet qui est
   enregistré dans l'ancre.
   ═══════════════════════════════════════════════════════════════════════ */
function boutonNote(section, objet, ref, lib){
  const n = notesDe(section, objet, ref), ouvertes = n.filter(x => !x.clos);
  const bl = ouvertes.some(x => TYPES_NOTE[x.type].bloque);
  return `<button class="note-i ${ouvertes.length ? 'has' : ''}"
    data-note-cible="${esc(section)}|${esc(objet)}|${esc(String(ref))}|${esc(lib)}"
    title="${ouvertes.length ? ouvertes.length + ' note(s) ouverte(s)' : 'poser une note de revue sur cet objet'}"
    >${bl ? '⚑' : '✎'}${n.length ? ' ' + n.length : ''}</button>`;
}

function ligneNote(n, contexte){
  const t = TYPES_NOTE[n.type], u = USERS[n.auteur], pour = USERS[n.pour];
  const peut = peutClore(S.moi, n);
  const age = ancienneteNote(n);
  return `<div class="nl ${t.cls} ${n.clos ? 'clos' : ''}" data-note="${n.id}">
    <div class="m">
      <span class="tag ${t.bloque ? 'abs' : ''}">${esc(t.lib)}</span>
      <span class="mono">#${n.id}</span>
      <span>${esc(u.nom)} → ${esc(pour ? pour.nom : '—')}</span>
      <span>${horo(n.t)}</span>
      ${!n.clos ? `<span class="pill ${age >= 10 ? 'bad' : age >= 5 ? 'warn' : ''}">${age} j ouvrés</span>` : ''}
      ${n.recurrente ? '<span class="pill warn">récurrente — déjà relevée en N-1</span>' : ''}
      ${n.clos ? `<span class="pill">close par ${esc(USERS[n.clos.par].nom)} le ${horo(n.clos.t)}</span>` : ''}
      ${contexte ? `<button class="btn mini sec" data-goanc="${n.id}">${esc(n.ancre.lib)} ↗</button>`
                 : `<span class="smallcaps">sur : ${esc(n.ancre.lib)}</span>`}
    </div>
    <div class="txt">${esc(n.texte)}</div>
    ${n.reponses.map(r => `<div class="rep"><b>${esc(USERS[r.par].nom)}</b>
        <span class="smallcaps">${horo(r.t)}</span> — ${esc(r.texte)}</div>`).join('')}
    ${n.clos ? '' : `<div class="row" style="margin:6px 0 0">
      <div class="ctrl" style="flex:1 1 240px"><input type="text" class="cell txt" data-rep="${n.id}"
        placeholder="répondre en tant que ${esc(USERS[S.moi].nom)}" style="border-color:var(--line)"></div>
      <button class="btn mini sec" data-repok="${n.id}">répondre</button>
      ${peut ? `<button class="btn mini" data-clos="${n.id}">clore</button>`
             : `<span class="smallcaps">clôture réservée au réviseur${n.auteur === S.moi ? ' — et jamais à l’auteur de la note' : ''}</span>`}
    </div>`}
  </div>`;
}
/** Ancienneté d'une note, en jours ouvrés depuis sa création. */
function ancienneteNote(n){
  let d = n.t.slice(0, 10), k = 0;
  while (d < S.aujourdhui){ d = addDays(d, 1); if (!isWeekend(d) || S.portail.samediOuvre) k++; }
  return k;
}

function blocNotesSection(code){
  const list = S.notes.filter(n => n.ancre.section === code);
  const ouvertes = list.filter(n => !n.clos);
  const c = S.noteCible && S.noteCible.section === code ? S.noteCible : null;
  return `
    ${c ? `<div class="callout" style="margin-top:8px">
      <b>Nouvelle note sur :</b> ${esc(c.lib)}
      <div class="row" style="margin:7px 0 0">
        <div class="ctrl"><label>Type</label><select id="nt-type">
          ${Object.entries(TYPES_NOTE).map(([k, v]) => `<option value="${k}">${esc(v.lib)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>À l’attention de</label><select id="nt-pour">
          ${Object.entries(USERS).filter(([k]) => k !== S.moi).map(([k, u]) => `<option value="${k}">${esc(u.nom)} — ${esc(ROLE_LIB[u.role])}</option>`).join('')}</select></div>
        <div class="ctrl" style="flex:1 1 300px"><label>Note</label>
          <input type="text" id="nt-txt" placeholder="ce qui doit être corrigé, documenté ou expliqué"></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn" id="nt-add">poser la note</button></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn sec" id="nt-annul">annuler</button></div>
      </div></div>`
      : '<p class="note">Bouton ✎ en regard de l’objet, dans n’importe quel bloc ci-dessus.</p>'}
    ${list.length ? `<div style="margin-top:8px">
        <div class="row"><span class="pill ${ouvertes.length ? 'warn' : ''}">${ouvertes.length} ouverte(s)</span>
          <span class="pill">${list.length - ouvertes.length} close(s)</span>
          ${notesBloquantesOuvertes(code).length ? `<span class="pill bad">${notesBloquantesOuvertes(code).length} bloquante(s) — visa impossible</span>` : ''}</div>
        ${list.map(n => ligneNote(n, false)).join('')}</div>`
      : '<p class="note">Aucune note sur cette section.</p>'}`;
}

/* ── vue transverse : la vraie vue de travail d'un chef de mission ───────── */
function vueNotes(){
  const ouvertes = S.notes.filter(n => !n.clos);
  const parPersonne = {};
  for (const n of ouvertes){ (parPersonne[n.pour] = parPersonne[n.pour] || []).push(n); }
  const parType = {};
  for (const n of ouvertes){ (parType[n.type] = parType[n.type] || []).push(n); }
  const parSection = {};
  for (const n of ouvertes){ (parSection[n.ancre.section] = parSection[n.ancre.section] || []).push(n); }
  const libSection = c => (POSTES.find(p => p.code === c) || {}).lib || c;
  const tri = [...ouvertes].sort((a, b) => {
    const bl = (TYPES_NOTE[b.type].bloque ? 1 : 0) - (TYPES_NOTE[a.type].bloque ? 1 : 0);
    return bl || (ancienneteNote(b) - ancienneteNote(a));
  });
  return `
    <div class="hd"><h1>Notes de revue — vue transverse</h1>
      <span class="sub">toutes les notes ouvertes du dossier, par responsable, ancienneté, type et section</span></div>
    <section class="blk"><header><h2>Répartition</h2></header><div class="body">
      <div class="grid3">
        <div><h3>Par responsable</h3>${Object.keys(USERS).map(u => {
          const l = parPersonne[u] || [], b = l.filter(n => TYPES_NOTE[n.type].bloque).length;
          return `<div class="kv"><span class="k">${esc(USERS[u].nom)}</span>
            <span class="v">${l.length}${b ? ' · ' + b + ' bloquante(s)' : ''}</span></div>`; }).join('')}</div>
        <div><h3>Par type</h3>${Object.entries(TYPES_NOTE).map(([k, v]) =>
          `<div class="kv"><span class="k">${esc(v.lib)}</span><span class="v">${(parType[k] || []).length}</span></div>`).join('')}</div>
        <div><h3>Par section</h3>${Object.keys(parSection).length
          ? Object.entries(parSection).map(([c, l]) => `<div class="kv"><span class="k">${esc(libSection(c))}</span>
              <span class="v">${l.length}</span></div>`).join('')
          : '<p class="note">Aucune.</p>'}</div>
      </div>
      ${ouvertes.filter(n => n.recurrente).length ? `<div class="callout warn" style="margin-top:10px">
        <b>${ouvertes.filter(n => n.recurrente).length} note(s) récurrente(s)</b> — même section et même type qu’en N-1.</div>` : ''}
    </div></section>
    <section class="blk"><header><h2>Notes ouvertes — bloquantes d’abord, puis les plus anciennes</h2>
      <span class="why">${ouvertes.length} note(s)</span></header><div class="body">
      ${tri.length ? tri.map(n => ligneNote(n, true)).join('')
        : '<p class="note">Aucune note ouverte sur le dossier.</p>'}
    </div></section>
    <section class="blk"><header><h2>Clôture du dossier</h2></header><div class="body">
      ${notesBloquantesOuvertes().length
        ? `<div class="callout bad"><b>Clôture impossible.</b> ${notesBloquantesOuvertes().length} note(s) bloquante(s)
            restent ouvertes : ${notesBloquantesOuvertes().map(n => '#' + n.id + ' (' + esc(n.ancre.lib) + ')').join(', ')}.
</div>
           <button class="btn" disabled>clôturer le dossier</button>`
        : `<div class="callout">Aucune note bloquante ouverte.</div>
           <button class="btn" id="clore-dossier" ${S.dossierClos ? 'disabled' : ''}>${S.dossierClos ? 'dossier clôturé' : 'clôturer le dossier'}</button>`}
    </div></section>`;
}
/* ═══ 13. PORTAIL CLIENT ═══════════════════════════════════════════════════
   Un environnement distinct, pas un filtre d'affichage. Deux différences
   structurelles avec l'espace auditeur :
     · les seuils n'y sont jamais rendus — le client n'a pas à connaître la
       matérialité, et ce n'est pas une case à décocher : le bandeau de seuils
       n'est tout simplement pas construit dans cet espace ;
     · le statut interne « en attente de revue par X » est replié avant
       affichage par statutVisibleClient() — le client ne peut pas déduire
       l'avancement du dossier d'audit.
   ═══════════════════════════════════════════════════════════════════════ */

/** Requêtes visibles par le contact connecté. Le référent général voit tout. */
function requetesVisiblesClient(){
  const c = contactCourant();
  return S.requetes.filter(r => c.role === 'referent_general' || r.contact === c.id);
}

function vueClientDemandes(){
  const c = contactCourant(), rs = requetesVisiblesClient();

  return `

}

const CLI_PAR_PAGE = 15;
function carteRequeteClient(r){
  const tousDeposes = r.items.every(i => i.statut !== 'non_recu' && i.statut !== 'partiel');
  const ret = retard(r);
  // une sélection d'audit peut compter plus de cent éléments : on en affiche une
  // page à la fois. Rien n'est masqué — le compte total est écrit, et le reste
  // s'ouvre d'un bouton.
  const tout = S.cliTout && S.cliTout[r.id];
  const restants = r.items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel');
  const vus = tout ? r.items : (restants.length > CLI_PAR_PAGE ? restants.slice(0, CLI_PAR_PAGE)
                                                               : r.items.slice(0, Math.max(CLI_PAR_PAGE, restants.length)));
  return `<section class="blk">
    <header><span class="num">${r.id}</span><h2>${esc(r.titre)}</h2>
      <span class="why">à fournir avant le ${frDate(r.echeance)}${ret ? ' — en retard de ' + ancienneteRetard(r) + ' jours ouvrés' : ''}</span></header>
    <div class="body">
      ${r.items.length > vus.length ? `<div class="row"><span class="pill">${r.items.length} demandés</span>
        <span class="pill">${r.items.length - restants.length} déposés</span>
        <span class="pill warn">${restants.length} restants</span>
        <button class="btn mini sec" data-clitout="${r.id}">tout afficher</button></div>` : ''}
      ${vus.map(i => {
        const v = statutVisibleClient(i);
        return `<div class="cli-item">
          <div class="g"><b>${esc(i.desc)}</b>
            ${i.depots.length ? `<div class="dep">Déposé : ${i.depots.map(d => `<span class="f">${esc(d.nom)}</span>`).join('')}
              <div>Accusé de réception — ${i.depots.map(d => horo(d.t)).join(', ')}</div></div>` : ''}
          </div>
          <div class="a">
            <span class="pill ${STATUTS[v].cls}">${STATUTS[v].lib}</span>
            <button class="btn mini sec" data-depot="${r.id}|${i.id}">déposer un document</button>
          </div>
        </div>`;
      }).join('')}
      ${tout && r.items.length > CLI_PAR_PAGE ? `<button class="btn mini sec" data-clitout="${r.id}" style="margin-top:8px">replier la liste</button>` : ''}
      <div class="row" style="margin:10px 0 0">
        ${r.clotureClient
          ? '<span class="pill">vous avez signalé que tout est déposé</span>'
          : `<button class="btn" data-clot="${r.id}" ${tousDeposes ? '' : 'disabled'}>tout est déposé</button>
             ${tousDeposes ? '' : '<span class="smallcaps">le bouton s’active quand chaque élément a reçu au moins un document</span>'}`}
      </div>
      <div class="msg">
        <h3>Échanges sur cette demande</h3>
        ${r.messages.length ? r.messages.map(m => `<div class="m ${m.cote}">
            <span class="w">${esc(m.par)} · ${horo(m.t)}</span>${esc(m.texte)}</div>`).join('')
          : '<p class="note">Aucun message.</p>'}
        <div class="row" style="margin:8px 0 0">
          <div class="ctrl" style="flex:1 1 300px"><input type="text" data-msg="${r.id}" placeholder="écrire à l’équipe d’audit"></div>
          <button class="btn sec" data-msgok="${r.id}">envoyer</button>
        </div>
      </div>
    </div></section>`;
}

/* ═══ 14. PÉRIMÈTRE ET SYNTHÈSE ════════════════════════════════════════════ */
function postesEnPerimetre(){
  const s = seuils();
  return postesCalcules().filter(p =>
    (S.scopingOverride[p.code] || (Math.abs(p.solde) >= s.PM ? 'in' : 'out')) === 'in');
}

/** Écarts nés hors papier de travail : rapprochement et test des écritures.
 *  Ils passent par le MÊME casier de résolution que les écarts de papier.
 *  Les phrases ci-dessous sont des explications REÇUES du client : elles sont
 *  enregistrées comme telles, et à elles seules elles ne résolvent rien. */
function ecartsHorsPapier(){
  const out = [];
  for (const r of rapprochement()) if (r.ecart !== 0 && r.sTB - r.sGL > 0)
    out.push({ ref:'rappro|' + r.compte, cle:r.compte, src:'Rapprochement', objet:'rappro', vue:'plan.rappro',
      lib:'Écriture de situation non reprise au fichier des écritures — compte ' + r.compte,
      constate:r.ecart, section:null,
      explRecue:'Écriture de situation passée après la transmission du fichier des écritures.' });
  const parTag = t => lg().entries.filter(e => e.tag === t);
  const dupe = parTag('A1');
  if (dupe.length === 2) out.push({ ref:'je|' + dupe[1].num, cle:dupe[1].num, src:'Test des écritures',
    objet:'je', vue:'plan.je', lib:'Même facture comptabilisée deux fois (' + dupe[0].pieceRef + ')',
    constate:dupe[1].lines[0].debit, section:null,
    explRecue:'Doublon d’intégration reconnu par le client ; extourne non comptabilisée à date.' });
  for (const e of parTag('A5')) out.push({ ref:'je|' + e.num, cle:e.num, src:'Test des écritures',
    objet:'je', vue:'plan.je', lib:'Produit de 2026 rattaché à 2025 (' + e.pieceRef + ')',
    constate:e.lines[0].debit, section:null,
    explRecue:'Facture datée du ' + frDate(e.pieceDate) + ', comptabilisée le ' + frDate(e.date) + '.' });
  for (const e of parTag('A6')) out.push({ ref:'je|' + e.num, cle:e.num, src:'Test des écritures',
    objet:'je', vue:'plan.je', lib:'Écriture manuelle de direction (' + e.pieceRef + ')',
    constate:e.lines[0].debit, section:null,
    explRecue:'Prestation démarrant en janvier 2026 selon l’explication reçue.' });
  return out;
}

/** Anomalies : elles ne sont pas saisies, elles AGRÈGENT ce que les sections
 *  ont produit — écarts de papiers de travail, écart de rapprochement,
 *  écritures relevées au test des écritures. Chacune porte son écart
 *  CONSTATÉ, la part EXPLIQUÉE par une résolution probante et le RÉSIDUEL.
 *  Seul le résiduel entre au cumul ; le triage sous/au-dessus du seuil de
 *  remontée se fait, lui, sur le constaté : une résolution change ce qui est
 *  cumulé, pas la taille de ce qui a été relevé. */
function anomalies(){
  const s = seuils(), out = [];
  const pousser = (o, d) => out.push({ ...o, constate:d.constate, explique:d.explique,
    montant:d.residuel, acquis:d.acquis, res:d.res, manques:d.manques,
    souSeuil:Math.abs(d.constate) < s.CTT });
  for (const p of postesEnPerimetre()){
    for (const pr of proceduresRequises(p)){
      for (const c of ecartsChiffresProc(p, pr)){
        pousser({ src:p.lib + ' · ' + procRef(p, pr),
                  lib:c.ch.lib + ' — ' + (c.ligne.x.e ? 'pièce ' + c.ligne.x.e.pieceRef : c.ligne.cle)
                     + ' (' + c.doc.toLowerCase() + ')',
                  section:p.code, objet:'papier', ref:c.ligne.cle, vue:'fsli:' + p.code,
                  piece:c.ligne.x.e ? c.ligne.x.e.pieceRef : null,
                  cleRes:p.code + '#' + pr.code + '#' + c.cle }, residuel(c));
      }
    }
  }
  for (const x of ecartsHorsPapier())
    pousser({ ...x, cleRes:'hors#' + x.ref }, residuelR(x.constate, resolHors(x.ref, x.explRecue)));
  return out;
}

/** Une même pièce touche deux comptes : une facture de vente est relevée dans
 *  la section « Clients » ET dans la section « Chiffre d'affaires ». Le même
 *  fait entre alors DEUX fois au cumul alors qu'il ne fausse les comptes
 *  qu'une fois. Rien n'est déduit d'office : la qualification « déjà cumulée »
 *  existe pour cela, et c'est l'auditeur qui choisit le côté qui reste. */
function doublesCumul(){
  const parPiece = {};
  for (const a of anomalies()){
    if (!a.piece || a.souSeuil) continue;
    (parPiece[a.piece] = parPiece[a.piece] || []).push(a);
  }
  return Object.entries(parPiece)
    .map(([piece, l]) => ({ piece, l, comptees:l.filter(x => x.montant !== 0).length,
                            montant:l.reduce((t, x) => t + x.montant, 0) }))
    .filter(x => x.comptees > 1);
}

/** Le bloc de résolution rendu là où l'écart naît — jamais dans la synthèse,
 *  qui n'est qu'un agrégat et ne doit rien porter de saisi. */
function blocEcartsHors(objet){
  const l = ecartsHorsPapier().filter(x => x.objet === objet);
  if (!l.length) return '';
  const d = l.map(x => residuelR(x.constate, resolHors(x.ref, x.explRecue)));
  const cumul = d.reduce((a, x) => a + x.residuel, 0);
  return blk('Écarts relevés et leur résolution', l.length + ' écart(s)',
    `<div class="row">
      <span class="pill">constaté ${eur(l.reduce((a, x) => a + x.constate, 0))}</span>
      <span class="pill">expliqué ${eur(d.reduce((a, x) => a + x.explique, 0))}</span>
      <span class="pill ${cumul ? 'bad' : ''}">résiduel porté au cumul ${eur(cumul)}</span>
    </div>
    <p class="note">Même contrainte que sur un papier de travail : une explication du client n’est pas un élément
    probant. Sans conclusion écrite, qualification, lien vers une pièce ou une écriture, auteur et date,
    l’écart reste entier au cumul des anomalies.</p>
    ${l.map(x => carteResolution('hors#' + x.ref,
        `<span class="mono">${esc(x.cle)}</span> · ${esc(x.lib)}`,
        x.constate, resolHors(x.ref, x.explRecue), null)).join('')}`);
}

/* Chaque panneau porte, en chasse fixe et en haut à droite, la référence du
   papier qu'il constitue — la convention que tout associé reconnaît.
   La référence est dérivée du titre : deux mots, trois lettres chacun. */
let _refSeq = {};
function refPapier(t){
  const k = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase()
    .replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(w => w.length > 2).slice(0, 2)
    .map(w => w.slice(0, 3)).join('-') || 'GEN';
  _refSeq[k] = (_refSeq[k] || 0) + 1;
  return k + '-' + String(_refSeq[k]).padStart(2, '0');
}
function blk(t, why, html){
  return `<section class="blk"><header><h2>${esc(t)}</h2>
    <span class="why">${esc(refPapier(t))}</span></header><div class="body">${html}</div></section>`;
}

/* ═══ 25. REGISTRE DES FACTEURS DE RISQUE ══════════════════════════════════
   Ce que doivent faire circuler les sections, ce ne sont pas des lignes de
   tableau : ce sont des CONSTATATIONS. Une constatation levée par une
   procédure — un écart de rapprochement, une écriture de direction, une
   pièce datée hors exercice — doit se poser SEULE sur les sections
   concernées, avec un lien vers sa source, sans ressaisie.

   Le facteur est un objet de première classe : source, nature, description,
   FSLI et assertions touchés, statut, effet retenu. Il n'est PAS un
   enregistrement figé : les candidats sont re-dérivés à chaque rendu par les
   règles ci-dessous (donc ils suivent la matérialité), tandis que la DÉCISION
   humaine — confirmé, écarté, effet retenu — est conservée par identifiant
   stable. Bouger un seuil ne perd jamais un arbitrage.

   GARDE-FOU. Trois cents alertes que personne ne lit, c'est le défaut
   classique de l'analyse de données en audit. Chaque règle porte donc un
   SEUIL DE PERTINENCE explicite et modifiable, le compteur de facteurs
   proposés est affiché en permanence, et la vue de triage alerte dès que le
   volume sort de l'ordre de la dizaine.
   ═══════════════════════════════════════════════════════════════════════ */

const CIBLE_VOLUME = 15;   // au-delà, le registre prévient qu'il devient du bruit

/** Postes touchés par un compte donné. */
function postesDuCompte(compte){
  return postesCalcules().filter(p => p.re.test(compte));
}

/* ── règles de levée ──────────────────────────────────────────────────────
   Chaque règle : un code, une source (procédure qui la lève et vue où la
   relire), un seuil de pertinence nommé, et une fonction qui rend des
   candidats. L'identifiant d'un candidat est stable : règle + clé métier.  */
const REGLES_FACTEUR = [
  {
    code:'RAPPRO', lib:'Écart de rapprochement balance ↔ grand livre non résolu',
    srcLib:'Rapprochement balance ↔ grand livre', srcVue:'plan.rappro',
    seuilLib:'écart minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const r of rapprochement()){
        if (Math.abs(r.ecart) < seuil * 100) continue;
        const postes = postesDuCompte(r.compte);
        if (!postes.length) continue;
        out.push({
          id:'RAPPRO:' + r.compte,
          description:`Le compte ${r.compte} « ${r.lib} » présente un écart de ${eur(r.ecart)} entre la balance `
                    + `transmise et le fichier des écritures. Tant qu’il n’est pas expliqué, le détail du poste `
                    + `n’est pas rapproché de son solde.`,
          cibles:postes.map(p => ({ fsli:p.code, assertions:['exhaustivite'] })),
          pertinence:`écart ${eur(Math.abs(r.ecart))} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'compte ' + r.compte,
        });
      }
      return out;
    },
  },
  {
    /* Chemin parcouru sur cette règle, parce qu'il dit ce que vaut le garde-fou.
       « La direction a saisi des écritures » : 62 écritures sur 1 605, réparties
       sur tous les postes → treize facteurs, c'est-à-dire du bruit pur.
       « … et porteuses d'un second marqueur » : encore onze.
       En regardant la distribution : douze postes entre 11 k€ et 244 k€, aucune
       coupure naturelle. Il n'y a pas de seuil ABSOLU défendable — le générateur
       attribue la saisie par la direction au hasard, donc il n'y a AUCUNE
       concentration à trouver. Choisir un montant qui « donne trois facteurs »
       aurait été régler le nombre, pas le critère.
       Le critère qui a un sens est donc RELATIF : la direction pèse-t-elle sur ce
       poste une part anormale de sa masse ? Sur ce jeu de données la réponse est
       non, et la règle ne lève rien — c'est le bon résultat. Une règle qui
       trouverait quelque chose ici serait une règle qui trouve toujours quelque
       chose. Baissez le seuil dans la vue de triage pour la voir se déclencher :
       c'est le compromis, et il est sous votre main. */
    code:'DIRECTION', lib:'Poids anormal des écritures de direction sur le poste',
    srcLib:'Test des écritures', srcVue:'plan.je',
    seuilLib:'part minimale de la masse du poste', seuilUnite:'%', seuilDefaut:() => 5, pas:0.5,
    nature:'qualitatif',
    calc(seuil){
      const marqueurs = [
        { lib:'journal d’opérations diverses', f:e => e.journal === 'OD' },
        { lib:'comptabilisée un week-end',     f:e => isWeekend(e.date) },
        { lib:'montant rond au millier',       f:e => { const m = e.lines[0].debit || e.lines[0].credit; return m >= 100000 && m % 100000 === 0; } },
        { lib:'validée après la clôture',      f:e => e.validDate > '2025-12-31' },
      ];
      const out = [];
      for (const p of postesCalcules()){
        const masse = statsPoste(p).masse;
        if (!masse) continue;
        const ecr = lg().entries.filter(e => e.lines.some(l => p.re.test(l.compte))
          && /direction/.test(e.saisiePar) && marqueurs.some(m => m.f(e)));
        if (!ecr.length) continue;
        const m = ecr.reduce((a, e) => a + (e.lines[0].debit || e.lines[0].credit), 0);
        const part = m / masse;
        // plancher absolu : un poste minuscule ne devient pas un risque parce
        // qu'une écriture y pèse proportionnellement beaucoup
        if (part < seuil / 100 || m < seuils().CTT) continue;
        const quels = [...new Set(ecr.flatMap(e => marqueurs.filter(x => x.f(e)).map(x => x.lib)))];
        out.push({
          id:'DIRECTION:' + p.code,
          description:`${ecr.length} écriture(s) saisies par la direction ET porteuses d’un second marqueur `
                    + `(${quels.join(', ')}) pèsent ${eur(m)}, soit ${pct(part, 1)} de la masse du poste `
                    + `(${eur(masse)}). La possibilité pour la direction de passer outre les contrôles est un `
                    + `facteur qualitatif : il ne se déduit d’aucun montant, mais il ne se lève que là où la `
                    + `concentration le justifie.`,
          cibles:[{ fsli:p.code, assertions:['realite'] }],
          pertinence:`${pct(part, 1)} de la masse ≥ seuil ${seuil}${NBSP}% (plancher ${eur(seuils().CTT)})`,
          srcRef:p.lib,
        });
      }
      return out;
    },
  },
  {
    code:'PIECE_HORS', lib:'Pièce datée hors exercice',
    srcLib:'Contrôle de forme du fichier des écritures', srcVue:'plan.rappro',
    /* Clé : la PIÈCE, pas le poste. Une facture de vente touche le chiffre
       d'affaires ET les créances : la keyer par poste dédoublait une seule
       constatation en deux facteurs portant le même texte. Une constatation,
       un facteur, plusieurs cibles. */
    seuilLib:'écart minimal à la clôture', seuilUnite:'jours', seuilDefaut:() => 1, pas:1,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const e of lg().entries){
        if (!e.pieceDate) continue;
        const jours = e.pieceDate > '2025-12-31'
          ? Math.round((Date.parse(e.pieceDate) - Date.parse('2025-12-31')) / 86400000)
          : e.pieceDate < '2025-01-01'
            ? Math.round((Date.parse('2025-01-01') - Date.parse(e.pieceDate)) / 86400000) : 0;
        if (jours < seuil) continue;
        const postes = [...new Set(e.lines.flatMap(l => postesDuCompte(l.compte).map(p => p.code)))];
        if (!postes.length) continue;
        out.push({
          id:'PIECE_HORS:' + e.pieceRef,
          description:`La pièce ${e.pieceRef} porte la date du ${frDate(e.pieceDate)}, soit ${jours} jour(s) hors `
                    + `de l’exercice, alors que l’écriture ${e.num} est comptabilisée le ${frDate(e.date)} `
                    + `(${eur(e.lines[0].debit || e.lines[0].credit)}). Indice de rattachement au mauvais exercice.`,
          cibles:postes.map(c => ({ fsli:c, assertions:['separation'] })),
          pertinence:`${jours} jour(s) hors exercice ≥ seuil ${seuil}`,
          srcRef:'pièce ' + e.pieceRef,
        });
      }
      return out;
    },
  },
  {
    code:'JE_ANOMALIE', lib:'Écriture particulière relevée au test des écritures',
    srcLib:'Test des écritures', srcVue:'plan.je',
    seuilLib:'montant minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const LIB = { A1:['réalité', 'realite', 'Même facture comptabilisée deux fois'],
                    A5:['séparation des exercices', 'separation', 'Produit de 2026 rattaché à 2025'],
                    A6:['réalité', 'realite', 'Écriture manuelle de direction en fin d’exercice'] };
      const out = [], vus = new Set();
      for (const e of lg().entries){
        if (!e.tag || !LIB[e.tag]) continue;
        const cle = e.tag + '/' + e.pieceRef;
        if (vus.has(cle)) continue;          // une constatation, un facteur
        vus.add(cle);
        const m = e.lines[0].debit || e.lines[0].credit;
        if (m < seuil * 100) continue;
        const comptes = e.lines.map(l => l.compte);
        const postes = [...new Set(comptes.flatMap(c => postesDuCompte(c).map(p => p.code)))];
        if (!postes.length) continue;
        out.push({
          id:'JE_ANOMALIE:' + e.num,
          description:`${LIB[e.tag][2]} — écriture ${e.num}, pièce ${e.pieceRef}, ${eur(m)}. Relevée par les `
                    + `critères de sélection des écritures, elle porte sur ce poste.`,
          cibles:postes.map(c => ({ fsli:c, assertions:[LIB[e.tag][1]] })),
          pertinence:`${eur(m)} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'écriture ' + e.num,
        });
      }
      return out;
    },
  },
  {
    /* Deuxième fois que le même piège se referme, et de la même façon.
       Premier essai : « variation ≥ 3 × le seuil de planification ». Résultat,
       cinq facteurs — dont une HAUSSE DE 1,7 % DU CHIFFRE D'AFFAIRES. Sur un
       compte de 5 M€, trois fois le seuil est un mouvement ordinaire ; le
       multiple absolu ne mesure que la taille du compte.
       Ce qui rend une variation inhabituelle, c'est son ampleur RELATIVE à ce
       que le compte pèse. La règle exige donc les deux : un montant qui compte
       (au moins le seuil de planification, sinon on parle de bruit) ET une
       déformation du compte au-delà du taux réglé ci-contre. Une croissance de
       1,7 % ne lève plus rien ; un compte qui double, oui. */
    code:'RA_PRELIM', lib:'Variation d’ampleur inhabituelle à la revue analytique préliminaire',
    srcLib:'Revue analytique préliminaire', srcVue:'plan.ra',
    seuilLib:'déformation minimale du compte', seuilUnite:'%', seuilDefaut:() => 25, pas:5,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const l of revueAnalytique()){
        if (Math.abs(l.d) < seuils().PM) continue;              // plancher : le montant doit compter
        if (l.p === null || Math.abs(l.p) < seuil / 100) continue;  // et la déformation doit être réelle
        const postes = postesDuCompte(l.compte);
        if (!postes.length) continue;
        const k = sensNaturel(l), sens = l.d * k > 0 ? 'augmentation' : 'diminution';
        out.push({
          id:'RA_PRELIM:' + l.compte,
          description:`Le compte ${l.compte} « ${l.lib} » présente une ${sens} de ${eur(Math.abs(l.d))}, soit `
                    + `${pct(Math.abs(l.p), 1)} de son solde de l’exercice précédent (${eur(Math.abs(l.n1))}). `
                    + `Une déformation de cette ampleur oriente les travaux avant même leur programmation.`,
          cibles:postes.map(x => ({ fsli:x.code, assertions:['realite', 'presentation'] })),
          pertinence:`${pct(Math.abs(l.p), 1)} de déformation ≥ seuil ${seuil}${NBSP}% · montant ${eur(Math.abs(l.d))} ≥ plancher ${eur0(seuils().PM)}`,
          srcRef:'compte ' + l.compte,
        });
      }
      return out;
    },
  },
  {
    code:'CIRC', lib:'Compte en comptabilité absent du listing à circulariser',
    srcLib:'Exhaustivité des circularisations', srcVue:'plan.circ',
    seuilLib:'solde minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const b of exhaustiviteBanques()){
        if (b.declare || Math.abs(b.solde) < seuil * 100) continue;
        const postes = postesDuCompte(b.compte);
        if (!postes.length) continue;
        out.push({
          id:'CIRC:' + b.compte,
          description:`Le compte ${b.compte} « ${b.lib} » (${eur(b.solde)}) figure en comptabilité mais pas au `
                    + `listing des banques transmis par le client. Le périmètre des confirmations à demander `
                    + `n’est pas arrêté.`,
          cibles:postes.map(p => ({ fsli:p.code, assertions:['exhaustivite'] })),
          pertinence:`solde ${eur(Math.abs(b.solde))} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'compte ' + b.compte,
        });
      }
      return out;
    },
  },
];

const _regleCache = new Map();
/** Candidats d'une règle, mémoïsés sur (règle, seuil, seuils de la mission).
 *  Sans cela, le rail — qui interroge les obstacles au visa de chaque section —
 *  relançait le registre entier seize fois par rendu. */
function candidatsRegle(r){
  const s = seuils(), seuil = seuilRegle(r.code);
  const cle = r.code + '|' + seuil + '|' + s.PM + '|' + s.CTT;
  if (_regleCache.has(cle)) return _regleCache.get(cle);
  const v = r.calc(seuil);
  if (_regleCache.size > 200) _regleCache.clear();
  _regleCache.set(cle, v);
  return v;
}
function seuilRegle(code){
  const r = REGLES_FACTEUR.find(x => x.code === code);
  return S.seuilsFacteurs[code] !== undefined ? S.seuilsFacteurs[code] : r.seuilDefaut();
}

/** Registre complet : candidats re-dérivés + facteurs saisis à la main,
 *  chacun portant la décision humaine conservée par identifiant. */
let _regCache = null, _regCle = '';
function registre(){
  const sq = seuils();
  const cle = JSON.stringify([S.seuilsFacteurs, S.decisionsFacteurs, S.facteursManuels.length, sq.PM, sq.CTT]);
  if (_regCache && _regCle === cle) return _regCache;
  const out = [];
  for (const r of REGLES_FACTEUR){
    for (const c of candidatsRegle(r)){
      const d = S.decisionsFacteurs[c.id] || {};
      out.push({ ...c, regle:r.code, regleLib:r.lib, nature:r.nature,
                 source:{ lib:r.srcLib, vue:r.srcVue, ref:c.srcRef },
                 auto:true,
                 statut:d.statut || 'propose', motif:d.motif || '',
                 effet:d.effet || 'majore', par:d.par, t:d.t, cree:d.cree || S.premierRendu });
    }
  }
  for (const f of S.facteursManuels){
    const d = S.decisionsFacteurs[f.id] || {};
    out.push({ ...f, auto:false,
               statut:d.statut || 'propose', motif:d.motif || '',
               effet:d.effet || 'majore', par:d.par, t:d.t });
  }
  _regCache = out; _regCle = cle;
  return out;
}
function facteursDe(code){ return registre().filter(f => f.cibles.some(c => c.fsli === code)); }
function facteursProposes(code){ return facteursDe(code).filter(f => f.statut === 'propose'); }
/** Facteurs confirmés ET retenus comme majorants, sur une assertion donnée. */
function facteursRetenus(code, assertion){
  return registre().filter(f => f.statut === 'confirme' && f.effet === 'majore'
    && f.cibles.some(c => c.fsli === code && (assertion === undefined || c.assertions.includes(assertion))));
}
function statuerFacteur(id, statut, motif, effet){
  const f = registre().find(x => x.id === id); if (!f) return;
  S.decisionsFacteurs[id] = { statut, motif:motif || '', effet:effet || 'majore',
                              par:S.moi, t:tick(), cree:f.cree };
  logEvent('facteur de risque ' + (statut === 'confirme' ? 'confirmé' : statut === 'ecarte' ? 'écarté' : 'remis en attente'),
           id, (motif ? motif.slice(0, 80) : '') + (statut === 'confirme' ? ' · effet : ' + effet : ''));
}

/* ── rendu d'un facteur ───────────────────────────────────────────────────── */
const STATUT_FACTEUR = { propose:{ lib:'proposé', cls:'warn' }, confirme:{ lib:'confirmé', cls:'bad' },
                         ecarte:{ lib:'écarté', cls:'' } };
function libFsli(code){ return (POSTES.find(p => p.code === code) || {}).lib || code; }
function libAssertion(code){ return (ASSERTIONS.find(a => a.code === code) || {}).lib || code; }

/* ── bloc inséré dans l'évaluation du risque d'une section ────────────────── */
function blocFacteursSection(p){
  const l = facteursDe(p.code), props = l.filter(f => f.statut === 'propose');
  if (!l.length) return `<p class="note">Aucune constatation venue d’une autre procédure ne touche ce poste

    ${l.map(f => carteFacteur(f, true)).join('')}`;
}

/* ── vue de triage : point d'entrée unique ───────────────────────────────── */

/* ═══ 28. REVUE ANALYTIQUE — TROIS MOMENTS ═════════════════════════════════
   Ce ne sont pas trois affichages d'un même module : ce sont trois diligences
   différentes, à trois moments différents, avec trois finalités.
     · préliminaire — en planification, transverse, elle ALIMENTE le registre
       des facteurs de risque ;
     · substantive  — dans une section, comme procédure à valeur probante ;
     · finale       — à l'achèvement, cohérence d'ensemble avant signature.
   ═══════════════════════════════════════════════════════════════════════ */

/** Ratios calculés des deux exercices. Aucun n'est saisi. */
function ratios(){
  const q = (b, re) => { let s = 0; for (const [c, v] of b) if (re.test(c)) s += v.solde; return s; };
  const f = b => {
    const ca = -q(b, /^70/), achats = q(b, /^60/), perso = q(b, /^64/),
          stocks = q(b, /^3/), clients = q(b, /^41/), fourn = -q(b, /^40/),
          produits = -q(b, /^7/), charges = q(b, /^6/), fin = q(b, /^66/);
    return { ca, achats, perso, stocks, clients, fourn, resultat:produits - charges, fin };
  };
  const a = f(bal()), b = f(B24);
  const L = [
    { lib:'Marge sur achats consommés', u:'%', formule:'(chiffre d’affaires − achats consommés) ÷ chiffre d’affaires',
      n:a.ca ? (a.ca - a.achats) / a.ca : 0, n1:b.ca ? (b.ca - b.achats) / b.ca : 0, type:'pct' },
    { lib:'Poids des charges de personnel', u:'%', formule:'charges de personnel ÷ chiffre d’affaires',
      n:a.ca ? a.perso / a.ca : 0, n1:b.ca ? b.perso / b.ca : 0, type:'pct' },
    { lib:'Résultat courant rapporté au chiffre d’affaires', u:'%', formule:'résultat courant ÷ chiffre d’affaires',
      n:a.ca ? a.resultat / a.ca : 0, n1:b.ca ? b.resultat / b.ca : 0, type:'pct' },
    { lib:'Délai de règlement clients', u:'jours', formule:'créances clients ÷ chiffre d’affaires × 365',
      n:a.ca ? a.clients / a.ca * 365 : 0, n1:b.ca ? b.clients / b.ca * 365 : 0, type:'jours' },
    { lib:'Délai de règlement fournisseurs', u:'jours', formule:'dettes fournisseurs ÷ achats consommés × 365',
      n:a.achats ? a.fourn / a.achats * 365 : 0, n1:b.achats ? b.fourn / b.achats * 365 : 0, type:'jours' },
    { lib:'Rotation des stocks', u:'jours', formule:'stocks ÷ achats consommés × 365',
      n:a.achats ? a.stocks / a.achats * 365 : 0, n1:b.achats ? b.stocks / b.achats * 365 : 0, type:'jours' },
    { lib:'Couverture des charges financières', u:'×', formule:'résultat courant ÷ charges financières',
      n:a.fin ? a.resultat / a.fin : 0, n1:b.fin ? b.resultat / b.fin : 0, type:'fois' },
  ];
  return L.map(r => ({ ...r, d:r.n - r.n1,
    fmt:v => r.type === 'pct' ? pct(v, 1) : r.type === 'jours' ? v.toFixed(0).replace('.', ',') + NBSP + 'j'
           : v.toFixed(1).replace('.', ',') + NBSP + '×' }));
}

function vueRAPrelim(){

  const rt = ratios();

function soldeDe(comptes){ const b = bal(); return comptes.reduce((a, c) => a + (b.get(c) ? b.get(c).solde : 0), 0); }

    aide:'Le montant ne se lit dans aucun solde : il résulte du tableau de variation. Il doit être documenté.' },
  { ref:'A-02', lib:'Annexe — échéancier des dettes financières à plus d’un an', nature:'calcul',
    formule:'capital restant dû au 31/12/2025 diminué des échéances contractuelles des douze mois suivants',
    aide:'Le solde 164000 ne se ventile pas seul : la ventilation vient du tableau d’amortissement de l’emprunt.' },
  { ref:'A-03', lib:'Annexe — ventilation du chiffre d’affaires par nature', nature:'calcul',

];
function montantAudite(e){
  if (e.nature === 'calcul') return null;
  return Math.abs(soldeDe(e.comptes));
}
function montantPlaquette(e){
  const a = montantAudite(e);
  return a === null ? null : a + (e.ecart || 0);
}
const NATURE_LIB = { solde:'solde de balance', agregat:'agrégat de comptes', calcul:'calcul à documenter' };

function vueAchPointage(){
  const st = S.achevement;
  const rows = PLAQUETTE.map(e => {
    const aud = e.nature === 'calcul'
      ? (st.calculs[e.ref] && st.calculs[e.ref].montant !== undefined ? st.calculs[e.ref].montant : null)
      : montantAudite(e);
    const pl = e.nature === 'calcul'
      ? (st.plaquette[e.ref] !== undefined ? st.plaquette[e.ref] : null)
      : montantPlaquette(e);
    const ec = (aud === null || pl === null) ? null : pl - aud;
    return {
      ref:`<span class="mono">${e.ref}</span>`,
      lib:`<b>${esc(e.lib)}</b>${e.formule ? '<div class="smallcaps">' + esc(e.formule) + '</div>' : ''}`,
      nat:`<span class="tag ${e.nature === 'calcul' ? 'abs' : 'det'}">${NATURE_LIB[e.nature]}</span>`,
      pl:e.nature === 'calcul'
         ? `<input class="cell" data-plaq="${e.ref}" value="${pl === null ? '' : (pl / 100).toFixed(2).replace('.', ',')}" placeholder="montant plaquette">`
         : eur(pl),
      or:e.nature === 'calcul' ? '<span class="smallcaps">à documenter</span>'
         : `<span class="smallcaps">${e.comptes.join(' · ')}</span>`,
      aud:e.nature === 'calcul'
          ? `<input class="cell" data-calcm="${e.ref}" value="${aud === null ? '' : (aud / 100).toFixed(2).replace('.', ',')}" placeholder="montant audité">`
          : eur(aud),
      ec:ec === null ? '<span class="pill warn">non rapproché</span>'
         : ec === 0 ? '<span class="pill">nul</span>' : '<span class="pill bad">' + eur(ec) + '</span>',
      doc:e.nature === 'calcul'
          ? `<input class="cell txt" data-calcd="${e.ref}" value="${esc((st.calculs[e.ref] || {}).doc || '')}" placeholder="d’où vient le montant">`
          : '<span class="smallcaps">rapproché de la balance</span>',
    };
  });
  const nonRappro = PLAQUETTE.filter(e => {
    const aud = e.nature === 'calcul' ? (st.calculs[e.ref] || {}).montant : montantAudite(e);
    const pl = e.nature === 'calcul' ? st.plaquette[e.ref] : montantPlaquette(e);
    return aud === undefined || aud === null || pl === undefined || pl === null;
  });
  const ecarts = PLAQUETTE.filter(e => {
    const aud = e.nature === 'calcul' ? (st.calculs[e.ref] || {}).montant : montantAudite(e);
    const pl = e.nature === 'calcul' ? st.plaquette[e.ref] : montantPlaquette(e);
    return aud != null && pl != null && pl - aud !== 0;
  });
  const sansDoc = PLAQUETTE.filter(e => e.nature === 'calcul' && !((st.calculs[e.ref] || {}).doc || '').trim());
  return entete('Pointage des états financiers', 'plaquette à gauche, montant audité à droite, écart et origine') +
    cite('Une fonction pointage des états financiers et données chiffrées des annexes où après réception de la plaquette du client, un agent IA vient s’assurer que chaque chiffre cadre bien avec les montants que nous avons audité, dans notre TB et documente un réconciliation sur un Template intégré avec à gauche montant plaquette et à droite montant interne et validé avec une cross reference vers l’origine du montant validé.') +
    blk('Rapprochement', `${PLAQUETTE.length} montants · ${ecarts.length} écart(s) · ${nonRappro.length} non rapproché(s)`,
      table([{k:'ref',t:'Réf.'},{k:'lib',t:'Poste de la plaquette',cls:'wrapcell'},{k:'nat',t:'Nature'},
             {k:'pl',t:'Montant plaquette',n:1},{k:'aud',t:'Montant audité',n:1},
             {k:'or',t:'Origine',cls:'wrapcell'},{k:'ec',t:'Écart',n:1},{k:'doc',t:'Documentation du calcul',cls:'wrapcell'}], rows) +
      `<div class="row" style="margin-top:8px">
        <span class="pill ${ecarts.length ? 'bad' : ''}">${ecarts.length} écart(s)</span>
        <span class="pill ${nonRappro.length ? 'warn' : ''}">${nonRappro.length} non rapproché(s)</span>
        <span class="pill ${sansDoc.length ? 'warn' : ''}">${sansDoc.length} calcul(s) sans documentation</span>
        <span class="smallcaps">${PLAQUETTE.filter(e => e.nature === 'calcul').length} des ${PLAQUETTE.length} montants ne se lisent dans aucun solde</span>
      </div>
      <p class="note">Aucune plaquette n’existe dans ce fichier : les montants « solde » et « agrégat » viennent de la
      balance auditée augmentée des écarts semés, ceux marqués « calcul » se saisissent. Lire une plaquette réelle
      relève de l’échelle d’extraction <span class="tag mod">modèle</span>.</p>`);
}

function vueAchCloture(){
  const st = S.achevement, postes = postesEnPerimetre();
  const nonVisees = postes.filter(p => !sec(p.code).visa);
  const bloq = notesBloquantesOuvertes();
  const facteursOuverts = registre().filter(f => f.statut === 'propose');
  const echeance = addDays(DATE_RAPPORT, DELAI_ASSEMBLAGE);
  const jours = Math.round((Date.parse(echeance) - Date.parse(S.aujourdhui)) / 86400000);
  const obstacles = [];
  if (nonVisees.length) obstacles.push(`${nonVisees.length} section(s) non visée(s) : ${nonVisees.map(p => p.lib).join(', ')}`);
  if (bloq.length) obstacles.push(`${bloq.length} note(s) de revue bloquante(s) ouverte(s)`);
  if (facteursOuverts.length) obstacles.push(`${facteursOuverts.length} facteur(s) de risque non statué(s)`);
  if (!st.opinion) obstacles.push('opinion non arrêtée');
  if (!st.raFinale.trim()) obstacles.push('revue analytique finale non conclue');
  for (const k of Object.keys(ACH)){
    const f = ACH[k].pts.filter((_, i) => (st.points[k] || {})[i]).length;
    if (f < ACH[k].pts.length) obstacles.push(`${ACH[k].t} : ${ACH[k].pts.length - f} point(s) non exécuté(s)`);
    if (!(st.concl[k] || '').trim()) obstacles.push(`${ACH[k].t} : conclusion manquante`);
  }
  return entete('Assemblage et clôture du dossier', 'le dossier devient définitif et se verrouille') +
    blk('Délai d’assemblage', jours >= 0 ? jours + ' jour(s) restant(s)' : 'délai dépassé',
      `<div class="kv">
        <span class="k">Date du rapport</span><span class="v">${frDate(DATE_RAPPORT)}</span>
        <span class="k">Délai d’assemblage</span><span class="v">${DELAI_ASSEMBLAGE} jours</span>
        <span class="k">Échéance</span><span class="v">${frDate(echeance)}</span>
        <span class="k">Aujourd’hui</span><span class="v">${frDate(S.aujourdhui)}</span>
        <span class="k">Conservation</span><span class="v">${RETENTION_ANS} ans</span>
      </div>
      <p class="note">Délai d’assemblage : <b>C. com., art. D. 821-186, III et IV</b> — 60 jours.
      Durée de conservation : <b>C. com., art. R. 820-42</b> — 6 ans. Ces deux références ont été vérifiées sur le
      texte primaire lors des travaux de rétention du dépôt ; elles sont portées ici telles que le noyau les
      enregistre, avec leur source.</p>`) +
    blk('Conditions de clôture', obstacles.length ? obstacles.length + ' obstacle(s)' : 'réunies',
      obstacles.length
        ? `<div class="callout bad"><ul style="margin:0 0 0 16px;padding:0">${obstacles.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
           <button class="btn" disabled>clôturer et verrouiller le dossier</button>`
        : st.clos
          ? `<div class="callout"><b>Dossier clôturé</b> par ${esc(USERS[st.clos.par].nom)} le ${horo(st.clos.t)}.
             Le dossier est en lecture seule ; toute pièce ajoutée après cette date porte sa propre date et ne se
             substitue à rien.</div>`
          : `<button class="btn" id="ach-clore">clôturer et verrouiller le dossier</button>`) +
    blk('Ce que contient le dossier clôturé', '',
      table([{k:'q',t:'Élément'},{k:'n',t:'Nombre',n:1}], [
        { q:'Sections de travail visées', n:String(postes.filter(p => sec(p.code).visa).length) },
        { q:'Procédures exécutées', n:String(postes.reduce((a, p) => a + proceduresRequises(p).length, 0)) },
        { q:'Éléments sélectionnés', n:String(postes.reduce((a, p) => a + proceduresRequises(p).reduce((b, pr) => { const e = echantillonProc(p, pr); return b + (e ? e.retenus.length : 0); }, 0), 0)) },
        { q:'Requêtes émises', n:String(S.requetes.length) },
        { q:'Pièces déposées', n:String(S.requetes.reduce((a, r) => a + r.items.reduce((b, i) => b + i.depots.length, 0), 0)) },
        { q:'Notes de revue', n:String(S.notes.length) },

        { q:'Événements au journal', n:String(S.events.length) },
      ]));
}

/* ═══ 31. FILTRES DE REQUÊTES ══════════════════════════════════════════════
   Cumulables, et les mêmes des deux côtés : ce qui change entre l'auditeur et
   le client, c'est le jeu de requêtes visibles et les statuts lisibles, pas
   la façon de filtrer.
   ═══════════════════════════════════════════════════════════════════════ */
function filtrer(liste, cote){
  const f = S.filtres;
  return liste.filter(r => {
    if (f.section && r.section !== f.section) return false;
    if (f.contact && r.contact !== f.contact) return false;
    if (f.statut){
      const st = r.items.map(i => cote === 'client' ? statutVisibleClient(i) : i.statut);
      if (!st.includes(f.statut)) return false;
    }
    if (f.echeance === 'retard' && !retard(r)) return false;
    if (f.echeance === 'avenir' && (retard(r) || r.echeance < S.aujourdhui)) return false;
    if (f.q){
      const q = f.q.toLowerCase();
      const hay = (r.id + ' ' + r.titre + ' ' + r.items.map(i => i.desc).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

  const sections = [...new Set(S.requetes.map(r => r.section))];

  return `<div class="row" style="align-items:flex-end">
    <div class="ctrl" style="flex:1 1 190px"><label>Recherche</label>
      <input type="text" id="f-q" value="${esc(f.q)}" placeholder="numéro, objet, élément"></div>
    <div class="ctrl"><label>Statut</label>

        ${statuts.map(([k, v]) => `<option value="${k}" ${f.statut === k ? 'selected' : ''}>${esc(v.lib)}</option>`).join('')}</select></div>
    ${cote === 'client' ? '' : `<div class="ctrl"><label>Section</label>
      <select id="f-section"><option value="">toutes</option>
        ${sections.map(c => `<option value="${c}" ${f.section === c ? 'selected' : ''}>${esc(libFsli(c))}</option>`).join('')}</select></div>`}
    ${cote === 'client' ? '' : `<div class="ctrl"><label>Destinataire</label>
      <select id="f-contact"><option value="">tous</option>
        ${S.contacts.map(c => `<option value="${c.id}" ${f.contact === c.id ? 'selected' : ''}>${esc(c.nom)}</option>`).join('')}</select></div>`}
    <div class="ctrl"><label>Échéance</label>
      <select id="f-echeance"><option value="">toutes</option>
        <option value="retard" ${f.echeance === 'retard' ? 'selected' : ''}>en retard</option>

    <div class="ctrl"><label>&nbsp;</label>
      <span class="pill">${retenus} / ${total}</span></div>
    ${Object.values(f).some(Boolean) ? '<div class="ctrl"><label>&nbsp;</label><button class="btn sec" id="f-raz">effacer</button></div>' : ''}

}

/* ═══ 32. EXPORT DU STATUT DE MISSION ══════════════════════════════════════
   Trois périmètres de destinataire. Le classeur porte une feuille par section
   et une feuille de synthèse.
   ═══════════════════════════════════════════════════════════════════════ */
const PERIMETRES = {
  equipe:{ lib:'équipe interne',
    cols:['N°','Objet','Procédure','Élément','Statut interne','En attente de revue par','Échéance','Retard (j ouvrés)','Responsable côté client'] },
  groupe:{ lib:'auditeur du groupe',
    cols:['N°','Objet','Éléments','Avancement','Échéance','Retard (j ouvrés)'] },
  client:{ lib:'client',
    cols:['N°','Objet','Élément','Statut','Échéance','Responsable côté client'] },
};
function lignesExport(kind, requetes){
  const out = [];
  for (const r of requetes){
    const c = S.contacts.find(x => x.id === r.contact);
    if (kind === 'groupe'){
      out.push([r.id, r.titre, String(r.items.length), pct(avancement(r.items), 0),
                frDate(r.echeance), String(ancienneteRetard(r))]);
      continue;
    }
    for (const i of r.items){
      if (kind === 'equipe') out.push([r.id, r.titre, r.proc || '', i.desc, STATUTS[i.statut].lib,
        i.revoyeur || '', frDate(r.echeance), String(ancienneteRetard(r)), c ? c.nom : '']);
      else out.push([r.id, r.titre, i.desc, STATUTS[statutVisibleClient(i)].lib,
        frDate(r.echeance), c ? c.nom : '']);
    }
  }
  return out;
}
/** Feuille de synthèse : avancement par section, et qui doit quoi. */
function feuilleSynthese(kind){
  /* Un export sorti du dossier doit dire de QUEL fichier il parle : sans la
     version et son empreinte, deux classeurs identiques d'apparence peuvent
     porter des chiffres différents. */
  const v = versionCourante();
  const l = [
    ['Version du fichier', 'v' + v.n + ' — ' + v.lib],
    ['Reçue le', frDate(v.date) + ' de ' + v.par],
    ['Fichiers', v.fichiers],
    ['Empreinte', empreinteVersion(v.n)],
    ['Seuils au moment de l’export', 'signification ' + eur0(seuils().M)
      + ' · planification ' + eur0(seuils().PM) + ' · remontée ' + eur0(seuils().CTT)],
    [],
    ['Section', 'Requêtes', 'Éléments', 'En attente', 'Avancement', 'Retard max (j ouvrés)']];
  const sections = [...new Set(S.requetes.map(r => r.section))];
  for (const c of sections){
    const rs = requetesDe(c);
    const items = rs.flatMap(r => r.items);
    l.push([libFsli(c), String(rs.length), String(items.length),
            String(items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length),
            pct(rs.length ? rs.reduce((a, r) => a + avancement(r.items), 0) / rs.length : 0, 0),
            String(Math.max(0, ...rs.map(ancienneteRetard)))]);
  }
  l.push([]);
  l.push(['Responsable côté client', 'Société', 'Demandes en retard', 'Éléments dus', 'Ancienneté max (j ouvrés)']);
  for (const ct of S.contacts){
    const rs = S.requetes.filter(r => r.contact === ct.id && retard(r));
    if (!rs.length) continue;
    l.push([ct.nom, ct.societe, String(rs.length),
            String(rs.flatMap(r => r.items).filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length),
            String(Math.max(...rs.map(ancienneteRetard)))]);
  }
  return l;
}
const xmlEsc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const nomFeuille = s => s.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31);
/** Classeur au format SpreadsheetML — plusieurs feuilles, aucune dépendance. */
function classeur(kind){
  const d = PERIMETRES[kind];
  const feuilles = [{ nom:'Synthèse', lignes:feuilleSynthese(kind) }];
  for (const c of [...new Set(S.requetes.map(r => r.section))]){
    feuilles.push({ nom:nomFeuille(libFsli(c)), lignes:[d.cols, ...lignesExport(kind, requetesDe(c))] });
  }
  const xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" '
    + 'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'
    + feuilles.map(f => `<Worksheet ss:Name="${xmlEsc(f.nom)}"><Table>\n`
        + f.lignes.map(r => '<Row>' + r.map(v =>
            `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`).join('') + '</Row>').join('\n')
        + '\n</Table></Worksheet>').join('\n')
    + '\n</Workbook>';
  return { xml, feuilles };
}
function telecharger(nom, contenu, type){
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenu], { type }));
    a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    return true;
  } catch (e){ return false; }
}

/* ═══ 33. LE TRAVAIL — OBJET UNIQUE DE LA MISSION ══════════════════════════
   « Détermination de la matérialité », « test de détail sur le chiffre
   d'affaires » et « événements postérieurs » sont trois instances du même
   objet. Ajouter des responsabilités aux seules sections aurait créé deux
   structures parallèles ; les procédures construites au lot précédent sont
   donc MIGRÉES en travaux de nature « procédure de section », pas dupliquées :
   leur casier d'exécution (population, germe, papier) reste dans proc(), leur
   casier d'organisation (affectation, heures, statut) vit ici.
   ═══════════════════════════════════════════════════════════════════════ */

const PHASES = [
  { id:'planification',    lib:'Planification' },
  { id:'controle_interne', lib:'Contrôle interne' },
  { id:'bilan',            lib:'Bilan' },
  { id:'resultat',         lib:'Compte de résultat' },
  { id:'achevement',       lib:'Achèvement' },
];
const NATURE_TRAVAIL = {
  planification:'planification', controle_interne:'contrôle interne',
  section:'procédure de section', achevement:'achèvement',
};

/* ── barème de budget : une décision affichée, pas une constante cachée ──── */
const BAREME_HEURES = [
  { nature:'planification', lib:'Travail de planification', base:4, parElement:0 },
  { nature:'controle_interne', lib:'Travail de contrôle interne', base:6, parElement:0 },
  { nature:'section', ech:false, lib:'Procédure de section sans sélection', base:2, parElement:0 },
  { nature:'section', ech:true, lib:'Procédure de section avec sélection', base:1.5, parElement:0.05 },
  { nature:'achevement', lib:'Travail d’achèvement', base:3, parElement:0 },
];
function baremeDe(t){
  return BAREME_HEURES.find(b => b.nature === t.nature && (b.ech === undefined || b.ech === !!t.ech))
      || BAREME_HEURES[0];
}
function budgetBareme(t){
  const b = baremeDe(t);
  return Math.round((b.base + b.parElement * (t.elements || 0)) * 4) / 4;   // au quart d'heure
}

/* ── règle de niveau de revue : elle DÉCOULE du risque ───────────────────── */
const REGLE_REVUE = [
  { si:'Procédure répondant à une assertion évaluée « élevé »', niveau:2 },
  { si:'Section dont le risque le plus élevé est « élevé »', niveau:2 },
  { si:'Détermination de la matérialité, arrêté de l’opinion, clôture du dossier', niveau:2 },
  { si:'Tout autre travail', niveau:1 },
];
const NIVEAU_REVUE_LIB = { 1:'revue de premier niveau (réviseur)', 2:'revue de second niveau (associé)' };
const TRAVAUX_NIVEAU2 = ['PLAN-01', 'ACH-05', 'ACH-08'];
function niveauRevueExige(t){
  if (TRAVAUX_NIVEAU2.includes(t.code)) return 2;
  if (t.nature === 'section' && t.poste){
    const p = postesCalcules().find(x => x.code === t.poste);
    if (p && t.assertion && niveau(p, t.assertion) === 'eleve') return 2;
    if (p && NIVEAUX[niveauMax(p)] === 'eleve') return 2;
  }
  return 1;
}
function peutReviser(uid, t){
  const u = USERS[uid]; if (!u) return false;
  if (niveauRevueExige(t) === 2) return u.role === 'associe';
  return u.role === 'reviseur' || u.role === 'associe';
}
