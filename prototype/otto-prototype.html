/** Casier d'organisation d'un travail — affectation, heures, statut. */
function trav(code){
  if (!S.travaux[code]) S.travaux[code] = {
    preparateur:null, reviseur:null, heuresBudget:null, heuresReel:0,
    statut:'a_faire', acheve:null, revu:null,
  };
  return S.travaux[code];
}
const STATUT_TRAVAIL = { a_faire:'à faire', en_cours:'en cours', acheve:'achevé', revu:'revu' };

/** La liste complète des travaux de la mission, dérivée. */
const _travCache = { cle:'', v:null };
function travaux(){
  const s = seuils();
  const cle = JSON.stringify([s.PM, s.CTT, Object.keys(S.scopingOverride), S.decisionsFacteurs, S.sections && Object.keys(S.sections).length]);
  if (_travCache.cle === cle && _travCache.v) return _travCache.v.map(t => ({ ...t, ...trav(t.code), code:t.code }));
  const out = [];
  for (const f of TRAVAUX_FIXES){
    out.push({ ...f, echeance:f.phase === 'planification' ? '2026-02-20' : addDays(DATE_RAPPORT, -10) });
  }
  for (const p of postesEnPerimetre()){
    const phase = masseDe(p);
    for (const pr of proceduresRequises(p)){
      const e = pr.ech ? echantillonProc(p, pr) : null;
      out.push({
        code:'SEC-' + p.code + '-' + pr.code, nature:'section', phase,
        intitule:pr.lib, poste:p.code, posteLib:p.lib, proc:pr.code,
        assertion:pr.a, ech:pr.ech, elements:e ? e.retenus.length : 0,
        wpRef:procRef(p, pr), vue:'fsli:' + p.code, echeance:'2026-03-25',
      });
    }
  }
  const base = out.map(t => ({ ...t, niveauRevue:niveauRevueExige(t) }));
  base.forEach(t => { t.budgetBareme = budgetBareme(t); });
  _travCache.cle = cle; _travCache.v = base;
  return base.map(t => ({ ...t, ...trav(t.code), code:t.code, niveauRevue:t.niveauRevue, budgetBareme:t.budgetBareme }));
}
function budget(t){ return t.heuresBudget === null || t.heuresBudget === undefined ? t.budgetBareme : t.heuresBudget; }
function travauxDe(code){ return travaux().filter(t => t.poste === code); }
function travailDe(code){ return travaux().find(t => t.code === code); }
function hFmt(h){ return (Math.round(h * 4) / 4).toFixed(2).replace('.', ',') + NBSP + 'h'; }

/* ── règles déterministes sur les responsabilités ─────────────────────────
   Préparateur et réviseur sont obligatoirement deux personnes différentes —
   refusé par le système, comme la clôture d'une note par son auteur.       */
function affecter(code, role, uid){
  const t = travailDe(code); if (!t) return { ok:false, why:'travail inconnu' };
  const st = trav(code);
  const autre = role === 'preparateur' ? st.reviseur : st.preparateur;
  if (uid && uid === autre) return { ok:false, why:'le préparateur et le réviseur doivent être deux personnes différentes' };
  if (role === 'reviseur' && uid && !peutReviser(uid, t))
    return { ok:false, why:'ce travail exige une ' + NIVEAU_REVUE_LIB[t.niveauRevue] };
  st[role] = uid || null;
  logEvent('affectation', t.code + ' — ' + t.intitule,
           (role === 'preparateur' ? 'préparateur : ' : 'réviseur : ') + (uid ? USERS[uid].nom : 'retiré'));
  return { ok:true };
}
/** Un travail ne passe « achevé » que par son préparateur, « revu » que par son réviseur. */
function changerStatut(code, statut){
  const t = travailDe(code), st = trav(code);
  if (statut === 'acheve' && st.preparateur !== S.moi) return { ok:false, why:'seul le préparateur affecté peut achever ce travail' };
  if (statut === 'revu'){
    if (st.reviseur !== S.moi) return { ok:false, why:'seul le réviseur affecté peut porter ce travail « revu »' };
    if (st.statut !== 'acheve') return { ok:false, why:'le travail doit d’abord être achevé par son préparateur' };
  }
  st.statut = statut;
  if (statut === 'acheve') st.acheve = { par:S.moi, t:tick() };
  if (statut === 'revu') st.revu = { par:S.moi, t:tick() };
  logEvent('travail ' + STATUT_TRAVAIL[statut], t.code + ' — ' + t.intitule, USERS[S.moi].nom);
  return { ok:true };
}
function obstaclesTravaux(code){
  const o = [];
  const l = travauxDe(code);
  const rec = l.filter(t => aReconfirmer(t));
  if (rec.length) o.push(`${rec.length} travail/travaux à reconfirmer sur la version courante du fichier`);
  const sansPrep = l.filter(t => !t.preparateur), sansRev = l.filter(t => !t.reviseur);
  if (sansPrep.length) o.push(`${sansPrep.length} travail/travaux sans préparateur affecté`);
  if (sansRev.length) o.push(`${sansRev.length} travail/travaux sans réviseur affecté`);
  const nonRevus = l.filter(t => t.preparateur && t.reviseur && t.statut !== 'revu');
  if (nonRevus.length) o.push(`${nonRevus.length} travail/travaux non revus`);
  return o;
}

/* ── ligne d'affectation, réutilisée partout ─────────────────────────────── */
function ligneAffectation(t){
  const st = trav(t.code);
  const sel = (role, val) => `<select class="cell txt" data-aff="${t.code}|${role}" style="width:150px">
      <option value="">— non affecté —</option>
      ${Object.entries(USERS).map(([k, u]) => `<option value="${k}" ${val === k ? 'selected' : ''}>${esc(u.nom)}</option>`).join('')}
    </select>`;
  return { prep:sel('preparateur', st.preparateur), rev:sel('reviseur', st.reviseur) };
}
function boutonsStatut(t){
  const st = trav(t.code);
  const rc = aReconfirmer({ ...t, ...st });
  if (rc) return `<span class="pill bad">à reconfirmer</span>
    <div class="smallcaps">${esc(rc.motif)}</div>
    <button class="btn mini" data-recon="${t.code}">reconfirmer</button>`;
  if (st.statut === 'revu') return `<span class="pill">revu par ${esc(USERS[st.revu.par].nom)}</span>`;
  const b = [];
  if (st.statut !== 'acheve' && st.preparateur === S.moi) b.push(`<button class="btn mini" data-tstat="${t.code}|acheve">achever</button>`);
  if (st.statut === 'acheve'){
    b.push(`<span class="pill">achevé par ${esc(USERS[st.acheve.par].nom)}</span>`);
    if (st.reviseur === S.moi) b.push(`<button class="btn mini" data-tstat="${t.code}|revu">porter « revu »</button>`);
  }
  if (!b.length) b.push(`<span class="smallcaps">${st.statut === 'acheve' ? 'en attente de revue' : 'réservé au préparateur affecté'}</span>`);
  return b.join(' ');
}

/* ═══ 35. VUE GLOBALE DE LA MISSION ════════════════════════════════════════
   Dans l'ordre des questions d'un chef de mission.
   ═══════════════════════════════════════════════════════════════════════ */
function vueMission(){
  const l = travaux(), postes = postesEnPerimetre();
  /* 1 — avancement par phase et par section */
  const parPhase = PHASES.map(ph => {
    const t = l.filter(x => x.phase === ph.id);
    return { ph, t, acheves:t.filter(x => x.statut === 'acheve').length, revus:t.filter(x => x.statut === 'revu').length };
  });
  /* 2 — charge par personne */
  const charge = Object.entries(USERS).map(([k, u]) => {
    const prep = l.filter(t => t.preparateur === k), rev = l.filter(t => t.reviseur === k);
    return { k, u, prep, rev, b:prep.reduce((a, t) => a + budget(t), 0),
             r:prep.reduce((a, t) => a + t.heuresReel, 0),
             bRev:rev.reduce((a, t) => a + budget(t) * 0.2, 0) };
  });
  const bMoyen = charge.reduce((a, c) => a + c.b, 0) / charge.length;
  /* 3 — notes de revue */
  const notes = S.notes.filter(n => !n.clos);
  /* 4 — facteurs non statués */
  const fp = registre().filter(f => f.statut === 'propose');
  /* 5 — demandes en retard par contact */
  const parContact = {};
  for (const r of S.requetes.filter(retard)){
    const c = S.contacts.find(x => x.id === r.contact); if (!c) continue;
    parContact[c.id] = parContact[c.id] || { c, n:0, items:0, age:0 };
    parContact[c.id].n++;
    parContact[c.id].items += r.items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length;
    parContact[c.id].age = Math.max(parContact[c.id].age, ancienneteRetard(r));
  }
  /* 6 — obstacles au visa agrégés */
  const obst = postes.map(p => ({ p, o:obstaclesVisa(p) })).filter(x => x.o.length);
  /* 7 — jalons */
  const ech = addDays(DATE_RAPPORT, DELAI_ASSEMBLAGE);
  const jours = d => Math.round((Date.parse(d) - Date.parse(S.aujourdhui)) / 86400000);
  const jalons = [
    { j:'Intérim', d:'2026-01-19' }, { j:'Clôture de l’exercice', d:CLOTURE },
    { j:'Réception de la balance définitive', d:'2026-02-16' }, { j:'Date du rapport', d:DATE_RAPPORT },
    { j:'Échéance d’assemblage du dossier', d:ech },

  const tb = l.reduce((a, t) => a + budget(t), 0), tr = l.reduce((a, t) => a + t.heuresReel, 0);

        parPhase.map(x => ({ p:esc(x.ph.lib), n:String(x.t.length), a:String(x.acheves), r:String(x.revus),

          b:hFmt(x.t.reduce((a, t) => a + budget(t), 0)), e:hFmt(x.t.reduce((a, t) => a + t.heuresReel, 0)),
          d:hFmt(x.t.reduce((a, t) => a + t.heuresReel - budget(t), 0)) })),
        { foot:{ p:'Total', n:String(l.length), b:hFmt(tb), e:hFmt(tr), d:hFmt(tr - tb) } })) +
    blk('Avancement par section', postes.length + ' sections',
      table([{k:'s',t:'Section',cls:'wrapcell'},{k:'n',t:'Travaux',n:1},{k:'r',t:'Revus',n:1},
             {k:'b',t:'Budget',n:1},{k:'e',t:'Réalisé',n:1},{k:'v',t:'Visa'},{k:'g',t:''}],
        postes.map(p => {
          const t = travauxDe(p.code), st = sec(p.code), o = obstaclesVisa(p);
          return { s:esc(p.lib), n:String(t.length), r:String(t.filter(x => x.statut === 'revu').length),

            v:st.visa ? '<span class="pill">visée</span>' : `<span class="pill ${o.length ? 'bad' : 'warn'}">${o.length || 'prête'}</span>`,
            g:`<button class="btn mini sec" data-open="${p.code}">ouvrir</button>` };

/* ═══ 37. RAPPORT D'IMPACT D'UNE VERSION ═══════════════════════════════════
   Afficher trois colonnes de balance ne coûte rien et ne dit rien. La
   question d'un chef de mission qui reçoit un nouveau fichier est : QU'EST-CE
   QUE ÇA CASSE ? Six réponses, toutes calculées en évaluant réellement le
   dossier sur les deux versions, jamais annoncées.
   ═══════════════════════════════════════════════════════════════════════ */

/** Évalue une fonction comme si la version n était prise en compte, puis
 *  rétablit l'état. Les caches dérivés sont vidés de part et d'autre : sans
 *  cela le rapport comparerait une version aux nombres de l'autre. */
function auVersion(n, fn){
  const av = S.version;
  if (av === n) return fn();
  S.version = n; viderCachesDerives();
  let r;
  try { r = fn(); } finally { S.version = av; viderCachesDerives(); }
  return r;
}

/** Photographie de ce qui dépend du fichier, à une version donnée. */
function photo(n){
  return auVersion(n, () => {
    const s = seuils();
    const comptes = new Map(tb().map(r => [r[0], { lib:r[1], solde:r[2] - r[3] }]));
    const postes = postesCalcules().map(p => ({ code:p.code, lib:p.lib, solde:p.solde }));
    const perim = postesEnPerimetre().map(p => p.code);
    const ech = {};
    for (const p of postesEnPerimetre()) for (const pr of proceduresRequises(p)){
      if (!pr.ech) continue;
      const e = echantillonProc(p, pr);
      if (e) ech[p.code + '/' + pr.code] = { n:e.retenus.length, masse:e.pop.masse,
        pop:e.pop.items.length, cles:e.retenus.map(x => x.cle).join('|') };
    }
    const rap = rapprochement(n).filter(r => r.ecart !== 0)
      .map(r => ({ compte:r.compte, lib:r.lib, ecart:r.ecart }));
    return { n, s, comptes, postes, perim, ech, rap,
             ecritures:ledgerVersion(n).entries.length, empreinte:empreinteVersion(n) };
  });
}

/* Le rapport dépend de la version ET de l'état saisi (travaux achevés, version
   d'exécution des papiers, réglage des seuils). La clé du cache le dit, plutôt
   que de compter sur un vidage posé au bon endroit. */
const _impCache = new Map();
function cleImpact(a, b){
  const t = travaux().filter(x => x.statut === 'acheve' || x.statut === 'revu')
    .map(x => x.code + ':' + (x.poste && x.proc ? proc(x.poste, x.proc).execVersion : '')).join(',');
  return [a, b, S.benchmark, S.pctM, S.pctPM, S.pctCTT,
          Object.keys(S.scopingOverride).join('|'), t].join('§');
}
function impact(a, b){
  const cle = cleImpact(a, b);
  if (_impCache.has(cle)) return _impCache.get(cle);
  if (_impCache.size > 40) _impCache.clear();
  const A = photo(a), B = photo(b);

  /* 1. quels comptes ont bougé, et de combien */
  const tous = [...new Set([...A.comptes.keys(), ...B.comptes.keys()])].sort();
  const mouvements = tous.map(c => {
    const x = A.comptes.get(c), y = B.comptes.get(c);
    return { compte:c, lib:(y || x).lib, av:x ? x.solde : null, ap:y ? y.solde : null,
             delta:(y ? y.solde : 0) - (x ? x.solde : 0),
             nouveau:!x && !!y, disparu:!!x && !y };
  }).filter(m => m.delta !== 0 || m.nouveau || m.disparu);

  /* 2. lesquels franchissent un seuil — dans un sens ou dans l'autre.
        Le seuil BOUGE aussi : un compte peut franchir sans avoir bougé, et
        c'est précisément le cas qu'on ne voit pas à l'œil nu. */
  const franchit = [];
  for (const c of tous){
    const x = A.comptes.get(c), y = B.comptes.get(c);
    const sa = x ? Math.abs(x.solde) : 0, sb = y ? Math.abs(y.solde) : 0;
    const da = sa >= A.s.CTT, db = sb >= B.s.CTT;
    if (da !== db) franchit.push({ compte:c, lib:(y || x).lib, seuil:'remontée',
      seuilAv:A.s.CTT, seuilAp:B.s.CTT, av:x ? x.solde : 0, ap:y ? y.solde : 0,
      sens:db ? 'entre' : 'sort', bouge:(x ? x.solde : 0) !== (y ? y.solde : 0) });
  }

  /* 3. quels postes entrent ou sortent du périmètre */
  const perimetre = [];
  for (const p of B.postes){
    const dedans = B.perim.includes(p.code), avant = A.perim.includes(p.code);
    if (dedans !== avant){
      const q = A.postes.find(x => x.code === p.code);
      perimetre.push({ code:p.code, lib:p.lib, sens:dedans ? 'entre' : 'sort',
        av:q ? q.solde : 0, ap:p.solde, pmAv:A.s.PM, pmAp:B.s.PM,
        bouge:!q || q.solde !== p.solde });
    }
  }

  /* 4. quels échantillons deviennent périmés parce que leur population a changé */
  const echantillons = [];
  for (const k of new Set([...Object.keys(A.ech), ...Object.keys(B.ech)])){
    const x = A.ech[k], y = B.ech[k];
    if (!x && y){ echantillons.push({ k, cause:'procédure nouvelle', y }); continue; }
    if (x && !y){ echantillons.push({ k, cause:'procédure disparue', x }); continue; }
    if (x.cles !== y.cles){
      const ax = new Set(x.cles.split('|')), ay = new Set(y.cles.split('|'));
      echantillons.push({ k, x, y,
        cause:'sélection modifiée',
        entres:[...ay].filter(v => !ax.has(v)).length,
        sortis:[...ax].filter(v => !ay.has(v)).length });
    } else if (x.pop !== y.pop || x.masse !== y.masse){
      echantillons.push({ k, x, y, cause:'population modifiée, sélection inchangée', entres:0, sortis:0 });
    }
  }

  /* 5. quels travaux achevés ou revus reposent sur une version périmée */
  const travauxTouches = [];
  for (const t of travaux()){
    if (t.statut !== 'acheve' && t.statut !== 'revu') continue;
    const st = t.proc && t.poste ? proc(t.poste, t.proc) : null;
    const ver = st && st.execVersion !== undefined && st.execVersion !== null ? st.execVersion : a;
    if (ver >= b) continue;
    const k = t.poste + '/' + t.proc;
    const e = echantillons.find(x => x.k === k);
    travauxTouches.push({ code:t.code, intitule:t.intitule, posteLib:t.posteLib, statut:t.statut,
      version:ver, cause:e ? e.cause : 'version du fichier plus récente' });
  }

  /* 6. quelles anomalies levées sur une version antérieure sont déjà corrigées */
  const corrigees = A.rap.filter(x => !B.rap.some(y => y.compte === x.compte))
    .map(x => ({ ...x, quoi:'écart de rapprochement' }));
  const nouvelles = B.rap.filter(x => !A.rap.some(y => y.compte === x.compte))
    .map(x => ({ ...x, quoi:'écart de rapprochement' }));

  const r = { a, b, A, B, mouvements, franchit, perimetre, echantillons, travauxTouches,
              corrigees, nouvelles,
              seuilsBougent:A.s.M !== B.s.M || A.s.PM !== B.s.PM || A.s.CTT !== B.s.CTT };
  _impCache.set(cle, r);
  return r;
}

/* ── travaux à reconfirmer : DÉRIVÉ, jamais écrit dans le statut ──────────
   Un travail achevé sur une version antérieure n'est pas « encore achevé » :
   il est à reconfirmer, et le motif est celui du rapport d'impact. Le statut
   stocké n'est pas modifié — si l'on revient à la version d'exécution, le
   travail redevient achevé de lui-même, sans qu'aucune écriture d'état n'ait
   eu lieu. */
function aReconfirmer(t){
  if (t.statut !== 'acheve' && t.statut !== 'revu') return null;
  if (!t.poste || !t.proc) return null;
  const st = proc(t.poste, t.proc);
  if (st.execVersion === undefined || st.execVersion === null) return null;
  if (st.execVersion >= S.version) return null;
  if (st.reconfirme === S.version) return null;
  const p = postesCalcules().find(x => x.code === t.poste);
  const pr = PROCEDURES.find(x => x.code === t.proc);
  const per = p && pr ? peremption(p, pr) : null;
  return { de:st.execVersion, a:S.version,
    motif:per && per.populationChangee
      ? 'la population de la sélection a changé avec la version ' + S.version
      : 'exécuté sur la version ' + st.execVersion + ', le dossier est à la version ' + S.version };
}
function reconfirmer(code){
  const t = travailDe(code);
  if (!t || !t.poste || !t.proc) return { ok:false, why:'travail sans papier de travail' };
  const st = proc(t.poste, t.proc), r = aReconfirmer(t);
  if (!r) return { ok:false, why:'ce travail n’est pas à reconfirmer' };
  const tr = trav(code);
  if (tr.statut === 'revu' && tr.reviseur !== S.moi) return { ok:false, why:'seul le réviseur affecté peut reconfirmer un travail revu' };
  if (tr.statut === 'acheve' && tr.preparateur !== S.moi) return { ok:false, why:'seul le préparateur affecté peut reconfirmer ce travail' };
  st.reconfirme = S.version;
  st.execVersion = S.version;
  const p = postesCalcules().find(x => x.code === t.poste);
  const pr = PROCEDURES.find(x => x.code === t.proc);
  st.execEmpreinte = empreinteSelection(p, pr);
  logEvent('travail reconfirmé', t.code + ' — ' + t.intitule,
           'version ' + r.de + ' → ' + r.a + ' · ' + USERS[S.moi].nom);
  return { ok:true };
}
/** Un visa posé sur une version antérieure est signalé, pas effacé. */
function visaPerime(code){
  const st = sec(code);
  if (!st.visa || st.visa.version === undefined) return null;
  return st.visa.version < S.version ? { de:st.visa.version, a:S.version } : null;
}

/* ═══ 38. VUE « VERSIONS DU FICHIER » ══════════════════════════════════════ */
function vueVersions(){
  const attente = versionsEnAttente();
  const courante = versionCourante();
  const cible = S.impactVers || (attente.length ? attente[0].n : Math.max(1, S.version));
  const source = S.impactDe || Math.max(1, cible - 1);
  return entete('Versions de la balance et du grand livre',
                'un mandat en reçoit trois à cinq — rien n’est écrasé, et une version reçue n’est pas une version prise en compte') +
    blocVersions(attente, courante) +
    (cible > 1 ? blocImpact(source, cible) : '') +
    blocBalanceVersions() +
    blocRapproVersions();
}

function blocVersions(attente, courante){
  const rows = VERSIONS.map(v => {
    const recue = v.date <= S.aujourdhui;
    const etat = v.n === S.version ? '<span class="pill">prise en compte</span>'
      : v.n < S.version ? '<span class="smallcaps">antérieure</span>'
      : recue ? '<span class="pill warn">reçue, en attente</span>'
      : '<span class="smallcaps">non reçue</span>';
    return {
      n:`<span class="mono">v${v.n}</span>`,
      l:`<b>${esc(v.lib)}</b><div class="smallcaps">${esc(v.note)}</div>`,
      d:`<span class="mono">${frDate(v.date)}</span><div class="smallcaps">${esc(v.par)}</div>`,
      f:`<span class="smallcaps">${esc(v.fichiers)}</span>`,
      e:`<span class="mono">${esc(empreinteVersion(v.n))}</span>`,
      w:String(v.ecritures.length),
      s:etat,
      a:recue && v.n !== S.version
        ? `<button class="btn mini ${v.n > S.version ? '' : 'sec'}" data-vers="${v.n}">${v.n > S.version ? 'prendre en compte' : 'revenir à cette version'}</button>`
        : '',
    };
  });
  return blk('Versions reçues', VERSIONS.length,
    table([{k:'n',t:'Version'},{k:'l',t:'Objet',cls:'wrapcell'},{k:'d',t:'Reçue le'},
           {k:'f',t:'Fichiers',cls:'wrapcell'},{k:'e',t:'Empreinte'},{k:'w',t:'Écritures',n:1},
           {k:'s',t:'État'},{k:'a',t:''}], rows) +
    (attente.length ? `<div class="callout warn"><b>Version ${attente[0].n} reçue le ${frDate(attente[0].date)}, pas encore prise en compte.</b>
      Lisez le rapport d’impact ci-dessous avant de basculer : prendre en compte une version change les seuils,
      le périmètre et les sélections, et remet en cause les travaux déjà achevés.</div>` : '') +
    `<p class="note">Une version n’est jamais une régénération : c’est le grand livre précédent
    <b>plus</b> les écritures passées depuis. L’empreinte est calculée sur le contenu du fichier ;
    deux versions identiques auraient la même. Le dossier est à la version ${S.version}
    — ${esc(courante.lib)}.</p>`);
}

function blocImpact(a, b){
  const i = impact(a, b);
  const va = VERSIONS.find(v => v.n === a), vb = VERSIONS.find(v => v.n === b);
  const compte = (l, s) => `<span class="pill ${l ? s : ''}">${l} ${l > 1 ? '' : ''}</span>`;
  const sel = `<div class="row">
    <div class="ctrl"><label>De la version</label>
      <select id="imp-de">${VERSIONS.filter(v => v.n < Math.max(...VERSIONS.map(x => x.n))).map(v =>
        `<option value="${v.n}" ${v.n === a ? 'selected' : ''}>v${v.n} — ${esc(v.lib)}</option>`).join('')}</select></div>
    <div class="ctrl"><label>à la version</label>
      <select id="imp-vers">${VERSIONS.filter(v => v.n > 1).map(v =>
        `<option value="${v.n}" ${v.n === b ? 'selected' : ''}>v${v.n} — ${esc(v.lib)}</option>`).join('')}</select></div>
  </div>`;

  const seuilsRow = `
    <h3>Ce que la version fait aux seuils</h3>
    ${table([{k:'q',t:'Seuil'},{k:'a',t:'v' + a,n:1},{k:'b',t:'v' + b,n:1},{k:'d',t:'Écart',n:1},{k:'p',t:'Effet',cls:'wrapcell'}], [
      { q:'Référence — ' + esc(i.B.s.bench.lib), a:eur0(i.A.s.bench.val), b:eur0(i.B.s.bench.val),
        d:eur0(i.B.s.bench.val - i.A.s.bench.val),
        p:'les écritures de la version modifient la référence, donc les trois seuils' },
      { q:'Seuil de signification', a:eur0(i.A.s.M), b:eur0(i.B.s.M), d:eur0(i.B.s.M - i.A.s.M),
        p:'ce qui rend les comptes trompeurs' },
      { q:'Seuil de planification', a:eur0(i.A.s.PM), b:eur0(i.B.s.PM), d:eur0(i.B.s.PM - i.A.s.PM),
        p:'ce qui entre au périmètre et la strate exhaustive des sélections' },
      { q:'Seuil de remontée', a:eur0(i.A.s.CTT), b:eur0(i.B.s.CTT), d:eur0(i.B.s.CTT - i.A.s.CTT),
        p:'ce qui est cumulé plutôt que jugé trivial' },
    ])}
    ${i.seuilsBougent ? `<div class="callout warn"><b>Les seuils bougent avec la version</b> — la référence
      de matérialité est calculée sur la balance, et la balance a changé. Un compte peut donc changer de côté
      sans avoir bougé d’un centime, et un poste entrer au périmètre sans qu’aucune écriture ne l’ait touché.

        ? `<b>C’est le cas ici</b> pour ${i.franchit.filter(x => !x.bouge).length} compte(s) et

  const q1 = `

    ${i.mouvements.length ? table([{k:'c',t:'Compte'},{k:'l',t:'Intitulé',cls:'wrapcell'},
      {k:'a',t:'v' + a,n:1},{k:'b',t:'v' + b,n:1},{k:'d',t:'Écart',n:1},{k:'q',t:''}],
      i.mouvements.map(m => ({ c:`<span class="mono">${m.compte}</span>`, l:esc(m.lib),
        a:m.av === null ? '<span class="smallcaps">absent</span>' : eur(m.av),
        b:m.ap === null ? '<span class="smallcaps">absent</span>' : eur(m.ap),
        d:'<b>' + eur(m.delta) + '</b>',
        q:m.nouveau ? '<span class="pill warn">compte apparu</span>' : m.disparu ? '<span class="pill warn">compte disparu</span>' : '' })),
      { foot:{ c:'Total', d:eur(i.mouvements.reduce((t, m) => t + m.delta, 0)) } })
      : '<p class="note">Aucun compte n’a bougé.</p>'}`;

  const q2 = `
    <h3>2. Comptes qui franchissent le seuil de remontée <span class="tag">${i.franchit.length}</span></h3>
    ${i.franchit.length ? table([{k:'c',t:'Compte'},{k:'l',t:'Intitulé',cls:'wrapcell'},
      {k:'a',t:'Solde v' + a,n:1},{k:'b',t:'Solde v' + b,n:1},{k:'s',t:'Seuil v' + a + ' → v' + b,n:1},{k:'q',t:'Sens',cls:'wrapcell'}],

        q:(x.sens === 'entre' ? '<span class="pill bad">entre au-dessus du seuil</span>' : '<span class="pill">passe en dessous</span>')

      : '<p class="note">Aucun compte ne change de côté par rapport au seuil de remontée.</p>'}`;

  const q3 = `
    <h3>3. Postes qui entrent ou sortent du périmètre <span class="tag">${i.perimetre.length}</span></h3>
    ${i.perimetre.length ? table([{k:'p',t:'Poste',cls:'wrapcell'},{k:'a',t:'Solde v' + a,n:1},

      i.perimetre.map(x => ({ p:esc(x.lib), a:eur(x.av), b:eur(x.ap),

        q:x.sens === 'entre' ? '<span class="pill bad">entre au périmètre — une section entière à ouvrir</span>'
                             : '<span class="pill warn">sort du périmètre — travaux à archiver, pas à supprimer</span>',
        v:`<button class="btn mini sec" data-open="${x.code}">voir</button>` })))
      : '<p class="note">Le périmètre est inchangé.</p>'}`;

  const q4 = `
    <h3>4. Sélections périmées <span class="tag">${i.echantillons.length}</span></h3>
    ${i.echantillons.length ? table([{k:'k',t:'Procédure'},{k:'c',t:'Cause',cls:'wrapcell'},
      {k:'p',t:'Population v' + a + ' → v' + b,n:1},{k:'n',t:'Retenus',n:1},{k:'m',t:'Mouvement',cls:'wrapcell'}],

        p:x.x && x.y ? x.x.pop + ' → ' + x.y.pop : (x.y ? '— → ' + x.y.pop : x.x.pop + ' → —'),
        n:x.x && x.y ? x.x.n + ' → ' + x.y.n : (x.y ? '— → ' + x.y.n : x.x.n + ' → —'),
        m:x.entres === undefined ? '<span class="smallcaps">—</span>'
          : `${x.entres} élément(s) entré(s), ${x.sortis} sorti(s)` })))
      : '<p class="note">Aucune sélection n’est modifiée : les populations et les tirages sont identiques.</p>'}
    <p class="note">Le germe ne change pas : si la sélection bouge, c’est que la population a bougé.
    Un papier de travail exécuté sur une sélection qui n’existe plus ne prouve plus ce qu’il disait.</p>`;

  const q5 = `
    <h3>5. Travaux achevés ou revus sur une version antérieure <span class="tag">${i.travauxTouches.length}</span></h3>
    ${i.travauxTouches.length ? table([{k:'c',t:'Travail'},{k:'i',t:'Intitulé',cls:'wrapcell'},

        v:`<span class="mono">v${t.version}</span>`, m:esc(t.cause) })))
      : `<p class="note">Aucun travail achevé ou revu ne repose sur une version antérieure — parce
         qu’aucun ne l’est encore, ou parce qu’ils ont été reconfirmés.</p>`}
    <p class="note">Ces travaux ne sont pas conservés en silence : ils passent à <b>« à reconfirmer »</b>
    dès la prise en compte, avec le motif ci-dessus. Le statut stocké n’est pas modifié — revenir à la
    version d’exécution les rend à leur état antérieur sans qu’aucune écriture n’ait eu lieu.</p>`;

  const q6 = `
    <h3>6. Anomalies déjà corrigées par la nouvelle version <span class="tag">${i.corrigees.length}</span></h3>
    ${i.corrigees.length ? table([{k:'q',t:'Nature'},{k:'c',t:'Compte'},{k:'l',t:'Intitulé',cls:'wrapcell'},{k:'m',t:'Écart v' + a,n:1}],
      i.corrigees.map(x => ({ q:esc(x.quoi), c:`<span class="mono">${x.compte}</span>`, l:esc(x.lib), m:eur(x.ecart) })))
      : '<p class="note">Aucune anomalie de la version ' + a + ' n’est résorbée par la version ' + b + '.</p>'}
    ${i.nouvelles.length ? `<h3>… et anomalies que la nouvelle version fait apparaître <span class="tag">${i.nouvelles.length}</span></h3>` +
      table([{k:'q',t:'Nature'},{k:'c',t:'Compte'},{k:'l',t:'Intitulé',cls:'wrapcell'},{k:'m',t:'Écart v' + b,n:1}],

    reste consultable plus bas, et la piste d’audit conserve la version sur laquelle elle avait été relevée.</p>`;

  return blk('Rapport d’impact — v' + a + ' → v' + b,
    `${i.mouvements.length} comptes · ${i.perimetre.length} postes · ${i.echantillons.length} sélections`,

      <b>${esc(va.lib)}</b> du ${frDate(va.date)}. Tout ce qui suit est calculé en évaluant réellement le
      dossier sur les deux versions.</p>`
    + seuilsRow + q1 + q2 + q3 + q4 + q5 + q6);
}

/** Balance multi-colonnes : une colonne par version, l'écart entre deux versions successives. */
function blocBalanceVersions(){
  const ns = VERSIONS.map(v => v.n);
  const tbs = Object.fromEntries(ns.map(n => [n, new Map(tbVersion(n).map(r => [r[0], r]))]));
  const comptes = [...new Set(ns.flatMap(n => tbVersion(n).map(r => r[0])))].sort();
  const bouge = c => ns.some(n => n > 1 && solde(tbs[n].get(c)) !== solde(tbs[n - 1].get(c)));
  const seulsMouv = S.balTout !== true;
  const vus = seulsMouv ? comptes.filter(bouge) : comptes;
  const cols = [{k:'c',t:'Compte'},{k:'l',t:'Intitulé',cls:'wrapcell'}];
  for (const n of ns) cols.push({ k:'v' + n, t:'v' + n, n:1 });
  for (const n of ns) if (n > 1) cols.push({ k:'d' + n, t:'v' + (n - 1) + ' → v' + n, n:1 });
  const rows = vus.map(c => {
    const r = { c:`<span class="mono">${c}</span>`,
                l:esc((tbs[ns[ns.length - 1]].get(c) || tbs[1].get(c))[1]) };
    for (const n of ns){ const x = tbs[n].get(c); r['v' + n] = x ? eur(solde(x)) : '<span class="smallcaps">absent</span>'; }
    for (const n of ns) if (n > 1){
      const d = solde(tbs[n].get(c)) - solde(tbs[n - 1].get(c));
      r['d' + n] = d ? '<b>' + eur(d) + '</b>' : '<span class="smallcaps">—</span>';
    }
    return r;
  });
  const foot = { c:'Total', l:'' };
  for (const n of ns) foot['v' + n] = eur(vus.reduce((a, c) => a + solde(tbs[n].get(c)), 0));
  for (const n of ns) if (n > 1) foot['d' + n] = eur(vus.reduce((a, c) => a + solde(tbs[n].get(c)) - solde(tbs[n - 1].get(c)), 0));
  return blk('Balance, une colonne par version', vus.length + ' compte(s) affiché(s) sur ' + comptes.length,
    `<div class="row">
      <button class="btn mini sec" id="bal-tout">${seulsMouv ? 'afficher les ' + comptes.length + ' comptes' : 'n’afficher que les comptes qui bougent'}</button>
      <span class="smallcaps">rien n’est écrasé : chaque version reste lisible dans sa colonne</span>
    </div>` + table(cols, rows, { foot }));
}
function solde(r){ return r ? r[2] - r[3] : 0; }

/** Le rapprochement est rejoué à chaque version ; les écarts antérieurs restent lisibles. */
function blocRapproVersions(){
  const rows = VERSIONS.map(v => {
    const ec = rapprochement(v.n).filter(r => r.ecart !== 0);
    return { n:`<span class="mono">v${v.n}</span>`, l:esc(v.lib),
      e:ec.length ? `<span class="pill bad">${ec.length}</span>` : '<span class="pill">aucun</span>',
      d:ec.length ? ec.map(r => `<span class="mono">${r.compte}</span> ${eur(r.ecart)}`).join(' · ')
                  : '<span class="smallcaps">balance et grand livre concordent</span>',
      m:esc(v.n === 1 ? 'écriture de situation à la balance, absente du fichier des écritures'
          : (v.ecritures.some(x => x.cible === 'gl') && !ec.length) ? 'l’écriture manquante a été reprise : l’écart de la version précédente est résorbé'
          : ec.length ? 'écriture passée à la balance seule : le fichier des écritures transmis lui est antérieur'
          : 'aucune écriture à sens unique') };
  });
  return blk('Rapprochement rejoué à chaque version', VERSIONS.length + ' rapprochements',
    table([{k:'n',t:'Version'},{k:'l',t:'Objet',cls:'wrapcell'},{k:'e',t:'Écarts',n:1},
           {k:'d',t:'Détail',cls:'wrapcell'},{k:'m',t:'Cause',cls:'wrapcell'}], rows) +
    `<p class="note">Le rapprochement n’est pas refait « à la place » de l’ancien : chaque version garde le sien.
    Un écart résorbé se lit encore sur la version où il avait été relevé.</p>`);
}

/** Le rail de l'espace auditeur suit les PHASES du dossier. */
function railItems(){
  if (S.espace === 'client')   return [{ grp:'Portail', items:VUES_CLIENT }];
  if (S.espace === 'pilotage') return [{ grp:'Pilotage', items:VUES_PILOTAGE }];
  const g = m => postesDeMasse(m).map(p => ({ id:'fsli:' + p.code, lib:p.lib, poste:p,
                                              second:masseDe(p) !== m }));
  const nCI = travaux().filter(t => t.nature === 'controle_interne').length;
  return [
    { grp:'Dossier', items:DOSSIER },
    { grp:'1 · Planification', items:TRANSVERSES },
    { grp:'2 · Contrôle interne', items:nCI ? [] : [{ id:'plan.ci', lib:'Revues de processus', lot2:true }] },
    { grp:'3 · Bilan — ' + postesDeMasse('bilan').length + ' poste(s)', items:g('bilan') },
    { grp:'4 · Compte de résultat — ' + postesDeMasse('resultat').length + ' poste(s)', items:g('resultat') },
    { grp:'5 · Achèvement', items:ACHEVEMENT },

function badgeRail(it){
  if (it.lot2) return '<span class="b warn">lot 2</span>';
  if (it.id === 'plan.facteurs'){
    const n = registre().filter(f => f.statut === 'propose').length;
    return n ? `<span class="b bad">${n}</span>` : '<span class="b ok">0</span>';
  }
  if (it.id === 'plan.programme'){
    const n = travaux().filter(t => !t.preparateur || !t.reviseur).length;
    return n ? `<span class="b bad">${n}</span>` : '<span class="b ok">0</span>';
  }
  if (!it.poste) return '';
  const p = it.poste, st = sec(p.code);
  if (it.second) return '<span class="b">aussi</span>';
  if (st.visa) return '<span class="b ok">visée</span>';
  const bl = notesBloquantesOuvertes(p.code).length;
  if (bl) return `<span class="b bad">${bl} ⚑</span>`;
  const o = obstaclesVisa(p).length;
  return `<span class="b">${o}</span>`;
}
function renderRail(){
  const html = railItems().map(g => `<div class="grp">${esc(g.grp)}</div>` +
    g.items.map(it => `<a data-vue="${it.id}" class="${S.vue === it.id ? 'on' : ''}">
        <span class="t">${esc(it.lib)}</span>${badgeRail(it)}</a>`).join('')).join('');
  document.getElementById('rail').innerHTML = html;
  const opts = railItems().map(g => `<optgroup label="${esc(g.grp)}">` +
    g.items.map(it => `<option value="${it.id}" ${S.vue === it.id ? 'selected' : ''}>${esc(it.lib)}</option>`).join('') +
    '</optgroup>').join('');
  return `<div class="railm"><div class="ctrl"><label>Section</label>
    <select id="railm">${opts}</select></div></div>`;
}

let lastImpact = {};
function renderImpact(){
  if (!document.getElementById('impact')) return;   // idem : absent du portail client
  const s = seuils(), postes = postesEnPerimetre();
  let procs = 0, sel = 0, couvert = 0, total = 0;
  for (const p of postes){
    const prs = proceduresRequises(p);
    procs += prs.length;
    for (const pr of prs){
      const e = echantillonProc(p, pr);
      if (!e) continue;
      sel += e.retenus.length; couvert += e.couvert; total += e.pop.masse;
    }
  }
  const a = anomalies(), nc = a.filter(x => !x.souSeuil).reduce((t, x) => t + x.montant, 0);
  const cells = {
    'sections de travail':                       [postes.length + '/' + postesCalcules().length, 'sections'],
    'procédures requises':                       [String(procs),                                 'procédures'],
    'éléments sélectionnés':                     [String(sel),                                   'éléments'],
    'couverture des sélections':                 [pct(total ? couvert / total : 0, 1),           'couverture'],
    'facteurs de risque à statuer':              [String(registre().filter(f => f.statut === 'propose').length), 'facteurs'],
    'requêtes en retard':                        [String(S.requetes.filter(retard).length),      'retards'],
    'notes bloquantes ouvertes':                 [String(notesBloquantesOuvertes().length),      'bloquantes'],
    'cumul non corrigé':                         [eur0(nc),                                      'cumul'],
    'conclusion':                                [Math.abs(nc) > s.M ? 'au-dessus du seuil' : 'sous le seuil', 'conclusion'],
  };
  document.getElementById('impact').innerHTML = Object.entries(cells).map(([k, [v, court]]) =>
    `<div class="c ${lastImpact[k] !== undefined && lastImpact[k] !== v ? 'flash' : ''}"><div class="k"><span class="lg">${k}</span><span class="sm">${court}</span></div><div class="v">${v}</div></div>`).join('');
  lastImpact = Object.fromEntries(Object.entries(cells).map(([k, [v]]) => [k, v]));
}

function focusKey(){
  const el = document.activeElement;
  if (!el || !/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return null;
  const pos = el.selectionStart;
  if (el.id) return { sel:'#' + el.id, pos };
  const ds = [...el.attributes].filter(a => a.name.startsWith('data-')).map(a => `[${a.name}="${a.value}"]`).join('');
  return ds ? { sel:el.tagName.toLowerCase() + ds, pos } : null;
}
function focusRestore(k){
  if (!k) return;
  const el = document.querySelector(k.sel);
  if (!el) return;
  el.focus();
  try { if (k.pos !== null && el.setSelectionRange) el.setSelectionRange(k.pos, k.pos); } catch (e) {}
}
function renderMain(){
  const k = focusKey();
  const main = document.getElementById('main');
  main.innerHTML = renderRail() + contenu();
  focusRestore(k);
}
function render(){
  renderBrand(); renderTopExtra(); renderMain(); syncTopHeight();
}
/** Rendu différé pour la saisie au clavier : l'état est mis à jour tout de
 *  suite, l'écran se recompose une fois la frappe retombée. Sans cela, chaque
 *  touche redessine une section de plus de cent lignes et la saisie accroche. */
/** Pendant le glissement d'un curseur, les seuils et le bandeau se recalculent
 *  immédiatement (3 ms) ; le rendu de la section, plus lourd, est ramené à un
 *  par image d'écran au lieu de s'empiler derrière chaque événement. */
let _raf = null;
function renderMainRaf(){
  if (_raf) return;
  _raf = requestAnimationFrame(() => { _raf = null; renderMain(); });
}
let _deb = null;
function renderMainDiff(){
  clearTimeout(_deb);
  _deb = setTimeout(() => { renderImpact(); renderMain(); }, 220);
}
/** Hauteur réelle de la barre collante → décalage des ancres de navigation. */
function syncTopHeight(){
  const h = Math.round(document.querySelector('.top').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--topH', h + 'px');
}

function aller(vue, espace){
  if (espace && espace !== S.espace) S.espace = espace;
  S.vue = vue; S.noteCible = null;
  render();
  const m = document.getElementById('main');
  if (m) m.scrollIntoView({ block:'start' });
}
/** Ouvre la section d'un poste, depuis n'importe où. */
function ouvrirSection(code){ aller('fsli:' + code, 'auditeur'); }

/* ═══ 21. ENCHAÎNEMENT ═════════════════════════════════════════════════════
   Règle → requête DANS la section → portail client → dépôt → papier de
   travail de la même section → écart → synthèse. Chaque maillon est ici.
   ═══════════════════════════════════════════════════════════════════════ */
function requeteJustificatifsProc(p, pr){
  const e = echantillonProc(p, pr); if (!e) return null;
  const cat = catalogue(p, pr), docs = docsAttendusProc(p, pr);
  const items = e.retenus.map(x => ({
    desc:`${pr.tiers ? 'Tiers' : 'Écriture'} ${x.cle}${x.e ? ' — pièce ' + x.e.pieceRef : ''}`
       + `${x.e ? ' du ' + frDate(x.e.date) : ''} (${eur(x.montant)}) — à fournir : ${docs.join(' + ')}`,
    ref:x.cle }));
  const r = creerRequete(p.code, 'Justificatifs — ' + pr.lib, items, 12);
  r.proc = pr.code;
  r.origine = 'catalogue de preuve';
  // ce que le client doit trouver sur chaque document : rédigé par le catalogue
  r.detail = cat ? cat.map(d => d.doc + ' — ' + d.champs.map(c => c.lib.toLowerCase()).join(', ')).join(' ; ') : '';
  return r;
}
function requeteVariation(p, compte, l){
  const r = creerRequete(p.code, 'Explication de variation — compte ' + compte, [{
    desc:`Le compte ${compte} « ${l.lib} » passe de ${eur(l.n1)} au 31/12/2024 à ${eur(l.n)} au 31/12/2025, `
       + `soit ${eur(l.d)}${l.pr === null ? '' : ' (' + pct(l.pr, 1) + ')'}. Merci d’en indiquer l’explication et `
       + `de préciser les éléments justificatifs disponibles.`, ref:compte }], 10);
  r.origine = 'revue analytique substantive';
  return r;
}
/** Dépôt d'une pièce par le client : il rend testable la ligne du papier de
 *  travail de LA PROCÉDURE qui a demandé la pièce. */
function deposer(reqId, itemId){
  const r = S.requetes.find(x => x.id === reqId); if (!r) return;
  const it = r.items.find(i => i.id === itemId); if (!it) return;
  const p = postesCalcules().find(x => x.code === r.section);
  const pr = r.proc ? PROCEDURES.find(x => x.code === r.proc) : null;
  const docs = (p && pr && docsAttendusProc(p, pr).length) ? docsAttendusProc(p, pr) : ['pièce justificative'];
  const doc = docs[Math.min(it.depots.length, docs.length - 1)];
  const base = it.ref ? String(it.ref).replace(/[^\w-]+/g, '') : r.id;
  const nom = base + '_' + doc.toLowerCase().replace(/[^a-zà-ÿ0-9]+/gi, '-').replace(/^-|-$/g, '') + '.pdf';
  it.depots.push({ nom, doc, t:tick(), par:contactCourant().nom });
  it.statut = it.depots.length >= docs.length ? 'depose' : 'partiel';
  logEvent('pièce déposée', r.id + ' · ' + nom, contactCourant().nom);
  /* Aucun drapeau n'est posé sur le papier de travail : la ligne devient
     testable parce que le dépôt existe, et le papier le lit. Une case
     « pièce reçue » aurait pu être cochée sans qu'aucune pièce n'arrive. */
}

/* ═══ 23. INTERACTIONS ═════════════════════════════════════════════════════ */
function posteCourant(){ return S.vue.startsWith('fsli:') ? postesCalcules().find(p => p.code === S.vue.slice(5)) : null; }
/** Retrouve une résolution d'écart depuis la clé portée par l'écran.
 *  Deux formes, un seul casier : « POSTE#PROC#élément|document|champ » pour un
 *  écart de papier de travail, « hors#référence » pour un écart né ailleurs
 *  (rapprochement, test des écritures). L'écran n'a pas à savoir laquelle. */
function resolDeCle(k){
  const s = String(k);
  if (s.startsWith('hors#')){
    const ref = s.slice(5), a = anomalies().find(x => x.cleRes === s);
    return a ? { r:resolHors(ref), constate:a.constate, lib:a.lib } : null;
  }
  const parts = s.split('#');
  if (parts.length < 3) return null;
  const p = postesCalcules().find(x => x.code === parts[0]);
  const pr = PROCEDURES.find(x => x.code === parts[1]);
  if (!p || !pr) return null;
  const cle = parts.slice(2).join('#');
  const c = controles(p, pr).find(x => x.cle === cle);
  return c ? { r:resol(c), constate:-c.ecart, lib:c.doc + ' — ' + c.ligne.cle } : null;
}

document.addEventListener('input', e => {
  const t = e.target, d = t.dataset, p = posteCourant();
  if (t.id === 'bm'){ S.benchmark = t.value; S.pctM = bm()[t.value].defaut; return render(); }
  if (t.id === 'pm'){ S.pctM = parseFloat(t.value); renderSeuils(); renderImpact(); return renderMainRaf(); }
  if (t.id === 'ppm'){ S.pctPM = parseInt(t.value, 10); renderSeuils(); renderImpact(); return renderMainRaf(); }
  if (t.id === 'pctt'){ S.pctCTT = parseInt(t.value, 10); renderSeuils(); renderImpact(); return renderMainRaf(); }
  if (d.pseed !== undefined && p){ proc(p.code, d.pseed).seed = t.value; proc(p.code, d.pseed).wp = null; return; }
  if (d.pconcl !== undefined && p){ proc(p.code, d.pconcl).conclusion = t.value;
    marquerExecution(p, PROCEDURES.find(x => x.code === d.pconcl)); return renderMainDiff(); }
  if (d.ctr !== undefined && p){
    const pr = PROCEDURES.find(x => x.code === d.pcode);
    const wp = wpProc(p, pr) || [];
    const cle = String(d.ctr).split('|')[0];
    const l = wp.find(x => String(x.cle) === cle);
    if (l){ l.champs[d.ctr] = t.value; marquerExecution(p, pr); }
    return renderMainDiff();
  }
  if (d.rexpl !== undefined){ const x = resolDeCle(d.rexpl); if (x) x.r.expl = t.value; return renderMainDiff(); }
  if (d.rconcl !== undefined){ const x = resolDeCle(d.rconcl); if (x) x.r.concl = t.value; return renderMainDiff(); }
  if (d.recr !== undefined){ const x = resolDeCle(d.recr); if (x) x.r.corrobEcriture = t.value; return renderMainDiff(); }
  if (d.rmont !== undefined){
    const x = resolDeCle(d.rmont);
    if (x) x.r.explique = Math.round((parseFloat(String(t.value).replace(/\s/g, '').replace(',', '.')) || 0) * 100);
    return renderMainDiff();
  }
  if (t.id === 'ar-montant'){ S.arMontant = Math.round((parseFloat(t.value) || 0) * 100); return renderMainDiff(); }
  if (t.id === 'ar-pct'){ S.arPct = parseFloat(t.value) || 0; return renderMainDiff(); }
  if (t.id === 'sec-concl' && p){ sec(p.code).conclusion = t.value; return renderMainDiff(); }
  if (t.id === 'pp-adr'){ S.portail.adresse = t.value; return; }
  if (t.id === 'f-q'){ S.filtres.q = t.value; return renderMainDiff(); }
  if (t.id === 'ft-q'){ S.filtreTrav.q = t.value; return renderMainDiff(); }
  const hrs = v => Math.max(0, Math.round((parseFloat(String(v).replace(',', '.')) || 0) * 4) / 4);
  if (d.hb !== undefined){ trav(d.hb).heuresBudget = t.value.trim() === '' ? null : hrs(t.value); return renderMainDiff(); }
  if (d.hr !== undefined){ trav(d.hr).heuresReel = hrs(t.value); return renderMainDiff(); }
  const cts = v => Math.round((parseFloat(String(v).replace(/\s/g, '').replace(',', '.')) || 0) * 100);
  if (d.plaq !== undefined){ S.achevement.plaquette[d.plaq] = t.value.trim() === '' ? undefined : cts(t.value); return renderMainDiff(); }
  if (d.calcm !== undefined){ const c = S.achevement.calculs[d.calcm] = S.achevement.calculs[d.calcm] || {};
    c.montant = t.value.trim() === '' ? undefined : cts(t.value); return renderMainDiff(); }
  if (d.calcd !== undefined){ const c = S.achevement.calculs[d.calcd] = S.achevement.calculs[d.calcd] || {};
    c.doc = t.value; return renderMainDiff(); }
  if (t.id === 'ach-ra'){ S.achevement.raFinale = t.value; return renderMainDiff(); }
  if (t.id === 'ach-opm'){ S.achevement.opinionMotif = t.value; return renderMainDiff(); }
  if (d.achc !== undefined){ S.achevement.concl[d.achc] = t.value; return renderMainDiff(); }
  if (d.fseuil !== undefined){ S.seuilsFacteurs[d.fseuil] = parseFloat(t.value) || 0; return renderMainDiff(); }
  if (d.scopem !== undefined){ S.scopingMotif[d.scopem] = t.value; return renderMainDiff(); }
  if (d.nsm !== undefined && p){ sec(p.code).nsMotif[d.nsm] = t.value; return renderMainDiff(); }
  if (d.nivm !== undefined && p){ sec(p.code).overrideMotif[d.nivm] = t.value; return renderMainDiff(); }
});

document.addEventListener('change', e => {
  const t = e.target, d = t.dataset, p = posteCourant();
  if (t.id === 'railm') return aller(t.value);
  if (t.id === 'whoaud'){ S.moi = t.value; return render(); }
  if (t.id === 'whoclient'){ S.moiClient = t.value; return render(); }
  if (d.scope !== undefined){
    if (t.value) S.scopingOverride[d.scope] = t.value; else { delete S.scopingOverride[d.scope]; delete S.scopingMotif[d.scope]; }
    logEvent('périmètre modifié', d.scope, t.value ? 'forcé : ' + t.value : 'retour à la proposition');
    return render();
  }
  if (d.ns !== undefined && p){
    const st = sec(p.code);
    if (t.value === 'auto'){ delete st.ns[d.ns]; delete st.nsMotif[d.ns]; } else st.ns[d.ns] = t.value;
    logEvent('statut de compte modifié', d.ns, t.value);
    return renderMain();
  }
  if (d.fac !== undefined && p){
    sec(p.code).declares[d.fac] = t.checked;
    logEvent('facteur de risque déclaré', p.lib, (FACTEURS.find(f => f.code === d.fac) || {}).lib + ' : ' + (t.checked ? 'oui' : 'non'));
    renderImpact(); return renderMain();
  }
  if (d.niv !== undefined && p){
    const st = sec(p.code);
    if (t.value) st.override[d.niv] = t.value; else { delete st.override[d.niv]; delete st.overrideMotif[d.niv]; }
    logEvent('niveau de risque arbitré', p.lib + ' · ' + d.niv, t.value ? 'forcé : ' + NIV_LIB[t.value] : 'retour au calcul');
    renderImpact(); return renderMain();
  }
  if (d.ctr !== undefined && p){
    const pr = PROCEDURES.find(x => x.code === d.pcode);
    const l = (wpProc(p, pr) || []).find(x => String(x.cle) === String(d.ctr).split('|')[0]);
    if (l) l.champs[d.ctr] = t.value;

    (S.achevement.points[k] = S.achevement.points[k] || {})[i] = t.checked;
    logEvent('point de diligence ' + (t.checked ? 'exécuté' : 'décoché'), ACH[k].t, ACH[k].pts[+i].slice(0, 60));
    return renderMain(); }
  if (t.id === 'ach-op'){ S.achevement.opinion = t.value;
    logEvent('opinion arrêtée', 'Altiverre SAS FY2025', t.value); return renderMain(); }
  if (d.rdisp !== undefined){ const x = resolDeCle(d.rdisp); if (x) x.r.disposition = t.value; return renderMain(); }
  if (d.rpiece !== undefined){ const x = resolDeCle(d.rpiece); if (x) x.r.corrobPiece = t.value; return renderMain(); }
  if (d.je !== undefined){ S.jeCrit[d.je] = t.checked; return renderMain(); }
  if (t.id === 'je-an'){ S.jeSansAN = t.checked; return renderMain(); }
  if (d.aff !== undefined){
    const [code, role] = d.aff.split('|');
    const r = affecter(code, role, t.value);
    S.affErreur = r.ok ? '' : r.why;
    return renderMain();
  }
  if (t.id === 'imp-de'){ S.impactDe = +t.value; return renderMain(); }
  if (t.id === 'imp-vers'){ S.impactVers = +t.value; return renderMain(); }
  if (t.id === 'ft-phase'){ S.filtreTrav.phase = t.value; return renderMain(); }
  if (t.id === 'ft-nature'){ S.filtreTrav.nature = t.value; return renderMain(); }
  if (t.id === 'ft-personne'){ S.filtreTrav.personne = t.value; return renderMain(); }

  if (t.id === 'f-statut'){ S.filtres.statut = t.value; return renderMain(); }
  if (t.id === 'f-section'){ S.filtres.section = t.value; return renderMain(); }
  if (t.id === 'f-contact'){ S.filtres.contact = t.value; return renderMain(); }
  if (t.id === 'f-echeance'){ S.filtres.echeance = t.value; return renderMain(); }
  if (t.id === 'env-cad'){ S.envoi.cadence = t.value; return renderMain(); }
  if (t.id === 'env-dest'){ S.envoi.destinataires = [...t.selectedOptions].map(o => o.value); return renderMain(); }
  if (d.crole !== undefined){ const c = S.contacts.find(x => x.id === d.crole); if (c) c.role = t.value; return renderMain(); }
  if (t.id === 'pp-cad'){ S.portail.cadence = +t.value; return renderMain(); }
  if (t.id === 'pp-esc'){ S.portail.escalade = +t.value; return renderMain(); }

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-vue]');
  if (a) return aller(a.dataset.vue);
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset, p = posteCourant();

  if (t.id === 'themebtn'){
    const cur = document.documentElement.dataset.theme
      || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    document.documentElement.dataset.theme = cur === 'dark' ? 'light' : 'dark';
    return;
  }
  if (d.espace){ const x = ESPACES.find(y => y.id === d.espace); return aller(x.defaut, x.id); }
  if (d.open) return ouvrirSection(d.open);
  if (d.goreq){ const r = S.requetes.find(x => x.id === d.goreq);
    if (r){ const c = S.contacts.find(x => x.id === r.contact); if (c) S.moiClient = c.id; }
    return aller('cli.vue', 'client'); }

  /* ── sélection et enchaînement ── */
  if (d.proc){ S.procOuverte = S.procOuverte === d.proc ? null : d.proc; renderMain();
    const b = document.getElementById('b4'); if (b) b.scrollIntoView({ block:'start' }); return; }
  if (d.ctrtout){ S.ctrTout[d.ctrtout] = !S.ctrTout[d.ctrtout]; return renderMain(); }
  if (d.pnouveau && p){
    const st = proc(p.code, d.pnouveau);
    st.seed = 'otto-' + p.code.toLowerCase() + '-' + d.pnouveau.toLowerCase() + '-' + String(seedOf(st.seed) % 9000 + 1000);
    st.wp = null;
    logEvent('nouveau germe', p.lib + ' · ' + d.pnouveau, st.seed);
    renderImpact(); return renderMain();
  }
  if (d.preq && p){
    const pr = PROCEDURES.find(x => x.code === d.preq);
    if (pr) requeteJustificatifsProc(p, pr);
    renderImpact(); return renderMain();
  }
  if (d.plire && p){
    const pr = PROCEDURES.find(x => x.code === d.plire);
    let n = 0;
    for (const c of controles(p, pr)){
      if (etatControle(c) !== 'recue') continue;
      const v = c.ch.val(c.ligne.x);
      c.ligne.champs[c.cle] = c.ch.type === 'montant' ? (v / 100).toFixed(2).replace('.', ',')
                            : c.ch.type === 'bool' ? (v ? 'oui' : 'non') : String(v);
      n++;
    }
    marquerExecution(p, pr);
    logEvent('valeurs relevées saisies', p.lib + ' · ' + procRef(p, pr),
             n + ' champ(s) · version ' + S.version);
    renderImpact(); return renderMain();
  }
  if (d.ravar && p){
    const l = revueAnalytique().find(x => x.compte === d.ravar);
    if (l) requeteVariation(p, d.ravar, l);
    renderImpact(); return renderMain();
  }
  if (t.id === 'req-add' && p){
    const ti = document.getElementById('req-titre'), dl = document.getElementById('req-delai');
    if (!ti.value.trim()) return;
    creerRequete(p.code, ti.value.trim(), ['Éléments demandés'], +dl.value);
    renderImpact(); return renderMain();
  }

  /* ── notes de revue ── */
  if (d.noteCible){
    const [section, objet, ref, lib] = d.noteCible.split('|');
    S.noteCible = { section, objet, ref, lib };
    renderMain();
    const b = document.querySelector('#b6') || document.querySelector('#main');
    if (b) b.scrollIntoView({ block:'start' });
    const i = document.getElementById('nt-txt'); if (i) i.focus();
    return;
  }
  if (t.id === 'nt-annul'){ S.noteCible = null; return renderMain(); }
  if (t.id === 'nt-add'){
    const txt = document.getElementById('nt-txt');
    if (!txt || !txt.value.trim() || !S.noteCible) return;
    const n = ajouterNote(document.getElementById('nt-type').value, S.noteCible, txt.value.trim());
    n.pour = document.getElementById('nt-pour').value;
    S.noteCible = null; renderImpact(); return renderMain();
  }
  if (d.repok){
    const i = document.querySelector(`input[data-rep="${d.repok}"]`);
    const n = S.notes.find(x => x.id === +d.repok);
    if (i && n && i.value.trim()){ n.reponses.push({ par:S.moi, t:tick(), texte:i.value.trim() });
      logEvent('réponse à une note', '#' + n.id + ' — ' + n.ancre.lib, USERS[S.moi].nom); }
    return renderMain();
  }
  if (d.clos){
    const n = S.notes.find(x => x.id === +d.clos);
    if (n && peutClore(S.moi, n)){ n.clos = { par:S.moi, t:tick() };
      logEvent('note close', '#' + n.id + ' — ' + n.ancre.lib, USERS[S.moi].nom + ' (' + ROLE_LIB[USERS[S.moi].role] + ')'); }
    renderImpact(); return renderMain();
  }
  if (d.goanc){
    const n = S.notes.find(x => x.id === +d.goanc);
    if (!n) return;
    if (n.ancre.section === 'JE') aller('plan.je', 'auditeur'); else ouvrirSection(n.ancre.section);
    setTimeout(() => {
      const el = [...document.querySelectorAll('[data-note-cible]')]
        .find(x => x.dataset.noteCible.startsWith(n.ancre.section + '|' + n.ancre.objet + '|' + n.ancre.ref + '|'));
      if (el){ const tr = el.closest('tr') || el.closest('div');
        if (tr){ tr.scrollIntoView({ block:'center' }); tr.style.outline = '2px solid var(--accent)';
                 setTimeout(() => { tr.style.outline = ''; }, 1800); } }
    }, 60);
    return;
  }

  /* ── conclusion, visa, reprise N-1, clôture ── */
  if (d.n1 && p){ sec(p.code).reprisN1Vues[d.n1] = 'Reconfirmé par ' + USERS[S.moi].nom + ' le ' + horo(tick());
    logEvent('travail N-1 reconfirmé', p.lib + ' · ' + d.n1, USERS[S.moi].nom); return renderMain(); }
  if (t.id === 'sec-visa' && p){
    if (obstaclesVisa(p).length) return;
    sec(p.code).visa = { par:S.moi, t:tick(), version:S.version };
    logEvent('section visée', p.lib, USERS[S.moi].nom + ' (' + ROLE_LIB[USERS[S.moi].role] + ')');
    return renderMain();
  }
  if (t.id === 'sec-devisa' && p){ sec(p.code).visa = null;
    logEvent('visa retiré', p.lib, USERS[S.moi].nom); return renderMain(); }
  if (t.id === 'clore-dossier'){
    if (notesBloquantesOuvertes().length) return;
    S.dossierClos = true; logEvent('dossier clôturé', 'Altiverre SAS FY2025', USERS[S.moi].nom);
    return renderMain();
  }

  /* ── portail client ── */
  if (d.clitout){ S.cliTout = S.cliTout || {}; S.cliTout[d.clitout] = !S.cliTout[d.clitout]; return renderMain(); }
  if (d.depot){ const [rid, iid] = d.depot.split('|'); deposer(rid, +iid); renderImpact(); return renderMain(); }
  if (d.clot){
    const r = S.requetes.find(x => x.id === d.clot);
    if (r && r.items.every(i => i.statut !== 'non_recu' && i.statut !== 'partiel')){
      r.clotureClient = true;
      for (const i of r.items) i.statut = 'traitement';
      logEvent('client : tout est déposé', r.id + ' — ' + r.titre, contactCourant().nom);
      // côté auditeur, la demande complète passe en attente de revue
      for (const i of r.items){ i.statut = 'attente_revue'; i.revoyeur = USERS.lea.nom; }
    }
    renderImpact(); return renderMain();
  }
  if (d.msgok){
    const i = document.querySelector(`input[data-msg="${d.msgok}"]`), r = S.requetes.find(x => x.id === d.msgok);
    if (i && r && i.value.trim()){
      r.messages.push({ cote:S.espace === 'client' ? 'cli' : 'aud',
                        par:S.espace === 'client' ? contactCourant().nom : USERS[S.moi].nom,
                        t:tick(), texte:i.value.trim() });
      logEvent('message sur requête', r.id, i.value.trim().slice(0, 60));
    }
    return renderMain();
  }
  if (t.id === 'ct-add'){
    const g = id => document.getElementById(id);
    const nom = g('ct-nom').value.trim(); if (!nom) return;
    const id = 'c' + (S.contacts.length + 1) + seedOf(nom) % 100;
    S.contacts.push({ id, nom, fonction:g('ct-fct').value.trim() || 'contact', mail:g('ct-mail').value.trim() || '—',
                      societe:g('ct-soc').value, role:'contributeur',
                      sections:g('ct-sec').value ? [g('ct-sec').value] : [] });
    logEvent('contact ajouté', nom, g('ct-soc').value);
    return renderMain();
  }
  /* ── registre des facteurs de risque ── */
  if (d.gosrc) return aller(d.gosrc, 'auditeur');
  if (d.fconf || d.fecart){
    const id = d.fconf || d.fecart;
    const mi = document.querySelector(`input[data-fmotif="${CSS.escape(id)}"]`);
    const se = document.querySelector(`select[data-feff="${CSS.escape(id)}"]`);
    const motif = mi ? mi.value.trim() : '', effet = se ? se.value : 'majore';
    // écarter, ou confirmer en neutralisant, sont des décisions qui doivent s'écrire
    if (!motif && (d.fecart || effet === 'neutre')){
      if (mi){ mi.focus(); mi.style.borderColor = 'var(--anomalie)'; mi.placeholder = 'motif obligatoire pour cette décision'; }
      return;
    }
    statuerFacteur(id, d.fconf ? 'confirme' : 'ecarte', motif, effet);
    renderImpact(); return renderMain();
  }
  if (d.frouvre){ delete S.decisionsFacteurs[d.frouvre];
    logEvent('facteur de risque remis en attente', d.frouvre, USERS[S.moi].nom);
    renderImpact(); return renderMain(); }
  if (t.id === 'mf-add'){
    const g = x => document.getElementById(x);
    const desc = g('mf-desc').value.trim();
    const fsli = [...g('mf-fsli').selectedOptions].map(o => o.value);
    const ass  = [...g('mf-ass').selectedOptions].map(o => o.value);
    if (!desc || !fsli.length || !ass.length){
      const manque = !desc ? 'mf-desc' : !fsli.length ? 'mf-fsli' : 'mf-ass';
      const el = g(manque); if (el){ el.focus(); el.style.borderColor = 'var(--anomalie)'; }
      return;
    }
    const id = 'MANUEL:' + String(++S.seqFacteurManuel).padStart(3, '0');
    S.facteursManuels.push({ id, regle:'MANUEL', regleLib:'Facteur levé à la main',
      nature:g('mf-nat').value, description:desc,
      cibles:fsli.map(c => ({ fsli:c, assertions:ass })),
      pertinence:'jugement de l’auditeur',
      source:{ lib:g('mf-src').value.trim() || 'saisi à la main', vue:null, ref:'' },
      cree:tick() });
    logEvent('facteur de risque levé à la main', id, desc.slice(0, 80) + ' → ' + fsli.join(', '));
    renderImpact(); return renderMain();
  }
  if (t.id === 'ach-clore'){ S.achevement.clos = { par:S.moi, t:tick() };
    logEvent('dossier clôturé et verrouillé', 'Altiverre SAS FY2025',
             USERS[S.moi].nom + ' — assemblage dans les ' + DELAI_ASSEMBLAGE + ' jours du rapport');
    return renderMain(); }
  if (d.raprelim){
    const l = revueAnalytique().find(x => x.compte === d.raprelim);
    if (l){
      const ps = postesDuCompte(d.raprelim);
      const r = creerRequete(ps.length ? ps[0].code : 'CA', 'Explication de variation — compte ' + d.raprelim,
        [{ desc:questionVariation(l), ref:d.raprelim }], 10);
      r.origine = 'revue analytique préliminaire';
    }
    renderImpact(); return renderMain();
  }
  if (d.rconclure){
    const x = resolDeCle(d.rconclure);
    if (x){ const r = conclureResolution(x.r, x.constate, x.lib); S.affErreur = r.ok ? '' : r.why; }
    renderImpact(); return renderMain();
  }
  if (d.rannul){
    const x = resolDeCle(d.rannul);
    if (x) annulerResolutionR(x.r, x.lib);
    renderImpact(); return renderMain();
  }
  if (d.tstat){
    const [code, st] = d.tstat.split('|');
    const r = changerStatut(code, st);
    S.affErreur = r.ok ? '' : r.why;
    return renderMain();
  }
  if (d.vers){
    prendreEnCompte(+d.vers);
    _impCache.clear();
    return render();
  }
  if (t.id === 'bal-tout'){ S.balTout = !S.balTout; return renderMain(); }
  if (d.recon){
    const r = reconfirmer(d.recon);
    S.affErreur = r.ok ? '' : r.why;
    return renderMain();
  }
  if (d.goecart){
    if (d.goecart.startsWith('fsli:')) return ouvrirSection(d.goecart.slice(5));
    return aller(d.goecart, 'auditeur');
  }
  if (d.gotrav) return aller(d.gotrav, 'auditeur');
  if (t.id === 'tv-auto'){
    // la règle s'applique : préparateur = préparateur, réviseur selon le niveau exigé
    let n = 0;
    for (const x of travaux()){
      const st = trav(x.code);
      if (!st.preparateur){ st.preparateur = 'karim'; n++; }
      if (!st.reviseur){
        st.reviseur = x.niveauRevue === 2 ? 'claire' : 'lea';
        if (st.reviseur === st.preparateur) st.reviseur = 'claire';
        n++;
      }
    }
    logEvent('affectation en masse', 'programme de travail', n + ' affectation(s) selon la règle');
    S.affErreur = '';
    return renderMain();
  }
  if (t.id === 'ft-imprime' || t.id === 'mi-imprime'){ window.print(); return; }
  if (d.xlsm){
    const c = classeur(d.xlsm);
    telecharger('mission-altiverre-2025-' + d.xlsm + '.xls', c.xml, 'application/vnd.ms-excel');
    logEvent('classeur généré', 'vue globale — ' + PERIMETRES[d.xlsm].lib, c.feuilles.length + ' feuille(s)');
    const o = document.getElementById('exp-out');
    if (o) o.innerHTML = `<div class="callout">Classeur « ${esc(PERIMETRES[d.xlsm].lib)} » — ${c.feuilles.length} feuille(s).</div>`;
    return;
  }
  if (t.id === 'f-raz'){ S.filtres = { statut:'', section:'', contact:'', echeance:'', q:'' }; return renderMain(); }
  if (d.perim){ S.envoi.perimetre = d.perim; return renderMain(); }
  if (d.xls){
    const c = classeur(d.xls);
    const ok = telecharger('suivi-altiverre-2025-' + d.xls + '.xls', c.xml, 'application/vnd.ms-excel');
    logEvent('classeur généré', 'statut de mission — ' + PERIMETRES[d.xls].lib,
             c.feuilles.length + ' feuille(s)');
    document.getElementById('exp-out').innerHTML = ok
      ? `<div class="callout">Classeur généré : ${c.feuilles.length} feuille(s), format SpreadsheetML lisible par
         Excel et LibreOffice. Si rien ne s’est téléchargé, c’est que la page est ouverte dans un cadre qui bloque les
         téléchargements : ouvrez le fichier directement dans le navigateur.</div>`
      : '<div class="callout bad">Le téléchargement a été refusé par le navigateur.</div>';
    return;
  }
  if (d.csv){
    const l = [PERIMETRES[d.csv].cols, ...lignesExport(d.csv, S.requetes)];
    const csv = l.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\n');
    telecharger('suivi-altiverre-2025-' + d.csv + '.csv', '\uFEFF' + csv, 'text/csv');
    logEvent('export CSV généré', PERIMETRES[d.csv].lib, l.length - 1 + ' ligne(s)');
    document.getElementById('exp-out').innerHTML =
      `<div class="callout"><b>${l.length - 1} ligne(s)</b></div><textarea rows="8" readonly>${esc(csv)}</textarea>`;
    return;
  }
  if (d.imprime){ window.print(); return; }
});

/* ═══ 24. DÉMARRAGE ════════════════════════════════════════════════════════ */
initPortail();
/* Quelques requêtes préexistantes, pour que le dossier ne parte pas d'un écran
   vide : elles sont créées par le même chemin que celles de l'enchaînement. */
(function amorce(){
  const r1 = creerRequete('TRESO', 'Confirmations bancaires et relevés au 31/12/2025',
    ['Listing des banques et contacts', 'Relevés au 31/12/2025', 'Explication du compte 512200 hors listing'], -20);
  r1.origine = 'enchaînement : exhaustivité';
  r1.items[0].statut = 'depose'; r1.items[0].depots = [{ nom:'listing-banques-2025.pdf', t:tick(), par:'Delphine Martin' }];
  r1.items[1].statut = 'partiel'; r1.items[1].depots = [{ nom:'releve-blc-decembre.pdf', t:tick(), par:'Delphine Martin' }];
  const r2 = creerRequete('PERSONNEL', 'Justificatifs de paie', ['Journal de paie annuel', 'Contrats des entrées de l’exercice'], -6);
  r2.items[0].statut = 'attente_revue'; r2.items[0].revoyeur = USERS.lea.nom;
  r2.items[0].depots = [{ nom:'journal-paie-2025.pdf', t:tick(), par:'Sophie Brun' }];
  S.events.length = 0; HORLOGE = '2026-03-15T09:12';   // l'amorce n'est pas un événement de la session
})();
render();
if (window.ResizeObserver) new ResizeObserver(syncTopHeight).observe(document.querySelector('.top'));
addEventListener('resize', syncTopHeight);

</script>
