    blk('Anomalies relevées', a.length + ' au total',
      table([{k:'src',t:'Origine'},{k:'lib',t:'Anomalie',cls:'wrapcell'},{k:'c',t:'Écart constaté',n:1},

             {k:'m',t:'Écart résiduel',n:1},

            { foot:{ src:'Cumul non corrigé', c:eur(retenues.reduce((t, x) => t + x.constate, 0)),
                     e:eur(explique), x:eur(corrige), m:eur(cumul) } }) +
      (doublesCumul().length ? `<div class="callout bad" style="margin-top:10px">
        <b>${doublesCumul().length} pièce(s) comptée(s) plusieurs fois au cumul.</b>
        Une même facture est relevée dans deux sections — au compte de tiers et au compte de résultat —
        et son écart entre donc deux fois, alors qu’il ne fausse les comptes qu’une fois.
        ${doublesCumul().map(x => `<div class="smallcaps"><span class="mono">${esc(x.piece)}</span> —
          ${x.comptees} fois, ${eur(x.montant)} au total : ${esc(x.l.map(y => y.src).join(' · '))}</div>`).join('')}
        Rien n’est déduit d’office : qualifiez l’un des côtés « déjà cumulée » dans son papier de travail,
        avec la pièce ou l’écriture qui corrobore. C’est une décision d’auditeur, pas une soustraction automatique.</div>` : '') +
      `<p class="note">La résolution d’un écart se documente là où il est né — dans le papier de travail, le
      rapprochement ou le test des écritures — et jamais ici. Une explication du client n’y suffit pas :
      il faut une conclusion écrite, une qualification, un lien vers la pièce ou l’écriture qui corrobore,
      un auteur et une date. Seul le résiduel entre dans le cumul ci-dessous.</p>
      <p class="note">La colonne « corrigé par écriture » n’est pas saisie non plus : elle vient des

      nomment la pièce qu’elles corrigent. Une correction partielle laisse le reste au cumul. Le détail,

      <div class="grid2" style="margin-top:10px">
        <div class="kv">

          <span class="k">Sous le seuil de remontée (${eur0(s.CTT)})</span><span class="v">${triviales.length}</span>
          <span class="k">Expliquées et corroborées</span><span class="v">${retenues.filter(x => x.acquis).length} — ${eur(explique)}</span>
          <span class="k">Résiduelles</span><span class="v">${nonResolues.length} — ${eur(cumul)}</span>
          <span class="k">Seuil de signification</span><span class="v">${eur(s.M)}</span>
          <span class="k">Rapport au seuil</span><span class="v">${pct(Math.abs(cumul) / s.M, 0)}</span>
        </div>

/* ═══ 25. REGISTRE DES FACTEURS DE RISQUE ══════════════════════════════════
   Ce que doivent faire circuler les sections, ce ne sont pas des lignes de
   tableau : ce sont des CONSTATATIONS. Une constatation levée par une
   procédure — un écart de rapprochement, une écriture de direction, une
   pièce datée hors exercice — doit se poser SEULE sur les sections
   concernées, avec un lien vers sa source, sans ressaisie.

   Le facteur est un objet de première classe : source, nature, description,
   FSLI et assertions touchés, statut, effet retenu. Il n'est PAS un
   enregistrement figé : les candidats sont re-dérivés à chaque rendu par les
   règles ci-dessous (donc ils suivent la matérialité), tandis que la DÉCISION
   humaine — confirmé, écarté, effet retenu — est conservée par identifiant
   stable. Bouger un seuil ne perd jamais un arbitrage.

   GARDE-FOU. Trois cents alertes que personne ne lit, c'est le défaut
   classique de l'analyse de données en audit. Chaque règle porte donc un
   SEUIL DE PERTINENCE explicite et modifiable, le compteur de facteurs
   proposés est affiché en permanence, et la vue de triage alerte dès que le
   volume sort de l'ordre de la dizaine.
   ═══════════════════════════════════════════════════════════════════════ */

const CIBLE_VOLUME = 15;   // au-delà, le registre prévient qu'il devient du bruit

/** Postes touchés par un compte donné. */
function postesDuCompte(compte){
  return postesCalcules().filter(p => p.re.test(compte));
}

/* ── règles de levée ──────────────────────────────────────────────────────
   Chaque règle : un code, une source (procédure qui la lève et vue où la
   relire), un seuil de pertinence nommé, et une fonction qui rend des
   candidats. L'identifiant d'un candidat est stable : règle + clé métier.  */
const REGLES_FACTEUR = [
  {
    code:'RAPPRO', lib:'Écart de rapprochement balance ↔ grand livre non résolu',
    srcLib:'Rapprochement balance ↔ grand livre', srcVue:'plan.rappro',
    seuilLib:'écart minimal retenu', seuilUnite:'€', seuilDefaut:() => seuils().CTT / 100, pas:100,
    nature:'quantitatif',
    calc(seuil){
      const out = [];
      for (const r of rapprochement()){
        if (Math.abs(r.ecart) < seuil * 100) continue;
        const postes = postesDuCompte(r.compte);
        if (!postes.length) continue;
        out.push({
          id:'RAPPRO:' + r.compte,
          description:`Le compte ${r.compte} « ${r.lib} » présente un écart de ${eur(r.ecart)} entre la balance `
                    + `transmise et le fichier des écritures. Tant qu’il n’est pas expliqué, le détail du poste `
                    + `n’est pas rapproché de son solde.`,
          cibles:postes.map(p => ({ fsli:p.code, assertions:['exhaustivite'] })),
          pertinence:`écart ${eur(Math.abs(r.ecart))} ≥ seuil ${eur(seuil * 100)}`,
          srcRef:'compte ' + r.compte,
        });
      }
      return out;
    },
  },
  {
    /* Chemin parcouru sur cette règle, parce qu'il dit ce que vaut le garde-fou.
       « La direction a saisi des écritures » : 62 écritures sur 1 605, réparties
       sur tous les postes → treize facteurs, c'est-à-dire du bruit pur.
       « … et porteuses d'un second marqueur » : encore onze.
       En regardant la distribution : douze postes entre 11 k€ et 244 k€, aucune
       coupure naturelle. Il n'y a pas de seuil ABSOLU défendable — le générateur
       attribue la saisie par la direction au hasard, donc il n'y a AUCUNE
       concentration à trouver. Choisir un montant qui « donne trois facteurs »
       aurait été régler le nombre, pas le critère.
       Le critère qui a un sens est donc RELATIF : la direction pèse-t-elle sur ce
       poste une part anormale de sa masse ? Sur ce jeu de données la réponse est
       non, et la règle ne lève rien — c'est le bon résultat. Une règle qui
       trouverait quelque chose ici serait une règle qui trouve toujours quelque
       chose. Baissez le seuil dans la vue de triage pour la voir se déclencher :
       c'est le compromis, et il est sous votre main. */
    code:'DIRECTION', lib:'Poids anormal des écritures de direction sur le poste',
    srcLib:'Test des écritures', srcVue:'plan.je',
    seuilLib:'part minimale de la masse du poste', seuilUnite:'%', seuilDefaut:() => 5, pas:0.5,
    nature:'qualitatif',
    calc(seuil){
      const marqueurs = [
        { lib:'journal d’opérations diverses', f:e => e.journal === 'OD' },
        { lib:'comptabilisée un week-end',     f:e => isWeekend(e.date) },

const _regleCache = new Map();
/** Candidats d'une règle, mémoïsés sur (règle, seuil, seuils de la mission).
 *  Sans cela, le rail — qui interroge les obstacles au visa de chaque section —
 *  relançait le registre entier seize fois par rendu. */
function candidatsRegle(r){
  const s = seuils(), seuil = seuilRegle(r.code);
  const cle = r.code + '|' + seuil + '|' + s.PM + '|' + s.CTT;
  if (_regleCache.has(cle)) return _regleCache.get(cle);
  const v = r.calc(seuil);
  if (_regleCache.size > 200) _regleCache.clear();
  _regleCache.set(cle, v);
  return v;
}
function seuilRegle(code){
  const r = REGLES_FACTEUR.find(x => x.code === code);
  return S.seuilsFacteurs[code] !== undefined ? S.seuilsFacteurs[code] : r.seuilDefaut();
}

/* ── le questionnaire alimente LE MÊME registre ───────────────────────────
   Une réponse « oui » CRÉE un facteur, avec sa source — le questionnaire n'a
   pas son chemin à lui. Une différence avec les candidats des règles : le
   facteur naît CONFIRMÉ, parce que la réponse EST la décision humaine.
   Redemander à quelqu'un de confirmer ce qu'il vient de répondre est la
   cérémonie qui fait qu'on cesse de lire. Il reste écartable, avec motif,
   comme n'importe quel autre facteur.

   Un « oui » sans précision écrite produit un facteur INCOMPLET : il compte,
   mais l'écran le dit et le visa s'en trouve bloqué — même règle qu'un facteur
   écarté sans motif. */
function reponseQuestion(q, code){
  return q.portee === 'entite' ? (S.questEntite[q.code] || {})
                               : { rep:sec(code).quest[q.code], prec:sec(code).questPrec[q.code] };
}
function facteursQuestionnaire(){
  const out = [];
  for (const q of QUEST_ENTITE){
    const r = S.questEntite[q.code] || {};
    if (r.rep !== 'oui') continue;
    const cibles = postesEnPerimetre().map(p => ({ fsli:p.code, assertions:[q.a] }));
    if (!cibles.length) continue;
    out.push({
      id:'QUEST:' + q.code, questionnaire:true, question:q, portee:'entite',
      description:q.q + ' — répondu OUI. ' + (r.prec || '').trim() + ' ' + q.effet,
      cibles, incomplet:!(r.prec || '').trim(),
      pertinence:'réponse d’entité · nature ' + NATURES_RI[q.nat].lib,
      srcRef:'questionnaire d’entité', par:r.par, t:r.t,
    });
  }
  for (const p of postesEnPerimetre()){
    const st = sec(p.code);
    for (const q of QUEST_SECTION){
      if (st.quest[q.code] !== 'oui') continue;
      const prec = (st.questPrec[q.code] || '').trim();
      out.push({
        id:'QUEST:' + q.code + ':' + p.code, questionnaire:true, question:q, portee:'section',
        description:q.q + ' — répondu OUI sur ' + p.lib + '. ' + prec + ' ' + q.effet,
        cibles:[{ fsli:p.code, assertions:[q.a] }], incomplet:!prec,
        pertinence:'réponse de section · nature ' + NATURES_RI[q.nat].lib,
        srcRef:p.lib, par:st.questPar && st.questPar[q.code], t:st.questT && st.questT[q.code],
      });
    }
  }
  return out;
}
/** Questions restées sans réponse — une évaluation de risque incomplète. */
function questionsSansReponse(code){
  const st = sec(code);

  const e = code === undefined ? QUEST_ENTITE.filter(q => !(S.questEntite[q.code] || {}).rep) : [];
  return { section:s, entite:e };

function repondreQuestion(q, code, rep, prec){
  if (q.portee === 'entite'){
    const av = (S.questEntite[q.code] || {}).rep;
    S.questEntite[q.code] = { rep, prec:prec !== undefined ? prec : (S.questEntite[q.code] || {}).prec || '',
                              par:S.moi, t:tick() };
    if (av !== rep) logEvent('questionnaire de risque — entité', q.q.slice(0, 70), 'réponse : ' + rep);
  } else {
    const st = sec(code);
    const av = st.quest[q.code];
    st.quest[q.code] = rep;
    if (prec !== undefined) st.questPrec[q.code] = prec;
    st.questPar = st.questPar || {}; st.questT = st.questT || {};
    st.questPar[q.code] = S.moi; st.questT[q.code] = tick();
    if (av !== rep) logEvent('questionnaire de risque — ' + libFsli(code), q.q.slice(0, 70), 'réponse : ' + rep);
  }
  _regCache = null; _regCle = '';
}

/** Registre complet : candidats re-dérivés + facteurs saisis à la main,
 *  chacun portant la décision humaine conservée par identifiant. */
let _regCache = null, _regCle = '';
function registre(){
  const sq = seuils();
  const cle = JSON.stringify([S.seuilsFacteurs, S.decisionsFacteurs, S.facteursManuels.length, sq.PM, sq.CTT,
    S.questEntite, postesEnPerimetre().map(p => p.code + JSON.stringify(sec(p.code).quest)).join('|')]);
  if (_regCache && _regCle === cle) return _regCache;
  const out = [];
  for (const r of REGLES_FACTEUR){
    for (const c of candidatsRegle(r)){
      const d = S.decisionsFacteurs[c.id] || {};
      out.push({ ...c, regle:r.code, regleLib:r.lib, nature:r.nature,
                 source:{ lib:r.srcLib, vue:r.srcVue, ref:c.srcRef },
                 auto:true,
                 statut:d.statut || 'propose', motif:d.motif || '',
                 effet:d.effet || 'majore', par:d.par, t:d.t, cree:d.cree || S.premierRendu });
    }
  }
  for (const f of S.facteursManuels){
    const d = S.decisionsFacteurs[f.id] || {};
    out.push({ ...f, auto:false,
               statut:d.statut || 'propose', motif:d.motif || '',
               effet:d.effet || 'majore', par:d.par, t:d.t });
  }
  for (const f of facteursQuestionnaire()){
    const d = S.decisionsFacteurs[f.id] || {};
    out.push({ ...f, regle:'QUESTIONNAIRE', regleLib:'Questionnaire résiduel de risque',
               nature:'qualitatif', auto:false,
               source:{ lib:f.portee === 'entite' ? 'Questionnaire d’entité' : 'Questionnaire de la section',
                        vue:f.portee === 'entite' ? 'plan.facteurs' : 'fsli:' + f.cibles[0].fsli,
                        ref:f.srcRef },
               statut:d.statut || 'confirme', motif:d.motif || '',
               effet:d.effet || 'majore',
               par:d.par || f.par, t:d.t || f.t, cree:d.cree || S.premierRendu });
  }
  _regCache = out; _regCle = cle;
  return out;
}
function facteursDe(code){ return registre().filter(f => f.cibles.some(c => c.fsli === code)); }
function facteursProposes(code){ return facteursDe(code).filter(f => f.statut === 'propose'); }
/** Facteurs confirmés ET retenus comme majorants, sur une assertion donnée. */
function facteursRetenus(code, assertion){
  return registre().filter(f => f.statut === 'confirme' && f.effet === 'majore'
    && f.cibles.some(c => c.fsli === code && (assertion === undefined || c.assertions.includes(assertion))));
}
function statuerFacteur(id, statut, motif, effet){
  const f = registre().find(x => x.id === id); if (!f) return;
  S.decisionsFacteurs[id] = { statut, motif:motif || '', effet:effet || 'majore',
                              par:S.moi, t:tick(), cree:f.cree };
  logEvent('facteur de risque ' + (statut === 'confirme' ? 'confirmé' : statut === 'ecarte' ? 'écarté' : 'remis en attente'),
           id, (motif ? motif.slice(0, 80) : '') + (statut === 'confirme' ? ' · effet : ' + effet : ''));
}

/* ── le questionnaire, à l'écran ──────────────────────────────────────────
   Chaque question porte la RAISON pour laquelle elle existe encore. C'est la
   règle de conception du questionnaire résiduel : si une autre source du
   dossier peut y répondre, la question ne doit pas être posée. */
function ligneQuestion(q, code){
  const r = reponseQuestion(q, code);

              : '<span class="pill warn">sans réponse</span>'}
      ${r.par ? `<span class="smallcaps">${esc(USERS[r.par] ? USERS[r.par].nom : r.par)}${r.t ? ' · ' + horo(r.t) : ''}</span>` : ''}
    </div>
    <div class="txt">${esc(q.q)}</div>
    <div class="row" style="margin-top:5px">

      Tant qu’elle manque, le visa de la section reste bloqué.</div>` : ''}

}
function blocQuestionnaireEntite(){
  const sans = QUEST_ENTITE.filter(q => !(S.questEntite[q.code] || {}).rep);

      + (sans.length ? ' · ' + sans.length + ' sans réponse' : ''),
    `<p class="note">Quatre questions posées <b>une fois pour le dossier</b>. Une réponse « oui » crée un facteur

    s’arrêtent pas à un cycle. Le questionnaire n’a pas de chemin à lui — il alimente le même registre, avec sa
    source, et le facteur reste écartable avec motif.</p>
    ${QUEST_ENTITE.map(q => ligneQuestion(q, undefined)).join('')}`,
    sans.length ? sans.length + ' sans réponse' : '');
}

        : '<p class="note">Aucun facteur statué pour l’instant.</p>'}

/* ═══ 28. REVUE ANALYTIQUE — TROIS MOMENTS ═════════════════════════════════
   Ce ne sont pas trois affichages d'un même module : ce sont trois diligences
   différentes, à trois moments différents, avec trois finalités.
     · préliminaire — en planification, transverse, elle ALIMENTE le registre
       des facteurs de risque ;
     · substantive  — dans une section, comme procédure à valeur probante ;
     · finale       — à l'achèvement, cohérence d'ensemble avant signature.
   ═══════════════════════════════════════════════════════════════════════ */

/** Ratios calculés des deux exercices. Aucun n'est saisi. */
function ratios(){
  const q = (b, re) => { let s = 0; for (const [c, v] of b) if (re.test(c)) s += v.solde; return s; };
  const f = b => {
    const ca = -q(b, /^70/), achats = q(b, /^60/), perso = q(b, /^64/),
          stocks = q(b, /^3/), clients = q(b, /^41/), fourn = -q(b, /^40/),
          produits = -q(b, /^7/), charges = q(b, /^6/), fin = q(b, /^66/);
    return { ca, achats, perso, stocks, clients, fourn, resultat:produits - charges, fin };
  };
  const a = f(bal()), b = f(B24);
  const L = [
    { lib:'Marge sur achats consommés', u:'%', formule:'(chiffre d’affaires − achats consommés) ÷ chiffre d’affaires',
      n:a.ca ? (a.ca - a.achats) / a.ca : 0, n1:b.ca ? (b.ca - b.achats) / b.ca : 0, type:'pct' },
    { lib:'Poids des charges de personnel', u:'%', formule:'charges de personnel ÷ chiffre d’affaires',
      n:a.ca ? a.perso / a.ca : 0, n1:b.ca ? b.perso / b.ca : 0, type:'pct' },
    { lib:'Résultat courant rapporté au chiffre d’affaires', u:'%', formule:'résultat courant ÷ chiffre d’affaires',
      n:a.ca ? a.resultat / a.ca : 0, n1:b.ca ? b.resultat / b.ca : 0, type:'pct' },
    { lib:'Délai de règlement clients', u:'jours', formule:'créances clients ÷ chiffre d’affaires × 365',
      n:a.ca ? a.clients / a.ca * 365 : 0, n1:b.ca ? b.clients / b.ca * 365 : 0, type:'jours' },
    { lib:'Délai de règlement fournisseurs', u:'jours', formule:'dettes fournisseurs ÷ achats consommés × 365',
      n:a.achats ? a.fourn / a.achats * 365 : 0, n1:b.achats ? b.fourn / b.achats * 365 : 0, type:'jours' },
    { lib:'Rotation des stocks', u:'jours', formule:'stocks ÷ achats consommés × 365',
      n:a.achats ? a.stocks / a.achats * 365 : 0, n1:b.achats ? b.stocks / b.achats * 365 : 0, type:'jours' },
    { lib:'Couverture des charges financières', u:'×', formule:'résultat courant ÷ charges financières',
      n:a.fin ? a.resultat / a.fin : 0, n1:b.fin ? b.resultat / b.fin : 0, type:'fois' },
  ];
  return L.map(r => ({ ...r, d:r.n - r.n1,
    fmt:v => r.type === 'pct' ? pct(v, 1) : r.type === 'jours' ? v.toFixed(0).replace('.', ',') + NBSP + 'j'
           : v.toFixed(1).replace('.', ',') + NBSP + '×' }));
}

function vueRAPrelim(){
  const lignes = revueAnalytique().filter(l => l.flag);
  const rt = ratios();
  const deja = c => S.requetes.some(r => r.origine === 'revue analytique préliminaire' && r.items.some(i => i.ref === c));
  return entete('Revue analytique préliminaire', 'planification — elle sert à orienter les travaux, pas à conclure') +
    cite('Revue analytique générée automatiquement, variation comptes entre l’année N (auditée) et N-1 et FSLI, en haut de cette revue analytique un threshold monétaire et un % de variation, si la variation du compte dépasse l’un ou l’autre ou les 2 (à faire valider par un auditeur humain) des questions sur l’explication de la variation sont automatiquement envoyée au client sur l’interface des requêtes.') +
    blk('Seuils', 'le seuil en montant suit par défaut le seuil de planification',
      `<div class="row">
        <div class="ctrl"><label>Seuil en montant</label>
          <input type="number" id="ar-montant" value="${(arSeuilMontant() / 100).toFixed(0)}" step="1000"></div>
        <div class="ctrl"><label>Seuil en pourcentage</label>
          <input type="number" id="ar-pct" value="${S.arPct}" step="1"></div>
        <div class="ctrl"><label>&nbsp;</label>
          <span class="pill ${lignes.length ? 'warn' : ''}">${lignes.length} compte(s) au-dessus d’un seuil</span></div>
      </div>`) +

function soldeDe(comptes){ const b = bal(); return comptes.reduce((a, c) => a + (b.get(c) ? b.get(c).solde : 0), 0); }
const PLAQUETTE = [

    aide:'Le montant ne se lit dans aucun solde : il résulte du tableau de variation. Il doit être documenté.' },
  { ref:'A-02', lib:'Annexe — échéancier des dettes financières à plus d’un an', nature:'calcul',
    formule:'capital restant dû au 31/12/2025 diminué des échéances contractuelles des douze mois suivants',
    aide:'Le solde 164000 ne se ventile pas seul : la ventilation vient du tableau d’amortissement de l’emprunt.' },
  { ref:'A-03', lib:'Annexe — ventilation du chiffre d’affaires par nature', nature:'calcul',

function montantAudite(e){
  if (e.nature === 'calcul') return null;
  return Math.abs(soldeDe(e.comptes));
}
function montantPlaquette(e){
  const a = montantAudite(e);
  return a === null ? null : a + (e.ecart || 0);
}
const NATURE_LIB = { solde:'solde de balance', agregat:'agrégat de comptes', calcul:'calcul à documenter' };

function vueAchPointage(){
  const st = S.achevement;
  const rows = PLAQUETTE.map(e => {
    const aud = e.nature === 'calcul'
      ? (st.calculs[e.ref] && st.calculs[e.ref].montant !== undefined ? st.calculs[e.ref].montant : null)
      : montantAudite(e);
    const pl = e.nature === 'calcul'
      ? (st.plaquette[e.ref] !== undefined ? st.plaquette[e.ref] : null)
      : montantPlaquette(e);
    const ec = (aud === null || pl === null) ? null : pl - aud;
    return {
      ref:`<span class="mono">${e.ref}</span>`,
      lib:`<b>${esc(e.lib)}</b>${e.formule ? '<div class="smallcaps">' + esc(e.formule) + '</div>' : ''}`,
      nat:`<span class="tag ${e.nature === 'calcul' ? 'abs' : 'det'}">${NATURE_LIB[e.nature]}</span>`,
      pl:e.nature === 'calcul'
         ? `<input class="cell" data-plaq="${e.ref}" value="${pl === null ? '' : (pl / 100).toFixed(2).replace('.', ',')}" placeholder="montant plaquette">`
         : eur(pl),
      or:e.nature === 'calcul' ? '<span class="smallcaps">à documenter</span>'
         : `<span class="smallcaps">${e.comptes.join(' · ')}</span>`,
      aud:e.nature === 'calcul'
          ? `<input class="cell" data-calcm="${e.ref}" value="${aud === null ? '' : (aud / 100).toFixed(2).replace('.', ',')}" placeholder="montant audité">`
          : eur(aud),
      ec:ec === null ? '<span class="pill warn">non rapproché</span>'
         : ec === 0 ? '<span class="pill">nul</span>' : '<span class="pill bad">' + eur(ec) + '</span>',
      doc:e.nature === 'calcul'
          ? `<input class="cell txt" data-calcd="${e.ref}" value="${esc((st.calculs[e.ref] || {}).doc || '')}" placeholder="d’où vient le montant">`
          : '<span class="smallcaps">rapproché de la balance</span>',
    };
  });
  const nonRappro = PLAQUETTE.filter(e => {
    const aud = e.nature === 'calcul' ? (st.calculs[e.ref] || {}).montant : montantAudite(e);
    const pl = e.nature === 'calcul' ? st.plaquette[e.ref] : montantPlaquette(e);
    return aud === undefined || aud === null || pl === undefined || pl === null;
  });
  const ecarts = PLAQUETTE.filter(e => {
    const aud = e.nature === 'calcul' ? (st.calculs[e.ref] || {}).montant : montantAudite(e);
    const pl = e.nature === 'calcul' ? st.plaquette[e.ref] : montantPlaquette(e);
    return aud != null && pl != null && pl - aud !== 0;
  });
  const sansDoc = PLAQUETTE.filter(e => e.nature === 'calcul' && !((st.calculs[e.ref] || {}).doc || '').trim());
  return entete('Pointage des états financiers', 'plaquette à gauche, montant audité à droite, écart et origine') +
    cite('Une fonction pointage des états financiers et données chiffrées des annexes où après réception de la plaquette du client, un agent IA vient s’assurer que chaque chiffre cadre bien avec les montants que nous avons audité, dans notre TB et documente un réconciliation sur un Template intégré avec à gauche montant plaquette et à droite montant interne et validé avec une cross reference vers l’origine du montant validé.') +
    blk('Pointage plaquette ↔ comptes audités', `${PLAQUETTE.length} montants · ${ecarts.length} écart(s) · ${nonRappro.length} non rapproché(s)`,
      table([{k:'ref',t:'Réf.'},{k:'lib',t:'Poste de la plaquette',cls:'wrapcell'},{k:'nat',t:'Nature'},
             {k:'pl',t:'Montant plaquette',n:1},{k:'aud',t:'Montant audité',n:1},
             {k:'or',t:'Origine',cls:'wrapcell'},{k:'ec',t:'Écart',n:1},{k:'doc',t:'Documentation du calcul',cls:'wrapcell'}], rows) +
      `<div class="row" style="margin-top:8px">
        <span class="pill ${ecarts.length ? 'bad' : ''}">${ecarts.length} écart(s)</span>
        <span class="pill ${nonRappro.length ? 'warn' : ''}">${nonRappro.length} non rapproché(s)</span>
        <span class="pill ${sansDoc.length ? 'warn' : ''}">${sansDoc.length} calcul(s) sans documentation</span>
        <span class="smallcaps">${PLAQUETTE.filter(e => e.nature === 'calcul').length} des ${PLAQUETTE.length} montants ne se lisent dans aucun solde</span>
      </div>
      <p class="note">Aucune plaquette n’existe dans ce fichier : les montants « solde » et « agrégat » viennent de la
      balance auditée augmentée des écarts semés, ceux marqués « calcul » se saisissent. Lire une plaquette réelle
      relève de l’échelle d’extraction <span class="tag mod">modèle</span>.</p>`);
}

function vueAchAnomalies(){

  const nonCorr = retenues.filter(x => x.montant !== 0);

  const parEcriture = retenues.filter(x => (x.corrigePar || []).length);
  const depasse = Math.abs(cumul) > s.M;

          m:x.montant ? eur(x.montant) : '<span class="smallcaps">—</span>',
          q:(x.corrigePar || []).length
            ? `corrigée par écriture<div class="smallcaps">${esc(x.corrigePar.map(y => 'v' + y.v + ' ' + y.ref).join(', '))}${x.montant ? ' — partiellement' : ''}</div>`
            : x.acquis ? `${esc(DISPOSITIONS[x.res.disposition].lib)}
              <div class="smallcaps">${esc(USERS[x.res.par].nom)}, ${horo(x.res.t)}</div>`
            : `<span class="pill bad">non résolue</span>`,
          v:`<button class="btn mini sec" data-goecart="${esc(x.vue)}">voir</button>`,
        })), { foot:{ src:'Cumul non corrigé', c:eur(retenues.reduce((t, x) => t + x.constate, 0)),

      résolution documentée — explication reçue, conclusion de l’auditeur, qualification, lien vers la pièce ou

function vueAchCloture(){
  const st = S.achevement, postes = postesEnPerimetre();
  const nonVisees = postes.filter(p => !sec(p.code).visa);
  const bloq = notesBloquantesOuvertes();
  const facteursOuverts = registre().filter(f => f.statut === 'propose');
  const echeance = addDays(DATE_RAPPORT_(), DELAI_ASSEMBLAGE);
  const jours = Math.round((Date.parse(echeance) - Date.parse(S.aujourdhui)) / 86400000);
  const obstacles = [];
  if (nonVisees.length) obstacles.push(`${nonVisees.length} section(s) non visée(s) : ${nonVisees.map(p => p.lib).join(', ')}`);
  if (bloq.length) obstacles.push(`${bloq.length} note(s) de revue bloquante(s) ouverte(s)`);
  if (facteursOuverts.length) obstacles.push(`${facteursOuverts.length} facteur(s) de risque non statué(s)`);
  if (!st.opinion) obstacles.push('opinion non arrêtée');
  if (!st.raFinale.trim()) obstacles.push('revue analytique finale non conclue');
  for (const k of Object.keys(ACH)){
    const f = ACH[k].pts.filter((_, i) => (st.points[k] || {})[i]).length;
    if (f < ACH[k].pts.length) obstacles.push(`${ACH[k].t} : ${ACH[k].pts.length - f} point(s) non exécuté(s)`);
    if (!(st.concl[k] || '').trim()) obstacles.push(`${ACH[k].t} : conclusion manquante`);
  }
  return entete('Assemblage et clôture du dossier', 'le dossier devient définitif et se verrouille') +
    blk('Délai d’assemblage', jours >= 0 ? jours + ' jour(s) restant(s)' : 'délai dépassé',
      `<div class="kv">
        <span class="k">Date du rapport</span><span class="v">${frDate(DATE_RAPPORT_())}</span>
        <span class="k">Délai d’assemblage</span><span class="v">${DELAI_ASSEMBLAGE} jours</span>
        <span class="k">Échéance</span><span class="v">${frDate(echeance)}</span>
        <span class="k">Aujourd’hui</span><span class="v">${frDate(S.aujourdhui)}</span>
        <span class="k">Conservation</span><span class="v">${RETENTION_ANS} ans</span>
      </div>
      <p class="note">Délai d’assemblage : <b>C. com., art. D. 821-186, III et IV</b> — 60 jours.
      Durée de conservation : <b>C. com., art. R. 820-42</b> — 6 ans. Ces deux références ont été vérifiées sur le
      texte primaire lors des travaux de rétention du dépôt ; elles sont portées ici telles que le noyau les
      enregistre, avec leur source.</p>`) +

/* ═══ 31. FILTRES DE REQUÊTES ══════════════════════════════════════════════
   Cumulables, et les mêmes des deux côtés : ce qui change entre l'auditeur et
   le client, c'est le jeu de requêtes visibles et les statuts lisibles, pas
   la façon de filtrer.
   ═══════════════════════════════════════════════════════════════════════ */
function filtrer(liste, cote){
  const f = S.filtres;
  return liste.filter(r => {
    if (f.section && r.section !== f.section) return false;
    if (f.contact && r.contact !== f.contact) return false;
    if (f.statut){
      const st = r.items.map(i => cote === 'client' ? statutVisibleClient(i) : i.statut);
      if (!st.includes(f.statut)) return false;
    }
    if (f.echeance === 'retard' && !retard(r)) return false;
    if (f.echeance === 'avenir' && (retard(r) || r.echeance < S.aujourdhui)) return false;
    if (f.q){
      const q = f.q.toLowerCase();
      const hay = (r.id + ' ' + r.titre + ' ' + r.items.map(i => i.desc).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}
function barreFiltres(cote, total, retenus){
  const f = S.filtres;
  const sections = [...new Set(S.requetes.map(r => r.section))];
  const statuts = Object.entries(STATUTS).filter(([, v]) => cote !== 'client' || v.client);
  return `<div class="row" style="align-items:flex-end">
    <div class="ctrl" style="flex:1 1 190px"><label>Recherche</label>
      <input type="text" id="f-q" value="${esc(f.q)}" placeholder="numéro, objet, élément"></div>
    <div class="ctrl"><label>Statut</label>
      <select id="f-statut"><option value="">tous</option>
        ${statuts.map(([k, v]) => `<option value="${k}" ${f.statut === k ? 'selected' : ''}>${esc(v.lib)}</option>`).join('')}</select></div>
    ${cote === 'client' ? '' : `<div class="ctrl"><label>Section</label>
      <select id="f-section"><option value="">toutes</option>
        ${sections.map(c => `<option value="${c}" ${f.section === c ? 'selected' : ''}>${esc(libFsli(c))}</option>`).join('')}</select></div>`}
    ${cote === 'client' ? '' : `<div class="ctrl"><label>Destinataire</label>
      <select id="f-contact"><option value="">tous</option>
        ${S.contacts.map(c => `<option value="${c.id}" ${f.contact === c.id ? 'selected' : ''}>${esc(c.nom)}</option>`).join('')}</select></div>`}
    <div class="ctrl"><label>Échéance</label>
      <select id="f-echeance"><option value="">toutes</option>
        <option value="retard" ${f.echeance === 'retard' ? 'selected' : ''}>en retard</option>
        <option value="avenir" ${f.echeance === 'avenir' ? 'selected' : ''}>à venir</option></select></div>
    <div class="ctrl"><label>&nbsp;</label>
      <span class="pill">${retenus} / ${total}</span></div>
    ${Object.values(f).some(Boolean) ? '<div class="ctrl"><label>&nbsp;</label><button class="btn sec" id="f-raz">effacer</button></div>' : ''}
  </div>`;
}

/* ═══ 32. EXPORT DU STATUT DE MISSION ══════════════════════════════════════
   Trois périmètres de destinataire. Le classeur porte une feuille par section
   et une feuille de synthèse.
   ═══════════════════════════════════════════════════════════════════════ */
const PERIMETRES = {
  equipe:{ lib:'équipe interne',
    cols:['N°','Objet','Procédure','Élément','Statut interne','En attente de revue par','Échéance','Retard (j ouvrés)','Responsable côté client'] },
  groupe:{ lib:'auditeur du groupe',
    cols:['N°','Objet','Éléments','Avancement','Échéance','Retard (j ouvrés)'] },
  client:{ lib:'client',
    cols:['N°','Objet','Élément','Statut','Échéance','Responsable côté client'] },
};
function lignesExport(kind, requetes){
  const out = [];
  for (const r of requetes){
    const c = S.contacts.find(x => x.id === r.contact);
    if (kind === 'groupe'){
      out.push([r.id, r.titre, String(r.items.length), pct(avancement(r.items), 0),
                frDate(r.echeance), String(ancienneteRetard(r))]);
      continue;
    }
    for (const i of r.items){
      if (kind === 'equipe') out.push([r.id, r.titre, r.proc || '', i.desc, STATUTS[i.statut].lib,
        i.revoyeur || '', frDate(r.echeance), String(ancienneteRetard(r)), c ? c.nom : '']);
      else out.push([r.id, r.titre, i.desc, STATUTS[statutVisibleClient(i)].lib,
        frDate(r.echeance), c ? c.nom : '']);
    }
  }
  return out;
}
/** Feuille de synthèse : avancement par section, et qui doit quoi. */
function feuilleSynthese(kind){
  /* Un export sorti du dossier doit dire de QUEL fichier il parle : sans la
     version et son empreinte, deux classeurs identiques d'apparence peuvent
     porter des chiffres différents. */
  const v = versionCourante();
  const l = [
    ['Version du fichier', 'v' + v.n + ' — ' + v.lib],
    ['Reçue le', frDate(v.date) + ' de ' + v.par],
    ['Fichiers', v.fichiers],
    ['Empreinte', empreinteVersion(v.n)],
    ['Seuils au moment de l’export', 'signification ' + eur0(seuils().M)
      + ' · planification ' + eur0(seuils().PM) + ' · remontée ' + eur0(seuils().CTT)],
    [],
    ['Section', 'Requêtes', 'Éléments', 'En attente', 'Avancement', 'Retard max (j ouvrés)']];
  const sections = [...new Set(S.requetes.map(r => r.section))];
  for (const c of sections){
    const rs = requetesDe(c);
    const items = rs.flatMap(r => r.items);
    l.push([libFsli(c), String(rs.length), String(items.length),
            String(items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length),
            pct(rs.length ? rs.reduce((a, r) => a + avancement(r.items), 0) / rs.length : 0, 0),
            String(Math.max(0, ...rs.map(ancienneteRetard)))]);
  }
  l.push([]);
  l.push(['Responsable côté client', 'Société', 'Demandes en retard', 'Éléments dus', 'Ancienneté max (j ouvrés)']);
  for (const ct of S.contacts){
    const rs = S.requetes.filter(r => r.contact === ct.id && retard(r));
    if (!rs.length) continue;
    l.push([ct.nom, ct.societe, String(rs.length),
            String(rs.flatMap(r => r.items).filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length),
            String(Math.max(...rs.map(ancienneteRetard)))]);
  }
  return l;
}
const xmlEsc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const nomFeuille = s => s.replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31);
/** Classeur au format SpreadsheetML — plusieurs feuilles, aucune dépendance. */
function classeur(kind){
  const d = PERIMETRES[kind];
  const feuilles = [{ nom:'Synthèse', lignes:feuilleSynthese(kind) }];
  for (const c of [...new Set(S.requetes.map(r => r.section))]){
    feuilles.push({ nom:nomFeuille(libFsli(c)), lignes:[d.cols, ...lignesExport(kind, requetesDe(c))] });
  }
  const xml = '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" '
    + 'xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'
    + feuilles.map(f => `<Worksheet ss:Name="${xmlEsc(f.nom)}"><Table>\n`
        + f.lignes.map(r => '<Row>' + r.map(v =>
            `<Cell><Data ss:Type="String">${xmlEsc(v)}</Data></Cell>`).join('') + '</Row>').join('\n')
        + '\n</Table></Worksheet>').join('\n')
    + '\n</Workbook>';
  return { xml, feuilles };
}
function telecharger(nom, contenu, type){
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([contenu], { type }));
    a.download = nom; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
    return true;
  } catch (e){ return false; }
}

          <span class="k">Pièce jointe</span><span class="v">${esc(m.piece)}</span>
        </div>
        <pre style="white-space:pre-wrap;font:12px/1.5 var(--mono);margin:8px 0 0">${esc(m.corps)}</pre>
      </div>
      <div class="callout warn"><b>Aucun envoi n’a lieu.</b> Ce fichier n’a ni serveur ni transport sortant : le message
      ci-dessus est <b>composé</b>, avec ses destinataires réels et sa pièce jointe réelle, et s’arrête là. L’envoi
      appartient à l’application.</div>`);
}
/* ═══ 33. LE TRAVAIL — OBJET UNIQUE DE LA MISSION ══════════════════════════
   « Détermination de la matérialité », « test de détail sur le chiffre
   d'affaires » et « événements postérieurs » sont trois instances du même
   objet. Ajouter des responsabilités aux seules sections aurait créé deux
   structures parallèles ; les procédures construites au lot précédent sont
   donc MIGRÉES en travaux de nature « procédure de section », pas dupliquées :
   leur casier d'exécution (population, germe, papier) reste dans proc(), leur
   casier d'organisation (affectation, heures, statut) vit ici.
   ═══════════════════════════════════════════════════════════════════════ */

const PHASES = [
  { id:'planification',    lib:'Planification' },
  { id:'controle_interne', lib:'Contrôle interne' },
  { id:'bilan',            lib:'Bilan' },
  { id:'resultat',         lib:'Compte de résultat' },
  { id:'achevement',       lib:'Achèvement' },
];
const NATURE_TRAVAIL = {
  planification:'planification', controle_interne:'contrôle interne',
  section:'procédure de section', achevement:'achèvement',
  manuel:'ajouté à la main',
};

/* ═══ JALONS DE MISSION ════════════════════════════════════════════════════
   Une échéance par travail, saisie cent fois, n'est pas un planning : c'est
   une corvée qui finit remplie au hasard. On pose QUATRE dates — l'intérim,
   l'intervention finale, la date du rapport, et l'échéance d'assemblage qui
   s'en déduit — et l'échéance de chaque travail s'en déduit à son tour, par
   une règle écrite. Chaque échéance reste modifiable travail par travail, et
   en lot sur la sélection : la règle propose, elle n'impose pas.

   L'échéance d'assemblage n'est PAS saisie : c'est un délai légal compté
   depuis la date du rapport. Une date qu'on peut taper à la main est une date
   qu'on peut taper fausse.                                                 */
const JALONS = [
  { id:'interim',    lib:'Intervention intérimaire', d:'ce qui se fait avant la clôture : contrôle interne, tests d’opérations sur la période écoulée' },
  { id:'final',      lib:'Intervention finale',      d:'les travaux sur les comptes arrêtés' },
  { id:'rapport',    lib:'Date du rapport',          d:'la date de signature' },
  { id:'assemblage', lib:'Échéance d’assemblage',    d:'délai légal compté depuis la date du rapport — déduite, jamais saisie',
    derive:() => addDays(S.jalons.rapport, DELAI_ASSEMBLAGE) },
];
function jalon(id){
  const j = JALONS.find(x => x.id === id);
  return j && j.derive ? j.derive() : S.jalons[id];
}
function fixerJalon(id, date){
  const j = JALONS.find(x => x.id === id);
  if (!j || j.derive) return { ok:false, why:'cette date se déduit, elle ne se saisit pas' };
  if (!date) return { ok:false, why:'une date vide n’est pas un jalon' };
  const av = S.jalons[id];
  S.jalons[id] = date;
  _travCache.cle = '';
  logEvent('jalon de mission déplacé', j.lib, frDate(av) + ' → ' + frDate(date));
  return { ok:true };
}
/* Ce dont chaque travail dépend. La règle est lisible et se lit à l'écran. */
const REGLE_ECHEANCE = [
  { cas:'Assemblage et clôture du dossier', jalon:'assemblage', dec:0,
    quoi:t => t.code === 'ACH-08' },
  { cas:'Travail de planification',   jalon:'interim', dec:0,  quoi:t => t.phase === 'planification' },
  { cas:'Travail de contrôle interne', jalon:'interim', dec:0, quoi:t => t.phase === 'controle_interne' },
  { cas:'Procédure de section',       jalon:'final',   dec:0,  quoi:t => t.phase === 'bilan' || t.phase === 'resultat' },
  { cas:'Travail d’achèvement',       jalon:'rapport', dec:-10, quoi:() => true },
];
function regleEcheance(t){ return REGLE_ECHEANCE.find(r => r.quoi(t)) || REGLE_ECHEANCE[REGLE_ECHEANCE.length - 1]; }
function echeanceDeduite(t){
  const r = regleEcheance(t);
  return addDays(jalon(r.jalon), r.dec);
}
/** L'échéance retenue : celle qu'on a écrite, sinon celle que la règle déduit. */
function echeanceDe(t){
  const st = trav(t.code);
  return st.echeance || echeanceDeduite(t);
}
function fixerEcheance(code, date){
  const st = trav(code), t = travailDe(code);
  if (!t) return { ok:false, why:'travail inconnu' };
  const av = echeanceDe(t);
  st.echeance = date || null;
  logEvent('échéance modifiée', t.code + ' — ' + t.intitule,
           frDate(av) + ' → ' + frDate(echeanceDe(t)) + (date ? '' : ' (retour à la règle)'));
  return { ok:true };
}
function fixerEcheanceEnLot(codes, date){
  let n = 0;
  for (const c of codes){ if (fixerEcheance(c, date).ok) n++; }
  return { n };
}

/* ── barème de budget : une décision affichée, pas une constante cachée ──── */
const BAREME_HEURES = [
  { nature:'planification', lib:'Travail de planification', base:4, parElement:0 },
  { nature:'controle_interne', lib:'Travail de contrôle interne', base:6, parElement:0 },
  { nature:'section', ech:false, lib:'Procédure de section sans sélection', base:2, parElement:0 },
  { nature:'section', ech:true, lib:'Procédure de section avec sélection', base:1.5, parElement:0.05 },
  { nature:'achevement', lib:'Travail d’achèvement', base:3, parElement:0 },
  { nature:'manuel', lib:'Travail ajouté à la main', base:3, parElement:0 },
];
function baremeDe(t){
  return BAREME_HEURES.find(b => b.nature === t.nature && (b.ech === undefined || b.ech === !!t.ech))
      || BAREME_HEURES[0];
}
function budgetBareme(t){
  const b = baremeDe(t);
  return Math.round((b.base + b.parElement * (t.elements || 0)) * 4) / 4;   // au quart d'heure
}

/* ── règle de niveau de revue : elle DÉCOULE du risque ───────────────────── */
const REGLE_REVUE = [
  { si:'Procédure répondant à une assertion évaluée « élevé »', niveau:2 },
  { si:'Section dont le risque le plus élevé est « élevé »', niveau:2 },
  { si:'Détermination de la matérialité, arrêté de l’opinion, clôture du dossier', niveau:2 },
  { si:'Tout autre travail', niveau:1 },
];
const NIVEAU_REVUE_LIB = { 1:'revue de premier niveau (réviseur)', 2:'revue de second niveau (associé)' };
const TRAVAUX_NIVEAU2 = ['PLAN-01', 'ACH-05', 'ACH-08'];
function niveauRevueExige(t){
  if (TRAVAUX_NIVEAU2.includes(t.code)) return 2;
  if (t.nature === 'section' && t.poste){
    const p = postesCalcules().find(x => x.code === t.poste);
    if (p && t.assertion && niveau(p, t.assertion) === 'eleve') return 2;
    if (p && NIVEAUX[niveauMax(p)] === 'eleve') return 2;
  }
  return 1;
}
function peutReviser(uid, t){
  const u = USERS[uid]; if (!u) return false;
  if (niveauRevueExige(t) === 2) return u.role === 'associe';
  return u.role === 'reviseur' || u.role === 'associe';
}

/* ── travaux de planification et d'achèvement : liste fixe ───────────────── */
const TRAVAUX_FIXES = [
  { code:'PLAN-01', nature:'planification', phase:'planification', intitule:'Détermination de la matérialité', vue:'plan.mat' },
  { code:'PLAN-02', nature:'planification', phase:'planification', intitule:'Import du grand livre et rapprochement à la balance', vue:'plan.rappro' },

  { code:'PLAN-07', nature:'planification', phase:'planification', intitule:'Exhaustivité des circularisations', vue:'plan.circ' },

  { code:'ACH-06', nature:'achevement', phase:'achevement', intitule:'Lettre d’affirmation', vue:'ach.affirmation' },
  { code:'ACH-07', nature:'achevement', phase:'achevement', intitule:'Communication aux organes de gouvernance', vue:'ach.gouvernance' },
  { code:'ACH-08', nature:'achevement', phase:'achevement', intitule:'Assemblage et clôture du dossier', vue:'ach.cloture' },
];

/** Casier d'organisation d'un travail — affectation, heures, statut. */
function trav(code){
  if (!S.travaux[code]) S.travaux[code] = {
    preparateur:null, reviseur:null, heuresBudget:null, heuresReel:0,
    statut:'a_faire', acheve:null, revu:null,
    echeance:null,      // null = celle que la règle des jalons déduit
    sansObjet:null,     // { motif, par, t } — jamais une suppression
  };
  return S.travaux[code];
}
/* ── « sans objet » plutôt qu'une suppression ────────────────────────────
   Un travail qui ne s'applique pas à ce dossier ne s'efface pas : il se
   MARQUE, avec un motif écrit. Un programme dont on a retiré des lignes ne
   dit pas pourquoi elles ne sont plus là ; un programme qui les garde
   barrées le dit. Le motif est obligatoire — sans lui, la marque est
   indistinguable d'une erreur de manipulation. */
function sansObjet(code){ return trav(code).sansObjet; }
function marquerSansObjet(code, motif){
  const t = travailDe(code); if (!t) return { ok:false, why:'travail inconnu' };
  const st = trav(code);
  if (!(motif || '').trim()) return { ok:false, why:'un travail marqué « sans objet » sans motif écrit reste au programme' };
  if (st.statut === 'acheve' || st.statut === 'revu')
    return { ok:false, why:'un travail déjà ' + STATUT_TRAVAIL[st.statut] + ' n’est pas sans objet : c’est une diligence exécutée' };
  st.sansObjet = { motif:motif.trim(), par:S.moi, t:tick() };
  logEvent('travail marqué sans objet', t.code + ' — ' + t.intitule, motif.trim().slice(0, 90));
  return { ok:true };
}
function annulerSansObjet(code){
  const t = travailDe(code), st = trav(code);
  if (!st.sansObjet) return { ok:false, why:'ce travail n’est pas marqué' };
  st.sansObjet = null;
  logEvent('marque « sans objet » retirée', t.code + ' — ' + t.intitule, USERS[S.moi].nom);
  return { ok:true };
}

/* ── travaux ajoutés à la main ────────────────────────────────────────────
   Aucun catalogue ne couvre tous les dossiers. Un travail ajouté à la main
   porte les mêmes règles que les autres : affectation, budget, échéance
   déduite d'un jalon, revue, statuts. Il n'a pas de chemin à lui. */
function ajouterTravail(intitule, phase, poste, natureVoulue){
  if (!(intitule || '').trim()) return { ok:false, why:'un travail sans intitulé n’est pas un travail' };
  if (!PHASES.some(x => x.id === phase)) return { ok:false, why:'phase inconnue' };
  const code = 'MAN-' + String(++S.seqTravManuel).padStart(2, '0');
  S.travauxManuels.push({ code, nature:natureVoulue || 'manuel', phase,
    intitule:intitule.trim(), poste:poste || null,
    posteLib:poste ? (POSTES.find(p => p.code === poste) || {}).lib : null,
    vue:poste ? 'fsli:' + poste : 'plan.programme', ajoutePar:S.moi, t:tick() });
  _travCache.cle = '';
  logEvent('travail ajouté au programme', code + ' — ' + intitule.trim(),
           PHASES.find(x => x.id === phase).lib + (poste ? ' · ' + poste : ''));
  return { ok:true, code };
}
function retirerTravailManuel(code){
  const i = S.travauxManuels.findIndex(x => x.code === code);
  if (i < 0) return { ok:false, why:'ce travail n’a pas été ajouté à la main : marquez-le « sans objet »' };
  const st = trav(code);
  if (st.preparateur || st.reviseur || st.statut !== 'a_faire')
    return { ok:false, why:'ce travail est engagé : marquez-le « sans objet » plutôt que de l’effacer' };
  const x = S.travauxManuels[i];
  S.travauxManuels.splice(i, 1);
  delete S.travaux[code];
  _travCache.cle = '';
  logEvent('travail retiré du programme', code + ' — ' + x.intitule, 'ajouté à la main, jamais engagé');
  return { ok:true };
}
const STATUT_TRAVAIL = { a_faire:'à faire', en_cours:'en cours', acheve:'achevé', revu:'revu' };

/** La liste complète des travaux de la mission, dérivée. */
const _travCache = { cle:'', v:null };
function travaux(){
  const s = seuils();
  const cle = JSON.stringify([s.PM, s.CTT, Object.keys(S.scopingOverride), S.decisionsFacteurs,
    S.sections && Object.keys(S.sections).length, S.jalons, S.travauxManuels.length]);
  if (_travCache.cle === cle && _travCache.v) return _travCache.v.map(habiller);
  const out = [];
  for (const f of TRAVAUX_FIXES) out.push({ ...f });
  for (const m of S.travauxManuels) out.push({ ...m });
  for (const p of postesEnPerimetre()){
    const phase = masseDe(p);
    for (const pr of proceduresRequises(p)){
      const e = pr.ech ? echantillonProc(p, pr) : null;
      out.push({
        code:'SEC-' + p.code + '-' + pr.code, nature:'section', phase,
        intitule:pr.lib, poste:p.code, posteLib:p.lib, proc:pr.code,
        assertion:pr.a, ech:pr.ech, elements:e ? e.retenus.length : 0,
        wpRef:procRef(p, pr), vue:'fsli:' + p.code,
      });
    }
  }
  const base = out.map(t => ({ ...t, niveauRevue:niveauRevueExige(t) }));
  base.forEach(t => { t.budgetBareme = budgetBareme(t); });
  _travCache.cle = cle; _travCache.v = base;
  return base.map(habiller);
}
/** Le casier d'organisation vient se poser sur la définition du travail, et
 *  l'échéance se déduit des jalons quand personne ne l'a écrite. Un seul
 *  chemin : le cache ne doit pas rendre un objet plus pauvre que le calcul. */
function habiller(t){
  const x = { ...t, ...trav(t.code), code:t.code,
              niveauRevue:t.niveauRevue, budgetBareme:t.budgetBareme };
  x.echeanceDeduite = echeanceDeduite(x);
  x.echeance = trav(t.code).echeance || x.echeanceDeduite;
  return x;
}
function budget(t){ return t.heuresBudget === null || t.heuresBudget === undefined ? t.budgetBareme : t.heuresBudget; }
function travauxDe(code){ return travaux().filter(t => t.poste === code); }
function travailDe(code){ return travaux().find(t => t.code === code); }
function hFmt(h){ return (Math.round(h * 4) / 4).toFixed(2).replace('.', ',') + NBSP + 'h'; }

/* ── règles déterministes sur les responsabilités ─────────────────────────
   Préparateur et réviseur sont obligatoirement deux personnes différentes —
   refusé par le système, comme la clôture d'une note par son auteur.       */
function affecter(code, role, uid){
  const t = travailDe(code); if (!t) return { ok:false, why:'travail inconnu' };
  const st = trav(code);
  const autre = role === 'preparateur' ? st.reviseur : st.preparateur;
  if (uid && uid === autre) return { ok:false, why:'le préparateur et le réviseur doivent être deux personnes différentes' };
  /* AUCUN travail à qui n'a pas signé sa déclaration d'indépendance. Le
     système refuse — il ne rappelle pas. Voir 30_equipe.js. */
  if (uid && !peutRecevoirTravail(uid))
    return { ok:false, why:'déclaration d’indépendance de ' + USERS[uid].nom + ' : '
      + etatDeclaration(uid).lib + ' — aucun travail ne peut lui être attribué' };
  if (uid && USERS[uid].sortie && USERS[uid].sortie < S.aujourdhui)
    return { ok:false, why:USERS[uid].nom + ' est sorti de la mission le ' + frDate(USERS[uid].sortie) };
  if (role === 'reviseur' && uid && !peutReviser(uid, t))
    return { ok:false, why:'ce travail exige une ' + NIVEAU_REVUE_LIB[t.niveauRevue] };
  st[role] = uid || null;
  logEvent('affectation', t.code + ' — ' + t.intitule,
           (role === 'preparateur' ? 'préparateur : ' : 'réviseur : ') + (uid ? USERS[uid].nom : 'retiré'));
  return { ok:true };
}
/** Un travail ne passe « achevé » que par son préparateur, « revu » que par son réviseur. */
function changerStatut(code, statut){
  const t = travailDe(code), st = trav(code);
  if (statut === 'acheve' && st.preparateur !== S.moi) return { ok:false, why:'seul le préparateur affecté peut achever ce travail' };
  if (statut === 'revu'){
    if (st.reviseur !== S.moi) return { ok:false, why:'seul le réviseur affecté peut porter ce travail « revu »' };
    if (st.statut !== 'acheve') return { ok:false, why:'le travail doit d’abord être achevé par son préparateur' };
  }
  st.statut = statut;
  if (statut === 'acheve') st.acheve = { par:S.moi, t:tick() };
  if (statut === 'revu') st.revu = { par:S.moi, t:tick() };
  logEvent('travail ' + STATUT_TRAVAIL[statut], t.code + ' — ' + t.intitule, USERS[S.moi].nom);
  return { ok:true };
}
function obstaclesTravaux(code){
  const o = [];
  const l = travauxDe(code).filter(t => !t.sansObjet);
  const rec = l.filter(t => aReconfirmer(t));
  if (rec.length) o.push(`${rec.length} travail/travaux à reconfirmer sur la version courante du fichier`);
  const sansPrep = l.filter(t => !t.preparateur), sansRev = l.filter(t => !t.reviseur);
  if (sansPrep.length) o.push(`${sansPrep.length} travail/travaux sans préparateur affecté`);
  if (sansRev.length) o.push(`${sansRev.length} travail/travaux sans réviseur affecté`);
  const nonRevus = l.filter(t => t.preparateur && t.reviseur && t.statut !== 'revu');
  if (nonRevus.length) o.push(`${nonRevus.length} travail/travaux non revus`);
  /* Un travail attribué à quelqu'un dont la déclaration est devenue caduque
     est un obstacle au visa : la diligence a été faite, mais pas par une
     personne dont l'indépendance est établie à ce jour. */
  for (const x of obstaclesIndependanceSection(code)) o.push(x);
  return o;
}

/* ── ligne d'affectation, réutilisée partout ─────────────────────────────── */
function ligneAffectation(t){
  const st = trav(t.code);
  const sel = (role, val) => `<select class="cell txt" data-aff="${t.code}|${role}" style="width:150px">
      <option value="">— non affecté —</option>
      ${Object.entries(USERS).map(([k, u]) => `<option value="${k}" ${val === k ? 'selected' : ''}>${esc(u.nom)}</option>`).join('')}
    </select>`;
  return { prep:sel('preparateur', st.preparateur), rev:sel('reviseur', st.reviseur) };
}
function boutonsStatut(t){
  const st = trav(t.code);
  const rc = aReconfirmer({ ...t, ...st });
  if (rc) return `<span class="pill bad">à reconfirmer</span>
    <div class="smallcaps">${esc(rc.motif)}</div>
    <button class="btn mini" data-recon="${t.code}">reconfirmer</button>`;
  if (st.statut === 'revu') return `<span class="pill">revu par ${esc(USERS[st.revu.par].nom)}</span>`;
  const b = [];
  if (st.statut !== 'acheve' && st.preparateur === S.moi) b.push(`<button class="btn mini" data-tstat="${t.code}|acheve">achever</button>`);
  if (st.statut === 'acheve'){
    b.push(`<span class="pill">achevé par ${esc(USERS[st.acheve.par].nom)}</span>`);
    if (st.reviseur === S.moi) b.push(`<button class="btn mini" data-tstat="${t.code}|revu">porter « revu »</button>`);
  }
  if (!b.length) b.push(`<span class="smallcaps">${st.statut === 'acheve' ? 'en attente de revue' : 'réservé au préparateur affecté'}</span>`);
  return b.join(' ');
}

/* ═══ 34. PROGRAMME DE TRAVAIL — livrable du dossier ═══════════════════════ */
function vueProgramme(){
  const f = S.filtreTrav, l = travaux();
  const vus = l.filter(t => (!f.phase || t.phase === f.phase) && (!f.nature || t.nature === f.nature)
    && (!f.personne || t.preparateur === f.personne || t.reviseur === f.personne)
    && (!f.statut || t.statut === f.statut)
    && (!f.q || (t.code + ' ' + t.intitule + ' ' + (t.posteLib || '')).toLowerCase().includes(f.q.toLowerCase())));
  const rows = vus.map(t => {
    const a = ligneAffectation(t);
    const pr = propositionDe(t.code), ec = ecartProposition(t);
    return {
      sel:`<label class="chk"><input type="checkbox" data-selt="${t.code}" ${S.selTrav.includes(t.code) ? 'checked' : ''}><span></span></label>`,
      c:`<span class="mono">${t.code}</span>`,
      pp:pr ? `<span class="smallcaps">${esc(pr.prep ? USERS[pr.prep].nom : '—')}</span>
              <div class="smallcaps">${esc(pr.rev ? USERS[pr.rev].nom : '—')}</div>`
            : '<span class="smallcaps">—</span>',
      n:`<span class="tag">${esc(NATURE_TRAVAIL[t.nature])}</span>`,
      i:`<b>${esc(t.intitule)}</b>${t.posteLib ? '<div class="smallcaps">' + esc(t.posteLib) + '</div>' : ''}`,
      r:esc(PHASES.find(x => x.id === t.phase).lib),
      as:t.assertion ? esc(libAssertion(t.assertion)) : '<span class="smallcaps">—</span>',
      p:a.prep, v:a.rev,
      nr:`<span class="pill ${t.niveauRevue === 2 ? 'warn' : ''}">niveau ${t.niveauRevue}</span>`,
      e:`<input class="cell txt" type="date" data-tech="${t.code}" value="${esc(t.echeance)}" style="width:132px">
         <div class="smallcaps">${t.echeance === t.echeanceDeduite
            ? esc(regleEcheance(t).jalon) : 'écrite — règle : ' + frDate(t.echeanceDeduite)}</div>`,
      hb:`<input class="cell" data-hb="${t.code}" value="${budget(t).toFixed(2).replace('.', ',')}">`,
      hr:`<input class="cell" data-hr="${t.code}" value="${t.heuresReel.toFixed(2).replace('.', ',')}">`,
      s:t.sansObjet
        ? `<span class="pill">sans objet</span>
           <div class="smallcaps">${esc(t.sansObjet.motif)}</div>
           <div class="smallcaps">${esc(USERS[t.sansObjet.par].nom)} · ${horo(t.sansObjet.t)}</div>
           <button class="btn mini sec" data-tso0="${t.code}">remettre au programme</button>`
        : boutonsStatut(t) + ` <button class="btn mini sec" data-tso="${t.code}">sans objet</button>`
          + (S.travauxManuels.some(x => x.code === t.code)
             ? ` <button class="btn mini sec" data-tdel="${t.code}">retirer</button>` : ''),
      ec:ec ? '<span class="pill warn">corrigé</span>' : '<span class="smallcaps">—</span>',
      w:t.wpRef ? `<span class="mono">${esc(t.wpRef)}</span>` : '<span class="smallcaps">—</span>',
      g:t.vue ? `<button class="btn mini sec" data-gotrav="${esc(t.vue)}">ouvrir</button>` : '',
    };
  });
  /* Un travail sans objet ne consomme pas de budget : le compter fausserait
     le seul chiffre que le chef de mission regarde. */
  const tb = vus.filter(t => !t.sansObjet).reduce((a, t) => a + budget(t), 0);
  const tr = vus.reduce((a, t) => a + t.heuresReel, 0);
  return entete('Programme de travail', 'tout travail de la mission est le même objet — livrable du dossier') +
    blocJalons(l) +
    blk('Filtres', vus.length + ' / ' + l.length,
      `<div class="row">
        <div class="ctrl"><label>Phase</label><select id="ft-phase"><option value="">toutes</option>
          ${PHASES.map(x => `<option value="${x.id}" ${f.phase === x.id ? 'selected' : ''}>${esc(x.lib)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>Nature</label><select id="ft-nature"><option value="">toutes</option>
          ${Object.entries(NATURE_TRAVAIL).map(([k, v]) => `<option value="${k}" ${f.nature === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>Personne</label><select id="ft-personne"><option value="">toutes</option>
          ${Object.entries(USERS).map(([k, u]) => `<option value="${k}" ${f.personne === k ? 'selected' : ''}>${esc(u.nom)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>Statut</label><select id="ft-statut"><option value="">tous</option>
          ${Object.entries(STATUT_TRAVAIL).map(([k, v]) => `<option value="${k}" ${f.statut === k ? 'selected' : ''}>${esc(v)}</option>`).join('')}</select></div>
        <div class="ctrl" style="flex:1 1 180px"><label>Recherche</label>
          <input type="text" id="ft-q" value="${esc(f.q)}" placeholder="code, intitulé, poste"></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn sec" id="ft-imprime">imprimer</button></div>
      </div>`) +
    /* Le barème de budget et les règles de revue ONT QUITTÉ cet écran : ce
       sont des explications de règles, pas des surfaces de travail. La règle
       doit agir — elle agit, dans la colonne « budget » et dans le refus
       d'affecter un réviseur de niveau insuffisant. Sa justification se lit
       dans « Principes de conception », avec les autres encadrés. */
    blocRepartition(vus) +
    blk('Travaux', vus.length + ' · budget ' + hFmt(tb) + ' · réalisé ' + hFmt(tr)
        + (l.filter(x => x.sansObjet).length ? ' · ' + l.filter(x => x.sansObjet).length + ' sans objet' : ''),
      barreSelection(vus) +
      `<div class="row" style="margin:-2px 0 8px">
        <div class="ctrl"><label>Échéance en lot — ${S.selTrav.length} sélectionné(s)</label>
          <input class="cell txt" type="date" id="tv-lotech" ${S.selTrav.length ? '' : 'disabled'}></div>
        <div class="ctrl"><label>&nbsp;</label>
          <button class="btn sec" id="tv-lotech-rgl" ${S.selTrav.length ? '' : 'disabled'}>rendre à la règle des jalons</button></div>
        <div class="ctrl" style="flex:1 1 220px"><label>Ajouter un travail — intitulé</label>
          <input type="text" id="tv-add-lib" placeholder="aucun catalogue ne couvre tous les dossiers"></div>
        <div class="ctrl"><label>Phase</label><select id="tv-add-phase">
          ${PHASES.map(x => `<option value="${x.id}">${esc(x.lib)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>Section</label><select id="tv-add-poste">
          <option value="">— aucune —</option>
          ${postesEnPerimetre().map(x => `<option value="${x.code}">${esc(x.lib)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn" id="tv-add">ajouter au programme</button></div>
      </div>
      ${S.travErreur ? `<div class="callout bad">${esc(S.travErreur)}</div>` : ''}` +
      table([{k:'sel',t:''},{k:'c',t:'Code'},{k:'n',t:'Nature'},{k:'i',t:'Intitulé',cls:'wrapcell'},{k:'r',t:'Phase'},
             {k:'as',t:'Assertion'},{k:'pp',t:'Proposé',cls:'wrapcell'},{k:'p',t:'Préparateur'},{k:'v',t:'Réviseur'},
             {k:'ec',t:''},{k:'nr',t:'Revue'},
             {k:'e',t:'Échéance'},{k:'hb',t:'Budget',n:1},{k:'hr',t:'Réalisé',n:1},
             {k:'s',t:'Statut',cls:'wrapcell'},{k:'w',t:'Papier'},{k:'g',t:''}], rows,
        { foot:{ c:'Total', hb:hFmt(tb), hr:hFmt(tr) } }) +
      `<p class="note">La colonne « proposé » porte le préparateur puis le réviseur que la règle désigne.
      Corriger une ligne ne change pas la proposition : l’écart reste visible, c’est votre décision.</p>`);
}

function blocJalons(l){
  const jours = d => Math.round((Date.parse(d) - Date.parse(S.aujourdhui)) / 86400000);
  const dec = n => n === 0 ? 'le jour même' : n > 0 ? '+' + n + ' j' : n + ' j';
  return blk('Jalons de la mission', 'quatre dates — les échéances des travaux s’en déduisent',
    `<div class="row">
      ${JALONS.map(j => `<div class="ctrl"><label>${esc(j.lib)}</label>
        <input class="cell txt" type="date" data-jalon="${j.id}" value="${esc(jalon(j.id))}"
          ${j.derive ? 'disabled' : ''} style="width:150px">
        <span class="smallcaps">${j.derive ? 'déduite — ' + DELAI_ASSEMBLAGE + ' jours après le rapport'
          : jours(jalon(j.id)) >= 0 ? 'dans ' + jours(jalon(j.id)) + ' j' : 'il y a ' + (-jours(jalon(j.id))) + ' j'}</span>
      </div>`).join('')}
    </div>
    ${table([{k:'c',t:'Cas',cls:'wrapcell'},{k:'j',t:'Jalon'},{k:'d',t:'Décalage'},{k:'e',t:'Échéance déduite'},{k:'n',t:'Travaux',n:1}],
      REGLE_ECHEANCE.map(r => {
        const n = l.filter(t => regleEcheance(t).cas === r.cas).length;
        return { c:esc(r.cas), j:esc((JALONS.find(x => x.id === r.jalon) || {}).lib || r.jalon),
                 d:dec(r.dec), e:`<span class="mono">${frDate(addDays(jalon(r.jalon), r.dec))}</span>`,
                 n:String(n) };
      }), { foot:{ c:'Total', n:String(l.length) } })}
    <p class="note">On pose <b>quatre dates</b>, pas cent. L’échéance de chaque travail s’en déduit par la
    règle ci-dessus ; elle reste modifiable ligne par ligne et en lot sur la sélection, et une échéance
    écrite le reste quand le jalon bouge — c’est une décision, elle ne se perd pas.
    L’échéance d’assemblage ne se saisit pas : c’est un délai légal compté depuis la date du rapport
    (${DELAI_ASSEMBLAGE} jours, C. com., art. D. 821-186, III et IV).
    ${l.filter(t => trav(t.code).echeance).length} échéance(s) écrite(s) à la main sur ${l.length}.</p>`);
}

/* ═══ 35. VUE GLOBALE DE LA MISSION ════════════════════════════════════════
   Dans l'ordre des questions d'un chef de mission.
   ═══════════════════════════════════════════════════════════════════════ */
function vueMission(){
  const l = travaux(), postes = postesEnPerimetre();
  /* 1 — avancement par phase et par section */
  const parPhase = PHASES.map(ph => {
    const t = l.filter(x => x.phase === ph.id);
    return { ph, t, acheves:t.filter(x => x.statut === 'acheve').length, revus:t.filter(x => x.statut === 'revu').length };
  });
  /* 2 — charge par personne */
  const charge = Object.entries(USERS).map(([k, u]) => {
    const prep = l.filter(t => t.preparateur === k), rev = l.filter(t => t.reviseur === k);
    return { k, u, prep, rev, b:prep.reduce((a, t) => a + budget(t), 0),
             r:prep.reduce((a, t) => a + t.heuresReel, 0),
             bRev:rev.reduce((a, t) => a + budget(t) * 0.2, 0) };
  });
  const bMoyen = charge.reduce((a, c) => a + c.b, 0) / charge.length;
  /* 3 — notes de revue */
  const notes = S.notes.filter(n => !n.clos);
  /* 4 — facteurs non statués */
  const fp = registre().filter(f => f.statut === 'propose');
  /* 5 — demandes en retard par contact */
  const parContact = {};
  for (const r of S.requetes.filter(retard)){
    const c = S.contacts.find(x => x.id === r.contact); if (!c) continue;
    parContact[c.id] = parContact[c.id] || { c, n:0, items:0, age:0 };
    parContact[c.id].n++;
    parContact[c.id].items += r.items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel').length;
    parContact[c.id].age = Math.max(parContact[c.id].age, ancienneteRetard(r));
  }
  /* 6 — obstacles au visa agrégés */
  const obst = postes.map(p => ({ p, o:obstaclesVisa(p) })).filter(x => x.o.length);
  /* 7 — jalons */
  const ech = jalon('assemblage');
  const jours = d => Math.round((Date.parse(d) - Date.parse(S.aujourdhui)) / 86400000);
  /* Les jalons ne sont plus une liste d'affichage : ce sont LES dates de la
     mission, posées dans le programme de travail, et dont les échéances des
     travaux se déduisent. Ici on les relit, on ne les redéfinit pas. */
  const jalons = [{ j:'Clôture de l’exercice', d:CLOTURE }]
    .concat(JALONS.map(x => ({ j:x.lib, d:jalon(x.id) })))
    .sort((a, b) => a.d < b.d ? -1 : 1);
  const tb = l.filter(t => !t.sansObjet).reduce((a, t) => a + budget(t), 0);
  const tr = l.reduce((a, t) => a + t.heuresReel, 0);
  return entete('Vue globale de la mission', 'Altiverre SAS — exercice clos le ' + frDate(CLOTURE)) +
    blocGraphes() +
    blk('Avancement par phase', l.length + ' travaux · budget ' + hFmt(tb) + ' · réalisé ' + hFmt(tr),
      table([{k:'p',t:'Phase'},{k:'n',t:'Travaux',n:1},{k:'a',t:'Achevés',n:1},{k:'r',t:'Revus',n:1},
             {k:'x',t:'Restants',n:1},{k:'b',t:'Budget',n:1},{k:'e',t:'Réalisé',n:1},{k:'d',t:'Écart',n:1}],
        parPhase.map(x => ({ p:esc(x.ph.lib), n:String(x.t.length), a:String(x.acheves), r:String(x.revus),
          x:String(x.t.length - x.acheves - x.revus),
          b:hFmt(x.t.reduce((a, t) => a + budget(t), 0)), e:hFmt(x.t.reduce((a, t) => a + t.heuresReel, 0)),
          d:hFmt(x.t.reduce((a, t) => a + t.heuresReel - budget(t), 0)) })),
        { foot:{ p:'Total', n:String(l.length), b:hFmt(tb), e:hFmt(tr), d:hFmt(tr - tb) } })) +
    blk('Avancement par section', postes.length + ' sections',
      table([{k:'s',t:'Section',cls:'wrapcell'},{k:'n',t:'Travaux',n:1},{k:'r',t:'Revus',n:1},
             {k:'b',t:'Budget',n:1},{k:'e',t:'Réalisé',n:1},{k:'v',t:'Visa'},{k:'g',t:''}],
        postes.map(p => {
          const t = travauxDe(p.code), st = sec(p.code), o = obstaclesVisa(p);
          return { s:esc(p.lib), n:String(t.length), r:String(t.filter(x => x.statut === 'revu').length),
            b:hFmt(t.reduce((a, x) => a + budget(x), 0)), e:hFmt(t.reduce((a, x) => a + x.heuresReel, 0)),
            v:st.visa ? '<span class="pill">visée</span>' : `<span class="pill ${o.length ? 'bad' : 'warn'}">${o.length || 'prête'}</span>`,
            g:`<button class="btn mini sec" data-open="${p.code}">ouvrir</button>` };
        }))) +
    blk('Charge par personne', 'budget, réalisé, surcharge',
      table([{k:'p',t:'Personne',cls:'wrapcell'},{k:'np',t:'Travaux préparés',n:1},{k:'nr',t:'Travaux à revoir',n:1},
             {k:'b',t:'Budget préparation',n:1},{k:'e',t:'Réalisé',n:1},{k:'d',t:'Écart',n:1},{k:'c',t:'Charge'}],
        charge.map(c => ({ p:`<b>${esc(c.u.nom)}</b><div class="smallcaps">${esc(ROLE_LIB[c.u.role])}</div>`,
          np:String(c.prep.length), nr:String(c.rev.length), b:hFmt(c.b), e:hFmt(c.r), d:hFmt(c.r - c.b),
          c:c.b > bMoyen * 1.3 ? '<span class="pill bad">surcharge</span>'
            : c.b < bMoyen * 0.7 ? '<span class="pill">sous-charge</span>' : '<span class="smallcaps">équilibrée</span>' })),
        { foot:{ p:'Total', np:String(l.filter(t => t.preparateur).length),
                 b:hFmt(charge.reduce((a, c) => a + c.b, 0)), e:hFmt(charge.reduce((a, c) => a + c.r, 0)) } }) +
      `<p class="note">La charge de revue est comptée à 20 % du budget de préparation du travail revu.
      ${l.filter(t => !t.preparateur).length} travail/travaux ne sont affectés à personne.</p>`) +
    blk('Notes de revue ouvertes', notes.length + ' — bloquantes en tête',
      notes.length ? table([{k:'t',t:'Type'},{k:'p',t:'Destinataire'},{k:'a',t:'Ancienneté',n:1},
             {k:'s',t:'Section'},{k:'x',t:'Note',cls:'wrapcell'},{k:'g',t:''}],
        [...notes].sort((a, b) => (TYPES_NOTE[b.type].bloque ? 1 : 0) - (TYPES_NOTE[a.type].bloque ? 1 : 0)
          || ancienneteNote(b) - ancienneteNote(a)).map(n => ({
          t:`<span class="tag ${TYPES_NOTE[n.type].bloque ? 'abs' : ''}">${esc(TYPES_NOTE[n.type].lib)}</span>`,
          p:esc(USERS[n.pour] ? USERS[n.pour].nom : '—'), a:ancienneteNote(n) + ' j',
          s:esc(libFsli(n.ancre.section)), x:esc(n.texte),
          g:`<button class="btn mini sec" data-goanc="${n.id}">objet ↗</button>` })))
        : '<p class="note">Aucune note ouverte.</p>') +
    blk('Facteurs de risque non statués', fp.length,
      fp.length ? table([{k:'i',t:'Facteur'},{k:'s',t:'Sections touchées',cls:'wrapcell'},{k:'p',t:'Pertinence',cls:'wrapcell'},{k:'g',t:''}],
        fp.map(f => ({ i:`<span class="mono">${esc(f.id)}</span>`,
          s:[...new Set(f.cibles.map(c => libFsli(c.fsli)))].map(esc).join(', '),
          p:esc(f.pertinence || '—'),
          g:'<button class="btn mini sec" data-vue="plan.facteurs">registre ↗</button>' })))
        : '<p class="note">Aucun facteur en attente.</p>') +
    blk('Demandes clients en retard', Object.keys(parContact).length + ' contact(s)',
      Object.keys(parContact).length
        ? table([{k:'p',t:'Personne',cls:'wrapcell'},{k:'n',t:'Demandes',n:1},{k:'i',t:'Éléments',n:1},{k:'a',t:'Ancienneté',n:1},{k:'g',t:''}],
            Object.values(parContact).sort((a, b) => b.age - a.age).map(x => ({
              p:`<b>${esc(x.c.nom)}</b><div class="smallcaps">${esc(x.c.societe)}</div>`,
              n:String(x.n), i:String(x.items), a:x.age + ' j ouvrés',
              g:'<button class="btn mini sec" data-vue="pil.requetes">requêtes ↗</button>' })))
        : '<p class="note">Aucune demande en retard.</p>') +
    blk('Obstacles au visa', obst.reduce((a, x) => a + x.o.length, 0) + ' sur ' + obst.length + ' section(s)',
      obst.length ? table([{k:'s',t:'Section'},{k:'o',t:'Obstacles',cls:'wrapcell'},{k:'g',t:''}],
        obst.map(x => ({ s:esc(x.p.lib), o:x.o.map(esc).join(' · '),
          g:`<button class="btn mini sec" data-open="${x.p.code}">ouvrir</button>` })))
        : '<p class="note">Aucun obstacle.</p>') +
    blk('Jalons', jours(ech) >= 0 ? jours(ech) + ' jours avant l’échéance d’assemblage' : 'échéance dépassée',
      table([{k:'j',t:'Jalon'},{k:'d',t:'Date'},{k:'r',t:'Décompte',n:1}],
        jalons.map(x => ({ j:esc(x.j), d:`<span class="mono">${frDate(x.d)}</span>`,
          r:jours(x.d) >= 0 ? 'dans ' + jours(x.d) + ' j' : 'il y a ' + (-jours(x.d)) + ' j' }))) +
      `<p class="note">Échéance d’assemblage : ${DELAI_ASSEMBLAGE} jours après la date du rapport
      (C. com., art. D. 821-186, III et IV). Conservation ${RETENTION_ANS} ans (C. com., art. R. 820-42).</p>`) +
    blk('Exporter cette vue', 'classeur de pilotage, ou impression',
      `<div class="row">
        ${Object.entries(PERIMETRES).map(([k, v]) => `<button class="btn sec" data-xlsm="${k}">classeur ${esc(v.lib)}</button>`).join('')}
        <button class="btn sec" id="mi-imprime">imprimer</button>
      </div><div id="exp-out"></div>`);
}

/** Phase « contrôle interne » : la structure existe, le module est au lot B. */
function vueCI(){
  return entete('Revues de processus et contrôle interne', 'phase 2 du dossier — module au lot B') +
    `<div class="callout warn">Cette phase n’est pas alimentée. Aucun processus n’est décrit, aucun entretien n’est
    documenté, aucun contrôle n’est testé. Ce qui existe déjà et lui appartient : la procédure « entretien avec le

        avec fréquence et propriétaire — en <b>données</b>, le diagramme étant généré ;</li>
