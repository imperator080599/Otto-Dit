      </ol>`) +
    blk('Précaution juridique', 'à vérifier avant écriture de code',
      `<p class="note">Enregistrer une réunion client suppose le consentement explicite des participants, et un
      transcript contient des données personnelles : étape de consentement tracée, durée de conservation, et
      fonctionnement du module sans enregistrement. L’état du droit applicable n’a pas pu être vérifié sur le texte
      primaire depuis cet environnement : le point est porté <span class="tag abs">UNVERIFIED</span> et aucune
      constante ne sera écrite tant qu’il ne l’est pas.</p>`);
}

/* ═══ 46. ÉQUIPE, ANCIENNETÉ ET INDÉPENDANCE ═══════════════════════════════
   Trois choses qu'un dossier doit porter et qu'aucun outil ne suit :

   1. QUI est sur la mission, à quel grade, avec quel rôle, entré quand et
      sorti quand. Une liste figée dans le code n'est pas une équipe.
   2. DEPUIS COMBIEN D'EXERCICES chacun est sur ce client. La familiarité est
      une menace à documenter, et la rotation du signataire est encadrée.
      C'est déterministe : ça se compte, ça ne se juge pas.
   3. SA DÉCLARATION D'INDÉPENDANCE, une par membre et par exercice, datée et
      signée.

   LA RÈGLE QUI REND TOUT CELA RÉEL, et c'est le seul point qui compte :
   AUCUN TRAVAIL NE PEUT ÊTRE ATTRIBUÉ à un membre dont la déclaration n'est
   pas signée, et un travail attribué à quelqu'un dont la déclaration est
   devenue caduque est un OBSTACLE AU VISA de sa section. Même famille de
   règle que « on ne clôt pas sa propre note » : le système refuse, il ne
   rappelle pas.

   Une déclaration se SIGNE SOI-MÊME — personne ne signe pour un autre. Elle
   se RÉVISE en cours de mission si les circonstances changent : la révision
   n'écrase rien, elle empile une version, et l'ancienne reste lisible avec sa
   signature. Tant que la révision n'est pas signée, la déclaration du membre
   est caduque et ses travaux bloquent le visa.

   RÉSERVE. Les seuils portés ici — durée de rotation du signataire, seuil de
   familiarité, plafond du ratio d'honoraires, liste des services interdits —
   sont des PARAMÈTRES DÉCLARÉS et modifiables, marqués [UNVERIFIED] : aucun
   texte primaire n'a pu être atteint depuis cet environnement. Ils doivent
   être confrontés au texte avant tout usage réel. C'est la même règle que
   pour le catalogue méthodologique.
   ═══════════════════════════════════════════════════════════════════════ */

const EXERCICE = '2025';

/* ── les rubriques de la déclaration ──────────────────────────────────────
   Le minimum demandé, dans l'ordre où on le remplit. Chacune se répond par
   oui ou par non ; un « oui » exige une précision écrite, sans quoi la
   déclaration n'est pas signable. Un formulaire qu'on peut signer vide est
   un formulaire qui ne dit rien. */
const RUBRIQUES_INDEP = [
  { code:'interets', lib:'Intérêts financiers, directs ou indirects',
    d:'titres du client ou d’une entité liée, détenus par vous, votre conjoint ou une personne à charge, '
     + 'y compris par l’intermédiaire d’un placement dont vous choisissez la composition' },
  { code:'familiaux', lib:'Liens familiaux avec les dirigeants ou le personnel comptable',
    d:'lien de parenté ou d’alliance avec un dirigeant, un administrateur, ou toute personne du client '
     + 'occupant une fonction comptable ou financière' },
  { code:'emploi', lib:'Emploi antérieur chez le client',
    d:'poste occupé chez le client ou une entité liée, à quelque date que ce soit, et fonction occupée' },
  { code:'sacc', lib:'Services autres que la certification rendus par vous au client',
    d:'toute prestation autre que l’audit à laquelle vous avez personnellement pris part, y compris une '
     + 'mission antérieure ou une intervention ponctuelle' },
  { code:'affaires', lib:'Relations d’affaires',
    d:'relation commerciale avec le client ou ses dirigeants, hors relation courante aux conditions du marché' },
  { code:'prets', lib:'Prêts et garanties',
    d:'prêt consenti au client ou reçu de lui, caution ou garantie donnée ou reçue, dans un sens ou dans l’autre' },
  { code:'cadeaux', lib:'Cadeaux et invitations au-delà du seuil déclaré',
    d:'cadeau, avantage ou invitation reçu du client dont la valeur dépasse le seuil paramétré ci-dessus' },
];

/* ── accès ─────────────────────────────────────────────────────────────── */
function membres(){
  return Object.entries(USERS).map(([id, u]) => ({ id, ...u }));
}
function membresActifs(){ return membres().filter(m => !m.sortie); }
function declarations(uid){
  if (!S.declarations[uid]) S.declarations[uid] = [];
  return S.declarations[uid];
}
function declarationCourante(uid){
  const l = declarations(uid);
  return l.length ? l[l.length - 1] : null;
}
function declarationVide(motif){
  return { exercice:EXERCICE, reponses:{}, precisions:{}, signee:null, motif:motif || '', t:tick() };
}
/** Ce qui manque pour qu'une déclaration soit signable — la liste EST la règle. */
function manquesDeclaration(d){
  const m = [];
  if (!d) return ['déclaration non ouverte'];
  for (const r of RUBRIQUES_INDEP){
    const v = d.reponses[r.code];
    if (v === undefined) m.push('« ' + r.lib +' » sans réponse');
    else if (v === 'oui' && !(d.precisions[r.code] || '').trim())
      m.push('« ' + r.lib + ' » déclaré, sans précision écrite');
  }
  return m;
}
/** Une déclaration vaut si elle est signée et n'a pas été remplacée. */
function declarationValide(uid){
  const d = declarationCourante(uid);
  return !!(d && d.signee);
}
function etatDeclaration(uid){
  const l = declarations(uid), d = declarationCourante(uid);
  if (!d) return { cle:'absente', lib:'aucune déclaration', cls:'bad' };
  if (d.signee) return { cle:'signee', lib:'signée le ' + horo(d.signee.t), cls:'' };
  if (l.length > 1) return { cle:'caduque', lib:'révision ouverte, non signée', cls:'bad' };
  return { cle:'ouverte', lib:'ouverte, non signée', cls:'warn' };
}
/** LA règle : un membre sans déclaration signée ne reçoit aucun travail. */
function peutRecevoirTravail(uid){ return !uid || declarationValide(uid); }

/* ── écriture ─────────────────────────────────────────────────────────── */
function ouvrirDeclaration(uid){
  const l = declarations(uid);
  if (l.length && !l[l.length - 1].signee) return { ok:false, why:'une déclaration est déjà ouverte' };
  l.push(declarationVide(''));
  logEvent('déclaration d’indépendance ouverte', USERS[uid].nom, 'exercice ' + EXERCICE);
  return { ok:true };
}
/** Révision en cours de mission : elle N'ÉCRASE RIEN. La version signée reste
 *  lisible, la nouvelle part de ses réponses, et le membre est caduque tant
 *  qu'il ne l'a pas signée. */
function reviserDeclaration(uid, motif){
  const d = declarationCourante(uid);
  if (!d || !d.signee) return { ok:false, why:'aucune déclaration signée à réviser' };
  if (!(motif || '').trim()) return { ok:false, why:'une révision sans motif écrit n’est pas une révision' };
  d.remplacee = true;
  const n = declarationVide(motif);
  n.reponses = { ...d.reponses }; n.precisions = { ...d.precisions };
  declarations(uid).push(n);
  logEvent('déclaration d’indépendance révisée', USERS[uid].nom, motif.slice(0, 90));
  return { ok:true };
}
/** On signe SA déclaration, jamais celle d'un autre. */
function signerDeclaration(uid){
  if (uid !== S.moi) return { ok:false, why:'une déclaration d’indépendance se signe soi-même' };
  const d = declarationCourante(uid);
  const m = manquesDeclaration(d);
  if (m.length) return { ok:false, why:'déclaration incomplète : ' + m.join(' ; ') };
  d.signee = { par:uid, t:tick() };
  S.independance.confirmation = null;   // la confirmation d'ensemble retombe
  logEvent('déclaration d’indépendance signée', USERS[uid].nom,
           RUBRIQUES_INDEP.filter(r => d.reponses[r.code] === 'oui').length + ' rubrique(s) déclarée(s)');
  return { ok:true };
}
/** Confirmation de l'associé signataire POUR L'ENSEMBLE de l'équipe.
 *  Elle ne peut pas précéder les déclarations individuelles : une confirmation
 *  qui porterait sur des déclarations manquantes ne confirmerait rien. */
function confirmerEquipe(){
  const u = USERS[S.moi];
  if (!u || u.role !== 'associe') return { ok:false, why:'seul l’associé signataire confirme pour l’équipe' };
  const sans = membresActifs().filter(m => !declarationValide(m.id));
  if (sans.length) return { ok:false,
    why:sans.length + ' membre(s) sans déclaration signée : ' + sans.map(m => m.nom).join(', ') };
  const men = menacesNonTraitees();
  if (men.length) return { ok:false, why:men.length + ' menace(s) sans sauvegarde décrite' };
  S.independance.confirmation = { par:S.moi, t:tick() };
  logEvent('indépendance confirmée pour l’équipe', CABINET,
           membresActifs().length + ' membre(s) · exercice ' + EXERCICE);
  return { ok:true };
}

/* ── mouvements d'équipe ──────────────────────────────────────────────────
   On n'efface pas quelqu'un qui a signé quelque chose. Un membre qui porte
   une trace au dossier — un travail, une note, un visa, un événement — ne se
   retire pas : il reçoit une DATE DE SORTIE, et le dossier garde son nom. */
function tracesDe(uid){
  const t = travaux().filter(x => x.preparateur === uid || x.reviseur === uid).length;
  const n = S.notes.filter(x => x.auteur === uid || (x.clos && x.clos.par === uid)).length;
  const v = postesEnPerimetre().filter(p => (sec(p.code).visa || {}).par === uid).length;
  const e = S.events.filter(x => x.qui === (USERS[uid] || {}).nom).length;
  const d = declarations(uid).filter(x => x.signee).length;
  return { travaux:t, notes:n, visas:v, events:e, declarations:d,
           total:t + n + v + e + d };
}
function ajouterMembre(nom, grade, role, mail){
  if (!(nom || '').trim()) return { ok:false, why:'un membre sans nom n’est pas un membre' };
  if (!ORDRE_GRADE.includes(grade)) return { ok:false, why:'grade inconnu' };
  if (!ROLE_LIB[role]) return { ok:false, why:'rôle inconnu' };
  const id = 'm' + (++S.seqMembre);
  USERS[id] = { nom:nom.trim(), grade, role, cote:'audit',
                mail:(mail || '').trim(), entree:S.aujourdhui, sortie:'', exercices:1 };
  _repCache.cle = '';
  logEvent('membre ajouté à l’équipe', nom.trim(), grade + ' · ' + ROLE_LIB[role]);
  return { ok:true, id };
}
function retirerMembre(uid){
  const u = USERS[uid]; if (!u) return { ok:false, why:'membre inconnu' };
  if (uid === S.moi) return { ok:false, why:'on ne se retire pas soi-même de la mission' };
  const tr = tracesDe(uid);
  if (tr.total) return { ok:false, why:'ce membre porte ' + tr.total + ' trace(s) au dossier ('
    + [tr.travaux && tr.travaux + ' travail/travaux', tr.notes && tr.notes + ' note(s)',
       tr.visas && tr.visas + ' visa(s)', tr.declarations && tr.declarations + ' déclaration(s) signée(s)',
       tr.events && tr.events + ' événement(s)'].filter(Boolean).join(', ')
    + ') : datez sa sortie, ne l’effacez pas' };
  delete USERS[uid];
  _repCache.cle = '';
  logEvent('membre retiré de l’équipe', u.nom, 'aucune trace au dossier');
  return { ok:true };
}
function majMembre(uid, champ, valeur){
  const u = USERS[uid]; if (!u) return { ok:false, why:'membre inconnu' };
  const av = u[champ];
  if (champ === 'exercices') u.exercices = Math.max(0, parseInt(valeur, 10) || 0);
  else u[champ] = valeur;
  if (champ === 'grade' || champ === 'role') _repCache.cle = '';
  logEvent('fiche de membre modifiée', u.nom, champ + ' : ' + (av || '—') + ' → ' + (u[champ] || '—'));
  return { ok:true };
}

/* ── menaces déduites de l'ancienneté ─────────────────────────────────────
   Deux menaces, deux seuils déclarés. Elles ne bloquent pas : elles exigent
   une SAUVEGARDE ÉCRITE. Une menace sans sauvegarde reste non traitée, et
   c'est ce qui empêche la confirmation d'ensemble. */
function menacesIndependance(){
  const s = S.independance, out = [];
  for (const m of membresActifs()){
    if (m.role === 'associe' && m.exercices > s.rotationSignataire)
      out.push({ id:'ROT:' + m.id, membre:m, type:'rotation',
        lib:`${m.nom} signe ce mandat depuis ${m.exercices} exercices consécutifs, au-delà de la durée de `
          + `rotation paramétrée (${s.rotationSignataire}).`,
        exige:'Rotation du signataire, ou sauvegarde décrite et acceptée par le cabinet.' });
    else if (m.exercices > s.seuilFamiliarite)
      out.push({ id:'FAM:' + m.id, membre:m, type:'familiarite',
        lib:`${m.nom} est sur ce client depuis ${m.exercices} exercices consécutifs, au-delà du seuil de `
          + `familiarité paramétré (${s.seuilFamiliarite}).`,
        exige:'Sauvegarde décrite : revue supplémentaire, rotation partielle, ou changement d’affectation.' });
  }
  return out.map(x => ({ ...x, sauvegarde:(S.independance.sauvegardes[x.id] || '') }));
}
function menacesNonTraitees(){ return menacesIndependance().filter(x => !x.sauvegarde.trim()); }

/* ── services autres que la certification ────────────────────────────────
   Obligation française à part entière : le registre des SACC rendus au client,
   leur nature, leur montant, et le ratio d'honoraires rapporté à la mission de
   certification. La colonne « admissibilité » est un PARAMÈTRE DÉCLARÉ, pas un
   avis juridique : la liste des services interdits n'a pas pu être confrontée
   au texte primaire depuis cet environnement. [UNVERIFIED] */
const NATURES_SACC = {
  tenue:        { lib:'Tenue ou établissement de la comptabilité', adm:'interdit' },
  evaluation:   { lib:'Évaluation entrant dans les comptes',        adm:'interdit' },
  audit_interne:{ lib:'Externalisation de l’audit interne',         adm:'interdit' },
  recrutement:  { lib:'Recrutement de dirigeants ou de cadres financiers', adm:'interdit' },
  juridique_rep:{ lib:'Représentation du client dans un contentieux', adm:'interdit' },
  si:           { lib:'Conception ou mise en œuvre de systèmes d’information financière', adm:'interdit' },
  fiscal_consult:{ lib:'Consultation fiscale sans effet sur les comptes', adm:'a_examiner' },
  due_diligence:{ lib:'Diligences d’acquisition',                    adm:'a_examiner' },
  attestation:  { lib:'Attestation ou rapport lié à la mission légale', adm:'admis' },
  formation:    { lib:'Formation technique',                          adm:'admis' },
  autre:        { lib:'Autre prestation',                             adm:'a_examiner' },
};
const ADM_LIB = { interdit:{ lib:'interdit', cls:'bad' }, a_examiner:{ lib:'à examiner', cls:'warn' },
                  admis:{ lib:'admis', cls:'' } };
function ajouterSacc(nature, lib, montant, date, prestataire){
  if (!NATURES_SACC[nature]) return { ok:false, why:'nature inconnue' };
  if (!(lib || '').trim()) return { ok:false, why:'un service sans intitulé ne s’inscrit pas au registre' };
  const m = Math.round((parseFloat(String(montant).replace(/\s/g, '').replace(',', '.')) || 0) * 100);
  if (m <= 0) return { ok:false, why:'un montant nul ne se déclare pas' };
  S.sacc.push({ id:'SACC-' + String(++S.seqSacc).padStart(3, '0'), nature, lib:lib.trim(),
                montant:m, date:date || S.aujourdhui, prestataire:(prestataire || CABINET).trim() });
  logEvent('service autre que la certification inscrit', lib.trim(),
           NATURES_SACC[nature].lib + ' · ' + eur(m));
  return { ok:true };
}
function retirerSacc(id){
  const i = S.sacc.findIndex(x => x.id === id); if (i < 0) return;
  const x = S.sacc[i];
  S.sacc.splice(i, 1);
  logEvent('service retiré du registre', x.lib, eur(x.montant));
}
function totalSacc(){ return S.sacc.reduce((t, x) => t + x.montant, 0); }
function ratioSacc(){ return S.honorairesMission ? totalSacc() / S.honorairesMission : 0; }
function saccInterdits(){ return S.sacc.filter(x => NATURES_SACC[x.nature].adm === 'interdit'); }
function saccAExaminer(){ return S.sacc.filter(x => NATURES_SACC[x.nature].adm === 'a_examiner'); }

/* ── obstacles ────────────────────────────────────────────────────────────
   Deux portées. Au dossier : ce qui empêche de confirmer l'indépendance de
   l'équipe. À la section : les travaux attribués à quelqu'un dont la
   déclaration ne vaut plus. */
function obstaclesIndependance(){
  const o = [];
  const sans = membresActifs().filter(m => !declarationValide(m.id));
  if (sans.length) o.push(`${sans.length} membre(s) sans déclaration d’indépendance signée : `
    + sans.map(m => m.nom).join(', '));
  const men = menacesNonTraitees();
  if (men.length) o.push(`${men.length} menace(s) d’indépendance sans sauvegarde décrite`);
  const int = saccInterdits();
  if (int.length) o.push(`${int.length} service(s) inscrit(s) au registre et paramétré(s) « interdit »`);
  if (ratioSacc() * 100 > S.plafondSacc)
    o.push(`ratio d’honoraires SACC ${pct(ratioSacc(), 0)} au-delà du plafond paramétré (${S.plafondSacc}${NBSP}%)`);
  if (!S.independance.confirmation) o.push('indépendance de l’équipe non confirmée par l’associé signataire');
  return o;
}
/** Travaux d'une section attribués à un membre dont la déclaration ne vaut plus. */
function travauxIndependanceSection(code){
  const out = [];
  for (const t of travauxDe(code)){
    for (const role of ['preparateur', 'reviseur']){
      const uid = t[role];
      if (uid && !declarationValide(uid)) out.push({ t, role, uid, etat:etatDeclaration(uid) });
    }
  }
  return out;
}
function obstaclesIndependanceSection(code){
  const l = travauxIndependanceSection(code);
  if (!l.length) return [];
  const gens = [...new Set(l.map(x => USERS[x.uid].nom))];
  return [`${l.length} travail/travaux attribué(s) à ${gens.join(', ')} — déclaration d’indépendance non valide`];
}

/* ═══════════════════════════════════════════════════════════════════════
   LA VUE
   ═══════════════════════════════════════════════════════════════════════ */
function vueEquipe(){
  return entete('Équipe et indépendance',
                'qui est sur la mission, depuis combien d’exercices, et ce qu’il a déclaré') +
    blocEquipe() + blocAnciennete() + blocDeclarations() + blocSacc() + blocParamIndep();
}

function blocEquipe(){
  const sel = (uid, champ, options) => `<select class="cell txt" data-mem="${uid}|${champ}">
    ${options.map(([v, l]) => `<option value="${v}" ${USERS[uid][champ] === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}
  </select>`;
  const rows = membres().map(m => {
    const e = etatDeclaration(m.id), tr = tracesDe(m.id);
    return {
      n:`<b>${esc(m.nom)}</b>${m.id === S.moi ? ' <span class="pill">vous</span>' : ''}
         <div class="smallcaps mono">${esc(m.id)}</div>`,
      g:sel(m.id, 'grade', ORDRE_GRADE.map(g => [g, g])),
      r:sel(m.id, 'role', Object.entries(ROLE_LIB)),
      c:`<input class="cell txt" data-mem="${m.id}|mail" value="${esc(m.mail || '')}" placeholder="courriel">`,
      en:`<input class="cell txt" type="date" data-mem="${m.id}|entree" value="${esc(m.entree || '')}">`,
      so:`<input class="cell txt" type="date" data-mem="${m.id}|sortie" value="${esc(m.sortie || '')}">`,
      x:`<input class="cell" data-mem="${m.id}|exercices" value="${m.exercices}" style="width:52px">`,
      d:`<span class="pill ${e.cls}">${esc(e.lib)}</span>`,
      t:tr.total ? `<span class="smallcaps">${tr.total} trace(s)</span>` : '<span class="smallcaps">aucune</span>',
      a:tr.total || m.id === S.moi
        ? `<span class="smallcaps">non retirable</span>`
        : `<button class="btn mini sec" data-memdel="${m.id}">retirer</button>`,
    };
  });
  return blk('Équipe de la mission', membres().length + ' membre(s) · ' + membresActifs().length + ' en fonction',
    table([{k:'n',t:'Membre',cls:'wrapcell'},{k:'g',t:'Grade'},{k:'r',t:'Rôle'},{k:'c',t:'Courriel',cls:'wrapcell'},
           {k:'en',t:'Entrée'},{k:'so',t:'Sortie'},{k:'x',t:'Exercices',n:1},
           {k:'d',t:'Déclaration',cls:'wrapcell'},{k:'t',t:'Traces'},{k:'a',t:''}], rows) +
    `<div class="row" style="margin-top:8px">
      <div class="ctrl" style="flex:1 1 180px"><label>Nom du nouveau membre</label>
        <input type="text" id="mem-nom" placeholder="Prénom Nom"></div>
      <div class="ctrl"><label>Grade</label><select id="mem-grade">
        ${ORDRE_GRADE.map(g => `<option value="${g}">${esc(g)}</option>`).join('')}</select></div>
      <div class="ctrl"><label>Rôle</label><select id="mem-role">
        ${Object.entries(ROLE_LIB).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select></div>
      <div class="ctrl" style="flex:1 1 180px"><label>Courriel</label>
        <input type="text" id="mem-mail" placeholder="p.nom@revisia-audit.example"></div>
      <div class="ctrl"><label>&nbsp;</label><button class="btn" id="mem-add">ajouter à la mission</button></div>
    </div>
    ${S.memErreur ? `<div class="callout bad">${esc(S.memErreur)}</div>` : ''}
    <p class="note">On ne retire pas quelqu’un qui a signé quelque chose : un membre portant une trace au
    dossier — un travail, une note, un visa, une déclaration — reçoit une <b>date de sortie</b>, et le
    dossier garde son nom. C’est la même règle que le journal d’événements, qui ne se réécrit pas.</p>`);
}

function blocAnciennete(){
  const men = menacesIndependance(), s = S.independance;
  const rows = membresActifs().sort((a, b) => b.exercices - a.exercices).map(m => {
    const mm = men.find(x => x.membre.id === m.id);
    return {
      n:`<b>${esc(m.nom)}</b><div class="smallcaps">${esc(m.grade)} · ${esc(ROLE_LIB[m.role])}</div>`,
      x:`<span class="mono">${m.exercices}</span>`,
      s:m.role === 'associe' ? `<span class="mono">${s.rotationSignataire}</span>
          <div class="smallcaps">rotation du signataire</div>`
        : `<span class="mono">${s.seuilFamiliarite}</span><div class="smallcaps">familiarité</div>`,
      e:mm ? `<span class="pill bad">${mm.type === 'rotation' ? 'rotation dépassée' : 'familiarité'}</span>`
           : '<span class="pill">sous le seuil</span>',
      g:mm ? `<textarea data-sauve="${esc(mm.id)}" rows="2"
                placeholder="sauvegarde décrite : ce qui est mis en place, et par qui">${esc(mm.sauvegarde)}</textarea>`
           : '<span class="smallcaps">—</span>',
    };
  });
  return blk('Ancienneté sur le client et menaces qui en découlent',
    men.length + ' menace(s) · ' + menacesNonTraitees().length + ' sans sauvegarde',
    table([{k:'n',t:'Membre',cls:'wrapcell'},{k:'x',t:'Exercices consécutifs',n:1},
           {k:'s',t:'Seuil applicable',n:1},{k:'e',t:'État'},{k:'g',t:'Sauvegarde décrite',cls:'wrapcell'}], rows) +
    (menacesNonTraitees().length ? `<div class="callout bad">
      <b>${menacesNonTraitees().length} menace(s) sans sauvegarde décrite.</b>
      ${menacesNonTraitees().map(x => esc(x.lib) + ' <span class="smallcaps">' + esc(x.exige) + '</span>').join('<br>')}
      <br>Tant qu’une sauvegarde n’est pas écrite, l’associé signataire ne peut pas confirmer
      l’indépendance de l’équipe.</div>` : '') +
    `<p class="note">Le nombre d’exercices consécutifs se compte, il ne se juge pas — et c’est précisément
    pour cela qu’aucun outil ne le suit. Les deux seuils sont des <b>paramètres déclarés</b>, modifiables
    plus bas et marqués <b>[UNVERIFIED]</b> : ils n’ont pas pu être confrontés au texte primaire depuis cet
    environnement.</p>`,
    menacesNonTraitees().length ? menacesNonTraitees().length + ' sans sauvegarde' : '');
}

function blocDeclarations(){
  const conf = S.independance.confirmation;
  const moi = S.moi, d = declarationCourante(moi), hist = declarations(moi);
  const manques = manquesDeclaration(d);
  const rows = membresActifs().map(m => {
    const e = etatDeclaration(m.id), dm = declarationCourante(m.id);
    const decl = dm ? RUBRIQUES_INDEP.filter(r => dm.reponses[r.code] === 'oui') : [];
    return {
      n:`<b>${esc(m.nom)}</b><div class="smallcaps">${esc(ROLE_LIB[m.role])}</div>`,
      e:`<span class="pill ${e.cls}">${esc(e.lib)}</span>`,
      v:`<span class="mono">${declarations(m.id).length || '—'}</span>`,
      r:decl.length ? decl.map(r => `<span class="tag">${esc(r.lib)}</span>`).join(' ')
                    : '<span class="smallcaps">rien à déclarer</span>',
      p:dm && dm.signee ? `<span class="smallcaps">${esc(USERS[dm.signee.par].nom)}<br>${horo(dm.signee.t)}</span>`
                        : '<span class="smallcaps">—</span>',
      a:m.id === moi ? '<span class="pill">à vous</span>'
        : declarationValide(m.id)

/* ── amorce ───────────────────────────────────────────────────────────────
   Les déclarations de l'exercice ont été signées avant le début des travaux,
   en novembre et décembre 2025 : elles portent donc des dates ANTÉRIEURES à
   l'horloge de mission, et n'entrent pas au journal d'événements de la
   session — le journal enregistre ce qui se passe pendant la mission, il ne
   se réécrit pas en arrière.

   Deux membres sont volontairement dans un autre état, parce que la règle ne
   se démontre pas sur un dossier parfait :
     — Hugo Vasseur, arrivé en janvier, n'a pas encore signé : AUCUN travail
       ne peut lui être attribué, et l'écran refuse ;
     — Inès Rodrigues a signé puis ouvert une RÉVISION (son conjoint a rejoint
       une filiale du client) : sa déclaration est caduque tant qu'elle n'a pas
       signé la nouvelle, et ses travaux bloquent le visa de leurs sections. */
const AMORCE_DECL = {
  claire:{ t:'2025-11-04T10:20', oui:{} },
  lea   :{ t:'2025-11-05T09:05', oui:{} },
  karim :{ t:'2025-11-06T14:40', oui:{ cadeaux:'Invitation à un déjeuner professionnel le 12/09/2025, 62 € — au-dessus du seuil déclaré, sans influence sur la conduite des travaux.' } },
  ines  :{ t:'2025-11-06T16:15', oui:{ emploi:'Stage de six mois chez Altiverre SAS en 2018, au service logistique — sans fonction comptable ni financière.' } },
  sonia :{ t:'2026-02-03T11:30', oui:{} },
};
function seedEquipe(){
  for (const [uid, a] of Object.entries(AMORCE_DECL)){
    if (!USERS[uid]) continue;
    const d = { exercice:EXERCICE, reponses:{}, precisions:{}, motif:'', t:a.t, signee:{ par:uid, t:a.t } };
    for (const r of RUBRIQUES_INDEP){
      d.reponses[r.code] = a.oui[r.code] ? 'oui' : 'non';
      if (a.oui[r.code]) d.precisions[r.code] = a.oui[r.code];
    }
    S.declarations[uid] = [d];
  }
  /* Inès : révision ouverte, non signée — la déclaration est caduque. */
  const di = S.declarations.ines;
  if (di && di.length === 1){
    di[0].remplacee = true;
    di.push({ exercice:EXERCICE, t:'2026-03-09T08:45',
      motif:'Le conjoint a rejoint en février 2026 la direction financière d’Altiverre Industrie, filiale du client.',
      reponses:{ ...di[0].reponses }, precisions:{ ...di[0].precisions }, signee:null });
  }
  /* Registre des services autres que la certification. */
  S.sacc = [
    { id:'SACC-001', nature:'due_diligence', lib:'Diligences d’acquisition sur la cible Verrerie du Forez',
      montant:1200000, date:'2025-06-18', prestataire:CABINET },
    { id:'SACC-002', nature:'si', lib:'Paramétrage du reporting de consolidation',
      montant:950000, date:'2025-09-30', prestataire:'Revisia Conseil (entité liée au cabinet)' },
    { id:'SACC-003', nature:'fiscal_consult', lib:'Consultation sur le crédit d’impôt recherche',
      montant:450000, date:'2025-04-02', prestataire:CABINET },
    { id:'SACC-004', nature:'formation', lib:'Formation à la nouvelle norme de présentation',
      montant:180000, date:'2025-11-14', prestataire:CABINET },
  ];
  S.seqSacc = 4;
  for (const a of AFFECTATIONS_AMORCE) a.poser();
}

/* ── affectations posées à l'amorce, et pourquoi ──────────────────────────
   Le dossier ne part pas d'une feuille blanche : certaines affectations ont
   été faites AVANT le moment où l'on ouvre l'outil. Elles sont écrites ici,
   nommées et motivées, pour qu'on puisse vérifier qu'il n'y en a pas
   d'autres — la proposition de répartition, elle, n'écrit toujours rien.

   Elles sont posées SANS passer par affecter(), qui refuserait aujourd'hui
   l'affectation d'Inès : c'est le fait même que la règle ne s'appliquait pas
   au moment où elles ont été faites qui rend l'obstacle au visa nécessaire. */
const AFFECTATIONS_AMORCE = [
  { section:'CLIENTS', prep:'ines', rev:t => t.niveauRevue === 2 ? 'claire' : 'lea',
    pourquoi:'attribuées à Inès en novembre 2025, quand sa déclaration d’indépendance valait ; '
           + 'la révision de mars 2026 les rend caduques et bloque le visa de la section',
    poser(){ for (const t of travauxDe(this.section)){
      const st = trav(t.code); st.preparateur = this.prep; st.reviseur = this.rev(t); } },
  },
];
/** Codes des travaux affectés à l'amorce — pour vérifier qu'il n'y en a pas d'autres. */
function codesAffectesAmorce(){
  return [...AFFECTATIONS_AMORCE.flatMap(a => travauxDe(a.section).map(t => t.code)),
          ...codesDeroules()];
}

/* ═══ 43. LA SECTION COMME LIEU, ET NON COMME PAGE ═════════════════════════
   Une section rendait ses sept blocs d'un seul tenant : sur le chiffre
   d'affaires, sept mille pixels d'un seul défilement. Un bouton « replier »
   aurait masqué le défaut sans le corriger — on aurait encore eu une page,
   simplement pliée.

   La correction est structurelle : la section devient un LIEU où l'on se
   déplace. Six destinations, une seule affichée à la fois. Le plan de travail
   est l'atterrissage, parce que c'est ce qu'un réviseur ouvre en premier.
   Une procédure ouverte REMPLACE le plan au lieu de s'y ajouter. Et ce qui
   dit où l'on en est — risque, obstacles, visa, avancement des justificatifs —
   quitte le corps de la page pour le bandeau collant : on ne fait jamais
   défiler pour savoir où l'on en est.
   ═══════════════════════════════════════════════════════════════════════ */

const DESTINATIONS = [
  { id:'comptes',  lib:'Comptes',           ref:'CPT-01' },
  { id:'risque',   lib:'Risque',            ref:'RSQ-01' },
  /* « Procédures d'audit », et non « Plan de travail » : ce dernier entrait en
     collision avec « Programme de travail », qui désigne autre chose — le
     livrable d'organisation de la mission entière. Deux noms quasi identiques
     pour deux objets différents est un défaut d'usage, pas un détail. */
  { id:'plan',     lib:'Procédures d’audit', ref:'PRO-01' },
  { id:'requetes', lib:'Requêtes',          ref:'REQ-01' },
  { id:'notes',    lib:'Notes de revue',    ref:'NDR-01' },
  { id:'concl',    lib:'Conclusion et visa',ref:'CCL-01' },
];
const DEST_DEFAUT = 'plan';
function destCourante(code){ return S.dest[code] || DEST_DEFAUT; }

/** Ce qui demande attention dans chaque destination. C'est ce nombre qui
 *  commande à la fois le compteur de la navigation et l'ouverture par défaut
 *  des replis : la place occupée à l'écran suit les problèmes, comme la
 *  couleur (ADR-038). */
function attentionDest(p, id){
  const st = sec(p.code);
  switch (id){
    case 'comptes': {
      const sansMotif = p.comptes.filter(c => st.ns[c] && !(st.nsMotif[c] || '').trim()).length;
      const ra = revueAnalytique().filter(l => p.re.test(l.compte) && l.flag).length;
      return sansMotif + ra;
    }
    case 'risque': {
      const fp = facteursProposes(p.code).length;
      const fsm = facteursDe(p.code).filter(f => f.statut === 'ecarte' && !f.motif.trim()).length;
      const niv = ASSERTIONS.filter(a => st.override[a.code] && !(st.overrideMotif[a.code] || '').trim()).length;
      return fp + fsm + niv;
    }
    case 'plan': {
      let n = 0;
      for (const pr of proceduresRequises(p)){
        if (obstaclesProcedure(p, pr).length) n++;
        if (peremption(p, pr)) n++;
      }
      return n;
    }
    case 'requetes': return requetesDe(p.code).filter(retard).length;
    case 'notes':    return notesBloquantesOuvertes(p.code).length;
    case 'concl': {
      let n = 0;
      if (!st.conclusion.trim()) n++;
      n += (PAPIERS_N1[p.code] || []).filter(x => !st.reprisN1Vues[x.id]).length;
      if (!st.visa && obstaclesVisa(p).length) n++;
      if (visaPerime(p.code)) n++;
      return n;
    }
  }
  return 0;
}

/* ── replis : l'état par défaut est dérivé, celui que l'on change est retenu ─
   `attention` : nombre de choses à traiter dans ce repli. Non nul, il s'ouvre.
   Le repli que l'auditeur ouvre ou ferme lui-même est mémorisé pour la
   session, par section — sa décision l'emporte sur la règle jusqu'à ce qu'il
   change d'avis. */
/* Quelques replis s'ouvrent par défaut sans porter d'obstacle : ce sont ceux
   où l'on TRAVAILLE — on ne cache pas l'outil qu'on est venu régler. */
const REPLIS_OUVERTS = new Set(['plan.je/crit/actifs']);
function ouvertParDefaut(cle, attention){
  const v = S.replis[cle];
  if (v !== undefined) return v;
  return !!attention || REPLIS_OUVERTS.has(cle);
}
function repli(cle, titre, sousTitre, contenu, attention){
  const o = ouvertParDefaut(cle, attention);
  return `<details class="repli" data-repli="${esc(cle)}" ${o ? 'open' : ''}>
    <summary>
      <span class="t">${esc(titre)}</span>
      ${sousTitre ? `<span class="s">${sousTitre}</span>` : ''}
      ${attention ? `<span class="pill bad">${attention}</span>` : ''}
    </summary>
    <div class="c">${contenu}</div>
  </details>`;
}
function barreReplis(prefixe){
  return `<div class="row replis-cmd">
    <button class="btn mini sec" data-replis="${esc(prefixe)}|1">tout déplier</button>
    <button class="btn mini sec" data-replis="${esc(prefixe)}|0">tout replier</button>
    <span class="smallcaps">ce qui demande attention est déjà ouvert</span>
  </div>`;
}

/* ── le bandeau collant de la section ─────────────────────────────────────
   Il remplace les compteurs de mission tant qu'on est dans une section : ce
   qu'il faut savoir ici, c'est l'état de CETTE section. La hauteur collante
   ne change donc pas. */
/** Un rapport au seuil se lit en multiples, pas en pourcentage : « 235 × »
 *  se comprend d'un coup d'œil, « 23 466 % » ne dit rien. */
function multiple(x){
  if (!isFinite(x)) return '—';
  return (x >= 10 ? Math.round(x) : (Math.round(x * 10) / 10).toString().replace('.', ',')) + NBSP + '×';
}
function cellulesSection(p){
  const s = seuils(), st = sec(p.code), o = obstaclesVisa(p), t = avancementSection(p);
  const niv = NIVEAUX[niveauMax(p)];
  /* Les trois cellules marquées « essentielles » sont celles qui restent quand
     le bandeau se réduit : ce que je regarde, où j'en suis, ce qui bloque. */
  return {
    'poste':                    [esc(p.lib), esc(p.code), true],
    'risque retenu':            [NIV_LIB[niv], 'risque'],
    'solde / planification':    [multiple(Math.abs(p.solde) / s.PM), '/ planif.'],
    'obstacles au visa':        [String(o.length), 'obstacles', true],
    'visa':                     [st.visa ? 'visée' : (o.length ? 'bloqué' : 'prête'), 'visa', true],
    'justificatifs attendus':   [String(t.elements), 'attendus'],
    'reçus':                    [String(t.recus), 'reçus'],
    'contrôles traités':        [String(t.traitee + t.explique), 'traités'],
    'écarts à expliquer':       [String(t.ecart), 'écarts'],
  };
}

/* ── navigation interne ───────────────────────────────────────────────── */
function navSection(p){
  const d = destCourante(p.code);
  return `<nav class="destnav">${DESTINATIONS.map(x => {
    const n = attentionDest(p, x.id);
    return `<button class="dest ${x.id === d ? 'on' : ''}" data-dest="${p.code}|${x.id}">
      ${esc(x.lib)}${n ? `<span class="cnt">${n}</span>` : ''}</button>`;
  }).join('')}</nav>`;
}

/* ── les six destinations ─────────────────────────────────────────────── */
function destinationSection(p, id){
  const k = s => p.code + '/' + id + '/' + s;
  switch (id){
    case 'comptes':
      return barreReplis(p.code + '/comptes') +
        repli(k('table'), 'Comptes de la section', p.comptes.length + ' compte(s)',
          partComptes(p), p.comptes.filter(c => sec(p.code).ns[c] && !(sec(p.code).nsMotif[c] || '').trim()).length) +
        repli(k('ra'), 'Revue analytique substantive du poste',
          revueAnalytique().filter(l => p.re.test(l.compte) && l.flag).length + ' compte(s) au-dessus d’un seuil',
          blocRevueAnalytique(p), revueAnalytique().filter(l => p.re.test(l.compte) && l.flag).length);

    case 'risque': {
      const st = sec(p.code);
      const nivSansMotif = ASSERTIONS.filter(a => st.override[a.code] && !(st.overrideMotif[a.code] || '').trim()).length;
      const fp = facteursProposes(p.code).length
        + facteursDe(p.code).filter(f => f.statut === 'ecarte' && !f.motif.trim()).length;
      return barreReplis(p.code + '/risque') +
        repli(k('facteurs'), 'Constatations venues d’autres procédures',
          facteursDe(p.code).length + ' facteur(s) au registre', blocFacteursSection(p), fp) +
        repli(k('assertions'), 'Évaluation par assertion', 'jugement de l’auditeur',
          partAssertions(p), nivSansMotif) +
        repli(k('questionnaire'), 'Questionnaire résiduel de risque',
          QUEST_SECTION.length + ' question(s) — ce qu’aucune autre source ne couvre',
          partQuestionnaire(p),
          questionsSansReponse(p.code).section.length
          + facteursQuestionnaire().filter(f => f.incomplet && f.cibles.some(c => c.fsli === p.code)).length) +
        repli(k('etendue'), 'Étendue des travaux, par assertion', 'ce que le risque commande',
          partEtendue(p), 0);
    }

    case 'plan': {
      const ouvertKey = S.procOuverte && S.procOuverte.startsWith(p.code + '/')
        ? S.procOuverte.slice(p.code.length + 1) : null;
      const pr = proceduresRequises(p).find(x => x.code === ouvertKey);
      if (pr) return filAriane(p, pr) + blocProcedure(p, pr);
      const t = avancementSection(p);
      return barreReplis(p.code + '/plan') +
        repli(k('procedures'), 'Procédures et sélections',
          proceduresRequises(p).length + ' procédure(s)', blocPlan(p),
          proceduresRequises(p).filter(x => obstaclesProcedure(p, x).length).length) +
        repli(k('suivi'), 'Avancement des justificatifs',
          t.recus + ' / ' + t.elements + ' éléments avec pièce', blocSuiviSection(p), t.ecart + t.attente);
    }

    case 'requetes':
      return barreReplis(p.code + '/requetes') +
        repli(k('liste'), 'Requêtes de la section', requetesDe(p.code).length + ' requête(s)',
          blocRequetes(p), requetesDe(p.code).filter(retard).length);

    case 'notes':
      return barreReplis(p.code + '/notes') +
        repli(k('liste'), 'Notes de revue de la section',
          notesDe(p.code).length + ' note(s)', blocNotesSection(p.code),
          notesBloquantesOuvertes(p.code).length);

    case 'concl': {
      const st = sec(p.code), n1 = (PAPIERS_N1[p.code] || []).filter(x => !st.reprisN1Vues[x.id]).length;
      return barreReplis(p.code + '/concl') +
        repli(k('n1'), 'Reprise de l’exercice précédent',
          (PAPIERS_N1[p.code] || []).length + ' papier(s) N-1', partN1(p), n1) +
        repli(k('concl'), 'Conclusion de section',
          st.conclusion.trim() ? 'rédigée' : 'non rédigée', partConclusion(p),
          st.conclusion.trim() ? 0 : 1) +
        repli(k('visa'), 'Visa',
          st.visa ? 'visée par ' + USERS[st.visa.par].nom : obstaclesVisa(p).length + ' obstacle(s)',
          partVisa(p), st.visa ? (visaPerime(p.code) ? 1 : 0) : obstaclesVisa(p).length);
    }
  }
  return '';
}

/** Fil d'Ariane : une procédure ouverte remplace le plan de travail. */
function filAriane(p, pr){
  return `<div class="ariane">

/* ── assemblage ───────────────────────────────────────────────────────── */
function vueFsli(code){
  const p = postesCalcules().find(x => x.code === code);

      sur des travaux qui ne portent plus sur le même fichier. Reconfirmez les travaux touchés, puis le visa.
      <button class="btn mini sec" id="sec-devisa">retirer le visa</button></div>` : ''}

}

/* ═══ 41. RÉPARTITION PROPOSÉE ═════════════════════════════════════════════
   « La meilleure attribution en lot est celle qu'on n'a pas à faire. »
   Le système propose, l'auditeur corrige. Deux règles se composent :

   1. QUI, par GRADE — ce que le travail demande, pas qui est disponible.
   2. LEQUEL, à grade égal — celui dont la charge est la plus faible, les
      travaux étant parcourus dans un ordre fixe. La répartition est donc
      rejouable à l'identique, et l'équilibre des heures en découle.

   Rien n'est écrit tant que personne n'a accepté : la proposition est
   affichée à côté de l'affectation réelle, jamais à sa place.
   ═══════════════════════════════════════════════════════════════════════ */

const REGLE_REPARTITION = [
  { cas:'Travail de niveau 2 — matérialité, arrêté de l’opinion, clôture du dossier',
    prep:'superviseur', rev:'associée',
    quoi:t => t.niveauRevue === 2 && t.nature !== 'section' },
  { cas:'Procédure de section répondant à une assertion évaluée « élevé »',
    prep:'senior', rev:'associée',
    quoi:t => t.nature === 'section' && t.niveauRevue === 2 },
  { cas:'Procédure de section avec sélection, risque moyen',
    prep:'senior', rev:'superviseur',
    quoi:t => t.nature === 'section' && t.ech && t.assertion && t.poste
           && niveau(postesCalcules().find(p => p.code === t.poste) || {}, t.assertion) === 'moyen' },
  { cas:'Procédure de section avec sélection, risque faible',
    prep:'assistant', rev:'superviseur',
    quoi:t => t.nature === 'section' && t.ech },
  { cas:'Procédure de section sans sélection',
    prep:'assistant', rev:'superviseur',
    quoi:t => t.nature === 'section' },
  { cas:'Travail de planification',
    prep:'senior', rev:'superviseur',
    quoi:t => t.nature === 'planification' },
  { cas:'Travail d’achèvement',
    prep:'superviseur', rev:'associée',
    quoi:t => t.nature === 'achevement' },
  { cas:'Tout autre travail',
    prep:'senior', rev:'superviseur', quoi:() => true },
];
function regleDe(t){ return REGLE_REPARTITION.find(r => r.quoi(t)) || REGLE_REPARTITION[REGLE_REPARTITION.length - 1]; }
/* La proposition ne propose que des gens à qui l'on peut RÉELLEMENT attribuer
   un travail : proposer quelqu'un que l'affectation refusera ensuite serait
   une proposition fausse. Le filtre est le même que la règle. */
function gensDuGrade(g){
  return Object.entries(USERS)
    .filter(([k, u]) => u.grade === g && !u.sortie && peutRecevoirTravail(k))
    .map(([k]) => k);
}

/** La proposition complète, dérivée. Jamais écrite tant qu'on ne l'accepte pas. */
const _repCache = { cle:'', v:null };
function repartitionProposee(){
  const l = travaux();
  const cle = l.length + '|' + JSON.stringify(l.map(t => t.code + t.niveauRevue))
    + '|' + membres().map(m => m.id + m.grade + (declarationValide(m.id) ? '1' : '0') + (m.sortie ? 'x' : '')).join(',');
  if (_repCache.cle === cle && _repCache.v) return _repCache.v;
  const chargePrep = {}, chargeRev = {};
  for (const k of Object.keys(USERS)){ chargePrep[k] = 0; chargeRev[k] = 0; }
  const out = new Map();
  /* Ordre fixe : par phase puis par code. La proposition est rejouable. */
  const ordre = [...l].sort((a, b) => {
    const pa = PHASES.findIndex(x => x.id === a.phase), pb = PHASES.findIndex(x => x.id === b.phase);
    return pa !== pb ? pa - pb : (a.code < b.code ? -1 : 1);
  });
  for (const t of ordre){
    const r = regleDe(t), h = budget(t);
    const cand = g => { const g2 = gensDuGrade(g); return g2.length ? g2 : gensDuGrade('senior'); };
    const moins = (liste, charge, exclu) => liste.filter(k => k !== exclu)
      .sort((a, b) => charge[a] - charge[b] || (a < b ? -1 : 1))[0];
    const prep = moins(cand(r.prep), chargePrep, null);
    /* Le réviseur ne peut être le préparateur, et un niveau 2 exige un associé. */
    const gradeRev = t.niveauRevue === 2 ? 'associée' : r.rev;
    const rev = moins(cand(gradeRev).filter(k => peutReviser(k, t)), chargeRev, prep);
    if (prep) chargePrep[prep] += h;
    if (rev) chargeRev[rev] += h * 0.2;      // la revue coûte le cinquième de la préparation
    out.set(t.code, { prep, rev, regle:r.cas, heures:h });
  }
  _repCache.cle = cle; _repCache.v = out;
  return out;
}
function propositionDe(code){ return repartitionProposee().get(code) || null; }
/** Un travail s'écarte-t-il de la proposition ? C'est la correction humaine. */
function ecartProposition(t){
  const p = propositionDe(t.code); if (!p) return null;
  const dp = t.preparateur && t.preparateur !== p.prep;
  const dr = t.reviseur && t.reviseur !== p.rev;
  return dp || dr ? { prep:dp, rev:dr, p } : null;
}

/** Applique la proposition. `quoi` : 'vides' ou 'selection'. */
function appliquerRepartition(quoi, codes){
  const l = travaux();
  const cibles = quoi === 'selection'
    ? l.filter(t => codes.includes(t.code))
    : l.filter(t => !t.preparateur || !t.reviseur);
  let n = 0, refus = 0;
  for (const t of cibles){
    const p = propositionDe(t.code); if (!p) continue;
    if (quoi === 'vides'){
      if (!t.preparateur && p.prep){ if (affecter(t.code, 'preparateur', p.prep).ok) n++; else refus++; }
      if (!trav(t.code).reviseur && p.rev){ if (affecter(t.code, 'reviseur', p.rev).ok) n++; else refus++; }
    } else {
      if (p.prep){ if (affecter(t.code, 'preparateur', p.prep).ok) n++; else refus++; }
      if (p.rev){ if (affecter(t.code, 'reviseur', p.rev).ok) n++; else refus++; }
    }
  }
  logEvent('répartition proposée appliquée',
           quoi === 'selection' ? cibles.length + ' travail/travaux sélectionné(s)' : 'travaux non affectés',
           n + ' affectation(s)' + (refus ? ', ' + refus + ' refusée(s) par la règle' : ''));
  return { n, refus, cibles:cibles.length };
}
/** Attribution en lot d'une personne choisie à la main, sur la sélection. */
function affecterEnLot(codes, role, uid){
  let n = 0; const refus = [];
  for (const c of codes){
    const r = affecter(c, role, uid);
    if (r.ok) n++; else refus.push(c + ' : ' + r.why);
  }
  logEvent('attribution en lot', codes.length + ' travail/travaux',
           (role === 'preparateur' ? 'préparateur : ' : 'réviseur : ') + (uid ? USERS[uid].nom : 'retiré')
           + ' · ' + n + ' appliquée(s)' + (refus.length ? ', ' + refus.length + ' refusée(s)' : ''));
  return { n, refus };
}

/* ── charge par personne, proposée et réelle ──────────────────────────── */
function chargeParPersonne(source){
  const l = travaux(), prop = repartitionProposee();
  return Object.entries(USERS).map(([k, u]) => {
    const p = source === 'proposee'
      ? l.filter(t => (prop.get(t.code) || {}).prep === k)
      : l.filter(t => t.preparateur === k);
    const r = source === 'proposee'
      ? l.filter(t => (prop.get(t.code) || {}).rev === k)
      : l.filter(t => t.reviseur === k);
    return { k, u, nPrep:p.length, nRev:r.length,
             /* Quelqu'un qui ne peut pas recevoir de travail apparaît à zéro
                AVEC SA RAISON : le faire disparaître de la charge donnerait
                une équipe plus petite qu'elle n'est. */
             indispo:!peutRecevoirTravail(k) ? etatDeclaration(k).lib : u.sortie ? 'sorti le ' + frDate(u.sortie) : '',
             h:p.reduce((a, t) => a + budget(t), 0) + r.reduce((a, t) => a + budget(t) * 0.2, 0) };
  });
}

/* ═══ 42. BLOCS D'ÉCRAN ════════════════════════════════════════════════════ */
function blocRepartition(vus){
  const prop = chargeParPersonne('proposee'), reel = chargeParPersonne('reelle');
  const l = travaux();
  const nonAffectes = l.filter(t => !t.preparateur || !t.reviseur).length;
  const corriges = l.map(t => ecartProposition(t)).filter(Boolean).length;
  const tot = prop.reduce((a, x) => a + x.h, 0);
  return blk('Répartition proposée', nonAffectes + ' travail/travaux non affecté(s) sur ' + l.length,
    table([{k:'c',t:'Cas',cls:'wrapcell'},{k:'p',t:'Préparateur proposé'},{k:'r',t:'Réviseur proposé'},{k:'n',t:'Travaux',n:1}],
      REGLE_REPARTITION.map(r => ({ c:esc(r.cas), p:esc(r.prep), r:esc(r.rev),
        n:String(l.filter(t => regleDe(t).cas === r.cas).length) })),
      { foot:{ c:'Total', n:String(l.length) } }) +
    `<p class="note">À grade égal, le travail va à la personne dont la charge est la plus faible, les travaux
    étant parcourus dans un ordre fixe : la proposition est rejouable à l’identique. La revue est comptée pour
    un cinquième de la préparation. Rien n’est écrit tant que vous n’acceptez pas.</p>
    ${prop.some(x => x.indispo) ? `<div class="callout warn">
      <b>${prop.filter(x => x.indispo).length} membre(s) ne reçoivent aucune proposition</b> —
      ${prop.filter(x => x.indispo).map(x => esc(x.u.nom) + ' (' + esc(x.indispo) + ')').join(', ')}.
      La proposition ne propose que ce que l’affectation accepterait : proposer quelqu’un qu’elle
      refuserait ensuite serait une proposition fausse.
      <button class="btn mini sec" data-vue="plan.equipe">Équipe et indépendance ↗</button></div>` : ''}
    ${diagnosticRepartition()}
    <h3>Charge — proposée et réelle</h3>
    ${table([{k:'n',t:'Personne',cls:'wrapcell'},{k:'g',t:'Grade'},
             {k:'pp',t:'Prépare (proposé)',n:1},{k:'pr',t:'Revoit (proposé)',n:1},{k:'ph',t:'Heures (proposé)',n:1},
             {k:'rp',t:'Prépare (réel)',n:1},{k:'rr',t:'Revoit (réel)',n:1},{k:'rh',t:'Heures (réel)',n:1}],
      prop.map((x, i) => ({ n:`<b>${esc(x.u.nom)}</b>`
          + (x.indispo ? `<div class="smallcaps" style="color:var(--anomalie)">${esc(x.indispo)} — aucun travail attribuable</div>` : ''),
        g:esc(x.u.grade),
        pp:String(x.nPrep), pr:String(x.nRev), ph:hFmt(x.h),
        rp:String(reel[i].nPrep), rr:String(reel[i].nRev), rh:hFmt(reel[i].h) })),
      { foot:{ n:'Total', ph:hFmt(tot), rh:hFmt(reel.reduce((a, x) => a + x.h, 0)) } })}
    <div class="row" style="margin-top:8px">
      <button class="btn" id="tv-auto">appliquer la proposition aux ${nonAffectes} travaux non affectés</button>
      <button class="btn sec" id="tv-prop-sel" ${S.selTrav.length ? '' : 'disabled'}>appliquer aux ${S.selTrav.length} sélectionné(s)</button>
      ${corriges ? `<span class="pill warn">${corriges} affectation(s) s’écartent de la proposition</span>` : ''}
      ${S.affErreur ? `<span class="pill bad">${esc(S.affErreur)}</span>` : ''}
    </div>`);
}

/* Ce que la répartition proposée révèle de la MISSION, et non d'elle-même :
   la part du budget qui va à chaque grade est une conséquence de l'évaluation
   du risque, pas un choix de dotation. Si elle déplaît, le levier est le
   niveau de risque des assertions, pas le grade inscrit dans la règle. */
function diagnosticRepartition(){
  const l = travaux(), tot = l.reduce((a, t) => a + budget(t), 0);
  const parGrade = {};
  for (const t of l){
    const g = regleDe(t).prep;
    parGrade[g] = (parGrade[g] || 0) + budget(t);
  }
  const eleve = l.filter(t => t.nature === 'section' && t.niveauRevue === 2);
  const hEleve = eleve.reduce((a, t) => a + budget(t), 0);
  const mortes = REGLE_REPARTITION.filter(r => !l.some(t => regleDe(t).cas === r.cas));
  return `<div class="callout">
    <b>Ce que la proposition dit de la mission.</b> ${Object.entries(parGrade)
      .sort((a, b) => b[1] - a[1])
      .map(([g, h]) => `${esc(g)} ${pct(h / tot, 0)}`).join(' · ')} du budget de préparation.
    ${hEleve ? `La part senior tient à l’évaluation du risque : <b>${eleve.length} procédures de section
      répondent à une assertion évaluée « élevé »</b>, soit ${pct(hEleve / tot, 0)} du budget, et une telle
      assertion se prépare au niveau senior et se revoit par l’associée. Conséquence directe :
      <b>l’associée revoit ${l.filter(t => t.niveauRevue === 2).length} travaux sur ${l.length}</b>.
      Si cette dotation ne convient pas, le levier est le niveau de risque des assertions —
      pas le grade inscrit dans la règle.` : ''}
    ${mortes.length ? `<br><span class="smallcaps">${mortes.length} cas de la règle ne s’appliquent à aucun
      travail de cette mission : ${mortes.map(r => esc(r.cas)).join(' · ')}.</span>` : ''}
  </div>`;
}

function barreSelection(vus){
  const n = S.selTrav.length;
  const tous = vus.length && vus.every(t => S.selTrav.includes(t.code));
  const opt = (role) => `<select data-lot="${role}">
      <option value="">— ${role === 'preparateur' ? 'préparateur' : 'réviseur'} —</option>
      ${Object.entries(USERS).filter(([, u]) => role === 'preparateur' || u.role !== 'preparateur')
        .map(([k, u]) => `<option value="${k}">${esc(u.nom)} — ${esc(u.grade)}</option>`).join('')}
    </select>`;
  return `<div class="row" style="margin-bottom:8px">
    <button class="btn mini sec" id="tv-tout">${tous ? 'tout désélectionner' : 'tout sélectionner (' + vus.length + ' du résultat filtré)'}</button>
    <span class="pill ${n ? '' : ''}">${n} sélectionné(s)</span>
    <div class="ctrl"><label>Affecter en lot — préparateur</label>${opt('preparateur')}</div>
    <div class="ctrl"><label>Réviseur</label>${opt('reviseur')}</div>
    ${n ? '' : '<span class="smallcaps">cochez des travaux, ou sélectionnez tout le résultat filtré</span>'}
    ${S.lotErreur ? `<div class="callout bad" style="flex:1 1 100%">${esc(S.lotErreur)}</div>` : ''}
  </div>`;
}

/* ═══ 37. RAPPORT D'IMPACT D'UNE VERSION ═══════════════════════════════════
   Afficher trois colonnes de balance ne coûte rien et ne dit rien. La
   question d'un chef de mission qui reçoit un nouveau fichier est : QU'EST-CE
   QUE ÇA CASSE ? Six réponses, toutes calculées en évaluant réellement le
   dossier sur les deux versions, jamais annoncées.
   ═══════════════════════════════════════════════════════════════════════ */

/** Évalue une fonction comme si la version n était prise en compte, puis
 *  rétablit l'état. Les caches dérivés sont vidés de part et d'autre : sans
 *  cela le rapport comparerait une version aux nombres de l'autre. */
function auVersion(n, fn){
  const av = S.version;
  if (av === n) return fn();
  S.version = n; viderCachesDerives();
  let r;
  try { r = fn(); } finally { S.version = av; viderCachesDerives(); }
  return r;
}

/** Photographie de ce qui dépend du fichier, à une version donnée. */
function photo(n){
  return auVersion(n, () => {
    const s = seuils();
    const comptes = new Map(tb().map(r => [r[0], { lib:r[1], solde:r[2] - r[3] }]));
    const postes = postesCalcules().map(p => ({ code:p.code, lib:p.lib, solde:p.solde }));
    const perim = postesEnPerimetre().map(p => p.code);
    const ech = {};
    for (const p of postesEnPerimetre()) for (const pr of proceduresRequises(p)){
      if (!pr.ech) continue;
      const e = echantillonProc(p, pr);
      if (e) ech[p.code + '/' + pr.code] = { n:e.retenus.length, masse:e.pop.masse,
        pop:e.pop.items.length, cles:e.retenus.map(x => x.cle).join('|') };
    }
    const rap = rapprochement(n).filter(r => r.ecart !== 0)
      .map(r => ({ compte:r.compte, lib:r.lib, ecart:r.ecart }));
    return { n, s, comptes, postes, perim, ech, rap,
             ecritures:ledgerVersion(n).entries.length, empreinte:empreinteVersion(n) };
  });
}

/* Le rapport dépend de la version ET de l'état saisi (travaux achevés, version
   d'exécution des papiers, réglage des seuils). La clé du cache le dit, plutôt
   que de compter sur un vidage posé au bon endroit. */
const _impCache = new Map();
function cleImpact(a, b){
  const t = travaux().filter(x => x.statut === 'acheve' || x.statut === 'revu')
    .map(x => x.code + ':' + (x.poste && x.proc ? proc(x.poste, x.proc).execVersion : '')).join(',');
  return [a, b, S.benchmark, S.pctM, S.pctPM, S.pctCTT,
          Object.keys(S.scopingOverride).join('|'), t].join('§');
}
function impact(a, b){
  const cle = cleImpact(a, b);
  if (_impCache.has(cle)) return _impCache.get(cle);
  if (_impCache.size > 40) _impCache.clear();
  const A = photo(a), B = photo(b);

  /* 1. quels comptes ont bougé, et de combien */
  const tous = [...new Set([...A.comptes.keys(), ...B.comptes.keys()])].sort();
  const mouvements = tous.map(c => {
    const x = A.comptes.get(c), y = B.comptes.get(c);
    return { compte:c, lib:(y || x).lib, av:x ? x.solde : null, ap:y ? y.solde : null,
             delta:(y ? y.solde : 0) - (x ? x.solde : 0),
             nouveau:!x && !!y, disparu:!!x && !y };
  }).filter(m => m.delta !== 0 || m.nouveau || m.disparu);

  /* 2. lesquels franchissent un seuil — dans un sens ou dans l'autre.
        Le seuil BOUGE aussi : un compte peut franchir sans avoir bougé, et
        c'est précisément le cas qu'on ne voit pas à l'œil nu. */
  const franchit = [];
  for (const c of tous){
    const x = A.comptes.get(c), y = B.comptes.get(c);
    const sa = x ? Math.abs(x.solde) : 0, sb = y ? Math.abs(y.solde) : 0;
    const da = sa >= A.s.CTT, db = sb >= B.s.CTT;
    if (da !== db) franchit.push({ compte:c, lib:(y || x).lib, seuil:'remontée',
      seuilAv:A.s.CTT, seuilAp:B.s.CTT, av:x ? x.solde : 0, ap:y ? y.solde : 0,
      sens:db ? 'entre' : 'sort', bouge:(x ? x.solde : 0) !== (y ? y.solde : 0) });
  }

  /* 3. quels postes entrent ou sortent du périmètre */
  const perimetre = [];
  for (const p of B.postes){
    const dedans = B.perim.includes(p.code), avant = A.perim.includes(p.code);
    if (dedans !== avant){
      const q = A.postes.find(x => x.code === p.code);
      perimetre.push({ code:p.code, lib:p.lib, sens:dedans ? 'entre' : 'sort',
        av:q ? q.solde : 0, ap:p.solde, pmAv:A.s.PM, pmAp:B.s.PM,
        bouge:!q || q.solde !== p.solde });
    }
  }

  /* 4. quels échantillons deviennent périmés parce que leur population a changé */
  const echantillons = [];
  for (const k of new Set([...Object.keys(A.ech), ...Object.keys(B.ech)])){
    const x = A.ech[k], y = B.ech[k];
    if (!x && y){ echantillons.push({ k, cause:'procédure nouvelle', y }); continue; }
    if (x && !y){ echantillons.push({ k, cause:'procédure disparue', x }); continue; }
    if (x.cles !== y.cles){
      const ax = new Set(x.cles.split('|')), ay = new Set(y.cles.split('|'));
      echantillons.push({ k, x, y,
        cause:'sélection modifiée',
        entres:[...ay].filter(v => !ax.has(v)).length,
        sortis:[...ax].filter(v => !ay.has(v)).length });
    } else if (x.pop !== y.pop || x.masse !== y.masse){
      echantillons.push({ k, x, y, cause:'population modifiée, sélection inchangée', entres:0, sortis:0 });
    }
  }

  /* 5. quels travaux achevés ou revus reposent sur une version périmée */
  const travauxTouches = [];
  for (const t of travaux()){
    if (t.statut !== 'acheve' && t.statut !== 'revu') continue;
    const st = t.proc && t.poste ? proc(t.poste, t.proc) : null;
    const ver = st && st.execVersion !== undefined && st.execVersion !== null ? st.execVersion : a;
    if (ver >= b) continue;
    const k = t.poste + '/' + t.proc;
    const e = echantillons.find(x => x.k === k);
    travauxTouches.push({ code:t.code, intitule:t.intitule, posteLib:t.posteLib, statut:t.statut,
      version:ver, cause:e ? e.cause : 'version du fichier plus récente' });
  }

  /* 6. quelles anomalies levées sur une version antérieure sont déjà corrigées */
  const corrigees = A.rap.filter(x => !B.rap.some(y => y.compte === x.compte))
    .map(x => ({ ...x, quoi:'écart de rapprochement' }));
  const nouvelles = B.rap.filter(x => !A.rap.some(y => y.compte === x.compte))
    .map(x => ({ ...x, quoi:'écart de rapprochement' }));

  const r = { a, b, A, B, mouvements, franchit, perimetre, echantillons, travauxTouches,
              corrigees, nouvelles,
              seuilsBougent:A.s.M !== B.s.M || A.s.PM !== B.s.PM || A.s.CTT !== B.s.CTT };
  _impCache.set(cle, r);
  return r;
}

/* ── travaux à reconfirmer : DÉRIVÉ, jamais écrit dans le statut ──────────
   Un travail achevé sur une version antérieure n'est pas « encore achevé » :
   il est à reconfirmer, et le motif est celui du rapport d'impact. Le statut
   stocké n'est pas modifié — si l'on revient à la version d'exécution, le
   travail redevient achevé de lui-même, sans qu'aucune écriture d'état n'ait
   eu lieu. */
function aReconfirmer(t){
  if (t.statut !== 'acheve' && t.statut !== 'revu') return null;
  if (!t.poste || !t.proc) return null;
  const st = proc(t.poste, t.proc);
  if (st.execVersion === undefined || st.execVersion === null) return null;
  if (st.execVersion >= S.version) return null;
  if (st.reconfirme === S.version) return null;
  const p = postesCalcules().find(x => x.code === t.poste);
  const pr = PROCEDURES.find(x => x.code === t.proc);
  const per = p && pr ? peremption(p, pr) : null;
  return { de:st.execVersion, a:S.version,
    motif:per && per.populationChangee
      ? 'la population de la sélection a changé avec la version ' + S.version
      : 'exécuté sur la version ' + st.execVersion + ', le dossier est à la version ' + S.version };
}
function reconfirmer(code){
  const t = travailDe(code);
  if (!t || !t.poste || !t.proc) return { ok:false, why:'travail sans papier de travail' };
  const st = proc(t.poste, t.proc), r = aReconfirmer(t);
  if (!r) return { ok:false, why:'ce travail n’est pas à reconfirmer' };
  const tr = trav(code);
  if (tr.statut === 'revu' && tr.reviseur !== S.moi) return { ok:false, why:'seul le réviseur affecté peut reconfirmer un travail revu' };
  if (tr.statut === 'acheve' && tr.preparateur !== S.moi) return { ok:false, why:'seul le préparateur affecté peut reconfirmer ce travail' };
  st.reconfirme = S.version;
  st.execVersion = S.version;
  const p = postesCalcules().find(x => x.code === t.poste);
  const pr = PROCEDURES.find(x => x.code === t.proc);
  st.execEmpreinte = empreinteSelection(p, pr);
  logEvent('travail reconfirmé', t.code + ' — ' + t.intitule,
           'version ' + r.de + ' → ' + r.a + ' · ' + USERS[S.moi].nom);
  return { ok:true };
}
/** Un visa posé sur une version antérieure est signalé, pas effacé. */
function visaPerime(code){
  const st = sec(code);
  if (!st.visa || st.visa.version === undefined) return null;
  return st.visa.version < S.version ? { de:st.visa.version, a:S.version } : null;
}

/* ═══ 38. VUE « VERSIONS DU FICHIER » ══════════════════════════════════════ */
function vueVersions(){
  const attente = versionsEnAttente();
  const courante = versionCourante();
  const cible = S.impactVers || (attente.length ? attente[0].n : Math.max(1, S.version));
  const source = S.impactDe || Math.max(1, cible - 1);
  return entete('Versions de la balance et du grand livre',
                'un mandat en reçoit trois à cinq — rien n’est écrasé, et une version reçue n’est pas une version prise en compte') +
    blocVersions(attente, courante) +
    (cible > 1 ? blocImpact(source, cible) : '') +
    blocBalanceVersions() +
    blocRapproVersions();
}

function blocVersions(attente, courante){
  const rows = VERSIONS.map(v => {
    const recue = v.date <= S.aujourdhui;
    const etat = v.n === S.version ? '<span class="pill">prise en compte</span>'
      : v.n < S.version ? '<span class="smallcaps">antérieure</span>'
      : recue ? '<span class="pill warn">reçue, en attente</span>'
      : '<span class="smallcaps">non reçue</span>';
    return {
      n:`<span class="mono">v${v.n}</span>`,
      l:`<b>${esc(v.lib)}</b><div class="smallcaps">${esc(v.note)}</div>`,
      d:`<span class="mono">${frDate(v.date)}</span><div class="smallcaps">${esc(v.par)}</div>`,
      f:`<span class="smallcaps">${esc(v.fichiers)}</span>`,
      e:`<span class="mono">${esc(empreinteVersion(v.n))}</span>`,
      w:String(v.ecritures.length),
      s:etat,
      a:recue && v.n !== S.version
        ? `<button class="btn mini ${v.n > S.version ? '' : 'sec'}" data-vers="${v.n}">${v.n > S.version ? 'prendre en compte' : 'revenir à cette version'}</button>`
        : '',
    };
  });
  return blk('Versions reçues', VERSIONS.length,
    table([{k:'n',t:'Version'},{k:'l',t:'Objet',cls:'wrapcell'},{k:'d',t:'Reçue le'},
           {k:'f',t:'Fichiers',cls:'wrapcell'},{k:'e',t:'Empreinte'},{k:'w',t:'Écritures',n:1},
           {k:'s',t:'État'},{k:'a',t:''}], rows) +
    (attente.length ? `<div class="callout warn"><b>Version ${attente[0].n} reçue le ${frDate(attente[0].date)}, pas encore prise en compte.</b>
      Lisez le rapport d’impact ci-dessous avant de basculer : prendre en compte une version change les seuils,
      le périmètre et les sélections, et remet en cause les travaux déjà achevés.</div>` : '') +
    `<p class="note">Une version n’est jamais une régénération : c’est le grand livre précédent
    <b>plus</b> les écritures passées depuis. L’empreinte est calculée sur le contenu du fichier ;
    deux versions identiques auraient la même. Le dossier est à la version ${S.version}
    — ${esc(courante.lib)}.</p>`);
}

function blocImpact(a, b){

  const q6 = `

        i.nouvelles.map(x => ({ q:esc(x.quoi), c:`<span class="mono">${x.compte}</span>`, l:esc(x.lib), m:eur(x.ecart) })))
      : ''}
