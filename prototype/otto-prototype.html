<style>
/* ───────────────────────────────────────────────────────────────────────────
   Aucune ressource externe : pas de police distante, pas de script distant,
   pas de requête réseau. Le fichier fonctionne hors ligne, sur téléphone.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#12161c; --ink-2:#4c5563;
  --ink-3:#79828f; --line:#e2e6ec; --line-2:#eef1f5;
  --accent:#1f4fd8; --accent-soft:#eaf0ff;
  --ok:#127a43; --ok-soft:#e6f5ec; --warn:#9a6100; --warn-soft:#fdf3e2;
  --bad:#b32020; --bad-soft:#fdecec; --info:#5b3fb8; --info-soft:#f0ecfd;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1b222c; --ink:#e6edf3; --ink-2:#aeb9c6;
  --ink-3:#7d8794; --line:#262e39; --line-2:#1f262f;
  --accent:#6f9bff; --accent-soft:#18233c;
  --ok:#4ec27f; --ok-soft:#122a1d; --warn:#e0a54a; --warn-soft:#2c2413;
  --bad:#f2726f; --bad-soft:#301818; --info:#a892ff; --info-soft:#221d38;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#0d1117; --panel:#151b23; --panel-2:#1b222c; --ink:#e6edf3; --ink-2:#aeb9c6;
    --ink-3:#7d8794; --line:#262e39; --line-2:#1f262f;
    --accent:#6f9bff; --accent-soft:#18233c;
    --ok:#4ec27f; --ok-soft:#122a1d; --warn:#e0a54a; --warn-soft:#2c2413;
    --bad:#f2726f; --bad-soft:#301818; --info:#a892ff; --info-soft:#221d38;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
     -webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:13px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}

/* ── barre supérieure : seuils toujours visibles, ils pilotent tous les modules ── */
.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
     box-shadow:0 1px 0 rgba(0,0,0,.02)}
.top .id{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;padding:8px 88px 6px 14px}
.top .id b{font-size:14px}
.top .id span{color:var(--ink-3);font-size:12px}
.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);
      background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

.seuils{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:2px 14px 8px}
.ctrl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ctrl label{font-size:11px;color:var(--ink-3)}
.ctrl select,.ctrl input[type=number],.ctrl input[type=text]{
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px;min-width:0}
.ctrl input[type=range]{accent-color:var(--accent);width:100%}
.seuilbox{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.seuilbox .s{flex:1 1 120px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.seuilbox .s .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.seuilbox .s .v{font:600 16px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:1px}
.seuilbox .s .d{font-size:10.5px;color:var(--ink-3)}

/* bandeau d'impact : ce qui se recompose quand on bouge un seuil */
.impact{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:thin}
.impact .c{flex:0 0 auto;background:var(--accent-soft);border-radius:8px;padding:5px 9px;min-width:0}
.impact .c .k{font-size:10px;color:var(--ink-3);white-space:nowrap}
.impact .c .k .sm{display:none}
.impact .c .v{font:600 13px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.impact .c.flash{animation:flash .5s ease-out}
@keyframes flash{from{background:var(--warn-soft)}to{background:var(--accent-soft)}}

nav.jump{display:flex;gap:2px;overflow-x:auto;padding:0 8px 6px;border-top:1px solid var(--line-2);scrollbar-width:thin}
nav.jump a{flex:0 0 auto;padding:5px 8px;font-size:12px;color:var(--ink-2);text-decoration:none;border-radius:6px;white-space:nowrap}
nav.jump a:hover,nav.jump a.on{background:var(--accent-soft);color:var(--accent)}

   la barre (z-index 50) le recouvrait et il devenait incliquable. */

          border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink-2);
          min-height:28px;min-width:64px}

section.mod{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;
            /* --topH est mesurée en JS : la barre collante n'a pas la même hauteur

            scroll-margin-top:calc(var(--topH, 200px) + 10px)}

p.note{margin:6px 0 0;font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}

table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--panel-2);font-size:11px;color:var(--ink-3);text-transform:uppercase;

input.cell.txt{text-align:left;font-family:var(--sans)}

  .seuils{grid-template-columns:1fr 1fr;gap:5px;padding:0 10px 5px}
  .ctrl label{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl select{font-size:12px;padding:3px 5px}
  /* les trois seuils doivent rester visibles SANS défilement : ce sont eux qui

  .seuilbox{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 10px 5px;overflow:visible}

     les sept indicateurs, conclusion comprise, restent sous les yeux. */
  .impact{flex-wrap:wrap;overflow:visible;gap:4px;padding:0 10px 6px}

  /* libellé au-dessus de la valeur : les longs intitulés ne se coupent plus en biais */
  .kv{grid-template-columns:1fr;gap:0 0}
  .kv .k{margin-top:5px;font-size:11px}
  .grid2{gap:10px}
  blockquote.idea{font-size:12px}
}

/* ═══ 2. OUTILS ════════════════════════════════════════════════════════════ */

/** Générateur pseudo-aléatoire à germe (mulberry32) : même germe ⇒ même suite.
 *  C'est ce qui rend le tirage d'échantillon rejouable à l'identique. */
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** Germe entier stable à partir d'une chaîne (FNV-1a 32 bits). */
function seedOf(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

const NBSP = '\u00A0';
/** Format français : espace insécable pour les milliers, virgule décimale, € après. */
function eur(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents));
  const ent = String(Math.floor(v / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (neg ? '-' : '') + ent + ',' + String(v % 100).padStart(2, '0') + NBSP + '€';
}
function eur0(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents / 100));
  return (neg ? '-' : '') + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP) + NBSP + '€';
}
function pct(x, d){ return (x * 100).toFixed(d === undefined ? 1 : d).replace('.', ',') + NBSP + '%'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function frDate(iso){ return iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4); }
function isWeekend(iso){ const d = new Date(iso + 'T00:00:00Z').getUTCDay(); return d === 0 || d === 6; }
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }

/* ═══ 3. GRAND LIVRE ═══════════════════════════════════════════════════════
   Le grand livre n'est PAS saisi : il est engendré, à germe fixe, de façon à

   trouver) et moins les écritures particulières créées nommément.
   Conséquences vérifiables à l'écran :
     · total des débits = total des crédits (chaque écriture est équilibrée) ;
     · solde du grand livre = solde de la balance sur tous les comptes sauf deux.
   ═══════════════════════════════════════════════════════════════════════ */

  'Fours & Réfractaires SA','Assurances Belleville','Intérim Delorme','Transports Cabrol SAS'];
const AVOCATS = ['Cabinet Vasseur & Associés','SELARL Perrin Contentieux'];
const SAISIE = ['S. Marchand (comptabilité)','T. Girard (comptabilité)','M. Ferrand (direction)'];

/** Écriture de situation présente dans la balance client et absente du FEC.
 *  C'est l'anomalie A7 du jeu de données : 25 000 € en Dr 411000 / Cr 706000. */
const ECART_SITUATION = { debit: '411000', credit: '706000', montant: 2500000 };

function buildLedger(){
  const rnd = mulberry32(seedOf('otto-altiverre-fy2025-v1'));
  const label = Object.fromEntries(TB_2025.map(r => [r[0], r[1]]));

  // cibles = balance client, par compte et par sens
  const needD = new Map(), needC = new Map();
  for (const [c,, d, cr] of TB_2025){ if (d) needD.set(c, d); if (cr) needC.set(c, cr); }
  // on retire l'écriture de situation : le grand livre ne la contient pas
  needD.set(ECART_SITUATION.debit, needD.get(ECART_SITUATION.debit) - ECART_SITUATION.montant);
  needC.set(ECART_SITUATION.credit, needC.get(ECART_SITUATION.credit) - ECART_SITUATION.montant);

  const entries = [];
  let num = 0;
  function push(e){
    e.num = e.journal + '-2025-' + String(++num).padStart(4, '0');
    for (const l of e.lines){
      if (l.debit)  needD.set(l.compte, (needD.get(l.compte) || 0) - l.debit);
      if (l.credit) needC.set(l.compte, (needC.get(l.compte) || 0) - l.credit);
    }
    entries.push(e);
    return e;
  }
  function line(compte, debit, credit, auxLib){
    return { compte, libelleCompte: label[compte] || compte, debit: debit || 0, credit: credit || 0,
             auxNum: auxLib ? 'T' + String(seedOf(auxLib) % 900 + 100) : '', auxLib: auxLib || '' };
  }

  /* ── 3a. écritures particulières (les anomalies du scénario) ───────────── */
  const client = CLIENTS[0];
  // A1 — la même facture comptabilisée deux fois, juin puis juillet
  for (const [d, p] of [['2025-06-17','FA2025-0702'], ['2025-07-15','FA2025-0702']]){
    push({ journal:'VE', date:d, pieceRef:p, pieceDate:d, libelle:'Facture ' + p + ' — ' + client,
           saisiePar:SAISIE[0], validDate:addDays(d,3), tag:'A1',
           lines:[ line('411000', 3680000, 0, client), line('701000', 0, 3680000) ] });
  }
  // A5 — produit de janvier 2026 rattaché à 2025 (séparation des exercices)
  push({ journal:'VE', date:'2025-12-31', pieceRef:'FA2025-0706', pieceDate:'2026-01-06',
         libelle:'Facture FA2025-0706 — Promoteurs du Forez SA', saisiePar:SAISIE[1],
         validDate:'2026-01-08', tag:'A5',
         lines:[ line('411000', 3633000, 0, CLIENTS[1]), line('701000', 0, 3633000) ] });
  // A6 — écriture manuelle ronde, un samedi, saisie par la direction
  push({ journal:'OD', date:'2025-11-15', pieceRef:'OD-2025-089', pieceDate:'2025-11-15',
         libelle:'Régularisation contrat-cadre — décision de direction', saisiePar:SAISIE[2],
         validDate:'2025-11-17', tag:'A6',
         lines:[ line('411000', 5000000, 0, CLIENTS[0]), line('706000', 0, 5000000) ] });
  // honoraires juridiques : deux cabinets, dont un seul sera déclaré par le client
  {
    const tot = needD.get('622600') || 0;
    const part = Math.round(tot * 0.62);
    push({ journal:'AC', date:'2025-03-20', pieceRef:'FF2025-0311', pieceDate:'2025-03-18',
           libelle:'Honoraires — ' + AVOCATS[0], saisiePar:SAISIE[0], validDate:'2025-03-25',
           lines:[ line('622600', part, 0, AVOCATS[0]), line('401000', 0, part, AVOCATS[0]) ] });
    push({ journal:'AC', date:'2025-09-08', pieceRef:'FF2025-0742', pieceDate:'2025-09-04',
           libelle:'Honoraires contentieux — ' + AVOCATS[1], saisiePar:SAISIE[1], validDate:'2025-09-12',
           lines:[ line('622600', tot - part, 0, AVOCATS[1]), line('401000', 0, tot - part, AVOCATS[1]) ] });
  }

  /* ── 3b. table des contreparties plausibles ───────────────────────────── */
  const PREF = [
    { d:/^411/, c:/^(701|706|445710)/, j:'VE', lib:'Facture de vente' },
    { d:/^709/, c:/^411/,              j:'VE', lib:'Avoir accordé' },
    { d:/^512/, c:/^411/,              j:'BQ', lib:'Encaissement client' },
    { d:/^401/, c:/^512/,              j:'BQ', lib:'Règlement fournisseur' },
    { d:/^(60|61|62|624|606|615|616)/, c:/^401/, j:'AC', lib:'Facture fournisseur' },
    { d:/^445660/, c:/^401/,           j:'AC', lib:'TVA déductible sur achats' },
    { d:/^(641|645|621)/, c:/^(421|431|437)/, j:'PA', lib:'Paie du mois' },
    { d:/^(421|431|437)/, c:/^512/,    j:'BQ', lib:'Versement social / salaires' },
    { d:/^(661|164)/, c:/^512/,        j:'BQ', lib:'Échéance emprunt' },
    { d:/^445510/, c:/^512/,           j:'BQ', lib:'Paiement TVA' },
    { d:/^445710/, c:/^(445510|445660)/, j:'OD', lib:'Déclaration de TVA' },
    { d:/^681/, c:/^28/,               j:'OD', lib:'Dotation aux amortissements' },
    { d:/^(2|3)/, c:/^(401|512)/,      j:'AC', lib:'Acquisition' },
  ];
  const CAP = { VE:[300000,6500000], AC:[50000,3500000], BQ:[80000,9000000],
                PA:[1500000,18000000], OD:[100000,4000000], AN:[0,0] };

  function pickDate(){
    // dates réparties sur l'exercice, décalées au lundi suivant dans 9 cas sur 10
    // lorsqu'elles tombent un week-end : une comptabilité ne saisit presque jamais
    // le samedi, ce qui fait du critère « week-end » un vrai signal (~3 % ici).
    let d = addDays('2025-01-01', Math.floor(rnd() * 365));
    if (isWeekend(d) && rnd() < 0.9){
      d = addDays(d, new Date(d + 'T00:00:00Z').getUTCDay() === 6 ? 2 : 1);
      if (d > '2025-12-31') d = addDays(d, -3);
    }
    return d;
  }
  function mkEntry(dc, cc, amount, j, lib){
    const date = j === 'AN' ? '2025-01-01' : pickDate();
    const aux = dc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : cc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)]
              : cc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : dc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)] : '';
    const prefix = { VE:'FA', AC:'FF', BQ:'BQ', PA:'PA', OD:'OD', AN:'AN' }[j];
    const piece = prefix + '2025-' + String(1000 + Math.floor(rnd() * 8999));
    // validation : quelques écritures validées après la clôture (critère de test)
    const late = rnd() < 0.03;
    let pd = j === 'AN' ? date : addDays(date, -Math.floor(rnd() * 4));
    if (pd < '2025-01-01') pd = '2025-01-01';
    return { journal:j, date, pieceRef:piece, pieceDate:pd,
             libelle: lib + (aux ? ' — ' + aux : ''), saisiePar: SAISIE[rnd() < 0.04 ? 2 : (rnd() < .5 ? 0 : 1)],
             validDate: late ? addDays('2026-01-05', Math.floor(rnd()*20)) : addDays(date, 1 + Math.floor(rnd()*6)),
             lines: [ line(dc, amount, 0, aux), line(cc, 0, amount, aux) ] };
  }

  /* ── 3c. appariement glouton jusqu'à consommer toutes les cibles ───────── */
  const alive = m => [...m.entries()].filter(([, v]) => v > 0);
  let guard = 0;
  while (guard++ < 40000){
    const ds = alive(needD), cs = alive(needC);
    if (!ds.length || !cs.length) break;
    // on prend la cible débit la plus lourde : la boucle converge vite
    ds.sort((a, b) => b[1] - a[1]);
    const [dc, dRem] = ds[0];
    let rule = PREF.find(p => p.d.test(dc) && cs.some(([c]) => p.c.test(c) ));
    let cc, j, lib;
    if (rule){
      const cands = cs.filter(([c]) => rule.c.test(c));
      cc = cands[Math.floor(rnd() * cands.length)][0]; j = rule.j; lib = rule.lib;
    } else {
      // pas de contrepartie naturelle disponible : opération diverse
      const bs = c => /^[1-5]/.test(c);
      const cands = cs.filter(([c]) => bs(c) === bs(dc)).concat(cs);
      cc = cands[Math.floor(rnd() * cands.length)][0];
      j = (/^[1-3]/.test(dc) && /^[1-3]/.test(cc)) ? 'AN' : 'OD';
      lib = j === 'AN' ? 'À nouveau' : 'Opération diverse';
    }
    const cRem = needC.get(cc);
    const [lo, hi] = CAP[j];
    let amount;
    if (j === 'AN') amount = Math.min(dRem, cRem);
    else {
      // rnd()^2,6 : la masse des écritures est petite, la queue est longue
      amount = Math.min(dRem, cRem, lo + Math.floor(Math.pow(rnd(), 2.6) * (hi - lo)));
      // reliquat trop petit pour une écriture crédible : on le solde d'un coup
      if (dRem - amount < lo) amount = Math.min(dRem, cRem);
      // ~8 % des montants sont ronds au millier (critère « montant rond »)
      if (amount > 500000 && rnd() < 0.08) amount = Math.floor(amount / 100000) * 100000;
    }
    if (amount <= 0) { needD.set(dc, 0); continue; }
    push(mkEntry(dc, cc, amount, j, lib));
  }

  // numérotation par journal, comme dans un FEC réel
  const perJournal = {};
  for (const e of entries){
    perJournal[e.journal] = (perJournal[e.journal] || 0) + 1;
    e.num = e.journal + String(perJournal[e.journal]).padStart(5, '0');
  }
  entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.num < b.num ? -1 : 1));

  // aplatissement en lignes de FEC
  const rows = [];
  for (const e of entries){
    e.lines.forEach((l, i) => rows.push({
      JournalCode:e.journal, JournalLib:{VE:'Ventes',AC:'Achats',BQ:'Banque',PA:'Paie',OD:'Opérations diverses',AN:'À nouveaux'}[e.journal],
      EcritureNum:e.num, EcritureDate:e.date, CompteNum:l.compte, CompteLib:l.libelleCompte,
      CompAuxNum:l.auxNum, CompAuxLib:l.auxLib, PieceRef:e.pieceRef, PieceDate:e.pieceDate,
      EcritureLib:e.libelle, Debit:l.debit, Credit:l.credit, EcritureLet:'', DateLet:'',
      ValidDate:e.validDate, Montantdevise:'', Idevise:'', saisiePar:e.saisiePar, tag:e.tag || '', ligne:i + 1
    }));
  }
  return { entries, rows };
}

const LEDGER = buildLedger();
const FEC = LEDGER.rows;

/** Balance recalculée à partir des écritures — jamais saisie à côté. */
function balanceFromLedger(){
  const m = new Map();
  for (const r of FEC){
    const a = m.get(r.CompteNum) || { compte:r.CompteNum, lib:r.CompteLib, debit:0, credit:0 };
    a.debit += r.Debit; a.credit += r.Credit; m.set(r.CompteNum, a);
  }
  return [...m.values()].sort((a, b) => a.compte < b.compte ? -1 : 1);
}
const GL_BAL = balanceFromLedger();

/* ═══ 4. ÉTAT ══════════════════════════════════════════════════════════════
   Un seul objet d'état. Tout module lit les seuils ici : c'est la source
   unique de vérité que la démonstration doit rendre visible.
   ═══════════════════════════════════════════════════════════════════════ */
const S = {
  benchmark:'pbt', pctM:5, pctPM:75, pctCTT:5,
  scopingOverride:{},                       // code poste -> 'in' | 'out'
  arMontant:null, arPct:10,                 // null = suit le seuil de planification
  jeCrit:{ weekend:true, rond:true, od:false, valid:true, direction:true, gros:true },
  sampleSeed:'otto-demo-rev-1', sampleN:4, sampleRun:0, jeSansAN:true,
  clientView:false, requests:null,
  wp:null, wpExtra:[], wpJustif:'',
  notes:[], author:'Léa Moreau (superviseur)',
  ms:null,
  aujourdhui:'2026-03-15',                  // date de référence pour les relances
};

/* ── agrégats de la balance client (classes du plan comptable général) ──── */
function soldes(tb){ const m = new Map(); for (const [c, l, d, cr] of tb) m.set(c, { lib:l, solde:d - cr, debit:d, credit:cr }); return m; }
const B25 = soldes(TB_2025), B24 = soldes(TB_2024);
function sumWhere(bal, re){ let s = 0; for (const [c, v] of bal) if (re.test(c)) s += v.solde; return s; }

/** Références possibles pour la matérialité, toutes calculées depuis la balance.
 *  Signe : produits et capitaux propres sont créditeurs, on les rend positifs. */
function benchmarks(bal){
  const produits = -sumWhere(bal, /^7/);
  const charges  =  sumWhere(bal, /^6/);
  const ca       = -sumWhere(bal, /^70/);                    // 701+706 moins 709 (RRR)
  const resultat = produits - charges;                        // résultat courant avant impôt
  // total actif net = soldes débiteurs des classes 2 à 5, nets des amortissements
  let actif = 0;
  for (const [c, v] of bal){
    if (/^(28|29|39|49)/.test(c)) actif += v.solde;           // amortissements : solde créditeur, donc négatif
    else if (/^[2345]/.test(c) && v.solde > 0) actif += v.solde;
  }
  const capitaux = -sumWhere(bal, /^(101|106|110)/) + resultat;
  return {
    ca:{ code:'ca', lib:'Chiffre d’affaires', val:ca, defaut:1 },
    pbt:{ code:'pbt', lib:'Résultat courant avant impôt', val:resultat, defaut:5 },
    equity:{ code:'equity', lib:'Capitaux propres', val:capitaux, defaut:3 },
    actif:{ code:'actif', lib:'Total de l’actif', val:actif, defaut:2 },
    charges:{ code:'charges', lib:'Total des charges', val:charges, defaut:1 },
  };
}
const BM25 = benchmarks(B25), BM24 = benchmarks(B24);

/** Arrondi prudent vers le bas au pas indiqué (pratique de place). */
function arrondiBas(cents, pas){ return Math.floor(cents / pas) * pas; }

/** Les trois seuils. Recalculés à chaque mouvement de curseur. */
function seuils(){
  const b = BM25[S.benchmark];
  const brut = Math.round(b.val * S.pctM / 100);
  const M  = arrondiBas(brut, 100000);            // au millier d'euros inférieur
  const PM = arrondiBas(Math.round(M * S.pctPM / 100), 100000);
  const CTT= arrondiBas(Math.round(M * S.pctCTT / 100), 10000); // à la centaine d'euros
  return { bench:b, brut, M, PM, CTT };
}

const MODULES = [];

function table(cols, rows, opts){
  opts = opts || {};
  const th = cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.t)}</th>`).join('');
  const tb = rows.map(r => '<tr>' + cols.map(c => {
    const v = r[c.k];
    return `<td class="${c.n ? 'n' : ''} ${c.cls || ''} ${r._cls && r._cls[c.k] || ''}">${v === undefined || v === null ? '' : v}</td>`;
  }).join('') + '</tr>').join('');
  const tf = opts.foot ? '<tfoot><tr>' + cols.map(c => `<td class="${c.n ? 'n' : ''}">${opts.foot[c.k] === undefined ? '' : opts.foot[c.k]}</td>`).join('') + '</tr></tfoot>' : '';
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${tf}</table></div>`;
}

/* ═══ 7. MODULE 1 — IMPORT ET RAPPROCHEMENT ═══════════════════════════════ */
const CHAMPS_FEC = ['JournalCode','JournalLib','EcritureNum','EcritureDate','CompteNum','CompteLib',
  'CompAuxNum','CompAuxLib','PieceRef','PieceDate','EcritureLib','Debit','Credit','EcritureLet',
  'DateLet','ValidDate','Montantdevise','Idevise'];

/** Contrôles de forme du fichier des écritures comptables.
 *  Chaque contrôle renvoie le nombre de lignes ou d'écritures en anomalie. */
function controlesFec(){
  const tot = { d:0, c:0 };
  let deuxColonnes = 0, horsExercice = 0, compteInvalide = 0, validAvant = 0, auxIncomplet = 0, pieceHors = 0;
  const parEcriture = new Map();
  for (const r of FEC){
    tot.d += r.Debit; tot.c += r.Credit;
    if ((r.Debit > 0 && r.Credit > 0) || (r.Debit === 0 && r.Credit === 0)) deuxColonnes++;
    if (r.EcritureDate < '2025-01-01' || r.EcritureDate > '2025-12-31') horsExercice++;
    if (!/^\d{3,}$/.test(r.CompteNum)) compteInvalide++;
    if (r.ValidDate && r.ValidDate < r.EcritureDate) validAvant++;
    if ((r.CompAuxNum === '') !== (r.CompAuxLib === '')) auxIncomplet++;
    if (r.PieceDate && (r.PieceDate < '2025-01-01' || r.PieceDate > '2025-12-31')) pieceHors++;
    const e = parEcriture.get(r.EcritureNum) || { d:0, c:0 };
    e.d += r.Debit; e.c += r.Credit; parEcriture.set(r.EcritureNum, e);
  }
  let ecrituresDesequilibrees = 0;
  for (const [, v] of parEcriture) if (v.d !== v.c) ecrituresDesequilibrees++;
  const champsManquants = CHAMPS_FEC.filter(f => FEC.some(r => r[f] === undefined));
  return { tot, deuxColonnes, horsExercice, compteInvalide, validAvant, auxIncomplet, pieceHors,
           ecrituresDesequilibrees, nbEcritures:parEcriture.size, champsManquants };
}

/** Rapprochement balance client ↔ grand livre, compte par compte. */
function rapprochement(){
  const gl = new Map(GL_BAL.map(r => [r.compte, r]));
  const comptes = [...new Set([...TB_2025.map(r => r[0]), ...GL_BAL.map(r => r.compte)])].sort();
  return comptes.map(c => {
    const t = B25.get(c), g = gl.get(c);
    const sTB = t ? t.solde : 0, sGL = g ? g.debit - g.credit : 0;
    return { compte:c, lib:(t ? t.lib : g.lib), sTB, sGL, ecart:sTB - sGL,
             presentTB:!!t, presentGL:!!g };
  });
}

/* ═══ 10. MODULE 4 — REVUE ANALYTIQUE ═════════════════════════════════════ */
/** Variation N / N-1 par compte. Une ligne ressort si elle dépasse le seuil en
 *  montant OU le seuil en pourcentage : les deux critères sont indépendants. */
/** Seuil en montant de la revue analytique : par défaut le seuil de planification,
 *  sauf saisie explicite de l'auditeur. C'est pourquoi il bouge avec la matérialité. */
function arSeuilMontant(){ return S.arMontant === null ? seuils().PM : S.arMontant; }

function revueAnalytique(){
  const comptes = [...new Set([...TB_2025.map(r => r[0]), ...TB_2024.map(r => r[0])])].sort();
  return comptes.map(c => {
    const n = B25.get(c) ? B25.get(c).solde : 0;
    const n1 = B24.get(c) ? B24.get(c).solde : 0;
    const lib = (B25.get(c) || B24.get(c)).lib;
    const d = n - n1;
    const p = n1 === 0 ? (n === 0 ? 0 : null) : d / Math.abs(n1);   // null = pas de base N-1
    const parMontant = Math.abs(d) >= arSeuilMontant();
    const parPct = p !== null && Math.abs(p) >= S.arPct / 100;
    return { compte:c, lib, n, n1, d, p, parMontant, parPct, flag:parMontant || parPct };
  });
}
/** Question composée automatiquement — assemblage déterministe, aucun texte de modèle. */
function questionVariation(l){
  const sens = l.d > 0 ? 'une hausse' : 'une baisse';
  const pctTxt = l.p === null ? 'sans base comparative en N-1' : 'soit ' + pct(Math.abs(l.p), 1);
  const motif = l.parMontant && l.parPct ? 'seuil en montant et seuil en pourcentage'
              : l.parMontant ? 'seuil en montant' : 'seuil en pourcentage';
  return `Le compte ${l.compte} « ${l.lib} » présente ${sens} de ${eur(Math.abs(l.d))} entre le 31/12/2024 (${eur(l.n1)}) `
       + `et le 31/12/2025 (${eur(l.n)}), ${pctTxt}. Cette variation dépasse le ${motif} retenu pour la revue analytique `
       + `(${eur(arSeuilMontant())} / ${S.arPct}${NBSP}%). Merci d’en indiquer l’explication et de préciser les éléments justificatifs disponibles.`;
}

  };
}

/* ═══ 12. MODULE 6 — ÉCHANTILLONNAGE ══════════════════════════════════════ */
/** Deux strates : couverture exhaustive au-dessus du seuil de planification,
 *  puis tirage aléatoire à germe dans le reliquat. Même germe ⇒ même tirage. */
function echantillon(){
  const s = seuils();
  const pop = LEDGER.entries
    .filter(e => e.lines.some(l => /^70/.test(l.compte)))
    .map(e => ({ e, montant:e.lines.reduce((a, l) => a + (/^70/.test(l.compte) ? (l.credit - l.debit) : 0), 0) }))
    .filter(x => x.montant > 0);
  const total = pop.reduce((a, x) => a + x.montant, 0);
  const exhaustif = pop.filter(x => x.montant >= s.PM);
  const reste = pop.filter(x => x.montant < s.PM);
  const rnd = mulberry32(seedOf(S.sampleSeed));
  // tirage sans remise : on mélange une copie de l'index avec le germe fourni
  const idx = reste.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const alea = idx.slice(0, Math.min(S.sampleN, idx.length)).sort((a, b) => a - b).map(i => reste[i]);
  const couvert = exhaustif.reduce((a, x) => a + x.montant, 0) + alea.reduce((a, x) => a + x.montant, 0);
  return { pop, total, exhaustif, alea, couvert, s };
}

/** Listings déclarés par le client. L'exhaustivité se contrôle en confrontant

const LISTING_AVOCATS = [{ cabinet:'Cabinet Vasseur & Associés', contact:'contentieux@vasseur-avocats.example' }];

function exhaustiviteBanques(){
  const enCompta = GL_BAL.filter(r => /^(512|53)/.test(r.compte))
    .map(r => ({ compte:r.compte, lib:r.lib, solde:r.debit - r.credit }));
  const declares = new Set(LISTING_BANQUES.map(b => b.compte));
  return enCompta.map(c => ({ ...c, declare:declares.has(c.compte) }));

function exhaustiviteAvocats(){
  const parTiers = new Map();
  for (const r of FEC) if (/^622/.test(r.CompteNum) && r.Debit > 0){
    parTiers.set(r.CompAuxLib || '(sans tiers)', (parTiers.get(r.CompAuxLib || '(sans tiers)') || 0) + r.Debit);

  const declares = new Set(LISTING_AVOCATS.map(a => a.cabinet));
  return [...parTiers.entries()].map(([tiers, montant]) => ({ tiers, montant, declare:declares.has(tiers) }));

/* ═══ 17. MODULE 11 — SYNTHÈSE DES ANOMALIES ══════════════════════════════
   Le cumul n'est pas saisi : il agrège ce que les modules ont produit —
   les écarts de la feuille de travail, l'écart de rapprochement, et les
   anomalies relevées sur les écritures. Le tri par rapport au seuil de
   remontée et la conclusion suivent donc le curseur de matérialité.
   ═══════════════════════════════════════════════════════════════════════ */
function anomalies(){
  const s = seuils(), out = [];
  // 1. écarts constatés sur la feuille de travail (module 9)
  for (const r of initWp()){
    const d = r.compta - r.justif;
    if (d !== 0) out.push({ src:'Feuille REV-01', lib:'Écart pièce ' + r.piece + ' (' + r.tiers + ')',
                            montant:d, corrigee:false, expl:r.expl });
  }
  // 2. écart de rapprochement balance ↔ grand livre (module 1)
  for (const r of rapprochement()) if (r.ecart !== 0 && r.sTB - r.sGL > 0){
    out.push({ src:'Rapprochement', lib:'Écriture de situation non reprise au FEC — compte ' + r.compte,
               montant:r.ecart, corrigee:false, expl:'Écart documenté ; rapprochement à re-exécuter sur le FEC définitif.' });
  }
  // 3. anomalies relevées sur les écritures particulières (module 5)
  const parTag = t => LEDGER.entries.filter(e => e.tag === t);
  const dupe = parTag('A1');
  if (dupe.length === 2) out.push({ src:'Test des écritures', lib:'Même facture comptabilisée deux fois (' + dupe[0].pieceRef + ')',
    montant:dupe[1].lines[0].debit, corrigee:false, expl:'Doublon d’intégration reconnu par le client ; extourne non comptabilisée à date.' });
  for (const e of parTag('A5')) out.push({ src:'Test des écritures', lib:'Produit de 2026 rattaché à 2025 (' + e.pieceRef + ')',
    montant:e.lines[0].debit, corrigee:false, expl:'Facture datée du ' + frDate(e.pieceDate) + ', comptabilisée le ' + frDate(e.date) + '.' });
  for (const e of parTag('A6')) out.push({ src:'Test des écritures', lib:'Écriture manuelle de direction (' + e.pieceRef + ')',
    montant:e.lines[0].debit, corrigee:false, expl:'Prestation démarrant en janvier 2026 selon l’explication reçue.' });
  return out.map(a => ({ ...a, souSeuil:Math.abs(a.montant) < s.CTT }));
}

  function(){
    return `
      <p class="note">Tout ce qui précède tourne sans le moindre appel à un modèle : arithmétique, comparaisons,
      tri, tirage à germe. Voici la limite exacte, et son prix en minutes humaines.</p>
      <h3>Ces idées exigent un modèle</h3>
      ${table([{k:'i',t:'Idée',cls:'wrapcell'},{k:'a',t:'Ce que le modèle apporte',cls:'wrapcell'},
               {k:'v',t:'Vérification humaine imposée',cls:'wrapcell'}],
        BESOIN_MODELE.map(x => ({ i:esc(x.idee), a:esc(x.apport), v:esc(x.verif) })))}
      <h3 style="margin-top:12px">Ces idées, classées « agent », n’en ont pas besoin</h3>
      ${table([{k:'i',t:'Votre note',cls:'wrapcell'},{k:'r',t:'Ce que c’est réellement',cls:'wrapcell'}],
        FAUSSEMENT_AGENT.map(x => ({ i:'« ' + esc(x.idee) + ' »', r:esc(x.reel) })))}
      <div class="callout" style="margin-top:10px"><b>La règle qui en découle.</b> Un modèle sert à lire, classer,
      proposer et rédiger — jamais à calculer, sélectionner ni conclure. Tout ce qui peut être une règle en est une :
      c’est reproductible, ré-exécutable devant un inspecteur, et cela ne coûte rien à l’usage.</div>`;
  });

/* ═══ 19. RENDU ET INTERACTIONS ═══════════════════════════════════════════ */
/* Les curseurs sont construits UNE SEULE FOIS. Les reconstruire à chaque
   événement « input » détruirait l'élément en cours de glissement : au doigt,
   le drag s'arrêterait au premier mouvement. Seuls les libellés sont réécrits. */
function buildSeuils(){
  document.getElementById('seuils').innerHTML = `
    <div class="ctrl"><label>Référence de matérialité</label>
      <select id="bm">${Object.values(BM25).map(b => `<option value="${b.code}" ${b.code === S.benchmark ? 'selected' : ''}>${esc(b.lib)} — ${eur0(b.val)}</option>`).join('')}</select></div>
    <div class="ctrl"><label>Taux : <b id="lab-pm"></b></label>
      <input type="range" id="pm" min="0.5" max="10" step="0.1" value="${S.pctM}"></div>
    <div class="ctrl"><label>Seuil de planification : <b id="lab-ppm"></b> du seuil</label>
      <input type="range" id="ppm" min="50" max="90" step="5" value="${S.pctPM}"></div>
    <div class="ctrl"><label>Seuil de remontée : <b id="lab-pctt"></b> du seuil</label>
      <input type="range" id="pctt" min="1" max="10" step="1" value="${S.pctCTT}"></div>`;
}
function renderSeuils(){
  const s = seuils();
  document.getElementById('lab-pm').textContent   = pct(S.pctM / 100, 1);
  document.getElementById('lab-ppm').textContent  = S.pctPM + NBSP + '%';
  document.getElementById('lab-pctt').textContent = S.pctCTT + NBSP + '%';
  // le curseur n'est pas remplacé ; on ne le recale que s'il a bougé autrement (changement de référence)
  const pmEl = document.getElementById('pm');
  if (parseFloat(pmEl.value) !== S.pctM) pmEl.value = S.pctM;
  document.getElementById('seuilbox').innerHTML = `
    <div class="s ref"><div class="k">Référence</div><div class="v">${eur0(s.bench.val)}</div><div class="d">${esc(s.bench.lib)}</div></div>
    <div class="s"><div class="k">Seuil de signification</div><div class="v">${eur0(s.M)}</div><div class="d">${pct(S.pctM / 100, 1)} · brut ${eur0(s.brut)}</div></div>
    <div class="s"><div class="k">Seuil de planification</div><div class="v">${eur0(s.PM)}</div><div class="d">${S.pctPM}${NBSP}% du seuil</div></div>
    <div class="s"><div class="k">Seuil de remontée</div><div class="v">${eur0(s.CTT)}</div><div class="d">${S.pctCTT}${NBSP}% du seuil</div></div>`;
}
let lastImpact = {};
function renderImpact(){
  const s = seuils(), postes = postesCalcules();
  const nIn = postes.filter(p => (S.scopingOverride[p.code] || (Math.abs(p.solde) >= s.PM ? 'in' : 'out')) === 'in').length;
  const ar = revueAnalytique().filter(l => l.flag).length;
  const ech = echantillon();
  const a = anomalies(), nc = a.filter(x => !x.souSeuil && !x.corrigee).reduce((t, x) => t + x.montant, 0);
  const C = critereJE(s.PM);
  const je = LEDGER.entries.filter(e => !(S.jeSansAN && e.journal === 'AN'))
                           .filter(e => Object.keys(C).some(k => S.jeCrit[k] && C[k].f(e))).length;
  // libellé long (écran large) et libellé court (téléphone) : les SEPT indicateurs
  // doivent rester visibles au doigt, sinon on ne voit pas la conclusion bouger.
  const cells = {
    'postes dans le périmètre':                 [nIn + '/' + postes.length,                    'postes'],
    'lignes de revue analytique':               [String(ar),                                   'lignes RA'],
    'écritures sélectionnées':                  [String(je),                                   'écritures'],
    'couverture de l’échantillon':              [pct(ech.couvert / ech.total, 1),              'couverture'],
    'anomalies au-dessus du seuil de remontée': [String(a.filter(x => !x.souSeuil).length),    'anomalies'],
    'cumul non corrigé':                        [eur0(nc),                                     'cumul'],
    'conclusion':                               [Math.abs(nc) > s.M ? 'au-dessus du seuil' : 'sous le seuil', 'conclusion'],
  };
  document.getElementById('impact').innerHTML = Object.entries(cells).map(([k, [v, court]]) =>
    `<div class="c ${lastImpact[k] !== undefined && lastImpact[k] !== v ? 'flash' : ''}"><div class="k"><span class="lg">${k}</span><span class="sm">${court}</span></div><div class="v">${v}</div></div>`).join('');
  lastImpact = Object.fromEntries(Object.entries(cells).map(([k, [v]]) => [k, v]));
}
function renderModules(){
  const main = document.getElementById('main');
  main.innerHTML = MODULES.map(m => `
    <section class="mod" id="${m.id}">
      <header><span class="num">${m.num}</span><h2>${esc(m.titre)}</h2></header>
      <div class="body">
        <blockquote class="idea">« ${esc(m.quote)} »<span class="src">extrait, mot pour mot, de votre document d’idées</span></blockquote>
        <div class="content"></div>
      </div>
    </section>`).join('');
  for (const m of MODULES) main.querySelector('#' + m.id + ' .content').innerHTML = m.build();
  document.getElementById('jump').innerHTML = MODULES.map(m =>
    `<a href="#${m.id}">${m.num === '—' ? 'IA / déterministe' : m.num + '. ' + esc(m.titre.split(' ').slice(0, 3).join(' '))}</a>`).join('');
}
function render(){ renderSeuils(); renderImpact(); renderModules(); }
function renderTout(){ buildSeuils(); render(); }
/** Hauteur réelle de la barre collante → décalage des ancres de navigation. */
function syncTopHeight(){
  const h = Math.round(document.querySelector('.top').getBoundingClientRect().height);
  document.documentElement.style.setProperty('--topH', h + 'px');
}
if (window.ResizeObserver) new ResizeObserver(syncTopHeight).observe(document.querySelector('.top'));
addEventListener('resize', syncTopHeight);

/* délégation d'événements : un seul écouteur, le DOM est reconstruit à chaque rendu */
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'bm'){ S.benchmark = t.value; S.pctM = BM25[t.value].defaut; return render(); }  // le taux par défaut change : renderSeuils recale le curseur
  if (t.id === 'pm'){ S.pctM = parseFloat(t.value); renderSeuils(); renderImpact(); return renderModules(); }
  if (t.id === 'ppm'){ S.pctPM = parseInt(t.value, 10); renderSeuils(); renderImpact(); return renderModules(); }
  if (t.id === 'pctt'){ S.pctCTT = parseInt(t.value, 10); renderSeuils(); renderImpact(); return renderModules(); }
  if (t.id === 'ar-montant'){ S.arMontant = Math.round((parseFloat(t.value) || 0) * 100); renderImpact(); return refresh('m4', t); }
  if (t.id === 'ar-pct'){ S.arPct = parseFloat(t.value) || 0; renderImpact(); return refresh('m4', t); }
  if (t.id === 's-seed'){ S.sampleSeed = t.value; return; }
  if (t.id === 's-n'){ S.sampleN = Math.max(0, parseInt(t.value, 10) || 0); return; }
  if (t.id === 'wp-justif'){ S.wpJustif = t.value; return refresh('m9', t); }
  if (t.dataset.wp !== undefined){
    const r = S.wp[+t.dataset.wp];
    if (t.dataset.f === 'justif') r.justif = Math.round((parseFloat(String(t.value).replace(',', '.')) || 0) * 100);
    else r[t.dataset.f] = t.value;
    // la synthèse (module 11) agrège les écarts de cette feuille : elle doit suivre la saisie
    renderImpact(); refresh('m11'); return refresh('m9', t);
  }
  if (t.dataset.wpx !== undefined){ S.wp[+t.dataset.wpx][t.dataset.c] = t.value; return; }
});
/** Re-rend un seul module et rend le focus au champ modifié (frappe fluide). */
function refresh(id, focused){
  const m = MODULES.find(x => x.id === id);
  document.querySelector('#' + id + ' .content').innerHTML = m.build();
  if (focused && focused.id){
    const again = document.getElementById(focused.id);
    if (again){ again.focus(); if (again.setSelectionRange && again.type === 'text') { const v = again.value; again.setSelectionRange(v.length, v.length); } }
  } else if (focused && focused.dataset && focused.dataset.wp !== undefined){
    const again = document.querySelector(`[data-wp="${focused.dataset.wp}"][data-f="${focused.dataset.f}"]`);
    if (again){ again.focus(); const v = again.value; if (again.setSelectionRange) again.setSelectionRange(v.length, v.length); }
  }
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.je !== undefined){ S.jeCrit[t.dataset.je] = t.checked; renderImpact(); return refresh('m5'); }
  if (t.id === 'je-an'){ S.jeSansAN = t.checked; renderImpact(); return refresh('m5'); }
  if (t.id === 'clientview'){ S.clientView = t.checked; return refresh('m8'); }
  if (t.id === 'note-auteur'){ S.author = t.value; return; }
});
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'themebtn'){
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', cur ? (cur === 'dark' ? 'light' : 'dark') : (sysDark ? 'light' : 'dark'));
    return;
  }
  if (t.dataset.scope){
    const p = postesCalcules().find(x => x.code === t.dataset.scope);
    const prop = Math.abs(p.solde) >= seuils().PM ? 'in' : 'out';
    const cur = S.scopingOverride[p.code] || prop;
    const next = cur === 'in' ? 'out' : 'in';
    if (next === prop) delete S.scopingOverride[p.code]; else S.scopingOverride[p.code] = next;
    renderImpact(); return refresh('m3');
  }
  if (t.id === 'ar-sync'){ S.arMontant = null; renderImpact(); return refresh('m4'); }
  if (t.id === 's-replay'){ S.sampleRun++; renderImpact(); return refresh('m6'); }
  if (t.id === 's-newseed'){ S.sampleSeed = 'germe-' + Math.floor(Math.random() * 1e6); S.sampleRun++; renderImpact(); return refresh('m6'); }
  if (t.dataset.bump){
    const r = S.requests.find(x => x.seq === +t.dataset.bump);
    const i = r.items.find(x => x.statut !== 'recu_complet');
    if (i) i.statut = i.statut === 'non_recu' ? 'recu_partiel' : 'recu_complet';
    return refresh('m8');
  }
  if (t.dataset.close){ S.requests.find(x => x.seq === +t.dataset.close).clotureClient = true; return refresh('m8'); }
  if (t.id === 'exp-req'){
    const lignes = [['Numéro','Section','Demande','Échéance','Élément','Statut','Revue attendue de']];
    for (const r of S.requests) for (const i of r.items)
      lignes.push(['R-' + String(r.seq).padStart(3, '0'), S.clientView ? '' : r.section, r.titre, r.echeance,
                   i.desc, STATUTS[i.statut].lib, S.clientView ? '' : (i.revoyeur || '')]);
    const csv = lignes.map(l => l.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(';')).join('\n');
    document.getElementById('exp-out').innerHTML =
      `<div class="callout"><b>Export ${S.clientView ? 'vue client' : 'vue auditeur'} (CSV, séparateur point-virgule)</b>
       <textarea rows="6" readonly>${esc(csv)}</textarea>
       <a download="suivi-demandes.csv" href="data:text/csv;charset=utf-8,${encodeURIComponent('﻿' + csv)}">télécharger le fichier</a>
       — ou copier le contenu ci-dessus.</div>`;
    return;
  }
  if (t.id === 'wp-col'){
    const n = 'Colonne ' + (S.wpExtra.length + 1);
    const nom = prompt('Intitulé de la colonne ajoutée (hors cadre standard)', n);
    if (!nom) return;
    S.wpExtra.push(nom); return refresh('m9');
  }
  if (t.id === 'note-add'){
    const txt = document.getElementById('note-txt').value.trim();
    if (!txt) return;
    S.notes.unshift({ date:new Date().toISOString().slice(0, 16).replace('T', ' '), auteur:S.author, texte:txt, reponses:[], close:false });
    return refresh('m10');
  }
  if (t.dataset.rep !== undefined){
    const txt = prompt('Réponse à la note');
    if (!txt) return;
    S.notes[+t.dataset.rep].reponses.push({ date:new Date().toISOString().slice(0, 16).replace('T', ' '), auteur:S.author, texte:txt });
    return refresh('m10');
  }
  if (t.dataset.closeNote !== undefined){ S.notes[+t.dataset.closeNote].close = true; return refresh('m10'); }
});

renderTout();
syncTopHeight();
</script>
