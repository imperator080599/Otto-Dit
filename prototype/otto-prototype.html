<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OTTO — prototype par sections d’audit · Altiverre SAS FY2025</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   Aucune ressource externe : pas de police distante, pas de script distant,
   pas de requête réseau. Le fichier fonctionne hors ligne, sur téléphone.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel-2:#fbfcfd; --ink:#12161c; --ink-2:#4c5563;
  --ink-3:#79828f; --line:#e2e6ec; --line-2:#eef1f5;
  --ok:#127a43; --ok-soft:#e6f5ec; --warn:#9a6100; --warn-soft:#fdf3e2;
  --bad:#b32020; --bad-soft:#fdecec; --info:#5b3fb8; --info-soft:#f0ecfd;
  /* une teinte par espace : la couleur dit où l'on se trouve avant toute lecture */
  --c-aud:#1f4fd8; --c-aud-soft:#eaf0ff;
  --c-cli:#0b6f52; --c-cli-soft:#e2f2ec;
  --c-pil:#8a4b12; --c-pil-soft:#fbeee0;
  --accent:var(--c-aud); --accent-soft:var(--c-aud-soft);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --panel-2:#1b222c; --ink:#e6edf3; --ink-2:#aeb9c6;
  --ink-3:#7d8794; --line:#262e39; --line-2:#1f262f;
  --ok:#4ec27f; --ok-soft:#122a1d; --warn:#e0a54a; --warn-soft:#2c2413;
  --bad:#f2726f; --bad-soft:#301818; --info:#a892ff; --info-soft:#221d38;
  --c-aud:#6f9bff; --c-aud-soft:#18233c;
  --c-cli:#48c295; --c-cli-soft:#0f2a22;
  --c-pil:#e0a259; --c-pil-soft:#2b2113;
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#0d1117; --panel:#151b23; --panel-2:#1b222c; --ink:#e6edf3; --ink-2:#aeb9c6;
    --ink-3:#7d8794; --line:#262e39; --line-2:#1f262f;
    --ok:#4ec27f; --ok-soft:#122a1d; --warn:#e0a54a; --warn-soft:#2c2413;
    --bad:#f2726f; --bad-soft:#301818; --info:#a892ff; --info-soft:#221d38;
    --c-aud:#6f9bff; --c-aud-soft:#18233c;
    --c-cli:#48c295; --c-cli-soft:#0f2a22;
    --c-pil:#e0a259; --c-pil-soft:#2b2113;
  }
}
body[data-espace="client"]  { --accent:var(--c-cli); --accent-soft:var(--c-cli-soft) }
body[data-espace="pilotage"]{ --accent:var(--c-pil); --accent-soft:var(--c-pil-soft) }

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
     -webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h2{font-size:15px}
h3{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin:14px 0 6px}
h3:first-child{margin-top:0}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}

/* ══ chrome supérieur ══════════════════════════════════════════════════════ */
.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line);
     border-top:3px solid var(--accent)}
.brand{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;padding:7px 92px 5px 14px}
.brand b{font-size:14px}
.brand .esp{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.08em;
            color:var(--accent);background:var(--accent-soft);padding:4px 7px;border-radius:5px}
.brand span{color:var(--ink-3);font-size:12px}
.spaces{display:flex;gap:3px;padding:0 10px 6px;overflow-x:auto;scrollbar-width:thin;align-items:center}
.spaces .qui{flex:0 0 auto;margin-left:auto;padding-left:8px}
.spaces button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:7px;
               padding:5px 11px;font-size:12.5px;color:var(--ink-2);cursor:pointer;min-height:32px}
.spaces button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.themebtn{position:absolute;top:6px;right:10px;z-index:2;background:var(--panel-2);border:1px solid var(--line);
          border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--ink-2);
          min-height:28px;min-width:64px}

.pill{display:inline-block;padding:1px 7px;border-radius:999px;font-size:11px;border:1px solid var(--line);
      background:var(--panel-2);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* ══ seuils : espace auditeur uniquement — le client ne voit jamais la matérialité ══ */
.seuils{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;padding:2px 14px 8px}
.ctrl{display:flex;flex-direction:column;gap:2px;min-width:0}
.ctrl label{font-size:11px;color:var(--ink-3)}
.ctrl select,.ctrl input[type=number],.ctrl input[type=text],.ctrl input[type=email]{
  background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-size:13px;min-width:0;width:100%}
.ctrl input[type=range]{accent-color:var(--accent);width:100%}
.seuilbox{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.seuilbox .s{flex:1 1 120px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.seuilbox .s .k{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.seuilbox .s .v{font:600 16px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:1px}
.seuilbox .s .d{font-size:10.5px;color:var(--ink-3)}
.impact{display:flex;gap:6px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:thin}
.impact .c{flex:0 0 auto;background:var(--accent-soft);border-radius:8px;padding:5px 9px;min-width:0}
.impact .c .k{font-size:10px;color:var(--ink-3);white-space:nowrap}
.impact .c .k .sm{display:none}
.impact .c .v{font:600 13px/1.3 var(--mono);font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
.impact .c.flash{animation:flash .5s ease-out}
@keyframes flash{from{background:var(--warn-soft)}to{background:var(--accent-soft)}}

/* ══ coquille : rail de sections + contenu ═════════════════════════════════ */
.shell{display:grid;grid-template-columns:262px minmax(0,1fr);max-width:1680px;margin:0 auto}
.rail{border-right:1px solid var(--line);padding:10px 8px 20px;position:sticky;
      top:calc(var(--topH,180px));align-self:start;max-height:calc(100vh - var(--topH,180px));
      overflow-y:auto;scrollbar-width:thin}
.rail .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
           padding:10px 8px 4px;font-weight:600}
.rail a{display:flex;gap:6px;align-items:center;justify-content:space-between;padding:6px 9px;border-radius:7px;
        font-size:12.5px;color:var(--ink-2);text-decoration:none;cursor:pointer;min-height:32px}
.rail a:hover{background:var(--panel-2)}
.rail a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail a .b{flex:0 0 auto;font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px;
           background:var(--panel-2);color:var(--ink-3);border:1px solid var(--line)}
.rail a .b.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.rail a .b.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rail a .b.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.railm{display:none;padding:8px 10px 0}
main{padding:12px 14px 40px;min-width:0}

/* ══ blocs de contenu ══════════════════════════════════════════════════════ */
.hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.hd h1{font-size:18px}
.hd .sub{color:var(--ink-3);font-size:12.5px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:12px;overflow:hidden;
     scroll-margin-top:calc(var(--topH,180px) + 10px)}
.blk > header{padding:9px 12px;border-bottom:1px solid var(--line-2);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.blk > header .num{font:600 11px/1 var(--mono);color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:3px 5px}
.blk > header .why{margin-left:auto;font-size:11px;color:var(--ink-3)}
.blk .body{padding:10px 12px 12px}
blockquote.idea{margin:0 0 10px;padding:7px 10px;border-left:3px solid var(--info);background:var(--info-soft);
                border-radius:0 6px 6px 0;font-size:12.5px;color:var(--ink-2)}
blockquote.idea .src{display:block;margin-top:3px;font-size:10.5px;color:var(--ink-3)}
p.note{margin:6px 0 0;font-size:12px;color:var(--ink-3)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

/* ══ tableaux : défilement dans leur propre conteneur, jamais la page ══════ */
.tw{overflow-x:auto;max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:4px 8px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--panel-2);font-size:11px;color:var(--ink-3);text-transform:uppercase;
   letter-spacing:.04em;font-weight:600;z-index:1}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:11.5px}
tfoot td{font-weight:600;background:var(--panel-2);border-top:1px solid var(--line)}
.wrapcell{white-space:normal;min-width:200px;max-width:420px}

button.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 10px;font-size:12.5px;
           cursor:pointer;min-height:32px}
button.btn.sec{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}
button.btn.mini{padding:3px 8px;font-size:11.5px;min-height:26px}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button.btn:active:not(:disabled){transform:translateY(1px)}
.chk{display:inline-flex;gap:5px;align-items:center;background:var(--panel-2);border:1px solid var(--line);
     border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;min-height:30px}
.chk input{accent-color:var(--accent);margin:0}
.chk .cnt{font-family:var(--mono);color:var(--ink-3);font-size:11.5px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px}
.kv .k{color:var(--ink-3)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.callout{border:1px solid var(--line);border-left:3px solid var(--accent);background:var(--panel-2);
         border-radius:0 6px 6px 0;padding:7px 10px;font-size:12.5px;margin-top:8px}
.callout.bad{border-left-color:var(--bad);background:var(--bad-soft)}
.callout.ok{border-left-color:var(--ok);background:var(--ok-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.info{border-left-color:var(--info);background:var(--info-soft)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--accent)}
textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:6px;
         font:12px/1.4 var(--mono)}
input.cell{width:100%;background:transparent;border:1px solid transparent;border-radius:4px;padding:3px 4px;
           font:12px var(--mono);font-variant-numeric:tabular-nums;text-align:right;min-height:26px}
input.cell:focus{border-color:var(--accent);background:var(--panel);outline:none}
input.cell.txt{text-align:left;font-family:var(--sans)}
.smallcaps{font-size:11px;color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{background:var(--panel-2);border:0;border-right:1px solid var(--line);padding:4px 9px;
            font-size:11.5px;cursor:pointer;color:var(--ink-2);min-height:30px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:#fff;font-weight:600}
.tag{display:inline-block;font:600 10px/1 var(--mono);padding:3px 5px;border-radius:4px;
     background:var(--panel-2);border:1px solid var(--line);color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tag.det{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.tag.mod{background:var(--info-soft);color:var(--info);border-color:transparent}
.tag.abs{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* ══ notes de revue ════════════════════════════════════════════════════════ */
.note-i{display:inline-flex;align-items:center;gap:3px;border:0;background:transparent;cursor:pointer;
        color:var(--ink-3);font-size:11px;padding:2px 4px;border-radius:4px;min-height:24px}
.note-i:hover{background:var(--accent-soft);color:var(--accent)}
.note-i.has{color:var(--bad);font-weight:600}
.nl{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:7px;background:var(--panel-2)}
.nl.bloq{border-left:3px solid var(--bad)}
.nl.doc{border-left:3px solid var(--warn)}
.nl.q{border-left:3px solid var(--info)}
.nl.n1{border-left:3px solid var(--ink-3)}
.nl.clos{opacity:.62}
.nl .m{font-size:11px;color:var(--ink-3);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.nl .txt{margin:3px 0;font-size:12.5px}
.nl .rep{margin:4px 0 0 12px;padding-left:8px;border-left:2px solid var(--line);font-size:12px}

/* ══ portail client : autre densité, autre ton ═════════════════════════════ */
body[data-espace="client"] main{max-width:940px;margin:0 auto;font-size:14.5px}
body[data-espace="client"] .blk{border-radius:12px}
body[data-espace="client"] .blk > header{padding:12px 14px;font-size:15px}
.cli-item{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.cli-item:last-child{border-bottom:0}
.cli-item .g{flex:1 1 260px;min-width:0}
.cli-item .g b{font-size:13.5px;font-weight:600}
.cli-item .a{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dep{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.dep .f{display:inline-block;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;
        padding:2px 6px;margin:2px 4px 0 0;font-family:var(--mono);font-size:11px}
.msg{border-top:1px solid var(--line-2);margin-top:8px;padding-top:8px}
.msg .m{padding:5px 8px;border-radius:8px;margin-top:5px;font-size:12.5px;max-width:85%}
.msg .m.aud{background:var(--c-aud-soft);color:var(--ink)}
.msg .m.cli{background:var(--c-cli-soft);color:var(--ink);margin-left:auto}
.msg .m .w{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:2px}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .railm{display:block}
  main{padding:10px 10px 40px}
}
@media (max-width:640px){
  /* la barre collante doit tenir dans le tiers haut de l'écran : une ligne
     d'identité, une ligne d'espaces, les curseurs, les seuils, l'impact. */
  .brand{padding:5px 78px 3px 10px;gap:5px}
  .brand > span:not(.pill){display:none}
  .brand .pill{display:none}
  .brand b{font-size:13px}
  .brand .esp{font-size:10px;padding:3px 6px}
  .spaces{padding:0 8px 4px;gap:2px}
  .spaces button{padding:4px 8px;font-size:11.5px;min-height:28px}
  .spaces .qui{margin-left:6px;padding-left:0}
  .spaces .qui select{font-size:11px;padding:2px 4px;max-width:150px}
  .seuils{grid-template-columns:1fr 1fr;gap:4px 6px;padding:0 10px 4px}
  .ctrl input[type=range]{height:18px}
  .ctrl label{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl select{font-size:12px;padding:3px 5px}
  /* les trois seuils restent visibles SANS défilement : ce sont eux qui pilotent tout.
     La référence est déjà lisible dans le sélecteur au-dessus, on la retire ici. */
  .seuilbox{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:0 10px 5px;overflow:visible}
  .seuilbox .s{padding:4px 7px;min-width:0}
  .seuilbox .s.ref{display:none}
  .seuilbox .s .k{font-size:9px}
  .seuilbox .s .v{font-size:15px}
  .seuilbox .s .d{font-size:9.5px}
  /* au doigt : la bande se replie en pastilles courtes, les sept indicateurs
     — conclusion comprise — restent sous les yeux. */
  .impact{flex-wrap:wrap;overflow:visible;gap:3px;padding:0 10px 5px}
  .impact .c{padding:2px 6px;display:flex;align-items:baseline;gap:4px}
  .impact .c .k .lg{display:none}
  .impact .c .k .sm{display:inline}
  .impact .c .k{font-size:9.5px}
  .impact .c .v{font-size:12px}
  .kv{grid-template-columns:1fr;gap:0}
  .kv .k{margin-top:5px;font-size:11px}
  .grid2,.grid3{gap:10px}
  blockquote.idea{font-size:12px}
  .blk .body{padding:9px 10px 11px}
}
</style>
</head>

  <div id="topextra"></div>
</div>
<div class="shell">
  <aside class="rail" id="rail"></aside>
  <main id="main"></main>
</div>

/** Générateur pseudo-aléatoire à germe (mulberry32) : même germe ⇒ même suite.
 *  C'est ce qui rend le tirage d'échantillon rejouable à l'identique. */function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** Germe entier stable à partir d'une chaîne (FNV-1a 32 bits). */
function seedOf(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

const NBSP = '\u00A0';
/** Format français : espace insécable pour les milliers, virgule décimale, € après. */
function eur(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents));
  const ent = String(Math.floor(v / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (neg ? '-' : '') + ent + ',' + String(v % 100).padStart(2, '0') + NBSP + '€';
}
function eur0(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents / 100));
  return (neg ? '-' : '') + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP) + NBSP + '€';
}
function pct(x, d){ return (x * 100).toFixed(d === undefined ? 1 : d).replace('.', ',') + NBSP + '%'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function frDate(iso){ return iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4); }
function isWeekend(iso){ const d = new Date(iso + 'T00:00:00Z').getUTCDay(); return d === 0 || d === 6; }
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }

/* ═══ 3. GRAND LIVRE ═══════════════════════════════════════════════════════
   Le grand livre n'est PAS saisi : il est engendré, à germe fixe, de façon à
   totaliser exactement la balance client compte par compte — moins l'écriture
   de situation volontairement absente (l'écart que le rapprochement doit
   trouver) et moins les écritures particulières créées nommément.
   Conséquences vérifiables à l'écran :
     · total des débits = total des crédits (chaque écriture est équilibrée) ;
     · solde du grand livre = solde de la balance sur tous les comptes sauf deux.
   ═══════════════════════════════════════════════════════════════════════ */

const CLIENTS = ['Groupe Immovance SA','Promoteurs du Forez SA','Bâtiplace SARL','Constructions Peyrelle SAS',
  'Tertiaire Bâtir SAS','Menuiseries Chartier SAS','Habitat Confluence SAS','Négoce Vitrages Réunis SARL',
  'Sogexim Façades SA','Atelier Lumière & Verre EURL'];
const FOURNISSEURS = ['Silices du Vercors SA','Intercalaires Rhodia SARL','Profilés Aluvin SAS','Énergie Rhône Sud',
  'Fours & Réfractaires SA','Assurances Belleville','Intérim Delorme','Transports Cabrol SAS'];
const AVOCATS = ['Cabinet Vasseur & Associés','SELARL Perrin Contentieux'];
const SAISIE = ['S. Marchand (comptabilité)','T. Girard (comptabilité)','M. Ferrand (direction)'];

/** Écriture de situation présente dans la balance client et absente du FEC.
 *  C'est l'anomalie A7 du jeu de données : 25 000 € en Dr 411000 / Cr 706000. */
const ECART_SITUATION = { debit: '411000', credit: '706000', montant: 2500000 };

function buildLedger(){
  const rnd = mulberry32(seedOf('otto-altiverre-fy2025-v1'));
  const label = Object.fromEntries(TB_2025.map(r => [r[0], r[1]]));

  // cibles = balance client, par compte et par sens
  const needD = new Map(), needC = new Map();
  for (const [c,, d, cr] of TB_2025){ if (d) needD.set(c, d); if (cr) needC.set(c, cr); }
  // on retire l'écriture de situation : le grand livre ne la contient pas
  needD.set(ECART_SITUATION.debit, needD.get(ECART_SITUATION.debit) - ECART_SITUATION.montant);
  needC.set(ECART_SITUATION.credit, needC.get(ECART_SITUATION.credit) - ECART_SITUATION.montant);

  const entries = [];
  let num = 0;
  function push(e){
    e.num = e.journal + '-2025-' + String(++num).padStart(4, '0');
    for (const l of e.lines){
      if (l.debit)  needD.set(l.compte, (needD.get(l.compte) || 0) - l.debit);
      if (l.credit) needC.set(l.compte, (needC.get(l.compte) || 0) - l.credit);
    }
    entries.push(e);
    return e;
  }
  function line(compte, debit, credit, auxLib){
    return { compte, libelleCompte: label[compte] || compte, debit: debit || 0, credit: credit || 0,
             auxNum: auxLib ? 'T' + String(seedOf(auxLib) % 900 + 100) : '', auxLib: auxLib || '' };
  }

  /* ── 3a. écritures particulières (les anomalies du scénario) ───────────── */
  const client = CLIENTS[0];
  // A1 — la même facture comptabilisée deux fois, juin puis juillet
  for (const [d, p] of [['2025-06-17','FA2025-0702'], ['2025-07-15','FA2025-0702']]){
    push({ journal:'VE', date:d, pieceRef:p, pieceDate:d, libelle:'Facture ' + p + ' — ' + client,
           saisiePar:SAISIE[0], validDate:addDays(d,3), tag:'A1',
           lines:[ line('411000', 3680000, 0, client), line('701000', 0, 3680000) ] });
  }
  // A5 — produit de janvier 2026 rattaché à 2025 (séparation des exercices)
  push({ journal:'VE', date:'2025-12-31', pieceRef:'FA2025-0706', pieceDate:'2026-01-06',
         libelle:'Facture FA2025-0706 — Promoteurs du Forez SA', saisiePar:SAISIE[1],
         validDate:'2026-01-08', tag:'A5',
         lines:[ line('411000', 3633000, 0, CLIENTS[1]), line('701000', 0, 3633000) ] });
  // A6 — écriture manuelle ronde, un samedi, saisie par la direction
  push({ journal:'OD', date:'2025-11-15', pieceRef:'OD-2025-089', pieceDate:'2025-11-15',
         libelle:'Régularisation contrat-cadre — décision de direction', saisiePar:SAISIE[2],
         validDate:'2025-11-17', tag:'A6',
         lines:[ line('411000', 5000000, 0, CLIENTS[0]), line('706000', 0, 5000000) ] });
  // honoraires juridiques : deux cabinets, dont un seul sera déclaré par le client
  {
    const tot = needD.get('622600') || 0;
    const part = Math.round(tot * 0.62);
    push({ journal:'AC', date:'2025-03-20', pieceRef:'FF2025-0311', pieceDate:'2025-03-18',
           libelle:'Honoraires — ' + AVOCATS[0], saisiePar:SAISIE[0], validDate:'2025-03-25',
           lines:[ line('622600', part, 0, AVOCATS[0]), line('401000', 0, part, AVOCATS[0]) ] });
    push({ journal:'AC', date:'2025-09-08', pieceRef:'FF2025-0742', pieceDate:'2025-09-04',
           libelle:'Honoraires contentieux — ' + AVOCATS[1], saisiePar:SAISIE[1], validDate:'2025-09-12',
           lines:[ line('622600', tot - part, 0, AVOCATS[1]), line('401000', 0, tot - part, AVOCATS[1]) ] });
  }

  /* ── 3b. table des contreparties plausibles ───────────────────────────── */
  const PREF = [
    { d:/^411/, c:/^(701|706|445710)/, j:'VE', lib:'Facture de vente' },
    { d:/^709/, c:/^411/,              j:'VE', lib:'Avoir accordé' },
    { d:/^512/, c:/^411/,              j:'BQ', lib:'Encaissement client' },
    { d:/^401/, c:/^512/,              j:'BQ', lib:'Règlement fournisseur' },
    { d:/^(60|61|62|624|606|615|616)/, c:/^401/, j:'AC', lib:'Facture fournisseur' },
    { d:/^445660/, c:/^401/,           j:'AC', lib:'TVA déductible sur achats' },
    { d:/^(641|645|621)/, c:/^(421|431|437)/, j:'PA', lib:'Paie du mois' },
    { d:/^(421|431|437)/, c:/^512/,    j:'BQ', lib:'Versement social / salaires' },
    { d:/^(661|164)/, c:/^512/,        j:'BQ', lib:'Échéance emprunt' },
    { d:/^445510/, c:/^512/,           j:'BQ', lib:'Paiement TVA' },
    { d:/^445710/, c:/^(445510|445660)/, j:'OD', lib:'Déclaration de TVA' },
    { d:/^681/, c:/^28/,               j:'OD', lib:'Dotation aux amortissements' },
    { d:/^(2|3)/, c:/^(401|512)/,      j:'AC', lib:'Acquisition' },
  ];
  const CAP = { VE:[300000,6500000], AC:[50000,3500000], BQ:[80000,9000000],
                PA:[1500000,18000000], OD:[100000,4000000], AN:[0,0] };

  function pickDate(){
    // dates réparties sur l'exercice, décalées au lundi suivant dans 9 cas sur 10
    // lorsqu'elles tombent un week-end : une comptabilité ne saisit presque jamais
    // le samedi, ce qui fait du critère « week-end » un vrai signal (~3 % ici).
    let d = addDays('2025-01-01', Math.floor(rnd() * 365));
    if (isWeekend(d) && rnd() < 0.9){
      d = addDays(d, new Date(d + 'T00:00:00Z').getUTCDay() === 6 ? 2 : 1);
      if (d > '2025-12-31') d = addDays(d, -3);
    }
    return d;
  }
  function mkEntry(dc, cc, amount, j, lib){
    const date = j === 'AN' ? '2025-01-01' : pickDate();
    const aux = dc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : cc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)]
              : cc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : dc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)] : '';
    const prefix = { VE:'FA', AC:'FF', BQ:'BQ', PA:'PA', OD:'OD', AN:'AN' }[j];
    const piece = prefix + '2025-' + String(1000 + Math.floor(rnd() * 8999));
    // validation : quelques écritures validées après la clôture (critère de test)
    const late = rnd() < 0.03;
    let pd = j === 'AN' ? date : addDays(date, -Math.floor(rnd() * 4));
    if (pd < '2025-01-01') pd = '2025-01-01';
    return { journal:j, date, pieceRef:piece, pieceDate:pd,
             libelle: lib + (aux ? ' — ' + aux : ''), saisiePar: SAISIE[rnd() < 0.04 ? 2 : (rnd() < .5 ? 0 : 1)],
             validDate: late ? addDays('2026-01-05', Math.floor(rnd()*20)) : addDays(date, 1 + Math.floor(rnd()*6)),
             lines: [ line(dc, amount, 0, aux), line(cc, 0, amount, aux) ] };
  }

  /* ── 3c. appariement glouton jusqu'à consommer toutes les cibles ───────── */
  const alive = m => [...m.entries()].filter(([, v]) => v > 0);
  let guard = 0;
  while (guard++ < 40000){
    const ds = alive(needD), cs = alive(needC);
    if (!ds.length || !cs.length) break;
    // on prend la cible débit la plus lourde : la boucle converge vite
    ds.sort((a, b) => b[1] - a[1]);
    const [dc, dRem] = ds[0];
    let rule = PREF.find(p => p.d.test(dc) && cs.some(([c]) => p.c.test(c) ));
    let cc, j, lib;
    if (rule){
      const cands = cs.filter(([c]) => rule.c.test(c));
      cc = cands[Math.floor(rnd() * cands.length)][0]; j = rule.j; lib = rule.lib;
    } else {
      // pas de contrepartie naturelle disponible : opération diverse
      const bs = c => /^[1-5]/.test(c);
      const cands = cs.filter(([c]) => bs(c) === bs(dc)).concat(cs);
      cc = cands[Math.floor(rnd() * cands.length)][0];
      j = (/^[1-3]/.test(dc) && /^[1-3]/.test(cc)) ? 'AN' : 'OD';
      lib = j === 'AN' ? 'À nouveau' : 'Opération diverse';
    }
    const cRem = needC.get(cc);
    const [lo, hi] = CAP[j];
    let amount;
    if (j === 'AN') amount = Math.min(dRem, cRem);
    else {
      // rnd()^2,6 : la masse des écritures est petite, la queue est longue
      amount = Math.min(dRem, cRem, lo + Math.floor(Math.pow(rnd(), 2.6) * (hi - lo)));
      // reliquat trop petit pour une écriture crédible : on le solde d'un coup
      if (dRem - amount < lo) amount = Math.min(dRem, cRem);
      // ~8 % des montants sont ronds au millier (critère « montant rond »)
      if (amount > 500000 && rnd() < 0.08) amount = Math.floor(amount / 100000) * 100000;
    }
    if (amount <= 0) { needD.set(dc, 0); continue; }
    push(mkEntry(dc, cc, amount, j, lib));
  }

  // numérotation par journal, comme dans un FEC réel
  const perJournal = {};
  for (const e of entries){
    perJournal[e.journal] = (perJournal[e.journal] || 0) + 1;
    e.num = e.journal + String(perJournal[e.journal]).padStart(5, '0');
  }
  entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.num < b.num ? -1 : 1));

  // aplatissement en lignes de FEC
  const rows = [];
  for (const e of entries){
    e.lines.forEach((l, i) => rows.push({
      JournalCode:e.journal, JournalLib:{VE:'Ventes',AC:'Achats',BQ:'Banque',PA:'Paie',OD:'Opérations diverses',AN:'À nouveaux'}[e.journal],
      EcritureNum:e.num, EcritureDate:e.date, CompteNum:l.compte, CompteLib:l.libelleCompte,
      CompAuxNum:l.auxNum, CompAuxLib:l.auxLib, PieceRef:e.pieceRef, PieceDate:e.pieceDate,
      EcritureLib:e.libelle, Debit:l.debit, Credit:l.credit, EcritureLet:'', DateLet:'',
      ValidDate:e.validDate, Montantdevise:'', Idevise:'', saisiePar:e.saisiePar, tag:e.tag || '', ligne:i + 1
    }));
  }
  return { entries, rows };
}

const LEDGER = buildLedger();
const FEC = LEDGER.rows;

/** Balance recalculée à partir des écritures — jamais saisie à côté. */
function balanceFromLedger(){
  const m = new Map();
  for (const r of FEC){
    const a = m.get(r.CompteNum) || { compte:r.CompteNum, lib:r.CompteLib, debit:0, credit:0 };
    a.debit += r.Debit; a.credit += r.Credit; m.set(r.CompteNum, a);
  }
  return [...m.values()].sort((a, b) => a.compte < b.compte ? -1 : 1);
}
const GL_BAL = balanceFromLedger();

/** Statistiques observées d'un poste — base des facteurs qui n'ont pas à être demandés. */

function statsPoste(p){

  const re = p.re;
  const ecr = LEDGER.entries.filter(e => e.lines.some(l => re.test(l.compte)));
  const mvt = e => e.lines.reduce((a, l) => a + (re.test(l.compte) ? Math.abs(l.debit - l.credit) : 0), 0);
  const st = {
    n:ecr.length,
    od:ecr.filter(e => e.journal === 'OD').length,
    direction:ecr.filter(e => /direction/.test(e.saisiePar)).length,
    tardives:ecr.filter(e => e.validDate > '2025-12-31').length,
    decembre:ecr.filter(e => e.date >= '2025-12-01').length,
    tiers:new Set(ecr.flatMap(e => e.lines.map(l => l.auxLib).filter(Boolean))).size,
    masse:ecr.reduce((a, e) => a + mvt(e), 0),
  };
  _statCache.set(p.code, st);
  return st;
}

/** Facteurs OBSERVÉS : calculés sur les données, jamais demandés à l'auditeur.
 *  Facteurs DÉCLARÉS : relèvent du jugement, l'auditeur répond lui-même. */
const FACTEURS = [
  { code:'variation', a:'realite', lib:'Variation N/N-1 supérieure au seuil de planification',
    obs:p => Math.abs(p.solde - p.soldeN1) >= seuils().PM,
    dit:p => `variation ${eur0(p.solde - p.soldeN1)} · seuil ${eur0(seuils().PM)}` },
  { code:'volume', a:'exhaustivite', lib:'Plus de 200 écritures sur l’exercice',
    obs:p => statsPoste(p).n > 200, dit:p => statsPoste(p).n + ' écritures' },
  { code:'manuel', a:'realite', lib:'Plus de 5 % d’écritures en journal d’opérations diverses',
    obs:p => statsPoste(p).n > 0 && statsPoste(p).od / statsPoste(p).n > 0.05,
    dit:p => statsPoste(p).od + ' OD sur ' + statsPoste(p).n },
  { code:'direction', a:'realite', lib:'Écritures saisies par la direction',
    obs:p => statsPoste(p).direction > 0, dit:p => statsPoste(p).direction + ' écriture(s)' },
  { code:'tardive', a:'separation', lib:'Écritures validées après la date de clôture',
    obs:p => statsPoste(p).tardives > 0, dit:p => statsPoste(p).tardives + ' écriture(s)' },
  { code:'concentration', a:'separation', lib:'Plus de 15 % des écritures concentrées en décembre',
    obs:p => statsPoste(p).n > 0 && statsPoste(p).decembre / statsPoste(p).n > 0.15,
    dit:p => statsPoste(p).decembre + ' écritures en décembre sur ' + statsPoste(p).n },
  { code:'estimation', a:'evaluation', lib:'Le poste comporte une estimation comptable', declare:true },
  { code:'fraude', a:'realite', lib:'Poste porteur d’un risque de fraude identifié', declare:true },
  { code:'ci_faible', a:'exhaustivite', lib:'Contrôle interne non testé ou jugé non fiable sur ce cycle', declare:true },
  { code:'complexe', a:'presentation', lib:'Règle de présentation ou d’annexe complexe sur ce poste', declare:true },
  { code:'litige', a:'evaluation', lib:'Poste exposé à un litige ou à une incertitude', declare:true },
];

/** Facteurs actifs d'un poste : les observés sont calculés, les déclarés sont lus dans le casier. */
function facteursActifs(p){
  const st = sec(p.code);
  return FACTEURS.map(f => ({ ...f,
    actif: f.declare ? !!st.declares[f.code] : !!f.obs(p),
    preuve: f.declare ? null : f.dit(p) }));
}
const NIVEAUX = ['faible', 'moyen', 'eleve'];
const NIV_LIB = { faible:'faible', moyen:'moyen', eleve:'élevé' };
/** Règle : 0 facteur → faible, 1 → moyen, 2 et plus → élevé. Surchargeable avec motif. */
function niveauCalcule(p, a){
  const n = facteursActifs(p).filter(f => f.a === a && f.actif).length;
  return n === 0 ? 'faible' : n === 1 ? 'moyen' : 'eleve';
}
function niveau(p, a){ return sec(p.code).override[a] || niveauCalcule(p, a); }
function niveauMax(p){
  return ASSERTIONS.reduce((m, a) => Math.max(m, NIVEAUX.indexOf(niveau(p, a.code))), 0);
}

/* ── catalogue de procédures ──────────────────────────────────────────────
   `min` = niveau de risque à partir duquel la procédure devient requise.
   `postes` absent = procédure générique, applicable à tout poste.       */
const PROCEDURES = [
  { code:'RAPPRO', a:'exhaustivite', min:'faible', nature:'det',
    lib:'Rapprochement du détail du compte au solde de la balance' },
  { code:'RA', a:'presentation', min:'faible', nature:'det',
    lib:'Revue analytique du poste et explication des variations au-delà des seuils' },
  { code:'DETAIL', a:'realite', min:'faible', nature:'det',
    lib:'Test de détail sur les éléments sélectionnés, pièce à l’appui' },
  { code:'CUTOFF', a:'separation', min:'moyen', nature:'det',
    lib:'Test de séparation des exercices sur les dix jours encadrant la clôture' },
  { code:'SEQ', a:'exhaustivite', min:'moyen', nature:'det',
    lib:'Contrôle de séquence des pièces et recherche de ruptures de numérotation' },
  { code:'MANUEL', a:'realite', min:'moyen', nature:'det',
    lib:'Examen exhaustif des écritures manuelles du poste et de leur justification' },
  { code:'RECALC', a:'evaluation', min:'moyen', nature:'det',
    lib:'Recalcul des montants et vérification des bases de calcul retenues' },
  { code:'CONFIRM', a:'realite', min:'eleve', nature:'det',
    lib:'Confirmation directe auprès des tiers (circularisation)', postes:['CLIENTS','TRESO','FOURN','PROV'] },
  { code:'ENTRETIEN', a:'realite', min:'eleve', nature:'det',
    lib:'Entretien avec le responsable du cycle et documentation du processus' },
  { code:'ESTIM', a:'evaluation', min:'moyen', nature:'det',
    lib:'Test de la base de données servant à l’estimation et des taux ou formules appliqués',
    siFacteur:'estimation' },
  { code:'FRAUDE', a:'realite', min:'moyen', nature:'det',
    lib:'Test spécifique de réponse au risque de fraude sur le poste', siFacteur:'fraude' },
  { code:'ANNEXE', a:'presentation', min:'eleve', nature:'det',
    lib:'Rapprochement des montants d’annexe se rapportant au poste' },
];
function proceduresRequises(p){
  const fa = facteursActifs(p);
  return PROCEDURES.filter(pr => {
    if (pr.postes && !pr.postes.includes(p.code)) return false;
    if (pr.siFacteur && !fa.find(f => f.code === pr.siFacteur && f.actif)) return false;
    return NIVEAUX.indexOf(niveau(p, pr.a)) >= NIVEAUX.indexOf(pr.min);
  });
}

/* ── taille d'échantillon : table visible à l'écran, pas une formule cachée ── */
const TAILLE = { faible:6, moyen:15, eleve:30 };
function tailleEchantillon(p){ return TAILLE[NIVEAUX[niveauMax(p)]]; }

/* ═══ 7. ÉCHANTILLONNAGE GÉNÉRALISÉ ════════════════════════════════════════
   Deux strates : couverture exhaustive au-dessus du seuil de planification,
   puis tirage aléatoire à germe dans le reliquat. Même germe ⇒ même tirage.
   ═══════════════════════════════════════════════════════════════════════ */
const _echCache = new Map();
function echantillonPoste(p){
  const s = seuils(), st = sec(p.code), n = tailleEchantillon(p);
  // le tirage ne dépend que de ces quatre valeurs : on le mémoïse, sinon le
  // même mélange de 1 300 éléments serait refait à chaque frappe au clavier.
  const cle = p.code + '|' + st.seed + '|' + s.PM + '|' + n;
  if (_echCache.has(cle)) return _echCache.get(cle);
  const pop = LEDGER.entries
    .filter(e => e.lines.some(l => p.re.test(l.compte)))
    .map(e => ({ e, montant:e.lines.reduce((a, l) => a + (p.re.test(l.compte) ? Math.abs(l.debit - l.credit) : 0), 0) }))
    .filter(x => x.montant > 0);
  const total = pop.reduce((a, x) => a + x.montant, 0);
  const exhaustif = pop.filter(x => x.montant >= s.PM);
  const reste = pop.filter(x => x.montant < s.PM);
  const rnd = mulberry32(seedOf(st.seed));
  const idx = reste.map((_, i) => i);
  for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  const alea = idx.slice(0, Math.min(n, idx.length)).sort((a, b) => a - b).map(i => reste[i]);
  const couvert = exhaustif.reduce((a, x) => a + x.montant, 0) + alea.reduce((a, x) => a + x.montant, 0);
  const r = { pop, total, exhaustif, alea, couvert, n, taux: total ? couvert / total : 0 };
  if (_echCache.size > 400) _echCache.clear();
  _echCache.set(cle, r);
  return r;
}

function soldes(tb){ const m = new Map(); for (const [c, l, d, cr] of tb) m.set(c, { lib:l, solde:d - cr, debit:d, credit:cr }); return m; }
const B25 = soldes(TB_2025), B24 = soldes(TB_2024);
function sumWhere(bal, re){ let s = 0; for (const [c, v] of bal) if (re.test(c)) s += v.solde; return s; }

/** Références possibles pour la matérialité, toutes calculées depuis la balance.
 *  Signe : produits et capitaux propres sont créditeurs, on les rend positifs. */
function benchmarks(bal){
  const produits = -sumWhere(bal, /^7/);
  const charges  =  sumWhere(bal, /^6/);
  const ca       = -sumWhere(bal, /^70/);                    // 701+706 moins 709 (RRR)
  const resultat = produits - charges;                        // résultat courant avant impôt
  // total actif net = soldes débiteurs des classes 2 à 5, nets des amortissements
  let actif = 0;
  for (const [c, v] of bal){
    if (/^(28|29|39|49)/.test(c)) actif += v.solde;           // amortissements : solde créditeur, donc négatif
    else if (/^[2345]/.test(c) && v.solde > 0) actif += v.solde;
  }
  const capitaux = -sumWhere(bal, /^(101|106|110)/) + resultat;
  return {
    ca:{ code:'ca', lib:'Chiffre d’affaires', val:ca, defaut:1 },
    pbt:{ code:'pbt', lib:'Résultat courant avant impôt', val:resultat, defaut:5 },
    equity:{ code:'equity', lib:'Capitaux propres', val:capitaux, defaut:3 },
    actif:{ code:'actif', lib:'Total de l’actif', val:actif, defaut:2 },
    charges:{ code:'charges', lib:'Total des charges', val:charges, defaut:1 },
  };
}
const BM25 = benchmarks(B25), BM24 = benchmarks(B24);

/** Arrondi prudent vers le bas au pas indiqué (pratique de place). */
function arrondiBas(cents, pas){ return Math.floor(cents / pas) * pas; }

/** Les trois seuils. Recalculés à chaque mouvement de curseur. */
function seuils(){
  const b = BM25[S.benchmark];
  const brut = Math.round(b.val * S.pctM / 100);
  const M  = arrondiBas(brut, 100000);            // au millier d'euros inférieur
  const PM = arrondiBas(Math.round(M * S.pctPM / 100), 100000);
  const CTT= arrondiBas(Math.round(M * S.pctCTT / 100), 10000); // à la centaine d'euros
  return { bench:b, brut, M, PM, CTT };
}

/* ═══ 6. SOCLE D'AFFICHAGE ═════════════════════════════════════════════════ */function table(cols, rows, opts){
  opts = opts || {};
  const th = cols.map(c => `<th class="${c.n ? 'n' : ''}">${esc(c.t)}</th>`).join('');
  const tb = rows.map(r => '<tr>' + cols.map(c => {
    const v = r[c.k];
    return `<td class="${c.n ? 'n' : ''} ${c.cls || ''} ${r._cls && r._cls[c.k] || ''}">${v === undefined || v === null ? '' : v}</td>`;
  }).join('') + '</tr>').join('');
  const tf = opts.foot ? '<tfoot><tr>' + cols.map(c => `<td class="${c.n ? 'n' : ''}">${opts.foot[c.k] === undefined ? '' : opts.foot[c.k]}</td>`).join('') + '</tr></tfoot>' : '';
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody>${tf}</table></div>`;
}

/* ═══ 7. MODULE 1 — IMPORT ET RAPPROCHEMENT ═══════════════════════════════ */const CHAMPS_FEC = ['JournalCode','JournalLib','EcritureNum','EcritureDate','CompteNum','CompteLib',
  'CompAuxNum','CompAuxLib','PieceRef','PieceDate','EcritureLib','Debit','Credit','EcritureLet',
  'DateLet','ValidDate','Montantdevise','Idevise'];

/** Contrôles de forme du fichier des écritures comptables.
 *  Chaque contrôle renvoie le nombre de lignes ou d'écritures en anomalie. */
function controlesFec(){
  const tot = { d:0, c:0 };
  let deuxColonnes = 0, horsExercice = 0, compteInvalide = 0, validAvant = 0, auxIncomplet = 0, pieceHors = 0;
  const parEcriture = new Map();
  for (const r of FEC){
    tot.d += r.Debit; tot.c += r.Credit;
    if ((r.Debit > 0 && r.Credit > 0) || (r.Debit === 0 && r.Credit === 0)) deuxColonnes++;
    if (r.EcritureDate < '2025-01-01' || r.EcritureDate > '2025-12-31') horsExercice++;
    if (!/^\d{3,}$/.test(r.CompteNum)) compteInvalide++;
    if (r.ValidDate && r.ValidDate < r.EcritureDate) validAvant++;
    if ((r.CompAuxNum === '') !== (r.CompAuxLib === '')) auxIncomplet++;
    if (r.PieceDate && (r.PieceDate < '2025-01-01' || r.PieceDate > '2025-12-31')) pieceHors++;
    const e = parEcriture.get(r.EcritureNum) || { d:0, c:0 };
    e.d += r.Debit; e.c += r.Credit; parEcriture.set(r.EcritureNum, e);
  }
  let ecrituresDesequilibrees = 0;
  for (const [, v] of parEcriture) if (v.d !== v.c) ecrituresDesequilibrees++;
  const champsManquants = CHAMPS_FEC.filter(f => FEC.some(r => r[f] === undefined));
  return { tot, deuxColonnes, horsExercice, compteInvalide, validAvant, auxIncomplet, pieceHors,
           ecrituresDesequilibrees, nbEcritures:parEcriture.size, champsManquants };
}

/** Rapprochement balance client ↔ grand livre, compte par compte. */
function rapprochement(){
  const gl = new Map(GL_BAL.map(r => [r.compte, r]));
  const comptes = [...new Set([...TB_2025.map(r => r[0]), ...GL_BAL.map(r => r.compte)])].sort();
  return comptes.map(c => {
    const t = B25.get(c), g = gl.get(c);
    const sTB = t ? t.solde : 0, sGL = g ? g.debit - g.credit : 0;
    return { compte:c, lib:(t ? t.lib : g.lib), sTB, sGL, ecart:sTB - sGL,
             presentTB:!!t, presentGL:!!g };
  });
}
function arSeuilMontant(){ return S.arMontant === null ? seuils().PM : S.arMontant; }

function revueAnalytique(){
  const comptes = [...new Set([...TB_2025.map(r => r[0]), ...TB_2024.map(r => r[0])])].sort();
  return comptes.map(c => {
    const n = B25.get(c) ? B25.get(c).solde : 0;
    const n1 = B24.get(c) ? B24.get(c).solde : 0;
    const lib = (B25.get(c) || B24.get(c)).lib;
    const d = n - n1;
    const p = n1 === 0 ? (n === 0 ? 0 : null) : d / Math.abs(n1);   // null = pas de base N-1
    const parMontant = Math.abs(d) >= arSeuilMontant();
    const parPct = p !== null && Math.abs(p) >= S.arPct / 100;
    return { compte:c, lib, n, n1, d, p, parMontant, parPct, flag:parMontant || parPct };
  });
}
/** Sens naturel d'un compte : -1 s'il est normalement créditeur (produits,
 *  capitaux, dettes). Sans cela, une hausse du chiffre d'affaires — qui rend le
 *  solde PLUS créditeur, donc plus négatif en convention signée — serait
 *  décrite comme une baisse. C'est le genre d'erreur qu'un associé voit en
 *  trois secondes et qui décrédibilise tout le reste. */
function sensNaturel(l){ return ((l.n1 || l.n) < 0) ? -1 : 1; }

/** Question composée automatiquement — assemblage déterministe, aucun texte de modèle. */
function questionVariation(l){
  const k = sensNaturel(l);
  const mouvement = l.d * k;                       // > 0 = augmentation, dans le sens du compte
  const sens = mouvement > 0 ? 'une augmentation' : 'une diminution';
  const nature = k < 0 ? 'solde créditeur' : 'solde débiteur';
  const pctTxt = l.p === null ? 'sans base comparative en N-1' : 'soit ' + pct(Math.abs(l.p), 1);
  const motif = l.parMontant && l.parPct ? 'seuil en montant et seuil en pourcentage'
              : l.parMontant ? 'seuil en montant' : 'seuil en pourcentage';
  return `Le compte ${l.compte} « ${l.lib} » (${nature}) présente ${sens} de ${eur(Math.abs(l.d))} entre le `
       + `31/12/2024 (${eur(Math.abs(l.n1))}) et le 31/12/2025 (${eur(Math.abs(l.n))}), ${pctTxt}. Cette variation `
       + `dépasse le ${motif} retenu pour la revue analytique (${eur(arSeuilMontant())} / ${S.arPct}${NBSP}%). `
       + `Merci d’en indiquer l’explication et de préciser les éléments justificatifs disponibles.`;
}

/** Montant que porte la pièce justificative, pour l'écriture donnée.
 *  Règle déterministe et vérifiable : une pièce sur dix-sept environ porte un
 *  écart avec la comptabilité. Le germe vient de la référence de pièce, donc
 *  la même écriture donne toujours le même écart. */
function montantSurPiece(entry, comptabilise){
  const h = seedOf(entry.pieceRef);
  if (h % 17 !== 0) return comptabilise;
  const delta = 50000 + (h % 250000);          // entre 500 € et 3 000 €
  return comptabilise - delta;
}
/** Nature des documents obtenus, déterminée par la pièce elle-même. */
function docsAttendus(entry){
  const h = seedOf(entry.pieceRef) % 3;
  const base = entry.journal === 'VE' ? 'facture de vente'
             : entry.journal === 'AC' ? 'facture fournisseur'
             : entry.journal === 'BQ' ? 'relevé bancaire'
             : entry.journal === 'PA' ? 'journal de paie'
             : 'pièce justificative';
  if (h === 0) return [base, 'bon de livraison'];
  if (h === 1) return [base];
  return [base, 'contrat ou conditions tarifaires'];
}
function usageDuDoc(docs){
  if (docs.some(d => /livraison/.test(d))) return 'Quantité livrée rapprochée de la quantité facturée et de l’écriture';
  if (docs.some(d => /contrat|tarifaires/.test(d))) return 'Conditions tarifaires rapprochées du contrat, puis du montant comptabilisé';
  return 'Montant, date et tiers rapprochés de l’écriture comptable';
}

/** Papiers de travail de la section : une ligne par élément sélectionné.
 *  La colonne « montant relevé » ne devient saisissable qu'une fois la pièce
 *  déposée par le client — c'est le contrat de preuve rendu visible. */
function wpDe(p){
  const st = sec(p.code), ech = echantillonPoste(p);
  const voulu = [...ech.exhaustif, ...ech.alea];
  const anc = new Map((st.wp || []).map(r => [r.num, r]));
  st.wp = voulu.map(x => {
    const garde = anc.get(x.e.num);
    return garde || {
      num:x.e.num, piece:x.e.pieceRef, tiers:x.e.lines.map(l => l.auxLib).find(Boolean) || '—',
      date:x.e.date, compta:x.montant, motif:x.montant >= seuils().PM ? 'couverture exhaustive' : 'tirage aléatoire',
      recu:false, docs:[], releve:null, expl:'',
    };
  });
  // le motif de sélection dépend du seuil : il doit suivre le curseur
  for (const r of st.wp){ const x = voulu.find(v => v.e.num === r.num);
    if (x) r.motif = x.montant >= seuils().PM ? 'couverture exhaustive' : 'tirage aléatoire'; }
  return st.wp;
}
function ecartsWp(p){
  return wpDe(p).filter(r => r.recu && r.releve !== null && r.releve !== r.compta)
                .map(r => ({ ...r, ecart:r.compta - r.releve }));
}

function blocComptes(p){

    return { c, lib:B25.get(c).lib, n, n1, d, pr, propose, retenu,
             rCTT:Math.abs(n) / s.CTT, rPM:Math.abs(n) / s.PM };
  });
  const tot = rows.reduce((a, r) => a + r.n, 0), totN1 = rows.reduce((a, r) => a + r.n1, 0);
  const nsRows = rows.filter(r => r.retenu === 'ns');

    c:`<span class="mono">${r.c}</span>`, lib:esc(r.lib),

    st:`<select class="cell txt" data-ns="${r.c}" style="width:140px">
          <option value="auto" ${!st.ns[r.c] ? 'selected' : ''}>proposé : ${r.propose === 'ns' ? 'non significatif' : 'significatif'}</option>
          <option value="sig" ${st.ns[r.c] === 'sig' ? 'selected' : ''}>significatif (surchargé)</option>
          <option value="ns"  ${st.ns[r.c] === 'ns'  ? 'selected' : ''}>non significatif (surchargé)</option>
        </select>` +
        (st.ns[r.c] ? `<input class="cell txt" data-nsm="${r.c}" placeholder="motif obligatoire" value="${esc(st.nsMotif[r.c] || '')}" style="margin-top:3px">` : ''),
    nt:boutonNote(p.code, 'compte', r.c, 'Compte ' + r.c + ' — ' + r.lib),
  }));
  const sansMotif = rows.filter(r => st.ns[r.c] && !(st.nsMotif[r.c] || '').trim());
  return `

             {k:'n',t:'31/12/2025',n:1},{k:'d',t:'Variation',n:1},{k:'pr',t:'%',n:1},
             {k:'ctt',t:'/ seuil de remontée',n:1},{k:'pm',t:'/ seuil de planification',n:1},
             {k:'st',t:'Statut'},{k:'nt',t:''}], body,
            { foot:{ c:'Total', n1:eur(totN1), n:eur(tot), d:eur(tot - totN1) } })}
    <p class="note">Soldes signés : débit positif, crédit négatif — c’est la convention de la balance, elle est
    conservée ici pour que les totaux se vérifient. La revue analytique ci-dessous, elle, parle dans le
    <b>sens du compte</b> : une hausse du chiffre d’affaires y est une augmentation.</p>
    <div class="callout info"><b>Deux indicateurs, deux usages.</b>
      La colonne « / seuil de remontée » (${eur0(s.CTT)}) trie <b>à l’intérieur</b> de la section : elle dit quels
      comptes méritent un travail. La colonne « / seuil de planification » (${eur0(s.PM)}) mesure un <b>poids de
      périmètre</b> : c’est elle qui a fait entrer le poste dans le champ des travaux. Un compte peut être

    ${nsRows.length ? `<p class="note">${nsRows.length} compte(s) porté(s) « non significatif » — total ${eur(nsRows.reduce((a, r) => a + r.n, 0))}. Ils restent affichés : rien n’est masqué.</p>` : ''}

            <td>${esc(ASSERTIONS.find(a => a.code === pr.a).lib)}</td>
            <td><span class="pill">${NIV_LIB[pr.min]}</span></td>
            <td>${boutonNote(p.code, 'procedure', pr.code, 'Procédure ' + pr.code)}</td></tr>`).join('')}</tbody>
        </table></div>` : '<p class="note">Aucune procédure requise à ce niveau de risque.</p>'}
        <p class="note">Cette liste n’est pas fixe : elle est <b>déduite</b> des niveaux retenus ci-dessus.
        Cochez un facteur déclaré, ou forcez un niveau, et la liste change sous vos yeux.</p>
      </div>
      <div>
        <h3>Taille d’échantillon</h3>
        <div class="tw"><table>
          <thead><tr><th>Risque le plus élevé du poste</th><th class="n">Éléments tirés</th></tr></thead>
          <tbody>${NIVEAUX.map(n => `<tr${n === nMax ? ' style="font-weight:600"' : ''}>
            <td>${NIV_LIB[n]}${n === nMax ? ' &nbsp;← retenu' : ''}</td><td class="n">${TAILLE[n]}</td></tr>`).join('')}</tbody>
        </table></div>
        <div class="callout">La table est <b>affichée</b>, pas cachée dans une formule : le tirage aléatoire porte sur
        ${TAILLE[nMax]} éléments, <b>en plus</b> de la couverture exhaustive de tout élément supérieur au seuil de
        planification (${eur0(seuils().PM)}). Deux leviers indépendants : le risque commande le nombre, la matérialité
        commande la strate exhaustive.</div>
      </div>
    </div>`;
}

/* ─────────────────────────────────────────────────────────────────────────
   3. SÉLECTIONS ET PARAMÈTRES
   ───────────────────────────────────────────────────────────────────────── */
function blocSelection(p){
  const st = sec(p.code), e = echantillonPoste(p), s = seuils();
  const rows = [...e.exhaustif.map(x => ({ x, m:'couverture exhaustive' })),
                ...e.alea.map(x => ({ x, m:'tirage aléatoire' }))].map(({ x, m }) => ({
    num:`<span class="mono">${x.e.num}</span>`, date:`<span class="mono">${frDate(x.e.date)}</span>`,
    piece:`<span class="mono">${esc(x.e.pieceRef)}</span>`,
    tiers:esc(x.e.lines.map(l => l.auxLib).find(Boolean) || '—'),
    montant:eur(x.montant),
    m:`<span class="pill ${m === 'couverture exhaustive' ? 'acc' : ''}">${m}</span>`,
    nt:boutonNote(p.code, 'selection', x.e.num, 'Élément sélectionné ' + x.e.num),
  }));
  const dejaDemande = requetesDe(p.code).some(r => r.origine === 'selection');
  return `
    <div class="row">
      <div class="ctrl"><label>Méthode</label>
        <select id="sel-methode" disabled><option>strates : exhaustive au-dessus du seuil + tirage aléatoire</option></select></div>
      <div class="ctrl"><label>Germe du tirage</label>
        <input type="text" id="sel-seed" value="${esc(st.seed)}"></div>
      <div class="ctrl"><label>&nbsp;</label>
        <button class="btn sec" id="sel-rejouer">rejouer à l’identique</button></div>
      <div class="ctrl"><label>&nbsp;</label>
        <button class="btn sec" id="sel-nouveau">nouveau germe</button></div>
      <div class="ctrl"><label>&nbsp;</label>
        <button class="btn" id="sel-requete" ${dejaDemande ? 'disabled' : ''}>créer la requête de justificatifs</button></div>
    </div>
    <div class="grid3">
      <div class="kv"><span class="k">Population</span><span class="v">${e.pop.length} écritures</span>
        <span class="k">Masse</span><span class="v">${eur(e.total)}</span></div>
      <div class="kv"><span class="k">Strate exhaustive (≥ ${eur0(s.PM)})</span><span class="v">${e.exhaustif.length}</span>
        <span class="k">Tirage aléatoire</span><span class="v">${e.alea.length} / ${e.n} demandés</span></div>
      <div class="kv"><span class="k">Montant couvert</span><span class="v">${eur(e.couvert)}</span>
        <span class="k">Couverture</span><span class="v">${pct(e.taux, 1)}</span></div>
    </div>
    ${table([{k:'num',t:'Écriture'},{k:'date',t:'Date'},{k:'piece',t:'Pièce'},{k:'tiers',t:'Tiers',cls:'wrapcell'},
             {k:'montant',t:'Montant',n:1},{k:'m',t:'Motif de sélection'},{k:'nt',t:''}], rows)}
    <p class="note">Le germe est écrit dans la feuille : un tiers qui le rejoue obtient exactement les mêmes
    ${rows.length} éléments. Changer le germe change le tirage — et se voit.</p>
    ${dejaDemande ? '<div class="callout ok">La requête de justificatifs de cette sélection a été émise : elle figure ci-dessous et dans le portail client.</div>' : ''}`;
}

/* ─────────────────────────────────────────────────────────────────────────
   4. REQUÊTES DE LA SECTION
   ───────────────────────────────────────────────────────────────────────── */
function blocRequetes(p){
  const rs = requetesDe(p.code);
  if (!rs.length) return `<p class="note">Aucune requête sur cette section. Elles naissent soit d’un enchaînement
    (une règle qui se déclenche dans la section), soit d’une saisie manuelle ci-dessous.</p>
    ${formNouvelleRequete(p)}`;
  const rows = rs.map(r => {
    const a = avancement(r.items), ret = retard(r);
    const c = S.contacts.find(x => x.id === r.contact);
    return {
      id:`<span class="mono">${r.id}</span>`, t:esc(r.titre),
      dest:c ? esc(c.nom) + '<div class="smallcaps">' + esc(c.fonction) + '</div>' : '—',
      ech:`<span class="mono">${frDate(r.echeance)}</span>` + (ret ? `<div class="smallcaps" style="color:var(--bad)">retard ${ancienneteRetard(r)} j ouvrés</div>` : ''),
      av:`<div class="bar" style="width:90px"><i style="width:${(a * 100).toFixed(0)}%"></i></div><span class="smallcaps">${pct(a, 0)}</span>`,
      st:r.items.map(i => `<span class="pill ${STATUTS[i.statut].cls}">${STATUTS[i.statut].lib}${i.statut === 'attente_revue' ? ' ' + esc(i.revoyeur || '') : ''}</span>`).join(' '),
      org:r.origine ? `<span class="tag">${esc(r.origine)}</span>` : '<span class="tag">saisie manuelle</span>',
      nt:boutonNote(p.code, 'requete', r.id, 'Requête ' + r.id) +
         ` <button class="btn mini sec" data-goreq="${r.id}">voir au portail</button>`,
    };
  });
  return `
    ${table([{k:'id',t:'N°'},{k:'t',t:'Objet',cls:'wrapcell'},{k:'dest',t:'Destinataire côté client',cls:'wrapcell'},
             {k:'ech',t:'Échéance'},{k:'av',t:'Avancement'},{k:'st',t:'États',cls:'wrapcell'},
             {k:'org',t:'Origine'},{k:'nt',t:''}], rows)}
    ${formNouvelleRequete(p)}`;
}
function formNouvelleRequete(p){
  return `<div class="row" style="margin-top:10px">
    <div class="ctrl" style="flex:1 1 320px"><label>Nouvelle requête (saisie manuelle)</label>
      <input type="text" id="req-titre" placeholder="ex. : détail du compte 706000 avec les contrats associés"></div>
    <div class="ctrl"><label>Échéance dans</label>
      <select id="req-delai"><option value="7">7 jours</option><option value="12" selected>12 jours</option><option value="20">20 jours</option></select></div>
    <div class="ctrl"><label>&nbsp;</label><button class="btn" id="req-add">créer</button></div>
  </div>`;
}

/* ─────────────────────────────────────────────────────────────────────────
   5. PAPIERS DE TRAVAIL
   ───────────────────────────────────────────────────────────────────────── */
function blocPapiers(p){
  const wp = wpDe(p), s = seuils();
  const recus = wp.filter(r => r.recu);
  const ec = ecartsWp(p);
  const ecartTotal = ec.reduce((a, r) => a + r.ecart, 0);
  const nonExpl = ec.filter(r => !r.expl.trim()).reduce((a, r) => a + r.ecart, 0);
  const rows = wp.map((r, i) => ({
    _anchor:'papier:' + r.num,
    num:`<span class="mono">${r.num}</span>`, piece:`<span class="mono">${esc(r.piece)}</span>`,
    tiers:esc(r.tiers), date:`<span class="mono">${frDate(r.date)}</span>`,
    compta:eur(r.compta),
    doc:r.recu ? r.docs.map(d => `<span class="tag">${esc(d)}</span>`).join(' ')
              : '<span class="pill bad">pièce non reçue</span>',
    usage:r.recu ? esc(usageDuDoc(r.docs)) : '<span class="smallcaps">le contrôle ne peut pas être exécuté sans la pièce</span>',
    releve:r.recu ? `<input class="cell" data-wp="${i}" data-f="releve" value="${r.releve === null ? '' : (r.releve / 100).toFixed(2).replace('.', ',')}">`
                  : '<span class="smallcaps">—</span>',
    ecart:r.recu && r.releve !== null && r.releve !== r.compta ? '<b>' + eur(r.compta - r.releve) + '</b>' : '—',
    expl:r.recu && r.releve !== null && r.releve !== r.compta
         ? `<input class="cell txt" data-wp="${i}" data-f="expl" placeholder="explication de l’écart" value="${esc(r.expl)}">` : '',
    nt:boutonNote(p.code, 'papier', r.num, 'Papier de travail — ligne ' + r.num),
  }));
  return `
    <div class="grid3" style="margin-bottom:8px">
      <div class="kv"><span class="k">Lignes à tester</span><span class="v">${wp.length}</span>
        <span class="k">Pièces reçues</span><span class="v">${recus.length} / ${wp.length}</span></div>
      <div class="kv"><span class="k">Écarts relevés</span><span class="v">${ec.length}</span>
        <span class="k">Écart total</span><span class="v">${eur(ecartTotal)}</span></div>
      <div class="kv"><span class="k">Seuil de remontée</span><span class="v">${eur0(s.CTT)}</span>
        <span class="k">Écart non expliqué</span><span class="v">${eur(nonExpl)}</span></div>
    </div>
    ${table([{k:'num',t:'Écriture'},{k:'piece',t:'Pièce'},{k:'tiers',t:'Tiers',cls:'wrapcell'},{k:'date',t:'Date'},
             {k:'compta',t:'Comptabilisé',n:1},{k:'doc',t:'Document obtenu',cls:'wrapcell'},
             {k:'usage',t:'Comment il a servi au contrôle',cls:'wrapcell'},
             {k:'releve',t:'Relevé sur la pièce',n:1},{k:'ecart',t:'Écart',n:1},
             {k:'expl',t:'Explication',cls:'wrapcell'},{k:'nt',t:''}], rows)}
    ${wp.length - recus.length > 0 ? `<div class="callout warn"><b>${wp.length - recus.length} pièce(s) manquante(s).</b>
      Les lignes correspondantes ne portent aucun contrôle : rien n’a été relevé, donc rien n’est conclu.
      Le prototype ne remplit pas une ligne sans pièce — c’est ce qui distingue une diligence d’un tableau rempli.</div>` : ''}
    ${nonExpl ? `<div class="callout bad">⚑ <b>Écart non expliqué : ${eur(nonExpl)}</b> — le drapeau reste levé tant
      qu’une explication n’est pas saisie en regard de chaque écart.</div>`
      : ec.length ? `<div class="callout ok">✓ Les ${ec.length} écart(s) relevé(s) portent une explication — total ${eur(ecartTotal)}.</div>` : ''}`;
}

/* ─────────────────────────────────────────────────────────────────────────
   6. CONCLUSION, VISA, REPRISE N-1
   ───────────────────────────────────────────────────────────────────────── */
function obstaclesVisa(p){
  const st = sec(p.code), o = [];
  const bl = notesBloquantesOuvertes(p.code);
  if (bl.length) o.push(`${bl.length} note(s) de revue bloquante(s) ouverte(s)`);
  const wp = wpDe(p), manquantes = wp.filter(r => !r.recu).length;
  if (manquantes) o.push(`${manquantes} pièce(s) justificative(s) non reçue(s)`);
  const nonExpl = ecartsWp(p).filter(r => !r.expl.trim());
  if (nonExpl.length) o.push(`${nonExpl.length} écart(s) sans explication`);
  const sansMotif = p.comptes.filter(c => st.ns[c] && !(st.nsMotif[c] || '').trim());
  if (sansMotif.length) o.push(`statut forcé sans motif sur ${sansMotif.join(', ')}`);
  const nivSansMotif = ASSERTIONS.filter(a => st.override[a.code] && !(st.overrideMotif[a.code] || '').trim());
  if (nivSansMotif.length) o.push(`niveau de risque forcé sans motif (${nivSansMotif.map(a => a.lib).join(', ')})`);
  if (!st.conclusion.trim()) o.push('conclusion de section non rédigée');
  const n1 = (PAPIERS_N1[p.code] || []).filter(x => !st.reprisN1Vues[x.id]);
  if (n1.length) o.push(`${n1.length} papier(s) N-1 non reconfirmé(s)`);
  return o;
}
function blocConclusion(p){
  const st = sec(p.code), o = obstaclesVisa(p), n1 = PAPIERS_N1[p.code] || [];
  const notesN1 = NOTES_N1.filter(n => n.section === p.code);
  return `
    <h3>Reprise de l’exercice précédent</h3>
    ${n1.length || notesN1.length ? `
      <div class="callout info"><b>Rien n’est repris automatiquement.</b> Les travaux N-1 sont affichés pour mémoire
      et marqués « à reconfirmer ». Tant qu’un papier N-1 n’a pas été explicitement reconfirmé ou écarté, la section
      ne peut pas être visée.</div>
      ${n1.map(x => `<div class="nl n1">
        <div class="m"><span class="mono">${x.id}</span> · exercice 2024
          ${st.reprisN1Vues[x.id] ? '<span class="pill ok">reconfirmé</span>' : '<span class="pill warn">à reconfirmer</span>'}</div>
        <div class="txt"><b>${esc(x.lib)}</b> — ${esc(x.concl)}</div>
        ${st.reprisN1Vues[x.id] ? `<div class="smallcaps">${esc(st.reprisN1Vues[x.id])}</div>`
          : `<button class="btn mini sec" data-n1="${x.id}">reconfirmer pour 2025</button>`}
      </div>`).join('')}
      ${notesN1.map(n => `<div class="nl ${TYPES_NOTE[n.type].cls}" style="opacity:.8">
        <div class="m"><span class="tag">note N-1</span> ${TYPES_NOTE[n.type].lib}</div>
        <div class="txt">${esc(n.texte)}</div></div>`).join('')}
    ` : '<p class="note">Aucun travail N-1 enregistré sur cette section.</p>'}

    <h3>Conclusion de section</h3>
    <textarea id="sec-concl" rows="3" placeholder="Conclusion de l’auditeur sur le poste, au regard des procédures exécutées et des écarts relevés.">${esc(st.conclusion)}</textarea>
    ${boutonNote(p.code, 'conclusion', 'concl', 'Conclusion de la section ' + p.lib)}

    <h3>Visa</h3>
    ${st.visa ? `<div class="callout ok"><b>Section visée</b> par ${esc(USERS[st.visa.par].nom)}
        (${ROLE_LIB[USERS[st.visa.par].role]}) le ${horo(st.visa.t)}.
        <button class="btn mini sec" id="sec-devisa">retirer le visa</button></div>`
      : o.length ? `<div class="callout bad"><b>Visa impossible — ${o.length} obstacle(s) :</b>
          <ul style="margin:5px 0 0 16px;padding:0">${o.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
          <div class="smallcaps" style="margin-top:5px">Le bouton n’est pas grisé pour la forme : il n’existe aucun chemin
          qui vise une section dans cet état.</div></div>
          <button class="btn" disabled>viser la section</button>`
      : `<div class="callout ok">Aucun obstacle. Le visa engage ${esc(USERS[S.moi].nom)} (${ROLE_LIB[USERS[S.moi].role]}).</div>
         <button class="btn" id="sec-visa">viser la section</button>`}`;
}

/* ─────────────────────────────────────────────────────────────────────────
   ASSEMBLAGE DE LA SECTION
   ───────────────────────────────────────────────────────────────────────── */
function vueFsli(code){
  const p = postesCalcules().find(x => x.code === code);
  if (!p) return '<p class="note">Poste inconnu.</p>';
  const s = seuils(), e = echantillonPoste(p), procs = proceduresRequises(p);
  const st = sec(p.code), o = obstaclesVisa(p);
  const bloc = (n, titre, why, html) => `<section class="blk" id="b${n}">
      <header><span class="num">${n}</span><h2>${esc(titre)}</h2><span class="why">${why}</span></header>
      <div class="body">${html}</div></section>`;
  return `
    <div class="hd">
      <h1>${esc(p.lib)}</h1>
      <span class="pill ${Math.abs(p.solde) >= s.PM ? 'acc' : ''}">${Math.abs(p.solde) >= s.PM ? 'dans le périmètre' : 'hors périmètre'}</span>
      <span class="pill ${NIVEAUX[niveauMax(p)] === 'eleve' ? 'bad' : NIVEAUX[niveauMax(p)] === 'moyen' ? 'warn' : 'ok'}">risque ${NIV_LIB[NIVEAUX[niveauMax(p)]]}</span>
      ${st.visa ? '<span class="pill ok">visée</span>' : `<span class="pill ${o.length ? 'bad' : 'warn'}">${o.length ? o.length + ' obstacle(s) au visa' : 'prête à viser'}</span>`}
      <span class="sub">solde ${eur(p.solde)} · ${p.comptes.length} compte(s) · ${e.pop.length} écriture(s)
        · ${procs.length} procédure(s) · ${e.exhaustif.length + e.alea.length} élément(s) sélectionné(s)</span>
    </div>
    ${bloc(1, 'Comptes de la section', 'triage interne et poids de périmètre', blocComptes(p))}
    ${bloc(2, 'Évaluation du risque par assertion', 'commande les procédures et l’échantillon', blocRisque(p))}
    ${bloc(3, 'Sélections et paramètres', 'rejouable au germe', blocSelection(p))}
    ${bloc(4, 'Requêtes de la section', 'lien direct avec le portail client', blocRequetes(p))}
    ${bloc(5, 'Papiers de travail', 'une ligne, une pièce, un écart', blocPapiers(p))}
    ${bloc(6, 'Notes de revue de la section', 'ancrées sur un objet', blocNotesSection(p.code))}
    ${bloc(7, 'Conclusion, visa et reprise N-1', 'bloqué tant qu’un obstacle subsiste', blocConclusion(p))}`;
}
/* ═══ 12. NOTES DE REVUE — INTERFACE ═══════════════════════════════════════
   Il n'existe aucun chemin pour créer une note flottante : le bouton porte
   toujours l'objet sur lequel la note se pose, et c'est cet objet qui est
   enregistré dans l'ancre.
   ═══════════════════════════════════════════════════════════════════════ */
function boutonNote(section, objet, ref, lib){
  const n = notesDe(section, objet, ref), ouvertes = n.filter(x => !x.clos);
  const bl = ouvertes.some(x => TYPES_NOTE[x.type].bloque);
  return `<button class="note-i ${ouvertes.length ? 'has' : ''}"
    data-note-cible="${esc(section)}|${esc(objet)}|${esc(String(ref))}|${esc(lib)}"
    title="${ouvertes.length ? ouvertes.length + ' note(s) ouverte(s)' : 'poser une note de revue sur cet objet'}"
    >${bl ? '⚑' : '✎'}${n.length ? ' ' + n.length : ''}</button>`;
}

function ligneNote(n, contexte){
  const t = TYPES_NOTE[n.type], u = USERS[n.auteur], pour = USERS[n.pour];
  const peut = peutClore(S.moi, n);
  const age = ancienneteNote(n);
  return `<div class="nl ${t.cls} ${n.clos ? 'clos' : ''}" data-note="${n.id}">
    <div class="m">
      <span class="tag ${t.bloque ? 'abs' : ''}">${esc(t.lib)}</span>
      <span class="mono">#${n.id}</span>
      <span>${esc(u.nom)} → ${esc(pour ? pour.nom : '—')}</span>
      <span>${horo(n.t)}</span>
      ${!n.clos ? `<span class="pill ${age >= 10 ? 'bad' : age >= 5 ? 'warn' : ''}">${age} j ouvrés</span>` : ''}
      ${n.recurrente ? '<span class="pill warn">récurrente — déjà relevée en N-1</span>' : ''}
      ${n.clos ? `<span class="pill ok">close par ${esc(USERS[n.clos.par].nom)} le ${horo(n.clos.t)}</span>` : ''}
      ${contexte ? `<button class="btn mini sec" data-goanc="${n.id}">${esc(n.ancre.lib)} ↗</button>`
                 : `<span class="smallcaps">sur : ${esc(n.ancre.lib)}</span>`}
    </div>
    <div class="txt">${esc(n.texte)}</div>
    ${n.reponses.map(r => `<div class="rep"><b>${esc(USERS[r.par].nom)}</b>
        <span class="smallcaps">${horo(r.t)}</span> — ${esc(r.texte)}</div>`).join('')}
    ${n.clos ? '' : `<div class="row" style="margin:6px 0 0">
      <div class="ctrl" style="flex:1 1 240px"><input type="text" class="cell txt" data-rep="${n.id}"
        placeholder="répondre en tant que ${esc(USERS[S.moi].nom)}" style="border-color:var(--line)"></div>
      <button class="btn mini sec" data-repok="${n.id}">répondre</button>
      ${peut ? `<button class="btn mini" data-clos="${n.id}">clore</button>`
             : `<span class="smallcaps">clôture réservée au réviseur${n.auteur === S.moi ? ' — et jamais à l’auteur de la note' : ''}</span>`}
    </div>`}
  </div>`;
}
/** Ancienneté d'une note, en jours ouvrés depuis sa création. */
function ancienneteNote(n){
  let d = n.t.slice(0, 10), k = 0;
  while (d < S.aujourdhui){ d = addDays(d, 1); if (!isWeekend(d) || S.portail.samediOuvre) k++; }
  return k;
}

function blocNotesSection(code){
  const list = S.notes.filter(n => n.ancre.section === code);
  const ouvertes = list.filter(n => !n.clos);
  const c = S.noteCible && S.noteCible.section === code ? S.noteCible : null;
  return `
    <div class="callout info">Les notes de revue sont <b>réservées aux humains</b> : aucun auteur automatique, aucune
    réponse suggérée. Chaque note est <b>ancrée</b> sur un objet — on ne peut pas en poser une « sur la section ».</div>
    ${c ? `<div class="callout" style="margin-top:8px">
      <b>Nouvelle note sur :</b> ${esc(c.lib)}
      <div class="row" style="margin:7px 0 0">
        <div class="ctrl"><label>Type</label><select id="nt-type">
          ${Object.entries(TYPES_NOTE).map(([k, v]) => `<option value="${k}">${esc(v.lib)}</option>`).join('')}</select></div>
        <div class="ctrl"><label>À l’attention de</label><select id="nt-pour">
          ${Object.entries(USERS).filter(([k]) => k !== S.moi).map(([k, u]) => `<option value="${k}">${esc(u.nom)} — ${esc(ROLE_LIB[u.role])}</option>`).join('')}</select></div>
        <div class="ctrl" style="flex:1 1 300px"><label>Note</label>
          <input type="text" id="nt-txt" placeholder="ce qui doit être corrigé, documenté ou expliqué"></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn" id="nt-add">poser la note</button></div>
        <div class="ctrl"><label>&nbsp;</label><button class="btn sec" id="nt-annul">annuler</button></div>
      </div></div>`
      : '<p class="note" style="margin-top:8px">Pour poser une note, utilisez le bouton ✎ en regard de l’objet concerné, dans n’importe quel bloc ci-dessus.</p>'}
    ${list.length ? `<div style="margin-top:8px">
        <div class="row"><span class="pill ${ouvertes.length ? 'warn' : 'ok'}">${ouvertes.length} ouverte(s)</span>
          <span class="pill">${list.length - ouvertes.length} close(s)</span>
          ${notesBloquantesOuvertes(code).length ? `<span class="pill bad">${notesBloquantesOuvertes(code).length} bloquante(s) — visa impossible</span>` : ''}</div>
        ${list.map(n => ligneNote(n, false)).join('')}</div>`
      : '<p class="note">Aucune note sur cette section.</p>'}`;
}

/* ── vue transverse : la vraie vue de travail d'un chef de mission ───────── */
function vueNotes(){
  const ouvertes = S.notes.filter(n => !n.clos);
  const parPersonne = {};
  for (const n of ouvertes){ (parPersonne[n.pour] = parPersonne[n.pour] || []).push(n); }
  const parType = {};
  for (const n of ouvertes){ (parType[n.type] = parType[n.type] || []).push(n); }
  const parSection = {};
  for (const n of ouvertes){ (parSection[n.ancre.section] = parSection[n.ancre.section] || []).push(n); }
  const libSection = c => (POSTES.find(p => p.code === c) || {}).lib || c;
  const tri = [...ouvertes].sort((a, b) => {
    const bl = (TYPES_NOTE[b.type].bloque ? 1 : 0) - (TYPES_NOTE[a.type].bloque ? 1 : 0);
    return bl || (ancienneteNote(b) - ancienneteNote(a));
  });
  return `
    <div class="hd"><h1>Notes de revue — vue transverse</h1>
      <span class="sub">toutes les notes ouvertes du dossier, par responsable, ancienneté, type et section</span></div>
    <section class="blk"><header><h2>Répartition</h2></header><div class="body">
      <div class="grid3">
        <div><h3>Par responsable</h3>${Object.keys(USERS).map(u => {
          const l = parPersonne[u] || [], b = l.filter(n => TYPES_NOTE[n.type].bloque).length;
          return `<div class="kv"><span class="k">${esc(USERS[u].nom)}</span>
            <span class="v">${l.length}${b ? ' · ' + b + ' bloquante(s)' : ''}</span></div>`; }).join('')}</div>
        <div><h3>Par type</h3>${Object.entries(TYPES_NOTE).map(([k, v]) =>
          `<div class="kv"><span class="k">${esc(v.lib)}</span><span class="v">${(parType[k] || []).length}</span></div>`).join('')}</div>
        <div><h3>Par section</h3>${Object.keys(parSection).length
          ? Object.entries(parSection).map(([c, l]) => `<div class="kv"><span class="k">${esc(libSection(c))}</span>
              <span class="v">${l.length}</span></div>`).join('')
          : '<p class="note">Aucune.</p>'}</div>
      </div>
      ${ouvertes.filter(n => n.recurrente).length ? `<div class="callout warn" style="margin-top:10px">
        <b>${ouvertes.filter(n => n.recurrente).length} note(s) récurrente(s)</b> — même section, même type qu’en N-1.
        Une récurrence n’est pas une anomalie de plus : c’est un signal sur la qualité du dossier, obtenu par simple
        rapprochement avec l’exercice précédent.</div>` : ''}
    </div></section>
    <section class="blk"><header><h2>Notes ouvertes — bloquantes d’abord, puis les plus anciennes</h2>
      <span class="why">${ouvertes.length} note(s)</span></header><div class="body">
      ${tri.length ? tri.map(n => ligneNote(n, true)).join('')
        : '<p class="note">Aucune note ouverte sur le dossier.</p>'}
    </div></section>
    <section class="blk"><header><h2>Clôture du dossier</h2></header><div class="body">
      ${notesBloquantesOuvertes().length
        ? `<div class="callout bad"><b>Clôture impossible.</b> ${notesBloquantesOuvertes().length} note(s) bloquante(s)
            restent ouvertes : ${notesBloquantesOuvertes().map(n => '#' + n.id + ' (' + esc(n.ancre.lib) + ')').join(', ')}.
            Une note ne se supprime jamais — elle se clôt, par le réviseur.</div>
           <button class="btn" disabled>clôturer le dossier</button>`
        : `<div class="callout ok">Aucune note bloquante ouverte.</div>
           <button class="btn" id="clore-dossier" ${S.dossierClos ? 'disabled' : ''}>${S.dossierClos ? 'dossier clôturé' : 'clôturer le dossier'}</button>`}
    </div></section>`;
}
/* ═══ 13. PORTAIL CLIENT ═══════════════════════════════════════════════════
   Un environnement distinct, pas un filtre d'affichage. Deux différences
   structurelles avec l'espace auditeur :
     · les seuils n'y sont jamais rendus — le client n'a pas à connaître la
       matérialité, et ce n'est pas une case à décocher : le bandeau de seuils
       n'est tout simplement pas construit dans cet espace ;
     · le statut interne « en attente de revue par X » est replié avant
       affichage par statutVisibleClient() — le client ne peut pas déduire
       l'avancement du dossier d'audit.
   ═══════════════════════════════════════════════════════════════════════ */

const CLI_PAR_PAGE = 15;
function carteRequeteClient(r){
  const tousDeposes = r.items.every(i => i.statut !== 'non_recu' && i.statut !== 'partiel');
  const ret = retard(r);
  // une sélection d'audit peut compter plus de cent éléments : on en affiche une
  // page à la fois. Rien n'est masqué — le compte total est écrit, et le reste
  // s'ouvre d'un bouton.
  const tout = S.cliTout && S.cliTout[r.id];
  const restants = r.items.filter(i => i.statut === 'non_recu' || i.statut === 'partiel');
  const vus = tout ? r.items : (restants.length > CLI_PAR_PAGE ? restants.slice(0, CLI_PAR_PAGE)
                                                               : r.items.slice(0, Math.max(CLI_PAR_PAGE, restants.length)));
  return `<section class="blk">
    <header><span class="num">${r.id}</span><h2>${esc(r.titre)}</h2>
      <span class="why">à fournir avant le ${frDate(r.echeance)}${ret ? ' — en retard de ' + ancienneteRetard(r) + ' jours ouvrés' : ''}</span></header>
    <div class="body">
      ${r.items.length > vus.length ? `<div class="callout"><b>${r.items.length} documents demandés</b> —
        ${r.items.length - restants.length} déjà déposé(s), ${restants.length} restant(s).
        Les ${vus.length} premiers restants sont affichés.
        <button class="btn mini sec" data-clitout="${r.id}">afficher les ${r.items.length} éléments</button></div>` : ''}
      ${vus.map(i => {
        const v = statutVisibleClient(i);
        return `<div class="cli-item">
          <div class="g"><b>${esc(i.desc)}</b>
            ${i.depots.length ? `<div class="dep">Déposé : ${i.depots.map(d => `<span class="f">${esc(d.nom)}</span>`).join('')}
              <div>Accusé de réception — ${i.depots.map(d => horo(d.t)).join(', ')}</div></div>` : ''}
          </div>
          <div class="a">
            <span class="pill ${STATUTS[v].cls}">${STATUTS[v].lib}</span>
            <button class="btn mini sec" data-depot="${r.id}|${i.id}">déposer un document</button>
          </div>
        </div>`;
      }).join('')}
      ${tout && r.items.length > CLI_PAR_PAGE ? `<button class="btn mini sec" data-clitout="${r.id}" style="margin-top:8px">replier la liste</button>` : ''}
      <div class="row" style="margin:10px 0 0">
        ${r.clotureClient
          ? '<span class="pill ok">vous avez signalé que tout est déposé</span>'
          : `<button class="btn" data-clot="${r.id}" ${tousDeposes ? '' : 'disabled'}>tout est déposé</button>
             ${tousDeposes ? '' : '<span class="smallcaps">le bouton s’active quand chaque élément a reçu au moins un document</span>'}`}
      </div>
      <div class="msg">
        <h3>Échanges sur cette demande</h3>
        ${r.messages.length ? r.messages.map(m => `<div class="m ${m.cote}">
            <span class="w">${esc(m.par)} · ${horo(m.t)}</span>${esc(m.texte)}</div>`).join('')
          : '<p class="note">Aucun message. Ce fil est distinct des notes de revue internes à l’équipe d’audit : vous ne voyez jamais celles-ci.</p>'}
        <div class="row" style="margin:8px 0 0">
          <div class="ctrl" style="flex:1 1 300px"><input type="text" data-msg="${r.id}" placeholder="écrire à l’équipe d’audit"></div>
          <button class="btn sec" data-msgok="${r.id}">envoyer</button>
        </div>
      </div>
    </div></section>`;
}
