:root{
  /* ── surfaces et encres ── */
  --bg:#F4F6F3;        /* papier comptable très légèrement verdi */
  --panel:#FFFFFF;
  --panel-2:#FAFBF9;
  --ink:#14171A;
  --ink-2:#4A534E;
  --ink-3:#79837D;
  --line:#DFE4DE;
  /* ── accent unique, identique dans les trois espaces ── */
  --accent:#1F4D3D;
  --accent-soft:#EAEFEB;
  /* ── sémantique, réservée aux problèmes ── */
  --anomalie:#9B2C2C;
  --anomalie-soft:#F7ECEB;
  --attention:#8A5A00;
  --attention-soft:#F8F2E6;
  /* ── typographie ── */
  --sans:OttoSans,"Public Sans","Helvetica Neue",Arial,sans-serif;
  --mono:OttoMono,"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --t1:11px; --t2:12px; --t3:13px; --t4:15px; --t5:19px;   /* cinq tailles, pas six */
  /* ── géométrie ── */
  --r:3px; --rond:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
  /* Hauteur du bandeau collant. C'est un espacement du système au même titre
     que les six autres — simplement MESURÉ au rendu plutôt que choisi. Il
     était écrit « var(--sTop) » sur cinq sites : autant de littéraux
     hors échelle, et cinq endroits à corriger si la valeur de repli change.
     Un seul jeton, déclaré ici. */
  --sTop:180px;
  --ombre:0 1px 2px rgba(20,23,26,.06);
}
html[data-theme="dark"]{
  --bg:#121614; --panel:#191E1B; --panel-2:#1D2320;
  --ink:#E8EDE9; --ink-2:#A9B3AD; --ink-3:#78827C; --line:#2A322D;
  --accent:#6FBF9C; --accent-soft:#1B2621;
  --anomalie:#E38A85; --anomalie-soft:#2A1A19;
  --attention:#D6A44A; --attention-soft:#2A2214;
  --ombre:0 1px 2px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){
  html:not([data-theme="light"]){
    --bg:#121614; --panel:#191E1B; --panel-2:#1D2320;
    --ink:#E8EDE9; --ink-2:#A9B3AD; --ink-3:#78827C; --line:#2A322D;
    --accent:#6FBF9C; --accent-soft:#1B2621;
    --anomalie:#E38A85; --anomalie-soft:#2A1A19;
    --attention:#D6A44A; --attention-soft:#2A2214;
    --ombre:0 1px 2px rgba(0,0,0,.3);
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:var(--t3)/1.45 var(--sans);
     -webkit-text-size-adjust:100%;overflow-x:hidden;font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.006em}
h1{font-size:var(--t5)}
h2{font-size:var(--t4)}
h3{font-size:var(--t1);color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
   font-weight:700;margin:var(--s4) 0 var(--s2)}
h3:first-child{margin-top:0}
a{color:var(--accent);text-underline-offset:2px}
button,select,input,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:var(--t2)}

/* ══ chrome supérieur ══════════════════════════════════════════════════════ */
.top{position:sticky;top:0;z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;padding:var(--s2) calc(var(--s6) * 3) var(--s1) var(--s4)}
.brand b{font-size:var(--t3)}
.brand .esp{font:700 var(--t1)/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;
            color:var(--accent);border-left:2px solid var(--accent);padding-left:var(--s2)}
.brand span{color:var(--ink-3);font-size:var(--t2)}
.spaces{display:flex;gap:var(--s1);padding:0 var(--s3) var(--s2);overflow-x:auto;
        scrollbar-width:thin;align-items:center;border-top:1px solid var(--line)}
.spaces .qui{flex:0 0 auto;margin-left:auto;padding-left:var(--s2)}
.spaces button{flex:0 0 auto;background:transparent;border:1px solid transparent;border-radius:var(--r);
               padding:var(--s1) var(--s3);font-size:var(--t2);color:var(--ink-3);cursor:pointer;min-height:30px}
.spaces button.on{color:var(--ink);border-color:var(--line);background:var(--panel-2);font-weight:700}
.themebtn{position:absolute;top:var(--s2);right:var(--s3);z-index:2;background:var(--panel-2);
          border:1px solid var(--line);border-radius:var(--r);padding:var(--s1) var(--s2);
          font-size:var(--t2);cursor:pointer;color:var(--ink-2);min-height:28px;min-width:64px}

/* ══ pastilles : neutres par défaut, colorées SEULEMENT sur un problème ════ */
.pill{display:inline-block;padding:1px var(--s2);border-radius:var(--rond);font-size:var(--t1);
      border:1px solid var(--line);background:transparent;color:var(--ink-2);white-space:nowrap}
.pill.bad{border-color:var(--anomalie);color:var(--anomalie);background:var(--anomalie-soft)}
.pill.warn{border-color:var(--attention);color:var(--attention);background:var(--attention-soft)}
/* aucune classe « ok » : l'état normal ne porte pas de couleur */

/* ══ seuils — espace auditeur uniquement ═════════════════════════════════ */
.seuils{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--s2);
        padding:var(--s1) var(--s4) var(--s2)}
.ctrl{display:flex;flex-direction:column;gap:var(--s1);min-width:0}
.ctrl label{font-size:var(--t1);color:var(--ink-3)}
.ctrl select,.ctrl input[type=number],.ctrl input[type=text],.ctrl input[type=email]{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--s1) var(--s2);font-size:var(--t2);min-width:0;width:100%}
.ctrl input[type=range]{accent-color:var(--accent);width:100%}
.seuilbox{display:flex;gap:var(--s2);flex-wrap:wrap;padding:0 var(--s4) var(--s2)}
.seuilbox .s{flex:1 1 130px;border-left:2px solid var(--line);padding:0 0 0 var(--s2)}
.seuilbox .s .k{font-size:var(--t1);color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em}
.seuilbox .s .v{font:700 var(--t4)/1.2 var(--mono);margin-top:1px}
.seuilbox .s .d{font-size:var(--t1);color:var(--ink-3)}
.impact{display:flex;gap:var(--s3);overflow-x:auto;padding:0 var(--s4) var(--s2);scrollbar-width:thin;
        border-top:1px solid var(--line);padding-top:var(--s2)}
.impact .c{flex:0 0 auto;min-width:0}
.impact .c .k{font-size:var(--t1);color:var(--ink-3);white-space:nowrap}
.impact .c .k .sm{display:none}
.impact .c .v{font:700 var(--t2)/1.3 var(--mono);white-space:nowrap}
.impact .c.flash .v{color:var(--accent)}

/* ══ bandeau réduit ═══════════════════════════════════════════════════════
   Un bandeau collant de 294 px mange 35 % d'un écran de téléphone AVANT tout
   contenu : on lit alors une fenêtre étroite qui glisse sur un long document.
   Dès le premier défilement vers le bas il se réduit à l'essentiel — identité,
   état, obstacles — et il se rétablit dès qu'on remonte. Les curseurs de seuil
   ne servent qu'au moment où l'on règle : ils n'ont pas à occuper le tiers de
   l'écran pendant qu'on lit. */
html[data-bandeau="reduit"] .brand{padding-top:var(--s1);padding-bottom:0}
html[data-bandeau="reduit"] .brand span,
html[data-bandeau="reduit"] .brand .pill,
html[data-bandeau="reduit"] .spaces,
html[data-bandeau="reduit"] .seuils,
html[data-bandeau="reduit"] .seuilbox{display:none}
html[data-bandeau="reduit"] .impact{padding-top:var(--s1);padding-bottom:var(--s1);border-top:none}
html[data-bandeau="reduit"] .impact .c:not([data-cle]){display:none}
html[data-bandeau="reduit"] .impact .c .k{display:none}
html[data-bandeau="reduit"] .impact .c .v::before{content:attr(data-k) '\00a0';
  font:var(--t1)/1.3 var(--sans);color:var(--ink-3);font-weight:400}
html[data-bandeau="reduit"] .themebtn{top:2px;min-height:24px;padding:0 var(--s2)}

/* ══ coquille ═════════════════════════════════════════════════════════════ */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);max-width:1680px;margin:0 auto}
.rail{border-right:1px solid var(--line);padding:var(--s3) var(--s2) var(--s5);position:sticky;
      top:var(--sTop);align-self:start;max-height:calc(100vh - var(--sTop));
      overflow-y:auto;scrollbar-width:thin}
.rail .grp{font-size:var(--t1);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
           padding:var(--s3) var(--s2) var(--s1);font-weight:700}
.rail a{display:flex;gap:var(--s2);align-items:center;justify-content:space-between;
        padding:var(--s1) var(--s2);border-radius:var(--r);font-size:var(--t2);color:var(--ink-2);
        text-decoration:none;cursor:pointer;min-height:30px}
.rail a:hover{background:var(--panel-2)}
.rail a.on{background:var(--panel);color:var(--ink);font-weight:700;box-shadow:inset 2px 0 0 var(--accent)}
.rail a .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail a .b{flex:0 0 auto;font:700 var(--t1)/1 var(--mono);color:var(--ink-3)}
.rail a .b.bad{color:var(--anomalie)}
.rail a .b.warn{color:var(--attention)}
.railm{display:none;padding:var(--s2) var(--s3) 0}
main{padding:var(--s4);min-width:0;scroll-margin-top:var(--sTop)}
/* La barre est collante : sans cette marge de défilement, `scrollIntoView`
   amenait le haut du contenu SOUS la barre — au téléphone, les 294 premiers
   pixels de chaque vue étaient invisibles à l'arrivée. */
.blk,.destnav{scroll-margin-top:calc(var(--sTop) + var(--s2))}

/* ══ blocs ════════════════════════════════════════════════════════════════ */
.hd{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;margin-bottom:var(--s1)}
.hd .sub{color:var(--ink-3);font-size:var(--t2)}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
     margin-top:var(--s3);overflow:hidden;scroll-margin-top:calc(var(--sTop) + var(--s3))}
.blk > header{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);
              display:flex;gap:var(--s2);align-items:baseline;flex-wrap:wrap}
.blk > header .num{font:700 var(--t1)/1 var(--mono);color:var(--ink-3)}
/* signature : la référence du papier, en chasse fixe, coin supérieur droit,
   sous le filet — la convention que tout associé reconnaît. */
.blk > header .why{margin-left:auto;font:400 var(--t1)/1 var(--mono);color:var(--ink-3);
                   text-transform:uppercase;letter-spacing:.06em}
.blk .body{padding:var(--s3)}
blockquote.idea{margin:0 0 var(--s3);padding:var(--s2) var(--s3);border-left:2px solid var(--line);
                font-size:var(--t2);color:var(--ink-2)}
blockquote.idea .src{display:block;margin-top:var(--s1);font-size:var(--t1);color:var(--ink-3)}
p.note{margin:var(--s2) 0 0;font-size:var(--t2);color:var(--ink-3)}
.row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:flex-end;margin-bottom:var(--s2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--s3)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:var(--s3)}

/* ══ tableaux ═════════════════════════════════════════════════════════════ */
.tw{overflow-x:auto;max-height:62vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:var(--t2)}
th,td{padding:var(--s1) var(--s2);text-align:left;border-bottom:1px solid var(--line);
      white-space:nowrap;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);font-size:var(--t1);color:var(--ink-3);
   text-transform:uppercase;letter-spacing:.06em;font-weight:700;z-index:1;
   box-shadow:inset 0 -1px 0 var(--line)}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel-2)}
td.n,th.n{text-align:right;font-family:var(--mono)}
td.mono{font-family:var(--mono);font-size:var(--t1)}
tfoot td{font-weight:700;border-top:1px solid var(--line)}
.wrapcell{white-space:normal;min-width:200px;max-width:440px}

/* ══ commandes ════════════════════════════════════════════════════════════ */
button.btn{background:var(--accent);color:var(--panel);border:1px solid var(--accent);
           border-radius:var(--r);padding:var(--s1) var(--s3);font-size:var(--t2);
           cursor:pointer;min-height:30px}
button.btn.sec{background:var(--panel);color:var(--ink);border-color:var(--line)}
button.btn.mini{padding:2px var(--s2);font-size:var(--t1);min-height:24px}
button.btn:disabled{opacity:.4;cursor:not-allowed}
select:disabled,input:disabled,textarea:disabled,option{color:var(--ink-3);
  -webkit-text-fill-color:var(--ink-3);opacity:1;background:var(--panel)}
select:not(:disabled) option{color:var(--ink);-webkit-text-fill-color:var(--ink)}
button.btn:active:not(:disabled){transform:translateY(1px)}
.chk{display:inline-flex;gap:var(--s1);align-items:center;background:var(--panel);
     border:1px solid var(--line);border-radius:var(--r);padding:var(--s1) var(--s2);
     font-size:var(--t2);cursor:pointer;min-height:28px}
.chk input{accent-color:var(--accent);margin:0}
.chk .cnt{font-family:var(--mono);color:var(--ink-3);font-size:var(--t1)}
.chk.venu{border-left:2px solid var(--attention)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px var(--s3);font-size:var(--t2)}
.kv .k{color:var(--ink-3)}
.kv .v{font-family:var(--mono)}
.callout{border-left:2px solid var(--line);padding:var(--s2) var(--s3);font-size:var(--t2);
         margin-top:var(--s2);color:var(--ink-2)}
.callout.bad{border-left-color:var(--anomalie);background:var(--anomalie-soft);color:var(--ink)}
.callout.warn{border-left-color:var(--attention);background:var(--attention-soft);color:var(--ink)}
.bar{height:var(--s1);background:var(--line);border-radius:var(--rond);overflow:hidden;min-width:60px}
.bar > i{display:block;height:100%;background:var(--ink-3)}
textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
         padding:var(--s2);font:var(--t2)/1.5 var(--sans);color:var(--ink)}
input.cell{width:100%;background:transparent;border:1px solid transparent;border-radius:var(--r);
           padding:2px var(--s1);font:var(--t2) var(--mono);text-align:right;min-height:24px;color:var(--ink)}
input.cell:focus{border-color:var(--accent);background:var(--panel);outline:none}
input.cell.txt{text-align:left;font-family:var(--sans)}
/* Un select portant .cell ne recevait aucune règle : le navigateur lui donnait
   son fond blanc par défaut, illisible en thème sombre. Les contrôles de
   formulaire ne suivent pas les jetons sans qu'on le leur dise. */
select.cell{width:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:var(--r);padding:2px var(--s1);font:var(--t2) var(--mono);min-height:24px}
select.cell.txt{font-family:var(--sans)}
select.cell:focus{border-color:var(--accent);outline:none}
.smallcaps{font-size:var(--t1);color:var(--ink-3)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);
            padding:var(--s1) var(--s3);font-size:var(--t1);cursor:pointer;color:var(--ink-3);min-height:28px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--panel-2);color:var(--ink);font-weight:700}
/* étiquettes : neutres. Seule « abs » signale une absence, donc un problème. */
.tag{display:inline-block;font:700 var(--t1)/1 var(--mono);padding:2px var(--s1);
     color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.tag.det,.tag.mod{color:var(--ink-3)}
.tag.abs{color:var(--attention)}

/* ══ MARQUES DE POINTAGE — la convention du papier de travail ═════════════ */
.mk{font:700 var(--t1)/1 var(--mono);color:var(--ink-2);border-bottom:1px dotted var(--ink-3);
    padding-bottom:1px;cursor:help}
.mk.x{color:var(--anomalie);border-bottom-color:var(--anomalie)}
.mk.n{color:var(--attention);border-bottom-color:var(--attention)}
.legende{display:flex;gap:var(--s4);flex-wrap:wrap;margin-top:var(--s2);
         padding-top:var(--s2);border-top:1px solid var(--line);font-size:var(--t1);color:var(--ink-3)}
.legende span b{font-family:var(--mono);color:var(--ink-2)}

/* ══ notes de revue ═══════════════════════════════════════════════════════ */
.note-i{display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;cursor:pointer;
        color:var(--ink-3);font:var(--t1) var(--mono);padding:2px var(--s1);border-radius:var(--r);min-height:22px}
.note-i:hover{color:var(--accent)}
.note-i.has{color:var(--anomalie);font-weight:700}
.nl{border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);
    margin-top:var(--s2);background:var(--panel)}
.nl.bloq{border-left:2px solid var(--anomalie)}
.nl.doc{border-left:2px solid var(--attention)}
.nl.q{border-left:2px solid var(--line)}
.nl.n1{border-left:2px solid var(--line)}
.nl.clos{opacity:.55}
/* fiche de critère du test des écritures : la case, ce qu'il cherche, ses réglages */
.crits{display:grid;gap:var(--s2);grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
.crit{border:1px solid var(--line);border-radius:var(--r);padding:var(--s2) var(--s3);background:var(--panel-2)}
.crit.off{opacity:.6}
.crit .m{font-size:var(--t2);display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.crit .m .cnt{margin-left:auto;font-family:var(--mono);font-size:var(--t1);color:var(--ink-3)}
.crit .txt{margin:var(--s1) 0 var(--s2);font-size:var(--t1);color:var(--ink-2);line-height:1.45}
.crit .row{gap:var(--s2)}
.prm{display:flex;flex-direction:column;gap:2px;font-size:var(--t1);color:var(--ink-3)}
.prm input{width:120px}
.prm input.txt{width:auto;min-width:180px}

/* ── navigation interne d'une section : six destinations, une seule ouverte ─ */
.destnav{display:flex;flex-wrap:wrap;gap:var(--s1);margin-bottom:var(--s3);
  border-bottom:1px solid var(--line);padding-bottom:var(--s2)}
.destnav .dest{background:transparent;border:1px solid transparent;border-radius:var(--r);
  padding:var(--s1) var(--s3);font-size:var(--t2);color:var(--ink-2);cursor:pointer;
  display:inline-flex;align-items:center;gap:var(--s1);min-height:32px}
.destnav .dest:hover{border-color:var(--line)}
.destnav .dest.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.destnav .dest .cnt{font-family:var(--mono);font-size:var(--t1);color:var(--anomalie)}
/* fil d'Ariane : une procédure ouverte remplace le plan de travail */
.ariane{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:baseline;margin-bottom:var(--s3);
  padding-bottom:var(--s2);border-bottom:1px solid var(--line);font-size:var(--t2)}
.ariane .sep{color:var(--ink-3)}
/* replis : l'état d'ouverture par défaut suit ce qui demande attention */
.repli{border:1px solid var(--line);border-radius:var(--r);margin-bottom:var(--s2);background:var(--panel)}
.repli>summary{list-style:none;cursor:pointer;padding:var(--s2) var(--s3);display:flex;
  gap:var(--s2);align-items:baseline;flex-wrap:wrap;min-height:34px}
.repli>summary::-webkit-details-marker{display:none}
.repli>summary::before{content:'›';font-family:var(--mono);color:var(--ink-3);
  display:inline-block;transition:transform .12s;margin-right:var(--s1)}
.repli[open]>summary::before{transform:rotate(90deg)}
.repli>summary .t{font-weight:600;font-size:var(--t3)}
.repli>summary .s{font-size:var(--t1);color:var(--ink-3)}
.repli>summary:hover{background:var(--panel-2)}
.repli>.c{padding:0 var(--s3) var(--s3)}
.replis-cmd{margin-bottom:var(--s2)}
.dest-blk>.body{padding-top:var(--s2)}
/* un panneau de vue est un bloc repliable : même en-tête, même signature */
details.blk.pan{padding:0}
details.blk.pan>summary{list-style:none;cursor:pointer;display:flex;gap:var(--s2);align-items:baseline;
  flex-wrap:wrap;padding:var(--s3) var(--s4);border-bottom:1px solid transparent;min-height:38px}
details.blk.pan[open]>summary{border-bottom-color:var(--line)}
details.blk.pan>summary::-webkit-details-marker{display:none}
details.blk.pan>summary::before{content:'›';font-family:var(--mono);color:var(--ink-3);
  display:inline-block;transition:transform .12s}
details.blk.pan[open]>summary::before{transform:rotate(90deg)}
details.blk.pan>summary h2{margin:0}
details.blk.pan>summary .sub{font-size:var(--t1);color:var(--ink-3)}
details.blk.pan>summary .why{margin-left:auto;font-family:var(--mono);font-size:var(--t1);color:var(--ink-3)}
details.blk.pan>summary:hover{background:var(--panel-2)}
.nl .m{font-size:var(--t1);color:var(--ink-3);display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.nl .txt{margin:var(--s1) 0;font-size:var(--t2);color:var(--ink)}
.nl .rep{margin:var(--s1) 0 0 var(--s3);padding-left:var(--s2);border-left:1px solid var(--line);font-size:var(--t2)}

/* ══ portail client — même couleur, autre densité ═════════════════════════ */
body[data-espace="client"] main{max-width:960px;margin:0 auto}
.cli-item{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s2) 0;
          border-bottom:1px solid var(--line);flex-wrap:wrap}
.cli-item:last-child{border-bottom:0}
.cli-item .g{flex:1 1 280px;min-width:0}
.cli-item .a{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap}
.dep{font-size:var(--t1);color:var(--ink-3);margin-top:var(--s1)}
.dep .f{display:inline-block;border:1px solid var(--line);border-radius:var(--r);
        padding:1px var(--s1);margin:2px var(--s1) 0 0;font-family:var(--mono);font-size:var(--t1)}
.msg{border-top:1px solid var(--line);margin-top:var(--s2);padding-top:var(--s2)}
.msg .m{padding:var(--s1) var(--s2);border-radius:var(--r);margin-top:var(--s1);
        font-size:var(--t2);max-width:85%;border:1px solid var(--line)}
.msg .m.cli{margin-left:auto;background:var(--panel-2)}
.msg .m .w{display:block;font-size:var(--t1);color:var(--ink-3);margin-bottom:2px}

@media print{
  .top,.rail,.railm,button{display:none!important}
  .shell{grid-template-columns:1fr}
  .blk{break-inside:avoid;box-shadow:none}
  .tw{max-height:none;overflow:visible}
  body{background:#FFFFFF}
  /* UN PANNEAU REPLIÉ S'IMPRIMAIT REPLIÉ. Le navigateur masque le contenu
     d'un <details> fermé ; à l'impression, le papier de travail sortait donc
     amputé de tout ce que l'auditeur avait replié pour lire à l'écran. Un
     dossier ne se plie pas : tout s'ouvre au papier. */
  details > *:not(summary){display:block!important}
  details > summary{list-style:none}
  details > summary::-webkit-details-marker{display:none}
  details > summary::marker{content:''}
  /* et l'on ne coupe pas une ligne de papier de travail en deux pages */
  tr,.nl,.msg{break-inside:avoid}
  thead{display:table-header-group}
}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .railm{display:block}
  main{padding:var(--s3)}
}
@media (max-width:640px){
  .brand{padding:var(--s1) calc(var(--s6) * 2 + var(--s3)) var(--s1) var(--s3);gap:var(--s2)}
  .brand > span:not(.pill){display:none}
  .brand .pill{display:none}
  .spaces{padding:0 var(--s2) var(--s1);gap:var(--s1)}
  .spaces button{padding:var(--s1) var(--s2);font-size:var(--t1);min-height:28px}
  .spaces .qui{margin-left:var(--s2);padding-left:0}
  .spaces .qui select{font-size:var(--t1);padding:2px var(--s1);max-width:150px}
  .seuils{grid-template-columns:1fr 1fr;gap:var(--s1) var(--s2);padding:0 var(--s3) var(--s1)}
  .ctrl label{font-size:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctrl input[type=range]{height:18px}
  /* les trois seuils restent visibles sans défilement */
  .seuilbox{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s1);
            padding:0 var(--s3) var(--s1);overflow:visible}
  .seuilbox .s{padding-left:var(--s1)}
  .seuilbox .s.ref{display:none}
  .seuilbox .s .v{font-size:var(--t3)}
  .impact{flex-wrap:wrap;overflow:visible;gap:var(--s1) var(--s3);padding:var(--s1) var(--s3)}
  .impact .c{display:flex;align-items:baseline;gap:var(--s1)}
  .impact .c .k .lg{display:none}
  .impact .c .k .sm{display:inline}
  .kv{grid-template-columns:1fr;gap:0}
  .kv .k{margin-top:var(--s1)}
  .grid2,.grid3{gap:var(--s3)}
  .blk .body{padding:var(--s2)}
}
</style>

/** Générateur pseudo-aléatoire à germe (mulberry32) : même germe ⇒ même suite.
 *  C'est ce qui rend le tirage d'échantillon rejouable à l'identique. */function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
/** Germe entier stable à partir d'une chaîne (FNV-1a 32 bits). */
function seedOf(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}

const NBSP = '\u00A0';
/** Format français : espace insécable pour les milliers, virgule décimale, € après. */
function eur(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents));
  const ent = String(Math.floor(v / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
  return (neg ? '-' : '') + ent + ',' + String(v % 100).padStart(2, '0') + NBSP + '€';
}
/** Lit un montant saisi en français et rend des centimes entiers.
 *  Le noyau est en centimes de bout en bout : c'est ici, et seulement ici,
 *  qu'une chaîne devient un montant. */
function eurCents(txt){
  return Math.round((parseFloat(String(txt).replace(/[\s\u202f\u00a0]/g, '').replace(',', '.')) || 0) * 100);
}
function eur0(cents){
  const neg = cents < 0, v = Math.abs(Math.round(cents / 100));
  return (neg ? '-' : '') + String(v).replace(/\B(?=(\d{3})+(?!\d))/g, NBSP) + NBSP + '€';
}
function pct(x, d){ return (x * 100).toFixed(d === undefined ? 1 : d).replace('.', ',') + NBSP + '%'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function frDate(iso){ return iso.slice(8,10) + '/' + iso.slice(5,7) + '/' + iso.slice(0,4); }
function isWeekend(iso){ const d = new Date(iso + 'T00:00:00Z').getUTCDay(); return d === 0 || d === 6; }
function addDays(iso, n){ const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0,10); }

/* ═══ 3. GRAND LIVRE ═══════════════════════════════════════════════════════
   Le grand livre n'est PAS saisi : il est engendré, à germe fixe, de façon à
   totaliser exactement la balance client compte par compte — moins l'écriture
   de situation volontairement absente (l'écart que le rapprochement doit
   trouver) et moins les écritures particulières créées nommément.
   Conséquences vérifiables à l'écran :
     · total des débits = total des crédits (chaque écriture est équilibrée) ;
     · solde du grand livre = solde de la balance sur tous les comptes sauf deux.
   ═══════════════════════════════════════════════════════════════════════ */

const CLIENTS = ['Groupe Immovance SA','Promoteurs du Forez SA','Bâtiplace SARL','Constructions Peyrelle SAS',
  'Tertiaire Bâtir SAS','Menuiseries Chartier SAS','Habitat Confluence SAS','Négoce Vitrages Réunis SARL',
  'Sogexim Façades SA','Atelier Lumière & Verre EURL'];
const FOURNISSEURS = ['Silices du Vercors SA','Intercalaires Rhodia SARL','Profilés Aluvin SAS','Énergie Rhône Sud',
  'Fours & Réfractaires SA','Assurances Belleville','Intérim Delorme','Transports Cabrol SAS'];
const AVOCATS = ['Cabinet Vasseur & Associés','SELARL Perrin Contentieux'];
const SAISIE = ['S. Marchand (comptabilité)','T. Girard (comptabilité)','M. Ferrand (direction)'];

/** Écriture de situation présente dans la balance client et absente du FEC.
 *  C'est l'anomalie A7 du jeu de données : 25 000 € en Dr 411000 / Cr 706000. */
const ECART_SITUATION = { debit: '411000', credit: '706000', montant: 2500000 };

function buildLedger(){
  const rnd = mulberry32(seedOf('otto-altiverre-fy2025-v1'));
  const label = Object.fromEntries(TB_2025.map(r => [r[0], r[1]]));

  // cibles = balance client, par compte et par sens
  const needD = new Map(), needC = new Map();
  for (const [c,, d, cr] of TB_2025){ if (d) needD.set(c, d); if (cr) needC.set(c, cr); }
  // on retire l'écriture de situation : le grand livre ne la contient pas
  needD.set(ECART_SITUATION.debit, needD.get(ECART_SITUATION.debit) - ECART_SITUATION.montant);
  needC.set(ECART_SITUATION.credit, needC.get(ECART_SITUATION.credit) - ECART_SITUATION.montant);

  const entries = [];
  let num = 0;
  function push(e){
    e.num = e.journal + '-2025-' + String(++num).padStart(4, '0');
    for (const l of e.lines){
      if (l.debit)  needD.set(l.compte, (needD.get(l.compte) || 0) - l.debit);
      if (l.credit) needC.set(l.compte, (needC.get(l.compte) || 0) - l.credit);
    }
    entries.push(e);
    return e;
  }
  function line(compte, debit, credit, auxLib){
    return { compte, libelleCompte: label[compte] || compte, debit: debit || 0, credit: credit || 0,
             auxNum: auxLib ? 'T' + String(seedOf(auxLib) % 900 + 100) : '', auxLib: auxLib || '' };
  }

  /* ── 3a. écritures particulières (les anomalies du scénario) ───────────── */
  const client = CLIENTS[0];
  // A1 — la même facture comptabilisée deux fois, juin puis juillet
  for (const [d, p] of [['2025-06-17','FA2025-0702'], ['2025-07-15','FA2025-0702']]){
    push({ journal:'VE', date:d, pieceRef:p, pieceDate:d, libelle:'Facture ' + p + ' — ' + client,
           saisiePar:SAISIE[0], validDate:addDays(d,3), tag:'A1',
           lines:[ line('411000', 3680000, 0, client), line('701000', 0, 3680000) ] });
  }
  // A5 — produit de janvier 2026 rattaché à 2025 (séparation des exercices)
  push({ journal:'VE', date:'2025-12-31', pieceRef:'FA2025-0706', pieceDate:'2026-01-06',
         libelle:'Facture FA2025-0706 — Promoteurs du Forez SA', saisiePar:SAISIE[1],
         validDate:'2026-01-08', tag:'A5',
         lines:[ line('411000', 3633000, 0, CLIENTS[1]), line('701000', 0, 3633000) ] });
  // A6 — écriture manuelle ronde, un samedi, saisie par la direction
  push({ journal:'OD', date:'2025-11-15', pieceRef:'OD-2025-089', pieceDate:'2025-11-15',
         libelle:'Régularisation contrat-cadre — décision de direction', saisiePar:SAISIE[2],
         validDate:'2025-11-17', tag:'A6',
         lines:[ line('411000', 5000000, 0, CLIENTS[0]), line('706000', 0, 5000000) ] });
  // honoraires juridiques : deux cabinets, dont un seul sera déclaré par le client
  {
    const tot = needD.get('622600') || 0;
    const part = Math.round(tot * 0.62);
    push({ journal:'AC', date:'2025-03-20', pieceRef:'FF2025-0311', pieceDate:'2025-03-18',
           libelle:'Honoraires — ' + AVOCATS[0], saisiePar:SAISIE[0], validDate:'2025-03-25',
           lines:[ line('622600', part, 0, AVOCATS[0]), line('401000', 0, part, AVOCATS[0]) ] });
    push({ journal:'AC', date:'2025-09-08', pieceRef:'FF2025-0742', pieceDate:'2025-09-04',
           libelle:'Honoraires contentieux — ' + AVOCATS[1], saisiePar:SAISIE[1], validDate:'2025-09-12',
           lines:[ line('622600', tot - part, 0, AVOCATS[1]), line('401000', 0, tot - part, AVOCATS[1]) ] });
  }

  /* ── 3b. table des contreparties plausibles ───────────────────────────── */
  const PREF = [
    { d:/^411/, c:/^(701|706|445710)/, j:'VE', lib:'Facture de vente' },
    { d:/^709/, c:/^411/,              j:'VE', lib:'Avoir accordé' },
    { d:/^512/, c:/^411/,              j:'BQ', lib:'Encaissement client' },
    { d:/^401/, c:/^512/,              j:'BQ', lib:'Règlement fournisseur' },
    { d:/^(60|61|62|624|606|615|616)/, c:/^401/, j:'AC', lib:'Facture fournisseur' },
    { d:/^445660/, c:/^401/,           j:'AC', lib:'TVA déductible sur achats' },
    { d:/^(641|645|621)/, c:/^(421|431|437)/, j:'PA', lib:'Paie du mois' },
    { d:/^(421|431|437)/, c:/^512/,    j:'BQ', lib:'Versement social / salaires' },
    { d:/^(661|164)/, c:/^512/,        j:'BQ', lib:'Échéance emprunt' },
    { d:/^445510/, c:/^512/,           j:'BQ', lib:'Paiement TVA' },
    { d:/^445710/, c:/^(445510|445660)/, j:'OD', lib:'Déclaration de TVA' },
    { d:/^681/, c:/^28/,               j:'OD', lib:'Dotation aux amortissements' },
    { d:/^(2|3)/, c:/^(401|512)/,      j:'AC', lib:'Acquisition' },
  ];
  const CAP = { VE:[300000,6500000], AC:[50000,3500000], BQ:[80000,9000000],
                PA:[1500000,18000000], OD:[100000,4000000], AN:[0,0] };

  function pickDate(){
    // dates réparties sur l'exercice, décalées au lundi suivant dans 9 cas sur 10
    // lorsqu'elles tombent un week-end : une comptabilité ne saisit presque jamais
    // le samedi, ce qui fait du critère « week-end » un vrai signal (~3 % ici).
    let d = addDays('2025-01-01', Math.floor(rnd() * 365));
    if (isWeekend(d) && rnd() < 0.9){
      d = addDays(d, new Date(d + 'T00:00:00Z').getUTCDay() === 6 ? 2 : 1);
      if (d > '2025-12-31') d = addDays(d, -3);
    }
    return d;
  }
  function mkEntry(dc, cc, amount, j, lib){
    const date = j === 'AN' ? '2025-01-01' : pickDate();
    const aux = dc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : cc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)]
              : cc.startsWith('411') ? CLIENTS[Math.floor(rnd()*CLIENTS.length)]
              : dc.startsWith('401') ? FOURNISSEURS[Math.floor(rnd()*FOURNISSEURS.length)] : '';
    const prefix = { VE:'FA', AC:'FF', BQ:'BQ', PA:'PA', OD:'OD', AN:'AN' }[j];
    const piece = prefix + '2025-' + String(1000 + Math.floor(rnd() * 8999));
    // validation : quelques écritures validées après la clôture (critère de test)
    const late = rnd() < 0.03;
    let pd = j === 'AN' ? date : addDays(date, -Math.floor(rnd() * 4));
    if (pd < '2025-01-01') pd = '2025-01-01';
    return { journal:j, date, pieceRef:piece, pieceDate:pd,
             libelle: lib + (aux ? ' — ' + aux : ''), saisiePar: SAISIE[rnd() < 0.04 ? 2 : (rnd() < .5 ? 0 : 1)],
             validDate: late ? addDays('2026-01-05', Math.floor(rnd()*20)) : addDays(date, 1 + Math.floor(rnd()*6)),
             lines: [ line(dc, amount, 0, aux), line(cc, 0, amount, aux) ] };
  }

  /* ── 3c. appariement glouton jusqu'à consommer toutes les cibles ───────── */
  const alive = m => [...m.entries()].filter(([, v]) => v > 0);
  let guard = 0;
  while (guard++ < 40000){
    const ds = alive(needD), cs = alive(needC);
    if (!ds.length || !cs.length) break;
    // on prend la cible débit la plus lourde : la boucle converge vite
    ds.sort((a, b) => b[1] - a[1]);
    const [dc, dRem] = ds[0];
    let rule = PREF.find(p => p.d.test(dc) && cs.some(([c]) => p.c.test(c) ));
    let cc, j, lib;
    if (rule){
      const cands = cs.filter(([c]) => rule.c.test(c));
      cc = cands[Math.floor(rnd() * cands.length)][0]; j = rule.j; lib = rule.lib;
    } else {
      // pas de contrepartie naturelle disponible : opération diverse
      const bs = c => /^[1-5]/.test(c);
      const cands = cs.filter(([c]) => bs(c) === bs(dc)).concat(cs);
      cc = cands[Math.floor(rnd() * cands.length)][0];
      j = (/^[1-3]/.test(dc) && /^[1-3]/.test(cc)) ? 'AN' : 'OD';
      lib = j === 'AN' ? 'À nouveau' : 'Opération diverse';
    }
    const cRem = needC.get(cc);
    const [lo, hi] = CAP[j];
    let amount;
    if (j === 'AN') amount = Math.min(dRem, cRem);
    else {
      // rnd()^2,6 : la masse des écritures est petite, la queue est longue
      amount = Math.min(dRem, cRem, lo + Math.floor(Math.pow(rnd(), 2.6) * (hi - lo)));
      // reliquat trop petit pour une écriture crédible : on le solde d'un coup
      if (dRem - amount < lo) amount = Math.min(dRem, cRem);
      // ~8 % des montants sont ronds au millier (critère « montant rond »)
      if (amount > 500000 && rnd() < 0.08) amount = Math.floor(amount / 100000) * 100000;
    }
    if (amount <= 0) { needD.set(dc, 0); continue; }
    push(mkEntry(dc, cc, amount, j, lib));
  }

  // numérotation par journal, comme dans un FEC réel
  const perJournal = {};
  for (const e of entries){
    perJournal[e.journal] = (perJournal[e.journal] || 0) + 1;
    e.num = e.journal + String(perJournal[e.journal]).padStart(5, '0');
  }
  entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : (a.num < b.num ? -1 : 1));

  // aplatissement en lignes de FEC
  const rows = [];
  for (const e of entries){
    e.lines.forEach((l, i) => rows.push({
      JournalCode:e.journal, JournalLib:{VE:'Ventes',AC:'Achats',BQ:'Banque',PA:'Paie',OD:'Opérations diverses',AN:'À nouveaux'}[e.journal],
      EcritureNum:e.num, EcritureDate:e.date, CompteNum:l.compte, CompteLib:l.libelleCompte,
      CompAuxNum:l.auxNum, CompAuxLib:l.auxLib, PieceRef:e.pieceRef, PieceDate:e.pieceDate,
      EcritureLib:e.libelle, Debit:l.debit, Credit:l.credit, EcritureLet:'', DateLet:'',
      ValidDate:e.validDate, Montantdevise:'', Idevise:'', saisiePar:e.saisiePar, tag:e.tag || '', ligne:i + 1
    }));
  }
  return { entries, rows };
}

/** Le grand livre d'origine — la version 1. Les versions suivantes s'y
 *  AJOUTENT (voir ledgerVersion) : il n'est jamais régénéré. */
let _ledgerBase = null;
function ledgerBase(){ return _ledgerBase || (_ledgerBase = buildLedger()); }

/** Balance recalculée à partir des écritures — jamais saisie à côté. */
function balanceFromLedger(rows){
  const m = new Map();
  for (const r of rows){
    const a = m.get(r.CompteNum) || { compte:r.CompteNum, lib:r.CompteLib, debit:0, credit:0 };
    a.debit += r.Debit; a.credit += r.Credit; m.set(r.CompteNum, a);
  }
  return [...m.values()].sort((a, b) => a.compte < b.compte ? -1 : 1);
}

const ASSERTIONS = [

/** Statistiques observées d'un poste — base des facteurs qui n'ont pas à être demandés. */
const _statCache = new Map();
function statsPoste(p){
  if (_statCache.has(p.code)) return _statCache.get(p.code);
  const re = p.re;
  const ecr = lg().entries.filter(e => e.lines.some(l => re.test(l.compte)));
  const mvt = e => e.lines.reduce((a, l) => a + (re.test(l.compte) ? Math.abs(l.debit - l.credit) : 0), 0);
  const st = {
    n:ecr.length,
    od:ecr.filter(e => e.journal === 'OD').length,
    direction:ecr.filter(e => /direction/.test(e.saisiePar)).length,
    tardives:ecr.filter(e => e.validDate > '2025-12-31').length,
    decembre:ecr.filter(e => e.date >= '2025-12-01').length,
    tiers:new Set(ecr.flatMap(e => e.lines.map(l => l.auxLib).filter(Boolean))).size,
    masse:ecr.reduce((a, e) => a + mvt(e), 0),
  };
  _statCache.set(p.code, st);
  return st;
}

/** Facteurs actifs d'un poste : les observés sont calculés, les déclarés sont lus dans le casier. */
function facteursActifs(p){
  const locaux = FACTEURS.map(f => ({ ...f, actif:!!f.obs(p), preuve:f.dit(p) }));
  // Les constatations venues d'ailleurs, CONFIRMÉES et retenues comme
  // majorantes, comptent comme des facteurs de la section : c'est là que la
  // circulation produit son effet, et pas seulement un affichage.
  const vus = new Set();
  for (const f of facteursRetenus(p.code)){
    for (const c of f.cibles.filter(x => x.fsli === p.code)){
      for (const a of c.assertions){
        const k = f.id + '|' + a;
        if (vus.has(k)) continue;
        vus.add(k);
        locaux.push({ code:'REG:' + k, a, lib:f.description, actif:true,
                      registre:true, facteur:f, preuve:f.source ? f.source.lib : 'saisi à la main' });
      }
    }
  }
  return locaux;
}
const NIVEAUX = ['faible', 'moyen', 'eleve'];
const NIV_LIB = { faible:'faible', moyen:'moyen', eleve:'élevé' };
/** Règle : 0 facteur → faible, 1 → moyen, 2 et plus → élevé. Surchargeable avec motif. */
function niveauCalcule(p, a){
  const n = facteursActifs(p).filter(f => f.a === a && f.actif).length;
  return n === 0 ? 'faible' : n === 1 ? 'moyen' : 'eleve';
}
function niveau(p, a){ return sec(p.code).override[a] || niveauCalcule(p, a); }
function niveauMax(p){
  return ASSERTIONS.reduce((m, a) => Math.max(m, NIVEAUX.indexOf(niveau(p, a.code))), 0);
}

/* ── étendue des travaux : elle suit l'assertion, pas le poste ─────────────
   Une procédure répond à UNE assertion. Lui appliquer le risque le plus élevé
   du poste revient à traiter la séparation des exercices comme l'exhaustivité
   sous prétexte qu'elles partagent un compte : sur le chiffre d'affaires, un
   test de cut-off recevait trente éléments alors que la séparation des
   exercices est évaluée « faible ». Les deux tables ci-dessous s'appliquent
   donc au niveau de risque de l'assertion TESTÉE, et une section porte des
   échantillons de tailles différentes — c'est la conséquence normale.       */
const TAILLE = { faible:6, moyen:15, eleve:30 };
/* ── ce sur quoi le risque agit, et ce sur quoi il n'agit pas ──────────────
   ARBITRAGE DE L'AUDITEUR (2026-08-26), qui corrige l'ADR-034.

   La strate exhaustive n'est PAS un levier de risque. C'est la strate des
   éléments INDIVIDUELLEMENT SIGNIFICATIFS — ceux dont une anomalie, à eux
   seuls, serait significative. Cette coupure vaut le seuil de planification,
   sans modulation : un élément de 20 000 € n'est pas plus ou moins
   individuellement significatif selon que l'assertion qu'il sert est jugée
   moyenne ou élevée.

   Le risque agit sur la TAILLE de l'échantillon, et — par voie de
   conséquence, l'intervalle valant masse ÷ taille — sur l'INTERVALLE DE
   SONDAGE. Deux leviers, pas trois.                                        */
function tailleEchantillon(p, pr){ return TAILLE[niveau(p, pr.a)]; }
function seuilStrate(){ return seuils().PM; }
/** Part de la population au-delà de laquelle une strate exhaustive cesse
 *  d'être une strate : à ce niveau, on ne sonde plus, on teste tout.
 *  Le système le dit et propose autre chose ; il ne bascule pas seul. */
const GARDE_EXHAUSTIVE = 0.25;

const STATUTS = {

  partiel:       { lib:'partiellement soumis',    cls:'warn', client:true  },
  depose:        { lib:'tout est déposé',         cls:'',     client:true  },

/** Ce que le client a le droit de lire. Un statut interne est replié sur le
 *  dernier statut visible : le client ne doit pas déduire l'avancement du dossier. */
function statutVisibleClient(it){
  return STATUTS[it.statut].client ? it.statut : 'traitement';

function creerRequete(section, titre, items, echeanceJ){
  const r = { id:'R' + String(++S.seqReq).padStart(3, '0'), section, titre,
              echeance:addDays(S.aujourdhui, echeanceJ === undefined ? 12 : echeanceJ),
              contact:referentSection(section).id, clotureClient:false, messages:[],
              items:items.map((d, i) => ({ id:i + 1, desc:typeof d === 'string' ? d : d.desc,
                                           ref:typeof d === 'string' ? null : d.ref,
                                           statut:'non_recu', revoyeur:null, depots:[] })),
              cree:tick(), origine:null };
  S.requetes.push(r);
  logEvent('requête créée', r.id + ' — ' + titre, section + ' · ' + r.items.length + ' élément(s)');
  return r;
}
function avancement(items){
  const poids = { non_recu:0, partiel:.5, depose:.8, traitement:.9, attente_revue:1 };
  return items.length ? items.reduce((a, i) => a + poids[i.statut], 0) / items.length : 0;
}
function requetesDe(code){ return S.requetes.filter(r => r.section === code); }
function retard(r){
  return !r.clotureClient && r.echeance < S.aujourdhui && r.items.some(i => i.statut === 'non_recu' || i.statut === 'partiel');
}
function ancienneteRetard(r){
  if (!retard(r)) return 0;
  let n = 0, d = r.echeance;
  while (d < S.aujourdhui){ d = addDays(d, 1); if (!isWeekend(d) || S.portail.samediOuvre) n++; }
  return n;
}

/** Empreinte d'un fichier : déterministe, calculée sur ce qu'il contient. */
function empreinteVersion(n){
  const src = JSON.stringify([n, tbVersion(n), ledgerVersion(n).entries.length]);
  let h = 0x811c9dc5;
  for (let i = 0; i < src.length; i++){ h ^= src.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  const g = (x) => x.toString(16).padStart(8, '0');
  return (g(h) + g(Math.imul(h, 0x85ebca6b) >>> 0) + g(Math.imul(h ^ n, 0xc2b2ae35) >>> 0)).slice(0, 20);
}

/* ── balance d'une version ────────────────────────────────────────────────
   La balance de la version n, c'est celle de la version 1 augmentée des
   écritures des versions suivantes qui la touchent. Rien n'est écrasé.     */
const _tbCache = new Map();
function tbVersion(n){
  if (_tbCache.has(n)) return _tbCache.get(n);
  const m = new Map(TB_2025.map(r => [r[0], [r[0], r[1], r[2], r[3]]]));
  for (const e of ecrituresJusqua(n)){
    if (e.cible === 'gl') continue;
    for (const [c, d, cr] of e.lignes){
      const r = m.get(c) || [c, COMPTES_NOUVEAUX[c] || c, 0, 0];
      r[2] += d; r[3] += cr; m.set(c, r);
    }
  }
  const out = [...m.values()].sort((a, b) => a[0] < b[0] ? -1 : 1);
  _tbCache.set(n, out);
  return out;
}

/** Signature de la sélection d'une procédure : si elle change, l'échantillon
 *  n'est plus le même et le papier ne porte plus sur la même population. */
function empreinteSelection(p, pr){
  const e = echantillonProc(p, pr);
  if (!e) return '';
  return e.retenus.length + ':' + e.retenus.map(x => x.cle).join('|');
}
/** Stampe la version d'exécution au premier travail réellement saisi. */
function marquerExecution(p, pr){
  const st = proc(p.code, pr.code);
  if (st.execVersion === undefined || st.execVersion === null){
    st.execVersion = S.version;
    st.execEmpreinte = empreinteSelection(p, pr);
  }
}
/** Un papier est périmé si la version a changé ET que sa population a bougé,
 *  ou s'il a été exécuté sur une version antérieure à celle du dossier. */
function peremption(p, pr){
  const st = proc(p.code, pr.code);
  if (st.execVersion === undefined || st.execVersion === null) return null;
  if (st.execVersion === S.version) return null;
  const emp = empreinteSelection(p, pr);
  return { de:st.execVersion, a:S.version, populationChangee:emp !== st.execEmpreinte };
}
function soldes(tb){ const m = new Map(); for (const [c, l, d, cr] of tb) m.set(c, { lib:l, solde:d - cr, debit:d, credit:cr }); return m; }
const B24 = soldes(TB_2024);
function sumWhere(bal, re){ let s = 0; for (const [c, v] of bal) if (re.test(c)) s += v.solde; return s; }

/** Références possibles pour la matérialité, toutes calculées depuis la balance.
 *  Signe : produits et capitaux propres sont créditeurs, on les rend positifs. */
function benchmarks(bal){
  const produits = -sumWhere(bal, /^7/);
  const charges  =  sumWhere(bal, /^6/);
  const ca       = -sumWhere(bal, /^70/);                    // 701+706 moins 709 (RRR)
  const resultat = produits - charges;                        // résultat courant avant impôt
  // total actif net = soldes débiteurs des classes 2 à 5, nets des amortissements
  let actif = 0;
  for (const [c, v] of bal){
    if (/^(28|29|39|49)/.test(c)) actif += v.solde;           // amortissements : solde créditeur, donc négatif
    else if (/^[2345]/.test(c) && v.solde > 0) actif += v.solde;
  }
  const capitaux = -sumWhere(bal, /^(101|106|110)/) + resultat;
  return {
    ca:{ code:'ca', lib:'Chiffre d’affaires', val:ca, defaut:1 },
    pbt:{ code:'pbt', lib:'Résultat courant avant impôt', val:resultat, defaut:5 },
    equity:{ code:'equity', lib:'Capitaux propres', val:capitaux, defaut:3 },
    actif:{ code:'actif', lib:'Total de l’actif', val:actif, defaut:2 },
    charges:{ code:'charges', lib:'Total des charges', val:charges, defaut:1 },
  };
}
const BM24 = benchmarks(B24);

/** Arrondi prudent vers le bas au pas indiqué (pratique de place). */
function arrondiBas(cents, pas){ return Math.floor(cents / pas) * pas; }

/** Les trois seuils. Recalculés à chaque mouvement de curseur. */
function seuils(){
  const b = bm()[S.benchmark];
  const brut = Math.round(b.val * S.pctM / 100);
  const M  = arrondiBas(brut, 100000);            // au millier d'euros inférieur
  const PM = arrondiBas(Math.round(M * S.pctPM / 100), 100000);
  const CTT= arrondiBas(Math.round(M * S.pctCTT / 100), 10000); // à la centaine d'euros
  return { bench:b, brut, M, PM, CTT };
}

/** Contrôles de forme du fichier des écritures comptables.
 *  Chaque contrôle renvoie le nombre de lignes ou d'écritures en anomalie. */
function controlesFec(){
  const tot = { d:0, c:0 };
  let deuxColonnes = 0, horsExercice = 0, compteInvalide = 0, validAvant = 0, auxIncomplet = 0, pieceHors = 0;
  const parEcriture = new Map();
  const rows = fec();
  for (const r of rows){
    tot.d += r.Debit; tot.c += r.Credit;
    if ((r.Debit > 0 && r.Credit > 0) || (r.Debit === 0 && r.Credit === 0)) deuxColonnes++;
    if (r.EcritureDate < '2025-01-01' || r.EcritureDate > '2025-12-31') horsExercice++;
    if (!/^\d{3,}$/.test(r.CompteNum)) compteInvalide++;
    if (r.ValidDate && r.ValidDate < r.EcritureDate) validAvant++;
    if ((r.CompAuxNum === '') !== (r.CompAuxLib === '')) auxIncomplet++;
    if (r.PieceDate && (r.PieceDate < '2025-01-01' || r.PieceDate > '2025-12-31')) pieceHors++;
    const e = parEcriture.get(r.EcritureNum) || { d:0, c:0 };
    e.d += r.Debit; e.c += r.Credit; parEcriture.set(r.EcritureNum, e);
  }
  let ecrituresDesequilibrees = 0;
  for (const [, v] of parEcriture) if (v.d !== v.c) ecrituresDesequilibrees++;
  const champsManquants = CHAMPS_FEC.filter(f => rows.some(r => r[f] === undefined));
  return { tot, deuxColonnes, horsExercice, compteInvalide, validAvant, auxIncomplet, pieceHors,
           ecrituresDesequilibrees, nbEcritures:parEcriture.size, champsManquants };
}

/** Rapprochement balance client ↔ grand livre, compte par compte. */
function rapprochement(n){
  const v = n === undefined ? S.version : n;
  const tbv = tbVersion(v), balv = v === S.version ? bal() : soldes(tbv);
  const glb = v === S.version ? glBal() : balanceFromLedger(ledgerVersion(v).rows);
  const gl = new Map(glb.map(r => [r.compte, r]));
  const comptes = [...new Set([...tbv.map(r => r[0]), ...glb.map(r => r.compte)])].sort();
  return comptes.map(c => {
    const t = balv.get(c), g = gl.get(c);
    const sTB = t ? t.solde : 0, sGL = g ? g.debit - g.credit : 0;
    return { compte:c, lib:(t ? t.lib : g.lib), sTB, sGL, ecart:sTB - sGL,
             presentTB:!!t, presentGL:!!g };
  });
}
function arSeuilMontant(){ return S.arMontant === null ? seuils().PM : S.arMontant; }

function revueAnalytique(){
  const b = bal();
  const comptes = [...new Set([...tb().map(r => r[0]), ...TB_2024.map(r => r[0])])].sort();
  return comptes.map(c => {
    const n = b.get(c) ? b.get(c).solde : 0;
    const n1 = B24.get(c) ? B24.get(c).solde : 0;
    const lib = (b.get(c) || B24.get(c)).lib;
    const d = n - n1;
    const p = n1 === 0 ? (n === 0 ? 0 : null) : d / Math.abs(n1);   // null = pas de base N-1
    const parMontant = Math.abs(d) >= arSeuilMontant();
    const parPct = p !== null && Math.abs(p) >= S.arPct / 100;
    return { compte:c, lib, n, n1, d, p, parMontant, parPct, flag:parMontant || parPct };
  });
}
/** Sens naturel d'un compte : -1 s'il est normalement créditeur (produits,
 *  capitaux, dettes). Sans cela, une hausse du chiffre d'affaires — qui rend le
 *  solde PLUS créditeur, donc plus négatif en convention signée — serait
 *  décrite comme une baisse. C'est le genre d'erreur qu'un associé voit en
 *  trois secondes et qui décrédibilise tout le reste. */
function sensNaturel(l){ return ((l.n1 || l.n) < 0) ? -1 : 1; }

/** Question composée automatiquement — assemblage déterministe, aucun texte de modèle. */
function questionVariation(l){
  const k = sensNaturel(l);
  const mouvement = l.d * k;                       // > 0 = augmentation, dans le sens du compte
  const sens = mouvement > 0 ? 'une augmentation' : 'une diminution';
  const nature = k < 0 ? 'solde créditeur' : 'solde débiteur';
  const pctTxt = l.p === null ? 'sans base comparative en N-1' : 'soit ' + pct(Math.abs(l.p), 1);
  const motif = l.parMontant && l.parPct ? 'seuil en montant et seuil en pourcentage'
              : l.parMontant ? 'seuil en montant' : 'seuil en pourcentage';
  return `Le compte ${l.compte} « ${l.lib} » (${nature}) présente ${sens} de ${eur(Math.abs(l.d))} entre le `
       + `31/12/2024 (${eur(Math.abs(l.n1))}) et le 31/12/2025 (${eur(Math.abs(l.n))}), ${pctTxt}. Cette variation `
       + `dépasse le ${motif} retenu pour la revue analytique (${eur(arSeuilMontant())} / ${S.arPct}${NBSP}%). `
       + `Merci d’en indiquer l’explication et de préciser les éléments justificatifs disponibles.`;
}

/* ── extrait de l'exercice suivant ────────────────────────────────────────
   La recherche de passifs non enregistrés part des décaissements POSTÉRIEURS
   à la clôture : sans extrait de l'exercice suivant, elle est incatalogable
   autrement qu'en « non exécutable ». Le client en transmet un — c'est la
   pratique — donc le jeu de données en contient un : soixante décaissements
   du 1er janvier au 31 mars 2026.

   Ces soixante décaissements ne sont pas de même nature, et c'est tout
   l'intérêt de la procédure :

     — la plupart RÈGLENT une dette déjà comptabilisée au bilan de clôture
       (fait générateur en 2025, dette au passif) : rien à relever ;
     — d'autres sont des charges de l'exercice SUIVANT (fait générateur en
       2026, aucune dette attendue à la clôture) : rien à relever non plus ;
     — TROIS règlent une dette née avant la clôture et JAMAIS comptabilisée.
       Ce sont les passifs non enregistrés, et ce sont les seuls écarts.

   Une version antérieure datait tous les faits générateurs normaux après la
   clôture : la date suffisait alors à trier, et le test ne prouvait rien
   qu'un tri de dates. Le contrôle réel n'est pas une date, c'est une
   RECHERCHE : la dette attendue figure-t-elle au bilan de clôture ?

   Les trois passifs omis portent des références FIXES posées à des rangs
   FIXES de l'extrait. Elles étaient auparavant laissées à la numérotation
   de la boucle, qui n'engendrait que des multiples de sept : FF2026-0117
   n'en est pas un et n'a jamais existé. Une donnée d'essai nommée doit être
   posée, pas espérée. */
const POST_DEB = '2026-01-01', POST_FIN = '2026-03-31';
const PASSIFS_OMIS = {
  'FF2026-0042':{ montant:1840000, faitLe:'2025-11-28', facture:'2026-01-14', why:'prestation de maintenance de novembre, facture reçue en janvier, aucune charge à payer comptabilisée' },
  'FF2026-0117':{ montant: 962000, faitLe:'2025-12-15', facture:'2026-01-03', why:'livraison de profilés du 15 décembre, facture datée du 3 janvier, non provisionnée' },
  'FF2026-0203':{ montant: 415000, faitLe:'2025-12-22', facture:'2026-02-09', why:'honoraires de conseil sur un dossier clos en décembre, facturés en février' },
};
/** Rang de l'extrait auquel chaque passif omis est posé. */
const RANGS_OMIS = { 7:'FF2026-0042', 23:'FF2026-0117', 46:'FF2026-0203' };

let _post = null;
function ledgerPost(){
  if (_post) return _post;
  const rnd = mulberry32(seedOf('otto-altiverre-post-2026'));
  const reserve = new Set(Object.values(RANGS_OMIS));
  const out = [];
  let n = 0;
  const refSuivante = () => {
    let r;
    do { r = 'FF2026-' + String(++n * 7).padStart(4, '0'); } while (reserve.has(r));
    return r;
  };
  const jour = i => addDays(POST_DEB, Math.floor(i * 89 / 60));
  for (let i = 0; i < 60; i++){
    const f = FOURNISSEURS[Math.floor(rnd() * FOURNISSEURS.length)];
    const ref = RANGS_OMIS[i] || refSuivante();
    const omis = PASSIFS_OMIS[ref];
    const tirage = rnd();
    const montant = omis ? omis.montant : Math.round((80000 + rnd() * 4200000) / 100) * 100;
    let faitLe, facture, comptabilisee;
    if (omis){
      /* dette née avant la clôture, jamais portée au passif */
      faitLe = omis.faitLe; facture = omis.facture; comptabilisee = false;
    } else if (tirage < 0.6){
      /* règlement d'une dette fournisseur déjà comptabilisée à la clôture */
      faitLe = addDays(CLOTURE, -(3 + Math.floor(rnd() * 85)));
      facture = addDays(faitLe, Math.floor(rnd() * 8));
      comptabilisee = true;
    } else {
      /* charge de l'exercice suivant : aucune dette attendue à la clôture */
      faitLe = addDays(jour(i), -Math.floor(rnd() * 20));
      if (faitLe <= CLOTURE) faitLe = addDays(CLOTURE, 1 + Math.floor(rnd() * 20));
      facture = addDays(faitLe, Math.floor(rnd() * 6));
      comptabilisee = false;
    }
    out.push({ num:'BQ2026-' + String(i + 1).padStart(4, '0'), date:jour(i), pieceRef:ref,
               tiers:f, montant, faitLe, facture, comptabilisee, omis:!!omis,
               libelle:'Règlement fournisseur — ' + f });
  }
  _post = out;
  return out;
}

    return 'le catalogue ne nomme aucune population calculable : cette procédure s’exécute hors '
         + 'des données comptables (observation, entretien, inspection physique).';
  if (PREDICATS_ABSENTS[nom]) return PREDICATS_ABSENTS[nom];
  if (!PREDICATS[nom]) return 'prédicat « ' + nom + ' » inconnu du registre du prototype.';
  return null;
}

function proc(code, prCode){
  const st = sec(code);
  if (!st.procs) st.procs = {};
  if (!st.procs[prCode]) st.procs[prCode] = {
    seed:'otto-' + code.toLowerCase() + '-' + prCode.toLowerCase() + '-01',

/* ── population d'une procédure : explicite, affichée, comptée ───────────── */
const _popCache = new Map();
function population(p, pr){
  if (!pr.ech) return null;
  const s = seuils();
  const cle = p.code + '|' + pr.code + '|' + s.CTT + '|' + S.version;
  if (_popCache.has(cle)) return _popCache.get(cle);
  const d = pr.def.population;
  const fn = PREDICATS[d.predicat || 'non_implemente'] || PREDICATS.non_implemente;
  const items = fn(p, pr, d.parametres || {});
  if (!items) return null;
  const r = { lib:d.libelle, source:d.source, periode:d.periode, filtre:d.filtre,
              predicat:d.predicat, comptes:p.comptes, unite:pr.unite, items,
              masse:items.reduce((a, x) => a + x.montant, 0) };
  if (_popCache.size > 300) _popCache.clear();
  _popCache.set(cle, r);

/* ── méthodes de sélection ────────────────────────────────────────────────

   seconde quand ils l'approchent — c'est précisément le cas où la première
   se met à retenir la moitié de la population.                             */
const METHODES = {
  strate:{
    lib:'strate exhaustive + tirage aléatoire',
    court:'strate + aléatoire',
    d:'Tout élément individuellement significatif est testé ; le reliquat est tiré au sort, '
     + 'chaque élément ayant la même probabilité d’être retenu.',
    quand:'Convient quand les éléments sont petits devant le seuil de planification.' },
  exhaustive:{
    lib:'sélection exhaustive au seuil de remontée',
    court:'exhaustive',
    imposee:'la méthode l’exige — voir la note de la procédure',
    d:'Aucun tirage : tous les éléments de la population sont testés. La population est déjà bornée '
     + 'par le seuil de remontée déclaré ; c’est ce seuil, et lui seul, qui fixe l’étendue.',
    quand:'Exigée par les tests d’exhaustivité : sonder une population que l’on cherche précisément à '
        + 'compléter ne prouve rien sur ce qui en est absent.' },
  sum:{
    lib:'sondage en unités monétaires',
    court:'unités monétaires',
    d:'La population est parcourue en euros, pas en éléments : un euro sur « intervalle » est '
     + 'retenu, et l’élément qui le porte entre dans l’échantillon. Un élément a donc une '
     + 'probabilité proportionnelle à sa valeur, et tout élément supérieur à l’intervalle est '
     + 'retenu d’office.',
    quand:'Convient quand les éléments approchent le seuil : la couverture en valeur est obtenue '
        + 'sans tester la moitié des éléments.' },
};
/** La méthode imposée par le catalogue n'est pas offerte au choix. */
function methodeImposee(pr){
  const m = pr.def && pr.def.selection === 'exhaustive_au_seuil' ? 'exhaustive' : null;
  return m;
}
function methodeDe(p, pr){
  const imp = methodeImposee(pr);
  if (imp) return imp;
  const st = proc(p.code, pr.code);
  return METHODES[st.methode] && !METHODES[st.methode].imposee ? st.methode : 'strate';
}

/** Sondage en unités monétaires. Déterministe : le départ aléatoire est tiré
 *  du germe, et les éléments sont parcourus dans un ordre stable. */
/* Un intervalle de sondage supérieur au seuil de planification laisse passer,
   sans jamais les voir, des anomalies individuellement significatives : la
   méthode tourne, le papier a l'air rempli, et l'échantillon ne prouve rien.
   C'est le même défaut que la strate exhaustive à 50 % de la population, par
   l'autre bout — on le dit de la même façon, sans basculer seul.
   La taille qui ramène l'intervalle au seuil est une division, pas un choix. */
function tailleAdequate(masse, pm){ return Math.max(1, Math.ceil(masse / Math.max(1, pm))); }

function tirageSUM(items, masse, n, seed){
  const intervalle = Math.max(1, Math.floor(masse / Math.max(1, n)));
  const rnd = mulberry32(seedOf(seed + '|sum'));
  const depart = Math.floor(rnd() * intervalle);
  const ordre = [...items].sort((a, b) => String(a.cle) < String(b.cle) ? -1 : 1);
  const sel = [], unites = [];
  let cum = 0, cible = depart;
  for (const it of ordre){
    const haut = cum + it.montant;
    let pris = false;
    while (cible < haut){
      unites.push({ cle:it.cle, unite:cible });
      if (!pris){ sel.push(it); pris = true; }
      cible += intervalle;
    }
    cum = haut;
  }
  return { sel, intervalle, depart, unites };
}

/** Tirage d'une procédure. La coupure d'exhaustivité vaut le seuil de
 *  planification, sans modulation par le risque (voir 11_state.js). */
const _echProcCache = new Map();
function echantillonProc(p, pr){
  const pop = population(p, pr);
  if (!pop) return null;
  const s = seuils(), st = proc(p.code, pr.code);
  const nRegle = tailleEchantillon(p, pr);
  const n = st.taille ? Math.max(1, st.taille) : nRegle;
  const strate = seuilStrate();
  const meth = methodeDe(p, pr);
  const cle = [p.code, pr.code, st.seed, strate, s.CTT, n, meth].join('|');
  if (_echProcCache.has(cle)) return _echProcCache.get(cle);

  /* La strate des éléments individuellement significatifs se calcule dans les
     deux méthodes : c'est elle qui déclenche le garde-fou, indépendamment de
     la méthode retenue. */
  const indivSig = pop.items.filter(x => x.montant >= strate);
  const partSig = pop.items.length ? indivSig.length / pop.items.length : 0;
  const gardeFou = partSig > GARDE_EXHAUSTIVE;

  let exhaustif, alea, intervalle = null, depart = null, unites = [];
  if (meth === 'exhaustive'){
    /* Pas de strate, pas de tirage, pas de germe : la population entière est
       le papier de travail. Le garde-fou d'exhaustivité ne s'applique pas —
       il dit qu'on teste presque tout SANS l'avoir décidé ; ici c'est décidé,
       écrit au catalogue, et c'est la seule façon de conclure sur ce qui
       manque. */
    exhaustif = pop.items; alea = [];
  } else if (meth === 'sum'){
    const t = tirageSUM(pop.items, pop.masse, n, st.seed);
    intervalle = t.intervalle; depart = t.depart; unites = t.unites;
    exhaustif = t.sel.filter(x => x.montant >= intervalle);
    alea = t.sel.filter(x => x.montant < intervalle);
  } else {
    exhaustif = indivSig;
    const reste = pop.items.filter(x => x.montant < strate);
    const rnd = mulberry32(seedOf(st.seed));
    const idx = reste.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
    alea = idx.slice(0, Math.min(n, idx.length)).sort((a, b) => a - b).map(i => reste[i]);
  }
  const retenus = [...exhaustif, ...alea];
  const couvert = retenus.reduce((a, x) => a + x.montant, 0);
  const nAdequate = tailleAdequate(pop.masse, strate);
  const r = { pop, exhaustif, alea, retenus, n, nRegle, couvert,
              taux: pop.masse ? couvert / pop.masse : 0, strate, niv:niveau(p, pr.a),
              methode:meth, intervalle, depart, unites,
              indivSig, partSig, gardeFou: gardeFou && meth !== 'exhaustive',
              imposee: meth === 'exhaustive',
              nAdequate, intervalleLarge: meth === 'sum' && intervalle > strate };
  if (_echProcCache.size > 300) _echProcCache.clear();
  _echProcCache.set(cle, r);
  return r;
}

/* ═══ 27. CATALOGUE DE PREUVE ══════════════════════════════════════════════
   Par FSLI × procédure : les types de justificatifs attendus, et pour chaque
   type les CHAMPS à relever et le CONTRÔLE à opérer contre la ligne
   sélectionnée. C'est la méthode livrée avec l'outil : un cabinet sans
   département méthodologie achète l'une avec l'autre.

   `ref(x)`  : la donnée de référence, tirée du grand livre ou du paramétrage.
   `val(x)`  : ce que porte réellement la pièce (donnée synthétique).
   `tol`     : tolérance admise avant de compter un écart.
   ═══════════════════════════════════════════════════════════════════════ */
const C_MONTANT = { type:'montant', tol:0, tolLib:'exact' };
const C_DATE    = { type:'date',    tol:0, tolLib:'exact' };

/* ── le catalogue de preuve vient lui aussi des données ────────────────────
   Chaque champ nomme sa RÉFÉRENCE ; RESOLVEURS sait la calculer et sait ce
   que la pièce synthétique en dit. Un champ dont le résolveur est
   « non_implemente » ne produit aucun contrôle exécutable. */
function champCode(c){
  const r = RESOLVEURS[c.reference] || RESOLVEURS.non_implemente;
  return { code:c.code, lib:c.libelle, type:c.type, contre:c.controle_contre,
           regle:c.regle, tolLib:c.tolerance, releveSeul:!!c.releve_seul,
           tol:c.type === 'montant' || c.type === 'nombre' ? 0
             : c.type === 'date' && /± (\d+)/.test(c.tolerance) ? parseInt(c.tolerance.match(/± (\d+)/)[1], 10) : 0,
           ref:r.ref, val:r.val, resolveur:c.reference };
}
function docsCatalogue(liste){
  return (liste || []).map(d => ({ doc:d.document, champs:d.champs.map(champCode) }));
}
function catalogue(p, pr){
  const d = pr.def; if (!d) return null;
  const parCycle = (d.justificatifs_par_cycle || {})[p.code];
  const l = parCycle || d.justificatifs;
  return l && l.length ? docsCatalogue(l) : null;
}
function catalogueSpecifique(p, pr){
  return !!(pr.def && (pr.def.justificatifs_par_cycle || {})[p.code]) || (pr.cycle && pr.cycle !== '*');
}
/** Documents attendus pour une procédure, dans l'ordre du catalogue. */
function docsAttendusProc(p, pr){ const c = catalogue(p, pr); return c ? c.map(d => d.doc) : []; }

/* ── comparaison d'un champ relevé à sa donnée de référence ──────────────── */
function compare(ch, releve, x){
  if (releve === undefined || releve === null || releve === '') return { saisi:false };
  /* Un champ RELEVÉ SEUL n'a pas de référence à laquelle se comparer : il
     alimente le jugement ou un autre contrôle. Le catalogue distingue donc
     « champs à relever » et « contrôle à opérer » — la date d'un fait
     générateur se relève, c'est la recherche de la dette qui se contrôle.
     Le confondre avec un contrôle, c'était relever comme anomalie toute
     facture normale du cycle. */
  if (ch.releveSeul) return { saisi:true, ecart:0, conforme:true, releveSeul:true,
    refLib:'—', ecartLib:'relevé',
    valLib: ch.type === 'date' ? frDate(releve)
          : ch.type === 'montant' ? eur(Math.round((parseFloat(String(releve).replace(/\s/g, '').replace(',', '.')) || 0) * 100))
          : String(releve) };
  const r = ch.ref(x);
  if (ch.type === 'montant'){
    const v = Math.round((parseFloat(String(releve).replace(/\s/g, '').replace(',', '.')) || 0) * 100);
    return { saisi:true, ecart:v - r, conforme:Math.abs(v - r) <= (ch.tol || 0),
             refLib:eur(r), valLib:eur(v), ecartLib:eur(v - r) };
  }
  if (ch.type === 'nombre'){
    const v = parseFloat(String(releve).replace(',', '.'));
    return { saisi:true, ecart:v - r, conforme:Math.abs(v - r) <= (ch.tol || 0),
             refLib:String(r), valLib:String(v), ecartLib:(v - r > 0 ? '+' : '') + (v - r) };
  }
  if (ch.type === 'date'){
    /* Une facture datée du 5 et comptabilisée le 8 n'est pas une anomalie :
       comparer une date de pièce à la date de comptabilisation « à l'exact »
       produisait un écart sur toute pièce normale. Chaque champ déclare donc
       la RÈGLE qui le contrôle, et non une simple égalité. */
    const j = Math.round((Date.parse(releve) - Date.parse(r)) / 86400000);
    let conforme, refLib;
    /* L'apostrophe est NORMALISÉE avant comparaison. Le catalogue est écrit en
       JSON, où l'apostrophe droite est la seule commode ; le code était écrit
       avec l'apostrophe typographique. « dans l'exercice » ne tombait donc sur
       aucun cas, filait au défaut — comparaison à la tolérance, ici nulle — et
       relevait comme ANOMALIE toute facture datée d'un jour avant sa
       comptabilisation. Soixante-seize écarts sur cent quinze factures
       parfaitement normales. Le vrai défaut n'est pas la lettre : c'est un
       DÉFAUT SILENCIEUX sur une règle inconnue. Le schéma du catalogue refuse
       désormais une règle de date hors énumération, et l'assemblage s'arrête. */
    switch (String(ch.regle || '').replace(/[’‘]/g, "'")){
      case "dans l'exercice":
        conforme = releve >= OUVERTURE && releve <= CLOTURE;
        refLib = frDate(OUVERTURE) + ' – ' + frDate(CLOTURE);
        break;
      case 'antérieure ou égale':
        conforme = releve <= r; refLib = '≤ ' + frDate(r); break;
      case 'postérieure':
        conforme = releve > r; refLib = '> ' + frDate(r); break;
      case 'même exercice que la référence':
        conforme = (releve <= CLOTURE) === (r <= CLOTURE);
        refLib = frDate(r) + ' (même exercice)'; break;
      default:
        /* Pas de règle nommée : comparaison à la tolérance déclarée. C'est le
           cas légitime — et le seul — où l'on arrive ici. */
        conforme = Math.abs(j) <= (ch.tol || 0); refLib = frDate(r);
    }
    return { saisi:true, ecart:j, conforme, refLib, valLib:frDate(releve),
             ecartLib:/exercice/.test(String(ch.regle || '')) ? 'hors exercice' : (j > 0 ? '+' : '') + j + ' j' };
  }
  if (ch.type === 'bool'){
    const v = releve === 'oui' || releve === true;
    return { saisi:true, ecart:v === !!r ? 0 : 1, conforme:v === !!r,
             refLib:r ? 'exigée' : 'non exigée', valLib:v ? 'oui' : 'non', ecartLib:v === !!r ? '—' : 'absente' };
  }
  const conforme = String(releve).trim().toLowerCase() === String(r).trim().toLowerCase();
  return { saisi:true, ecart:conforme ? 0 : 1, conforme,
           refLib:String(r), valLib:String(releve), ecartLib:conforme ? '—' : 'divergent' };
}

/* ── papier de travail d'une procédure ───────────────────────────────────── */
function wpProc(p, pr){
  const e = echantillonProc(p, pr);
  if (!e) return null;
  const st = proc(p.code, pr.code);
  const anc = new Map((st.wp || []).map(r => [r.cle, r]));
  /* Une ligne ne porte AUCUN drapeau de réception : « reçue » se dérive du
     dépôt du client sur la requête (voir ligneRecue). Elle ne porte que ce
     qu'un auditeur a réellement saisi : les valeurs relevées et les
     résolutions d'écart. */
  st.wp = e.retenus.map(x => {
    const g = anc.get(x.cle);
    return g || { cle:x.cle, x, champs:{}, res:{} };
  });
  for (const r of st.wp){ const x = e.retenus.find(v => v.cle === r.cle); if (x) r.x = x; }
  return st.wp;
}
/** Contrôles d'une procédure : un par (élément × document attendu × champ). */
function controles(p, pr){
  const cat = catalogue(p, pr), wp = wpProc(p, pr);
  if (!cat || !wp) return [];
  const out = [];
  for (const r of wp){
    for (const d of cat){
      for (const ch of d.champs){
        const cle = r.cle + '|' + d.doc + '|' + ch.code;
        const c = compare(ch, r.champs[cle], r.x);
        out.push({ ligne:r, doc:d.doc, ch, cle, recu:docRecu(p, pr, r.cle, d.doc), ...c });
      }
    }
  }
  return out;
}
function ecartsProc(p, pr){ return controles(p, pr).filter(c => c.saisi && !c.conforme); }
/** Écarts chiffrés d'une procédure, pour la synthèse des anomalies.
 *  Seul le RÉSIDUEL entre au cumul — mais un écart intégralement expliqué
 *  reste LISTÉ, avec son constaté, sa part expliquée et son résiduel nul.
 *  Le faire disparaître de la liste est précisément ce qui avait permis à un
 *  montant de quitter le cumul sans que rien ne l'explique. */
function ecartsChiffresProc(p, pr){
  return ecartsProc(p, pr).filter(c => constateDe(c) !== 0)
    .map(c => ({ ...c, ...residuel(c), montant:residuel(c).residuel }));
}

/* ═══ 27b. DOCUMENTATION DU JEU DE DONNÉES ═════════════════════════════════
   Le taux d'anomalie est un paramètre du jeu d'essai : il doit être lisible,
   et le taux CONSTATÉ doit être comparé au taux VISÉ. Si les deux divergent,
   c'est que la table des pièces et les cibles ne sont plus d'accord.
   ═══════════════════════════════════════════════════════════════════════ */
/** Contrôle de bande : la part de la pièce que représente chaque écart posé,
 *  comparée à la bande de sa nature. C'est la vérification que le montant
 *  découle de la cause et non d'un réglage. */
function bandesEcarts(){
  return Object.entries(ANOMALIES_PIECES).filter(([, a]) => a.t === 'montant').map(([ref, a]) => {
    const e = lg().entries.find(x => x.pieceRef === ref);
    const piece = e ? Math.max(...e.lines.map(l => Math.max(l.debit, l.credit))) : 0;
    const part = piece ? -a.delta / piece : null;
    const b = NATURES_ECART[a.n];
    return { ref, ...a, piece, part, bande:b,
             ok:part !== null && part > b.min && part <= b.max };
  });
}
function tauxConstates(){
  const parType = {};
  for (const [ref, a] of Object.entries(ANOMALIES_PIECES)){
    (parType[a.t] = parType[a.t] || []).push({ ref, ...a });
  }
  return TAUX_ANOMALIE.map(t => {
    const l = parType[t.code] || [];
    return { ...t, constate:l.length, taux:l.length / t.base, vise:t.cible / t.base,
             ok:l.length === t.cible, pieces:l };
  });
}
function vueJeuDonnees(){

                       v:pct(t.vise, 2), n:String(t.constate) + (t.ok ? '' : ' <span class="pill bad">≠ ' + t.cible + '</span>'),

          return { p:`<span class="mono">${esc(ref)}</span>`,
                   j:e ? e.journal : '<span class="pill bad">introuvable</span>',

                   d:a.delta !== undefined ? (a.t === 'montant' ? eur(a.delta) : a.delta + ' unité(s)')
                     : a.jours !== undefined ? '+' + a.jours + ' j après la clôture' : 'absence',
                   w:esc(a.why) };
        }))) +
    blk('Écritures particulières', '3 scénarios semés dans le grand livre',
      table([{k:'t',t:'Scénario',cls:'wrapcell'},{k:'n',t:'Écritures',n:1},{k:'e',t:'Références'}],
        [['A1', 'Même facture comptabilisée deux fois'], ['A5', 'Produit de 2026 rattaché à 2025'],
         ['A6', 'Écriture manuelle de direction en fin d’exercice']].map(([tag, lib]) => {
          const l = ent.filter(e => e.tag === tag);
          return { t:esc(lib), n:String(l.length), e:l.map(e => `<span class="mono">${esc(e.num)}</span>`).join(' ') };
        })) +
      `<p class="note">Écart de rapprochement volontaire : écriture de situation de 25 000 € présente dans la balance
      transmise et absente du fichier des écritures (411000 / 706000).</p>`);
